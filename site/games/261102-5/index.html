<script>
(()=>{'use strict';
/* ================= utils ================= */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-(1-t)*(1-t), easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const wrapA=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;};
const mod=(a,n)=>((a%n)+n)%n;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const FX=mulberry32(12345); // cosmetic randomness

/* ================= colors ================= */
const C={table:'#3b2415',tableD:'#2a180c',tableL:'#4e301c',soil:'#7b4a2b',soilWet:'#3f2414',red:'#b5532b',redD:'#7f3518',green:'#5c8a39',greenD:'#3e6325',blue:'#3d76b3',blueD:'#274f80',yellow:'#e2b33b',yellowD:'#a87a22',white:'#efe7d3',whiteD:'#bfb398',skin:'#e7c398',under:'#2a160b',ice:'#d6eaf0',water:'#3a7fc0',waterL:'#8ec2e6',black:'#000000',wh:'#ffffff'};
const _rgb={};function rgb(h){if(_rgb[h])return _rgb[h];const n=parseInt(h.slice(1),16);return _rgb[h]=[n>>16&255,n>>8&255,n&255];}
const _mx={};function mix(a,b,t){t=Math.round(clamp(t,0,1)*40)/40;const k=a+b+t;let v=_mx[k];if(v)return v;const A=rgb(a),B=rgb(b);return _mx[k]=`rgb(${A[0]+(B[0]-A[0])*t|0},${A[1]+(B[1]-A[1])*t|0},${A[2]+(B[2]-A[2])*t|0})`;}
const lighten=(c,t)=>mix(c,'#ffffff',t), darken=(c,t)=>mix(c,'#000000',t);

/* ================= audio (Web Audio synth) ================= */
const AU={c:null,m:null,nb:null,v:0};
function audioInit(){
  try{
    if(!AU.c){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;AU.c=new AC();
      AU.m=AU.c.createGain();AU.m.gain.value=0.5;const comp=AU.c.createDynamicsCompressor();AU.m.connect(comp);comp.connect(AU.c.destination);
      const len=Math.floor(AU.c.sampleRate*0.8);AU.nb=AU.c.createBuffer(1,len,AU.c.sampleRate);const d=AU.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}
    if(AU.c.state==='suspended')AU.c.resume().catch(()=>{});
  }catch(e){}
}
function aok(){return AU.c&&AU.c.state==='running'&&AU.v<26;}
function tone(f,dur,o={}){if(!aok())return;try{const c=AU.c,t=c.currentTime+(o.at||0);const os=c.createOscillator(),g=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+dur);const v=o.vol==null?0.25:o.vol;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=f*0.025;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+0.02);}
  os.connect(g);g.connect(AU.m);os.start(t);os.stop(t+dur+0.03);AU.v++;os.onended=()=>{AU.v--;};}catch(e){}}
function noise(dur,o={}){if(!aok())return;try{const c=AU.c,t=c.currentTime+(o.at||0);const s=c.createBufferSource();s.buffer=AU.nb;const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q==null?1:o.q;const g=c.createGain();const v=o.vol==null?0.2:o.vol;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.004));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(AU.m);s.start(t,Math.random()*0.3);s.stop(t+Math.min(dur,0.48)+0.02);AU.v++;s.onended=()=>{AU.v--;};}catch(e){}}
const PHF=[1,1.19,0.89,0.75];
const SFX={
  dice(){noise(0.05,{f:2300,q:2,vol:0.35});tone(170,0.14,{f2:90,vol:0.4,type:'triangle'});},
  diceLand(){tone(260,0.09,{f2:140,vol:0.3,type:'triangle'});noise(0.04,{f:900,vol:0.2});},
  step(k,ph){const f=(150+k*14)*PHF[ph];tone(f,0.12,{f2:f*0.6,type:'triangle',vol:0.28});noise(0.05,{f:500,q:0.8,vol:0.14});},
  slide(){noise(0.35,{f:3000,f2:1500,q:2,vol:0.12});tone(1200,0.3,{f2:1600,vol:0.06});},
  click(ph,rev){const f=(rev?560:880)*PHF[ph];tone(f,0.045,{type:'square',vol:0.07});noise(0.02,{f:3200,q:3,vol:0.12});if(rev)tone(240,0.12,{f2:330,vol:0.12});},
  resist(){tone(160,0.08,{f2:120,vol:0.12,type:'triangle'});},
  dig(){for(let i=0;i<3;i++)noise(0.08,{f:700+i*220,q:1.4,vol:0.22,at:i*0.2});},
  melt(){for(let i=0;i<4;i++)tone(500+Math.random()*700,0.06,{f2:900+Math.random()*600,vol:0.1,at:i*0.07});},
  drip(p){tone(650+p*500+Math.random()*200,0.05,{f2:1150+p*500,vol:0.05});},
  freeze(){[1760,2349,2793,3520].forEach((f,i)=>tone(f,0.35,{vol:0.07,at:i*0.06}));noise(0.15,{f:6000,ft:'highpass',vol:0.06});},
  thaw(){tone(900,0.25,{f2:420,vol:0.1});noise(0.15,{f:1500,q:0.8,vol:0.06});},
  reveal(){tone(110,0.5,{f2:55,vol:0.45,type:'triangle'});noise(0.3,{f:300,ft:'lowpass',vol:0.4});tone(660,0.12,{f2:1320,vol:0.2,at:0.28});tone(990,0.22,{vol:0.15,at:0.4});tone(1320,0.3,{vol:0.12,at:0.5});},
  close(){tone(200,0.25,{f2:90,vol:0.3,type:'triangle'});},
  plug(){tone(420,0.13,{f2:780,type:'triangle',vol:0.2});},
  rush(){noise(0.45,{f:600,f2:2600,q:0.7,vol:0.28});tone(300,0.3,{f2:700,vol:0.1});},
  pour(p){noise(0.1,{f:1800+p*1200,q:1.2,vol:0.08});},
  plant(){tone(900,0.07,{f2:1300,vol:0.15});},
  ripe(i){tone(660*Math.pow(1.06,i%6),0.09,{type:'triangle',vol:0.08});},
  pick(i){tone(523*Math.pow(1.122,i%8),0.1,{type:'triangle',vol:0.18});},
  load(i){tone(392*Math.pow(1.122,i%10),0.08,{type:'square',vol:0.06});noise(0.03,{f:1200,vol:0.08});},
  success(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.25,{type:'triangle',vol:0.2,at:i*0.09}));},
  big(){[392,523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.32,{type:'triangle',vol:0.18,at:i*0.08}));tone(196,0.8,{vol:0.15,type:'triangle'});},
  whistle(){tone(880,0.5,{vol:0.14,vib:7});tone(1108,0.5,{vol:0.1,vib:7});},
  toot(){tone(740,0.18,{vol:0.08,vib:6});},
  chuff(){noise(0.08,{f:900,q:0.6,vol:0.1});},
  hmm(){tone(520,0.12,{f2:600,vol:0.15});tone(560,0.2,{f2:380,vol:0.15,at:0.13});},
  hat(){tone(784,0.1,{type:'triangle',vol:0.18});tone(1175,0.18,{type:'triangle',vol:0.18,at:0.1});tone(1568,0.2,{type:'triangle',vol:0.12,at:0.2});},
  wiggle(){tone(300+Math.random()*80,0.06,{f2:240,vol:0.08});},
  shake(){noise(0.3,{f:400,q:0.5,vol:0.25});},
  thud(){tone(140,0.12,{f2:80,vol:0.3,type:'triangle'});},
  roll(){tone(220+Math.random()*60,0.05,{vol:0.07,type:'triangle'});},
  squish(){tone(260,0.1,{f2:160,vol:0.1});},
  look(){tone(700,0.06,{f2:900,vol:0.08});},
};

/* ================= canvas / layout ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
let W=0,H=0,DPR=1,R=100,CX=0,CY=0,BASE=0,PORT=true;
const L={};
function readSafe(){const cs=getComputedStyle(saEl);return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function ang(a){return BASE+a*TAU/16;}
function pol(a,r){const t=ang(a);return[CX+Math.cos(t)*r*R,CY+Math.sin(t)*r*R];}
function makeCanvas(w,h,fn){const cn=document.createElement('canvas');cn.width=Math.max(1,Math.ceil(w*DPR));cn.height=Math.max(1,Math.ceil(h*DPR));const c=cn.getContext('2d');c.scale(DPR,DPR);fn(c,w,h);return cn;}

function doLayout(){
  W=Math.max(200,window.innerWidth);H=Math.max(200,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  const sa=readSafe();const ax=sa.l+8,ay=sa.t+8,aw=W-sa.l-sa.r-16,ah=H-sa.t-sa.b-16;
  PORT=ah>=aw;
  if(PORT){R=Math.min(aw/2.42,ah/3.8);CX=ax+aw/2;CY=ay+(ah-3.8*R)/2+0.64*R+1.18*R;BASE=PI/2;}
  else{R=Math.min(ah/2.45,aw/3.95);CX=ax+aw/2;CY=ay+ah/2;BASE=0;}
  const u=[Math.cos(BASE),Math.sin(BASE)],v=[-Math.sin(BASE),Math.cos(BASE)];
  const t0=[CX+u[0]*R,CY+u[1]*R],P1=[CX+u[0]*1.3*R,CY+u[1]*1.3*R],P2=[CX+u[0]*1.47*R,CY+u[1]*1.47*R];
  const len3=PORT?Math.min(1.05*R,aw/2-0.16*R):Math.min(1.0*R,ah/2-0.18*R);
  const P3=[P2[0]-v[0]*len3,P2[1]-v[1]*len3];const P4=[P3[0]+u[0]*0.3*R,P3[1]+u[1]*0.3*R];
  L.depot=[t0,P1,P2,P3,P4];L.u=u;L.v=v;
  if(PORT){L.dice=[CX-0.66*R,CY+1.62*R];L.tree=[CX+0.74*R,CY-1.5*R];L.lidRest=[CX-0.78*R,CY-1.52*R];L.heap=[CX-1.04*R,CY+1.68*R];}
  else{L.tree=[CX-1.56*R,CY-0.6*R];L.dice=[CX-1.56*R,CY+0.56*R];L.lidRest=[CX-1.58*R,CY+1.04*R];L.heap=[CX+1.62*R,CY+0.78*R];}
  L.diceSize=Math.max(58,0.4*R);
  const ta=Math.atan2(L.tree[1]-CY,L.tree[0]-CX);L.treeTile=mod(Math.round((ta-BASE)/(TAU/16)),16);
  L.stars=[];const sr=mulberry32(77);for(let i=0;i<40;i++){const x=sr()*W,y=sr()*H;if(dist(x,y,CX,CY)>1.3*R)L.stars.push([x,y,sr()]);}
  if(S.ready)buildStatic();
}

/* ================= clay primitives ================= */
const _wob=new Map();
function wobC(seed){let w=_wob.get(seed);if(w)return w;const r=mulberry32(seed*9301+49297);w=[];for(let k=2;k<=6;k++)w.push(k,(r()-0.5)*0.16/(k*0.55),r()*TAU);_wob.set(seed,w);return w;}
const _px=new Float64Array(80),_py=new Float64Array(80);
function blob(c,x,y,rx,ry,seed,amp=1,rot=0,N=18){
  const w=wobC(seed|0),cr=Math.cos(rot),sr=Math.sin(rot);
  for(let i=0;i<N;i++){const a=i/N*TAU;let f=1;for(let j=0;j<w.length;j+=3)f+=amp*w[j+1]*Math.sin(w[j]*a+w[j+2]);const px=Math.cos(a)*rx*f,py=Math.sin(a)*ry*f;_px[i]=x+px*cr-py*sr;_py[i]=y+px*sr+py*cr;}
  smoothClosed(c,_px,_py,N);
}
function smoothClosed(c,X,Y,N){c.beginPath();let mx=(X[N-1]+X[0])/2,my=(Y[N-1]+Y[0])/2;c.moveTo(mx,my);for(let i=0;i<N;i++){const j=(i+1)%N;c.quadraticCurveTo(X[i],Y[i],(X[i]+X[j])/2,(Y[i]+Y[j])/2);}c.closePath();}
function prints(c,x,y,r,seed){const rr=mulberry32(seed+7);c.strokeStyle='rgba(30,14,4,0.11)';c.lineWidth=Math.max(0.6,r*0.022);const ox=x+(rr()-0.5)*r*0.7,oy=y+(rr()-0.5)*r*0.7,rot=rr()*PI;for(let k=1;k<6;k++){c.beginPath();const s0=rr()*TAU;c.ellipse(ox,oy,r*0.11*k,r*0.08*k,rot,s0,s0+PI*1.2+rr());c.stroke();}}
function clay(c,x,y,rx,ry,col,seed,o={}){
  const amp=o.amp==null?1:o.amp,rot=o.rot||0;
  if(!o.noShadow){c.fillStyle='rgba(18,7,0,'+(o.sh==null?0.32:o.sh)+')';blob(c,x+rx*0.09,y+ry*0.17+(o.lift||0),rx*1.03,ry*1.03,seed,amp,rot);c.fill();}
  const g=c.createRadialGradient(x-rx*0.35,y-ry*0.45,0,x,y,Math.max(rx,ry)*1.25);
  g.addColorStop(0,lighten(col,0.3));g.addColorStop(0.5,col);g.addColorStop(1,darken(col,0.34));
  c.fillStyle=g;blob(c,x,y,rx,ry,seed,amp,rot);c.fill();
  if(o.print&&rx>9){c.save();c.clip();prints(c,x,y,Math.max(rx,ry),seed);c.restore();blob(c,x,y,rx,ry,seed,amp,rot);}
  c.strokeStyle='rgba(0,0,0,0.2)';c.lineWidth=Math.max(0.8,Math.min(rx,ry)*0.06);c.stroke();
  if(!o.noHi){c.fillStyle='rgba(255,255,255,'+(o.hi==null?0.26:o.hi)+')';c.beginPath();c.ellipse(x-rx*0.36,y-ry*0.42,rx*0.26,ry*0.15,-0.5,0,TAU);c.fill();}
}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function clayRect(c,x,y,w,h,r,col,o={}){
  if(!o.noShadow){c.fillStyle='rgba(18,7,0,0.3)';rrect(c,x+w*0.04,y+h*0.12,w,h,r);c.fill();}
  const g=c.createLinearGradient(x,y,x+w*0.3,y+h);g.addColorStop(0,lighten(col,0.28));g.addColorStop(0.45,col);g.addColorStop(1,darken(col,0.32));
  c.fillStyle=g;rrect(c,x,y,w,h,r);c.fill();c.strokeStyle='rgba(0,0,0,0.22)';c.lineWidth=Math.max(0.8,Math.min(w,h)*0.05);c.stroke();
  if(!o.noHi){c.fillStyle='rgba(255,255,255,0.22)';rrect(c,x+w*0.12,y+h*0.1,w*0.4,h*0.14,h*0.07);c.fill();}
}
const SPR=new Map();
function spr(key,w,h,draw){let s=SPR.get(key);if(!s){s={cn:makeCanvas(w,h,(c)=>draw(c,w,h)),w,h};SPR.set(key,s);}return s;}
function dspr(s,x,y,sc=1,rot=0,alpha=1){const w=s.w*sc,h=s.h*sc;if(alpha<1)ctx.globalAlpha=alpha;if(rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(s.cn,-w/2,-h/2,w,h);ctx.restore();}else ctx.drawImage(s.cn,x-w/2,y-h/2,w,h);if(alpha<1)ctx.globalAlpha=1;}

/* fruit sprites */
const FRUIT_COL={tomato:C.red,pumpkin:C.yellow,berry:C.blue,turnip:C.white,gold:C.yellow};
function fruitSpr(type,size){
  const s=Math.max(6,Math.round(size));
  return spr('f'+type+s,s*1.6,s*1.6,(c,w,h)=>{
    const x=w/2,y=h/2+s*0.08,r=s*0.5;
    if(type==='berry'){clay(c,x-r*0.42,y+r*0.2,r*0.5,r*0.5,C.blue,3,{sh:0.25});clay(c,x+r*0.42,y+r*0.22,r*0.5,r*0.5,C.blue,5,{sh:0.25});clay(c,x,y-r*0.3,r*0.52,r*0.5,C.blue,7,{sh:0.25});c.fillStyle=C.blueD;c.beginPath();c.arc(x,y-r*0.65,r*0.1,0,TAU);c.fill();}
    else if(type==='turnip'){clay(c,x,y+r*0.1,r*0.85,r*0.78,C.white,11,{print:true});c.strokeStyle=darken(C.white,0.2);c.lineWidth=r*0.08;c.beginPath();c.moveTo(x,y+r*0.85);c.lineTo(x,y+r*1.05);c.stroke();clay(c,x-r*0.25,y-r*0.75,r*0.18,r*0.42,C.green,12,{rot:-0.4,sh:0.15});clay(c,x+r*0.25,y-r*0.75,r*0.18,r*0.42,C.green,13,{rot:0.4,sh:0.15});c.fillStyle='rgba(181,83,43,0.35)';c.beginPath();c.ellipse(x,y-r*0.45,r*0.5,r*0.14,0,0,TAU);c.fill();}
    else if(type==='pumpkin'){clay(c,x,y,r*0.95,r*0.78,C.yellow,21,{print:true});c.strokeStyle='rgba(120,70,10,0.35)';c.lineWidth=r*0.07;for(const k of[-0.45,0,0.45]){c.beginPath();c.ellipse(x+k*r,y,r*0.22,r*0.7,0,0,TAU);c.stroke();}clay(c,x,y-r*0.8,r*0.12,r*0.2,C.greenD,22,{sh:0.1});}
    else if(type==='gold'){clay(c,x,y,r*0.95,r*0.9,C.yellow,31,{print:true});c.fillStyle='rgba(181,83,43,0.45)';c.beginPath();c.ellipse(x+r*0.3,y+r*0.15,r*0.4,r*0.35,0,0,TAU);c.fill();clay(c,x+r*0.25,y-r*0.92,r*0.3,r*0.14,C.green,32,{rot:-0.5,sh:0.1});c.strokeStyle=C.redD;c.lineWidth=r*0.1;c.beginPath();c.moveTo(x,y-r*0.7);c.lineTo(x+r*0.05,y-r*1.0);c.stroke();}
    else{clay(c,x,y,r*0.9,r*0.85,C.red,41,{print:true});c.fillStyle=C.green;for(let k=0;k<5;k++){const a=k/5*TAU-PI/2;c.beginPath();c.ellipse(x+Math.cos(a)*r*0.2,y-r*0.7+Math.sin(a)*r*0.12,r*0.2,r*0.07,a,0,TAU);c.fill();}}
  });
}

function setupLap(){

function genNet(rng){

    const i0=(cands.length>3&&rng()<0.5)?1:0;const c1=cands[i0],rest=cands.slice(i0+1);
    const i1=(rest.length>2&&rng()<0.5)?1:0;const cK=rest[i1],c2=rest[i1+1]||rest[rest.length-1];

    const eb1={pts:[[cK.a,0.395],[cK.a,0.47],[cK.a,0.8]],parent:eB,out:cK.t,pond:pi};
    const eb2={pts:[[cK.a,0.395],[cK.a+dir*0.5,0.395],...arcPts(cK.a+dir*0.5,c2.a,0.395),[c2.a,0.8]],parent:eB,out:c2.t,pond:pi};
    const pJ={edges:[eA,eB],pos:rng()<0.5?0:1,pond:pi,sd:0.085,id:plugs.length,wob:0};pJ.x=pJ.pos;
    const pK={edges:[eb1,eb2],pos:rng()<0.5?0:1,pond:pi,sd:0.06,id:plugs.length+1,wob:0};pK.x=pK.pos;

function arcPts(a0,a1,r){const out=[];const n=Math.max(2,Math.ceil(Math.abs(a1-a0)/0.25));for(let i=1;i<=n;i++)out.push([lerp(a0,a1,i/n),r]);return out;}

/* ================= gardener ================= */

function updGardener(dt){

          if(q.p&&!q.peek){const n=fruitCount(q.p);const[x,y]=pol(q.p.tile,0.95);for(let i=0;i<n;i++){g.basket.push({type:q.p.crop,giant:q.p.giant&&i===0});SFX.pick(g.basket.length);}if(q.p.giant)q.p.giant=false;q.p.g=4.6;q.p.lastN=0;burst(x,y,5,FRUIT_COL[q.p.crop],0.5);}
          if(q.p&&q.peek){const[x,y]=pol(q.p.tile,0.95);burst(x,y,6,C.waterL,0.5);SFX.look();}

function sendBasket(){

  const[gx,gy]=gardenerPos();

/* ================= watering can ================= */
function canAllowed(){return S.phase==='play'&&!S.piece.mv&&S.piece.queue===0&&!S.dice.rolling&&(S.g.mode==='idle'||S.g.mode==='tilt');}
function canHome(){return pol(S.piece.tile+0.4,0.88);}
function canPos(){if(S.can.held)return[S.can.x,S.can.y];if(S.can.fly>0){const h=canHome(),u=1-S.can.fly;return[lerp(S.can.fx,h[0],easeOut(u)),lerp(S.can.fy,h[1],easeOut(u))-Math.sin(PI*u)*0.2*R];}return canHome();}
function spoutDrop(x,y){return[x-0.13*R,y+0.06*R];}
function updCan(dt,ptr){
  const cn=S.can;cn.fly=Math.max(0,cn.fly-dt*2.5);
  if(!cn.held){cn.pour=null;cn.tilt=lerp(cn.tilt,0,Math.min(1,dt*10));return;}
  let[tx,ty]=[ptr[0]-0.02*R,ptr[1]-0.16*R];
  let[dx,dy]=spoutDrop(tx,ty);let best=null,bd=0.26*R;
  for(const p of S.plotList){const[px,py]=pol(p.tile,0.95);const d=dist(dx,dy,px,py);if(d<bd){bd=d;best=p;}}
  if(best){const[px,py]=pol(best.tile,0.95);tx+=px-dx;ty+=py-dy;cn.pour=best;}else cn.pour=null;
  cn.x=lerp(cn.x,tx,Math.min(1,dt*18));cn.y=lerp(cn.y,ty,Math.min(1,dt*18));
  cn.tilt=lerp(cn.tilt,cn.pour?-0.75:-0.15,Math.min(1,dt*8));
  if(cn.pour&&cn.tilt<-0.5){const p=cn.pour;const was=p.moist;p.moist=Math.min(1,p.moist+dt*0.9);
    if(!p.ever){p.ever=true;p.wetT=S.T;p.via='can';logEv('canWater',p.tile);}
    S.lapF.canUsed=true;S.flags.canWater=(S.flags.canWater||0)+dt;
    const[sx,sy]=spoutDrop(cn.x,cn.y);if(FX()<0.6)addP({x:sx+(FX()-0.5)*0.02*R,y:sy-0.03*R,vx:(FX()-0.5)*0.15*R,vy:0.2*R,life:0,max:0.25,s:0.014*R,col:C.waterL,g:3});
    cn.sndT-=dt;if(cn.sndT<=0){SFX.pour(p.moist);cn.sndT=0.13;}
    if(was<1&&p.moist>=1){const[px,py]=pol(p.tile,0.95);burst(px,py,5,C.waterL,0.4);}
  }
}

/* ================= water network ================= */
function waterArrive(p,via,pond){
  if(!p)return;p.flowing=true;p.moist=1;
  if(!p.ever||p.via==='can'&&via!=='can'&&!p.chan){
    const first=!p.ever;p.ever=true;if(first)p.wetT=S.T;p.via=via;p.chan=true;
    const[x,y]=pol(p.tile,0.86);burst(x,y,8,C.waterL,0.6);SFX.success();
    if(via==='under'){S.flags.underField=(S.flags.underField||0)+1;if(S.richN<2&&!S.snows[pond].richDone){S.snows[pond].richDone=true;p.rich=true;S.richN++;logEv('rich',p.tile);}}
    logEv('waterArrive',{tile:p.tile,via});gardenerReact(p);
  }
}
function updWater(dt){
  for(const p of S.plotList)p.flowing=false;
  let flowing=0;
  for(const sn of S.snows){const pd=sn.pond;const liq=pd.water*(1-pd.ice);
    const on=sn.cleared&&sn.dig<=0&&liq>0.22;sn.surf.fill=clamp(sn.surf.fill+(on?dt*1.5:-dt*0.7),0,1);
    if(sn.surf.fill>=1){waterArrive(S.plots[sn.surfTile],'surf',sn.k);flowing++;}
    if(pd.water>=0.99&&!pd.full){pd.full=true;}
  }
  if(S.revealed&&S.reveal.open>0.6){
    for(const pl of S.net.plugs){if(!pl.drag)pl.x=lerp(pl.x,pl.pos,Math.min(1,dt*14));pl.wob=Math.max(0,pl.wob-dt*3);}
    for(const e of S.net.edges){
      let inOn;if(e.src){const sn=S.snows[e.pond];const pd=sn.pond;inOn=sn.found&&pd.water*(1-pd.ice)>0.2;}else inOn=e.parent.fill>=1;
      const blocked=e.plug&&plugBlocked(e.plug)===e;
      if(inOn&&!blocked){e.fill=Math.min(1,e.fill+dt*(1.1*R)*(1+e.rush*3)/e.len);e.rush=Math.max(0,e.rush-dt*0.8);if(e.fill<1)flowing++;}
      else if(inOn&&blocked){e.pool=Math.min(1,e.pool+dt*0.35);e.fill=Math.max(0,e.fill-dt*0.9*R/e.len);}
      else{e.fill=Math.max(0,e.fill-dt*0.6*R/e.len);e.pool=Math.max(0,e.pool-dt*0.15);}

    }

  if(!S.revealed&&S.snows.some(s=>s.pond.water>=0.99&&s.pond.ice<0.5)){startReveal();}
}
function startReveal(){S.revealed=true;S.reveal.anim='open';S.reveal.t=0;SFX.reveal();S.shake=1;S.flags.reveal=(S.flags.reveal||0)+1;logEv('reveal');
  for(let i=0;i<16;i++){const[x,y]=pol(i+0.5,0.6+FX()*0.2);burst(x,y,1,i%2?C.green:C.soil,0.8);}}
function updReveal(dt){
  const rv=S.reveal;if(!rv.anim)return;rv.t+=dt;
  if(rv.anim==='open'){rv.open=clamp(rv.t/1.5,0,1);if(rv.t>=1.5){rv.anim=null;rv.open=1;}}
  else if(rv.anim==='close'){rv.open=clamp(1-rv.t/0.8,0,1);if(rv.t>=0.8){rv.anim=null;rv.open=0;SFX.close();}}
}
function setPlug(pl,target){
  if(target!==pl.pos){const opened=pl.edges[pl.pos];pl.pos=target;opened.rush=opened.pool;
    if(opened.pool>0.15){SFX.rush();const[x,y]=pl.s[pl.edges.indexOf(opened)];burst(x,y,10,C.waterL,0.7);S.flags.rushOut=(S.flags.rushOut||0)+1;logEv('rush',+opened.pool.toFixed(2));}
    opened.pool=0;SFX.plug();S.lapF.plugMoved=true;S.flags.plugMoved=(S.flags.plugMoved||0)+1;logEv('plug',{id:pl.id,pos:target});
  }else{SFX.wiggle();pl.wob=1;}

/* ================= tree & rollers ================= */
function treeTap(){
  if(S.phase==='treeReady'&&S.tree.ripe){dropTree();return;}
  S.tree.shake=0.4;SFX.shake();
}
function dropTree(){
  S.phase='treeDrop';S.phaseT=0;S.tree.ripe=false;S.tree.dropped=true;S.tree.shake=1.2;SFX.shake();S.shake=0.5;
  let st=S.plotList.filter(p=>p.ever);
  if(!st.length){st=S.snows.map(s=>S.plots[s.surfTile]).filter(Boolean);st.forEach(p=>{p.ever=true;});}
  const giantI=S.rng()<0.22?Math.floor(S.rng()*st.length):-1;
  const tt=L.treeTile;
  st.forEach((p,i)=>{const aT=p.tile>=tt?p.tile:p.tile+16;S.rollers.push({p,a:tt,aT:aT===tt?tt+16:aT,ph:'fall',t:-i*0.3,giant:i===giantI,rot:0,lastI:tt});p.station=true;});
  S.flags.treeDrop=(S.flags.treeDrop||0)+1;logEv('treeDrop',st.map(p=>p.tile));
}
function updRollers(dt){
  let all=true;
  for(const r of S.rollers){
    r.t+=dt;if(r.t<0){all=false;continue;}
    if(r.ph==='fall'){if(r.t>=0.5){r.ph='roll';SFX.thud();}all=false;}
    else if(r.ph==='roll'){r.a+=dt*(r.giant?3:4.2);r.rot+=dt*9;if(Math.floor(r.a)!==r.lastI){r.lastI=Math.floor(r.a);SFX.roll();}
      if(r.a>=r.aT){r.a=r.aT;r.ph='rest';r.p.tf={type:'gold',giant:r.giant};r.p.pop=1;SFX.thud();const[x,y]=pol(r.p.tile,0.95);burst(x,y,6,C.yellow,0.5);}else all=false;}
  }
  if(S.phase==='treeDrop'&&all&&S.rollers.length){S.phaseT+=dt;if(S.phaseT>0.7){S.rollers=[];startTrain();}}
}

/* ================= train ================= */
function resetTrain(){S.train={state:'parked',trail:[{d:4},{d:3},{d:2}],leg:null,route:[],speed:0,ring:0,wait:0,st:null,giantCar:false,pop:S.train?1:0,chuffD:0,wob:0,loadQ:[]};S.pendingCargo=0;}
function lp2px(p){if(p.t!=null)return pol(p.t,1.0);if(p.d!=null)return L.depot[p.d];return pol(p.b[0],p.b[1]);}
function nWagons(){return clamp(Math.ceil((S.cargo.length+S.pendingCargo)/8),3,5);}
function wagonForIdx(idx){return Math.min(4,Math.floor(idx/8))+1;}
function carList(){const n=nWagons();const a=['loco'];for(let i=1;i<=n;i++)a.push(i);if(S.train.giantCar)a.push('giant');return a;}
function wagonPos(w){const cl=carList();let k=cl.indexOf(w);if(k<0)k=cl.length-1;return trainCarPos(k);}
function trainCarPos(k,withAng){
  const tr=S.train;const gap=0.3*R;
  let pts=[];if(tr.leg){const a=lp2px(tr.trail[tr.trail.length-1]),b=lp2px(tr.leg.to);const L2=dist(a[0],a[1],b[0],b[1]);const u=L2?clamp(tr.leg.d*R/L2,0,1):1;pts.push([lerp(a[0],b[0],u),lerp(a[1],b[1],u)]);}
  for(let i=tr.trail.length-1;i>=0;i--)pts.push(lp2px(tr.trail[i]));
  if(pts.length===1)pts.push([pts[0][0]+L.u[0]*R,pts[0][1]+L.u[1]*R]);
  let need=k*gap;
  for(let i=1;i<pts.length;i++){const d=dist(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]);if(need<=d||i===pts.length-1){const t=d?need/d:0;/*extrapolates past end*/const x=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,y=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t;const an=Math.atan2(pts[i-1][1]-pts[i][1],pts[i-1][0]-pts[i][0]);return withAng?[x,y,an]:[x,y];}need-=d;}
  const p=pts[pts.length-1];return withAng?[p[0],p[1],0]:p;
}
function startTrain(){S.phase='train';S.train.state='board';S.g.mode='board';S.g.t=0;S.train.wait=0.8;logEv('trainBoard');}
function trainLegTo(p){const tr=S.train;tr.leg={to:p,d:0};}
function legLen(){const tr=S.train;const a=lp2px(tr.trail[tr.trail.length-1]),b=lp2px(tr.leg.to);return dist(a[0],a[1],b[0],b[1])/R;}
function trainPlan(i){
  const tr=S.train;
  if(tr.ring>=16){tr.route=[{d:1},{d:2},{d:3},{d:4}];return;}
  const ns=nextStepInfo(i);
  if(ns.bridge){tr.route=[{b:[i,0.86]},{b:[i+4,0.86]},{t:ns.to}];tr.ring+=4;SFX.slide();S.flags.bridgeTrain=(S.flags.bridgeTrain||0)+1;logEv('bridgeTrain',i);}
  else{tr.route=[{t:ns.to}];tr.ring+=1;}
}
function trainArrive(p){
  const tr=S.train;
  if(p.d===4){tr.state='home';tr.wait=0;unloadAll();return;}
  if(p.d===1&&tr.ring===0){tr.route=[{t:0}];return;}
  if(p.t!=null&&tr.route.length===0){
    if(p.t===0&&tr.ring===0){trainPlan(0);return;}
    const pl=S.plots[p.t];
    if(pl&&pl.station&&!pl.loaded&&!pl.skipped&&tr.ring<16+4){
      tr.st=pl;if(isEvening())startLoad(pl);else{tr.state='pause';tr.wait=3.5;SFX.toot();logEv('trainPause',pl.tile);}return;}
    trainPlan(p.t);
  }
}
function startLoad(pl){
  const tr=S.train;tr.state='load';tr.wait=0;SFX.toot();
  const items=[];if(pl.tf){items.push(pl.tf);}const n=fruitCount(pl);for(let i=0;i<n;i++)items.push({type:pl.crop,giant:pl.giant&&i===0});
  pl.tf=null;if(n){pl.g=4.6;pl.lastN=0;pl.giant=false;}
  const[x,y]=pol(pl.tile,0.95);
  items.forEach((it,i)=>{const idx=S.cargo.length+S.pendingCargo+i;fly(x,y,()=>wagonPos(it.giant?'giant':wagonForIdx(idx)),it.type,it.giant,0.55,()=>{S.cargo.push(it);S.pendingCargo--;SFX.load(S.cargo.length);if(it.giant)S.train.giantCar=true;},i*0.15);});
  S.pendingCargo+=items.length;
  if(items.some(it=>it.giant))S.train.giantCar=true;
  tr.loadN=items.length;tr.loadT=items.length*0.15+0.6;pl.loaded=true;
  S.flags.trainEveningStop=(S.flags.trainEveningStop||0)+1;logEv('trainLoad',{tile:pl.tile,n:items.length});
}
function unloadAll(){
  const items=S.cargo.slice();const[hx,hy]=L.heap;
  items.forEach((it,i)=>{const w=wagonPos(it.giant?'giant':wagonForIdx(i));fly(w[0],w[1],()=>[hx,hy-0.05*R],it.type,it.giant,0.6,()=>{S.heap+=it.giant?3:1;S.heapWob=1;SFX.pick(i);},i*0.06);});
  S.cargo=[];S.train.unloadT=items.length*0.06+0.9;S.flags.trainHome=(S.flags.trainHome||0)+1;logEv('trainHome',items.length);
}
function updTrain(dt){
  const tr=S.train;tr.wob=Math.max(0,tr.wob-dt*3);tr.pop=Math.max(0,tr.pop-dt*1.5);
  if(S.phase!=='train')return;
  if(tr.state==='board'){tr.wait-=dt;if(tr.wait<=0){tr.state='run';SFX.whistle();trainLegTo({d:1});}return;}
  if(tr.state==='pause'){tr.wait-=dt;tr.speed=0;
    if(isEvening()){startLoad(tr.st);return;}
    if(tr.wait<=0){tr.st.skipped=true;logEv('trainSkip',tr.st.tile);tr.state='run';trainPlan(tr.st.tile);tr.st=null;}return;}
  if(tr.state==='load'){tr.loadT-=dt;if(tr.loadT<=0){tr.state='waitMorning';}return;}
  if(tr.state==='waitMorning'){if(isMorning()&&!S.disc.drag){tr.state='run';SFX.whistle();S.flags.trainMorningDepart=(S.flags.trainMorningDepart||0)+1;logEv('trainDepart',tr.st&&tr.st.tile);const t=tr.st.tile;tr.st=null;trainPlan(t);}return;}
  if(tr.state==='home'){tr.unloadT-=dt;if(tr.unloadT<=0&&S.flyers.length===0){tr.state='done';SFX.big();S.g.wave=1.5;S.phase='newLap';S.phaseT=0;if(S.revealed){S.reveal.anim='close';S.reveal.t=0;}}return;}
  if(tr.state==='run'){
    if(!tr.leg){if(tr.route.length)trainLegTo(tr.route.shift());else return;}
    const near=tr.route.length===0&&tr.leg.to.t!=null&&S.plots[tr.leg.to.t]&&S.plots[tr.leg.to.t].station&&!S.plots[tr.leg.to.t].loaded;
    const target=near&&(legLen()-tr.leg.d)<0.25?0.35:0.95;tr.speed=lerp(tr.speed,target,Math.min(1,dt*2.5));
    let mv=tr.speed*dt;tr.chuffD+=mv;if(tr.chuffD>0.28){tr.chuffD=0;SFX.chuff();const lp=trainCarPos(0);addP({x:lp[0],y:lp[1]-0.12*R,vx:(FX()-0.5)*0.1*R,vy:-0.25*R,life:0,max:0.8,s:0.03*R,col:C.white,g:-0.05,k:1});}
    while(mv>0&&tr.leg){const ll=legLen();const rem=ll-tr.leg.d;if(mv<rem){tr.leg.d+=mv;mv=0;}else{mv-=rem;const to=tr.leg.to;tr.trail.push(to);if(tr.trail.length>16)tr.trail.shift();tr.leg=null;trainArrive(to);if(tr.state!=='run')break;if(tr.route.length)trainLegTo(tr.route.shift());}}
  }
}

/* ================= phases ================= */
function updPhase(dt){
  S.phaseT+=dt;
  if(S.phase==='lapDone'&&S.phaseT>1.2&&S.g.mode!=='dig'){S.phase='treeReady';S.tree.ripe=true;S.phaseT=0;SFX.look();}
  if(S.phase==='newLap'){
    if(!S.swapped&&S.phaseT>0.9){S.swapped=true;S.lap++;setupLap();for(const sn of S.snows)sn.drop=1;S.g={mode:'idle',t:0,look:[0,0],lookYou:0,tilt:0,cur:null,runQ:[],basket:[],idleT:0,wave:0};S.can.held=false;S.can.fly=0;SFX.whistle();}
    if(S.swapped){for(const sn of S.snows)sn.drop=Math.max(0,sn.drop-dt*1.6);}
    if(S.phaseT>1.8){S.phase='play';S.swapped=false;logEv('newLap',S.lap);}
  }else if(S.snows)for(const sn of S.snows)sn.drop=Math.max(0,sn.drop-dt*1.6);
}

/* ================= guidance ================= */
function busy(){return S.piece.mv||S.piece.queue>0||S.dice.rolling||!(S.g.mode==='idle'||S.g.mode==='tilt')||S.can.held||S.reveal.anim||S.can.fly>0;}
function dryPlot(){const cand=S.plotList.filter(p=>p.planted&&p.moist<0.2&&!p.ever);if(!cand.length)return null;
  const wet=new Set(S.plotList.filter(p=>p.ever).map(p=>p.tile));
  cand.sort((a,b)=>{const sa=(wet.has(mod(a.tile+1,16))||wet.has(mod(a.tile-1,16)))?0:1,sb=(wet.has(mod(b.tile+1,16))||wet.has(mod(b.tile-1,16)))?0:1;if(sa!==sb)return sa-sb;return Math.abs(shortA(S.piece.tile,a.tile)-S.piece.tile)-Math.abs(shortA(S.piece.tile,b.tile)-S.piece.tile);});return cand[0];}
function bestPlug(){
  let best=null,bs=-1;
  for(const pl of S.net.plugs){const up=pl.edges[0].parent;if(!(up.fill>=1))continue;const blocked=pl.edges[pl.pos];
    let sc=blocked.pool+1;const tgt=blocked.out!=null?S.plots[blocked.out]:null;if(tgt&&!tgt.ever)sc+=2;if(blocked.out==null)sc+=1.5;if(sc>bs){bs=sc;best=pl;}}
  return best;
}
function computeLure(){
  if(S.phase==='treeReady')return{k:'tree'};
  if(S.phase==='train'){const tr=S.train;if(tr.state==='waitMorning')return{k:'discB'};if(tr.state==='pause')return{k:'discF'};return null;}
  if(S.phase!=='play'||busy())return null;
  const ripe=S.plotList.some(p=>fruitCount(p)>0);
  if(isEvening()&&ripe)return{k:'gardener'};
  if(S.snows.some(s=>s.cleared&&s.heap>0.01))return{k:'discF'};
  if(S.revealed&&S.reveal.open>0.95&&!S.lapF.plugMoved){const pl=bestPlug();if(pl)return{k:'plug',pl};}
  if(S.snows.some(s=>s.cleared&&s.pond.water>0.3&&s.pond.ice<0.6&&!s.pond.frozeOnce))return{k:'discB'};
  if(S.lapF.rolls>=2&&!S.lapF.canUsed){const p=dryPlot();if(p)return{k:'can',p};}
  if(ripe&&!S.lapF.harvested&&S.lapF.rolls>=3)return{k:'discF'};
  return{k:'dice'};
}
function lureXY(l){
  if(!l)return null;

let act=null;let ptr=[0,0];
function rel(e){return[e.clientX,e.clientY];}
function hitTest(p){
  const[x,y]=p;const cands=[];
  if(canAllowed()){const c=canPos();cands.push({k:'can',sc:dist(x,y,c[0],c[1]+0.02*R)/Math.max(0.15*R,30)});}
  if(S.revealed&&S.reveal.open>0.95){for(const pl of S.net.plugs){const m=[(pl.s[0][0]+pl.s[1][0])/2,(pl.s[0][1]+pl.s[1][1])/2];cands.push({k:'plug',pl,sc:dist(x,y,m[0],m[1])/Math.max(0.13*R,26)});}}
  if(S.phase!=='newLap'){const g=gardenerPos();cands.push({k:'gardener',sc:dist(x,y,g[0],g[1]-0.06*R)/Math.max(0.16*R,30)});}
  const dcc=dist(x,y,CX,CY);if(dcc<0.4*R)cands.push({k:'disc',sc:0.55});
  let best=null;for(const c of cands)if(c.sc<1&&(!best||c.sc<best.sc))best=c;
  if(best){if(best.k==='disc')return{k:'disc'};return best;}
  const ds=L.diceSize;if(Math.abs(x-L.dice[0])<ds*0.68&&Math.abs(y-L.dice[1])<ds*0.68&&S.phase==='play')return canRoll()?{k:'dice'}:{k:'wig',o:S.dice};
  if(dist(x,y,L.tree[0],L.tree[1])<0.42*R)return{k:'tree'};
  const dc=dcc;
  const cl=carList();for(let k=0;k<cl.length;k++){const cp=trainCarPos(k);if(dist(x,y,cp[0],cp[1])<0.17*R)return{k:'wig',o:S.train,snd:'toot'};}

  if(S.reveal.open>0.95&&dist(x,y,L.lidRest[0],L.lidRest[1])<0.25*R)return{k:'wigLid'};

  return null;
}
function discAllowed(){if(S.phase==='train'||S.phase==='treeReady'||S.phase==='lapDone'||S.phase==='treeDrop')return true;return S.phase==='play'&&!S.piece.mv&&S.piece.queue===0&&!S.dice.rolling&&S.g.mode!=='dig'&&S.g.mode!=='harvest';}
function onDown(e){
  e.preventDefault();audioInit();
  if(S.hand){S.hand=null;}
  S.idle=0;
  if(act)return;
  const p=rel(e);ptr=p;const h=hitTest(p);if(!h)return;
  act={id:e.pointerId,h,sx:p[0],sy:p[1],moved:false};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  switch(h.k){
    case'dice':rollDice();break;
    case'can':{S.can.held=true;const c=canPos();S.can.x=c[0];S.can.y=c[1];SFX.look();S.g.lookYou=0;break;}
    case'plug':h.pl.drag=true;act.x0=h.pl.x;break;
    case'disc':if(discAllowed()){S.disc.drag=true;S.disc.last=Math.atan2(p[1]-CY,p[0]-CX);S.disc.acc=0;}else{S.disc.resist=0.3;SFX.resist();}break;

    case'wig':h.o.wob=1;if(h.snd==='toot')SFX.toot();else SFX.wiggle();break;

}
function onMove(e){

  if(h.k==='plug'){const pl=h.pl;const a=pl.s[0],b=pl.s[1];const vx=b[0]-a[0],vy=b[1]-a[1];const l2=vx*vx+vy*vy||1;pl.x=clamp(((p[0]-a[0])*vx+(p[1]-a[1])*vy)/l2,0,1);}
  else if(h.k==='disc'&&S.disc.drag){const r=dist(p[0],p[1],CX,CY);if(r<0.05*R)return;const an=Math.atan2(p[1]-CY,p[0]-CX);let d=wrapA(an-S.disc.last);S.disc.last=an;d=clamp(d,-0.9,0.9);const dT=d/(TAU/4);const done=applyDT(dT);S.disc.acc+=done;if(dT<0&&done===0)S.disc.resist=0.3;}
}
function onUp(e,cancel){

let last=0,raf=0,running=false;
function frame(now){
  raf=0;if(!running)return;
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);
  try{update(dt);render();}catch(e){if(!S.err){S.err=String(e&&e.stack||e);console.error(e);}}
  raf=requestAnimationFrame(frame);
}
function update(dt){
  S.time+=dt;S.shake=Math.max(0,S.shake-dt*2);
  updDice(dt);updPiece(dt);
  if(!S.disc.drag&&!S.piece.mv){const tg=Math.round(S.T);const df=tg-S.T;if(Math.abs(df)>1e-5){let st=df*Math.min(1,dt*12);if(Math.abs(df)<0.004)st=df;applyDT(st);}}

<script>
'use strict';
(function(){
// ============================================================ basics
const TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const saEl = document.getElementById('sa');
const COL = { bd:'#1d3a2c', bdD:'#152c20', bdL:'#2a4c39', w:'#f3efe2', y:'#f6dc6e', p:'#f3a5bb' };
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOB = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SESSION_SEED = (Math.random() * 1e9) | 0;
const srnd = mulberry(SESSION_SEED);
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

let VW = 0, VH = 0, DPR = 1, S = 50;
let SA = { t:0, r:0, b:0, l:0 };
let LY = null;
let now = 0;            // game clock (s), advances only while visible
let lastInput = 0;
let needLayout = true;

// ============================================================ audio (Web Audio synth)
let AC = null, MG = null, NB = null;
const sndLast = {};
function startAudio(){
  try {
    if (AC) { if (AC.state === 'suspended' && !document.hidden) AC.resume().catch(()=>{}); return; }
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    AC = new A();
    MG = AC.createGain(); MG.gain.value = 0.55;
    const comp = AC.createDynamicsCompressor();
    MG.connect(comp); comp.connect(AC.destination);
    NB = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.8), AC.sampleRate);
    const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(MG); s.start(0);
    if (AC.state === 'suspended') AC.resume().catch(()=>{});
  } catch (e) { AC = null; }
}
function canPlay(name, gap){ const t = performance.now(); if (sndLast[name] && t - sndLast[name] < gap) return false; sndLast[name] = t; return true; }
function tone(type, f0, f1, dur, vol, delay, att){
  if (!AC || AC.state !== 'running') return;
  try {
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (att || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noise(dur, vol, ftype, f, q, delay, f1){
  if (!AC || AC.state !== 'running' || !NB) return;
  try {
    const t = AC.currentTime + (delay || 0);
    const s = AC.createBufferSource(); s.buffer = NB;
    const fl = AC.createBiquadFilter(); fl.type = ftype; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(MG);

  } catch (e) {}
}
const SND = {
  squeak(sp){ if (!canPlay('sq', 55)) return; const p = 1 + Math.min(sp, 9) * 0.07;
    tone('triangle', 1050 * p, 1450 * p, 0.07, 0.06); tone('sine', 2100 * p, 1700 * p, 0.05, 0.025); noise(0.05, 0.035, 'bandpass', 2800 * p, 5); },
  dent(){ tone('sine', 520, 300, 0.09, 0.1); noise(0.06, 0.06, 'bandpass', 2400, 3); },
  pop(n, type){ if (!canPlay('pop', 40)) return; const b = (type === 'T' ? 392 : type === 'V' ? 494 : 330) * Math.pow(2, Math.min(n, 10) / 12);
    tone('sine', b * 0.6, b * 1.6, 0.13, 0.17); tone('triangle', b * 1.6, b * 1.25, 0.1, 0.05, 0.05); },
  puff(){ if (!canPlay('pf', 60)) return; noise(0.16, 0.05, 'lowpass', 1300, 1); },
  press(){ tone('sine', 280, 190, 0.12, 0.13); },
  stretch(){ if (!canPlay('st', 260)) return; tone('sine', 300, 560, 0.18, 0.05); },
  bounce(){ tone('sine', 420, 720, 0.08, 0.11); tone('sine', 720, 540, 0.12, 0.07, 0.07); },
  thump(){ noise(0.13, 0.11, 'lowpass', 520, 1); tone('sine', 150, 80, 0.13, 0.14); },
  grow(){ tone('triangle', 330, 990, 0.34, 0.06); },
  success(type){
    const N = type === 'ham' ? [523, 659, 784, 1047] : type === 'swing' ? [587, 740, 880, 1175] : [659, 831, 988, 1319];
    N.forEach((f, i) => { tone('triangle', f, f, 0.34, 0.11, i * 0.085); tone('sine', f * 2, f * 2, 0.22, 0.035, i * 0.085); });
    if (type === 'cart') for (let i = 0; i < 4; i++) noise(0.05, 0.07, 'bandpass', 1800, 6, 0.38 + i * 0.12);
    if (type === 'swing') tone('sine', 880, 1320, 0.4, 0.05, 0.36);
    if (type === 'ham') tone('sine', 520, 390, 0.6, 0.05, 0.36);
  },
  hood(){ [784, 988, 1175, 1568].forEach((f, i) => tone('sine', f, f, 0.3, 0.07, i * 0.06)); },
  unlink(){ tone('sine', 520, 240, 0.26, 0.08); noise(0.12, 0.04, 'lowpass', 900, 1, 0.05); },
  yawn(){ tone('sine', 560, 300, 0.5, 0.06); tone('sine', 300, 220, 0.5, 0.05, 0.45); },
  kick(){ if (!canPlay('kk', 300)) return; tone('sine', 620, 860, 0.07, 0.045); },
  wave(){ if (!canPlay('wv', 500)) return; tone('sine', 1320, 1320, 0.08, 0.05); tone('sine', 1568, 1568, 0.1, 0.05, 0.09); },
  hop(){ tone('sine', 640, 1080, 0.11, 0.07); },
  giggle(){ [900, 1150, 980, 1250].forEach((f, i) => tone('sine', f, f * 1.05, 0.06, 0.05, i * 0.07)); },
  fest(){ [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => { tone('triangle', f, f, 0.32, 0.1, i * 0.13); tone('sine', f / 2, f / 2, 0.3, 0.05, i * 0.13); });
    for (let i = 0; i < 12; i++) noise(0.05, 0.05, 'highpass', 5000, 1, i * 0.13); },
  bell(i){ const f = 784 * Math.pow(2, (i * 3) / 12); tone('sine', f, f, 0.7, 0.07); tone('sine', f * 2.01, f * 2.01, 0.4, 0.025); },
  erase(){ noise(0.7, 0.12, 'bandpass', 1400, 0.7, 0, 2600); },
  rub(){ if (!canPlay('rb', 120)) return; noise(0.1, 0.03, 'bandpass', 1800, 1); },
};

// ============================================================ chalk drawing helpers
let grainCv = null;
function makeGrain(){
  grainCv = document.createElement('canvas'); grainCv.width = grainCv.height = 96;
  const g = grainCv.getContext('2d'); const im = g.createImageData(96, 96); const r = mulberry(77);
  for (let i = 0; i < 96 * 96; i++) { const v = r(); im.data[i * 4 + 3] = v < 0.26 ? 255 : (v < 0.34 ? 120 : 0); }
  g.putImageData(im, 0, 0);
}
function cs(c, p, w, col, r, alpha){ // chalk stroke, 2 passes with jitter
  if (p.length < 4) return;
  c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round';
  const a0 = alpha == null ? 1 : alpha;
  for (let pass = 0; pass < 2; pass++) {
    c.globalAlpha = a0 * (pass ? 0.5 : 0.92); c.lineWidth = pass ? w * 0.55 : w;
    const j = w * (pass ? 0.55 : 0.2);
    c.beginPath();
    for (let i = 0; i < p.length; i += 2) {
      const x = p[i] + (r() - 0.5) * j, y = p[i + 1] + (r() - 0.5) * j;
      if (i) c.lineTo(x, y); else c.moveTo(x, y);
    }
    c.stroke();
  }
  c.globalAlpha = 1;
}
function ell(cx, cy, rx, ry, n, r, wob, a0, a1){
  const p = []; a0 = a0 || 0; a1 = a1 == null ? TAU : a1;
  for (let i = 0; i <= n; i++) { const t = a0 + (a1 - a0) * i / n; const k = 1 + (r() - 0.5) * (wob || 0); p.push(cx + Math.cos(t) * rx * k, cy + Math.sin(t) * ry * k); }
  return p;
}
function polyPath(c, p){ c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath(); }
function hatch(c, p, col, gap, w, ang, r, alpha){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < p.length; i += 2) { x0 = Math.min(x0, p[i]); x1 = Math.max(x1, p[i]); y0 = Math.min(y0, p[i + 1]); y1 = Math.max(y1, p[i + 1]); }
  c.save(); c.beginPath(); polyPath(c, p); c.clip();
  c.strokeStyle = col; c.lineWidth = w; c.globalAlpha = alpha; c.lineCap = 'round';
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, D = Math.hypot(x1 - x0, y1 - y0) / 2 + w;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  c.beginPath();
  for (let d = -D; d < D; d += gap) {
    const ox = cx - sa * d, oy = cy + ca * d, j = (r() - 0.5) * gap * 0.6;
    c.moveTo(ox - ca * D + j, oy - sa * D); c.lineTo(ox + ca * D, oy + sa * D + j);
  }
  c.stroke(); c.restore(); c.globalAlpha = 1;
}
function dot(c, x, y, rad, col, a){ c.globalAlpha = a == null ? 0.9 : a; c.fillStyle = col; c.beginPath(); c.arc(x, y, rad, 0, TAU); c.fill(); c.globalAlpha = 1; }
function sprite(w, h, ax, ay, seed, fn, noGrain){
  const o = document.createElement('canvas');
  o.width = Math.max(1, Math.ceil(w * DPR)); o.height = Math.max(1, Math.ceil(h * DPR));
  const c = o.getContext('2d'); c.scale(DPR, DPR); c.translate(ax, ay);
  fn(c, mulberry(seed));
  if (!noGrain) {
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'destination-out'; c.globalAlpha = 0.75;
    c.fillStyle = c.createPattern(grainCv, 'repeat'); c.fillRect(0, 0, o.width, o.height);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  }

}
function dSpr(c, sp, x, y, sc){ sc = sc || 1; c.drawImage(sp.cv, x - sp.ax * sc, y - sp.ay * sc, sp.w * sc, sp.h * sc); }
// cheap dynamic chalk line (main canvas)
function dl(c, p, w, col, alpha, dash){
  if (p.length < 4) return;
  c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round';
  if (dash) c.setLineDash(dash);
  c.globalAlpha = alpha; c.lineWidth = w;
  c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.stroke();
  c.globalAlpha = alpha * 0.45; c.lineWidth = w * 0.5;
  c.beginPath(); c.moveTo(p[0] + w * 0.3, p[1] - w * 0.25); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i] + w * 0.3, p[i + 1] - w * 0.25); c.stroke();
  if (dash) c.setLineDash([]);
  c.globalAlpha = 1;
}

// ============================================================ picture primitives (used by sprites)
function picTree(c, r, s, st){ // s = scale unit, base at 0,0
  const k = st ? [0.85, 1, 1.12][st - 1] : 1;
  const th = 1.3 * s * k;
  cs(c, [-0.14 * s, 0, -0.11 * s, -th * 0.5, -0.09 * s, -th], 0.075 * s, COL.w, r);
  cs(c, [0.14 * s, 0, 0.11 * s, -th * 0.5, 0.09 * s, -th], 0.075 * s, COL.w, r);
  cs(c, [-0.14 * s, 0, -0.32 * s, 0.05 * s], 0.05 * s, COL.w, r);
  cs(c, [0.14 * s, 0, 0.3 * s, 0.06 * s], 0.05 * s, COL.w, r);
  for (let i = 0; i < 4; i++) { const y = -th * (0.18 + i * 0.19); cs(c, [-0.05 * s, y, 0.04 * s, y - 0.07 * s], 0.03 * s, COL.w, r, 0.55); }
  cs(c, [0.09 * s, -th * 0.72, 0.36 * s, -th * 0.9], 0.05 * s, COL.w, r);
  const cy = -th - 0.55 * s * k, R = 0.8 * s * k, p = [];
  const ph = r() * 6;
  for (let i = 0; i <= 44; i++) { const a = i / 44 * TAU; const rr = R * (1 + 0.1 * Math.sin(a * 7 + ph) + (r() - 0.5) * 0.04); p.push(Math.cos(a) * rr * 1.08, cy + Math.sin(a) * rr * 0.9); }
  hatch(c, p, COL.w, 0.13 * s, 0.03 * s, 0.8, r, 0.32);
  cs(c, p, 0.075 * s, COL.w, r);
  for (let i = 0; i < 3; i++) { const ax = (r() - 0.5) * R, ay = cy + (r() - 0.5) * R * 0.7; cs(c, ell(ax, ay, 0.17 * R, 0.13 * R, 10, r, 0.1, 0.4, 4.6), 0.035 * s, COL.w, r, 0.7); }
  if (st >= 2) for (let i = 0; i < 5; i++) { const a = r() * TAU, d = r() * R * 0.75; dot(c, Math.cos(a) * d, cy + Math.sin(a) * d * 0.8, 0.075 * s, COL.y); }
  if (st >= 3) for (let i = 0; i < 6; i++) { const a = r() * TAU, d = R * (0.4 + r() * 0.45), fx = Math.cos(a) * d, fy = cy + Math.sin(a) * d * 0.85;
    for (let j = 0; j < 5; j++) dot(c, fx + Math.cos(j / 5 * TAU) * 0.06 * s, fy + Math.sin(j / 5 * TAU) * 0.06 * s, 0.04 * s, COL.p); dot(c, fx, fy, 0.03 * s, COL.y); }
}
function leafShape(cx, cy, sz, ang){
  const p = [], ca = Math.cos(ang), sa = Math.sin(ang);
  for (let i = 0; i <= 22; i++) { const t = i / 22 * TAU; const x = Math.sin(t) * 0.55 * (1 - Math.cos(t) * 0.25), y = -(0.5 - 0.5 * Math.cos(t)) * 1.0;
    p.push(cx + (x * ca - y * sa) * sz, cy + (x * sa + y * ca) * sz); }
  return p;
}
function picLeaf(c, r, s, col){
  const p = leafShape(0, 0.05 * s, 1.0 * s, 0);
  hatch(c, p, col || COL.w, 0.11 * s, 0.03 * s, 0.6, r, 0.3);
  cs(c, p, 0.07 * s, col || COL.w, r);
  cs(c, [0, 0.05 * s, 0, -0.85 * s], 0.05 * s, COL.y, r, 0.9);
  for (let i = 1; i < 4; i++) { const y = -0.18 * s * i; cs(c, [0, y, -0.2 * s, y - 0.12 * s], 0.03 * s, COL.w, r, 0.7); cs(c, [0, y, 0.2 * s, y - 0.12 * s], 0.03 * s, COL.w, r, 0.7); }
  const q = []; for (let i = 0; i <= 16; i++) { const t = i / 16; const a = t * 3.6 * Math.PI; const rr = 0.18 * s * (1 - t * 0.8); q.push(0.05 * s + Math.cos(a) * rr + t * 0.1 * s, 0.1 * s + Math.sin(a) * rr + 0.05 * s); }

function picVine(c, r, s, st){
  const k = st ? [0.85, 1, 1.15][st - 1] : 1;
  const p = [], H = 1.1 * s * k;
  for (let i = 0; i <= 22; i++) { const t = i / 22; p.push(Math.sin(t * 7) * 0.16 * s * (1 - t * 0.3), -t * H); }
  const tx = p[p.length - 2], ty = p[p.length - 1];
  for (let i = 1; i <= 16; i++) { const t = i / 16; const a = Math.PI + t * 3.2 * Math.PI; const rr = 0.2 * s * (1 - t * 0.8); p.push(tx + 0.2 * s + Math.cos(a) * rr, ty + Math.sin(a) * rr); }
  cs(c, p, 0.065 * s, COL.w, r);
  const L = [0.22, 0.48, 0.74]; L.forEach((t, i) => { const x = Math.sin(t * 7) * 0.16 * s, y = -t * H; const sd = i % 2 ? 1 : -1;
    const lp = leafShape(x, y, 0.36 * s * k, sd * 1.0); hatch(c, lp, COL.w, 0.07 * s, 0.025 * s, 0.4, r, 0.35); cs(c, lp, 0.05 * s, COL.w, r);
    cs(c, [x, y, x + Math.sin(sd) * 0.28 * s * k, y - Math.cos(sd) * 0.28 * s * k], 0.03 * s, COL.y, r, 0.9); });

  cs(c, [-0.3 * s, 0.02 * s, -0.1 * s, 0, 0.12 * s, 0.01 * s, 0.32 * s, 0.03 * s], 0.035 * s, COL.w, r, 0.5);

function picPump(c, r, s, g){

  cs(c, outer, 0.07 * s, COL.y, r);
  cs(c, ell(0, cy, rx * 0.42, ry * 0.98, 20, r, 0.04, -1.4, 1.4), 0.045 * s, COL.y, r, 0.85);
  cs(c, ell(0, cy, rx * 0.42, ry * 0.98, 20, r, 0.04, 1.75, 4.55), 0.045 * s, COL.y, r, 0.85);
  cs(c, [0, cy - ry * 0.92, 0.03 * s, cy - ry * 1.25, 0.12 * s, cy - ry * 1.38], 0.075 * s, COL.w, r);
  const lp = leafShape(-0.08 * s, cy - ry * 0.95, 0.3 * s, -1.2); cs(c, lp, 0.04 * s, COL.w, r, 0.85);
  const q = []; for (let i = 0; i <= 14; i++) { const t = i / 14, a = t * 3.4 * Math.PI, rr = 0.12 * s * (1 - t * 0.7); q.push(0.14 * s + Math.cos(a) * rr + t * 0.12 * s, cy - ry * 1.3 + Math.sin(a) * rr); }

function picFace(c, x, y, s){
  dot(c, x - 0.13 * s, y, 0.05 * s, COL.w, 1); dot(c, x + 0.13 * s, y, 0.05 * s, COL.w, 1);
  dot(c, x - 0.13 * s, y + 0.01 * s, 0.022 * s, COL.bdD, 1); dot(c, x + 0.13 * s, y + 0.01 * s, 0.022 * s, COL.bdD, 1);
  dot(c, x - 0.24 * s, y + 0.1 * s, 0.045 * s, COL.p, 0.8); dot(c, x + 0.24 * s, y + 0.1 * s, 0.045 * s, COL.p, 0.8);

// ============================================================ sprites
const SP = {};
let sectors = [];   // session arrangement of disk pictures
function buildSprites(){
  const s = S;
  SP.tree = [];
  for (let st = 1; st <= 3; st++) { SP.tree[st] = [];
    for (let v = 0; v < 2; v++) SP.tree[st][v] = sprite(2.3 * s, 3.3 * s, 1.15 * s, 3.05 * s, 100 + st * 7 + v, (c, r) => picTree(c, r, s, st)); }
  SP.vine = []; for (let st = 1; st <= 3; st++) SP.vine[st] = sprite(1.4 * s, 1.7 * s, 0.6 * s, 1.5 * s, 200 + st, (c, r) => picVine(c, r, s, st));

<script>
'use strict';
(function(){
/* ============================================================
   ぐるぐる！ジュースインクとまんが町の大行進
   ミキサー長押し → ジュースがペンのインクに → 町に道具を描く
   ============================================================ */
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const c01=t=>clamp(t,0,1);
const eOut=t=>{t=c01(t);return 1-(1-t)*(1-t)*(1-t);};
const eIn=t=>{t=c01(t);return t*t;};
const eIO=t=>{t=c01(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const eBack=t=>{t=c01(t);const c=2.0;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const R=Math.random, rr=(a,b)=>a+R()*(b-a);
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function mkRng(s){s=(s>>>0)||7;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a.toFixed(3)+')';}
function mixHex(a,b,t){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);t=c01(t);
 const r=Math.round(lerp(x>>16,y>>16,t)),g=Math.round(lerp((x>>8)&255,(y>>8)&255,t)),bl=Math.round(lerp(x&255,y&255,t));
 return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);}

/* ---------- パレット（白地＋朱赤・草緑・山吹・群青） ---------- */
const K={ink:'#1c1a22',paper:'#fffdf4',red:'#e8432d',green:'#45a842',yellow:'#f7b928',blue:'#2b4db6',
 skin:'#ffd6b0',water:'#a8cdf4',waterD:'#5f98e0',mud:'#8a5530',mudL:'#a9713f',gray:'#cfcabd',lgray:'#ebe7dc',
 pale:'#fff3c2',bgDot:'#3a5dc4',night:'#11142a',
 leaf:'#2f8a3a',white:'#ffffff',pink:'#f59a8a'};
const FRUIT={
 s:{col:K.red,  juice:'#e8432d', dark:'#a82a18'},
 m:{col:'#7fcf55',juice:'#5fbe42', dark:'#2f8a3a'},
 b:{col:K.yellow,juice:'#f8cc2a', dark:'#c58c10', thin:'#fde58a'},
 u:{col:K.blue, juice:'#3a47bf', dark:'#1d2a80'},
 p:{col:'#222', juice:'#151320', dark:'#000'}
};
const FKEYS=['s','m','b','u'];

/* ============================================================
   音（Web Audio 合成のみ）
   ============================================================ */
const AU={c:null,master:null,noise:null,motor:null,
 // 最初のタッチで重い準備をしないよう、読みこみのあと（まだ鳴らない状態で）作っておく
 prep(){
  if(this.c||this.bad) return;
  try{
   const A=window.AudioContext||window.webkitAudioContext; if(!A){ this.bad=1; return; }
   const c=new A(); this.c=c;
   const comp=c.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=10; comp.ratio.value=6;
   const m=c.createGain(); m.gain.value=.6; m.connect(comp); comp.connect(c.destination); this.master=m;
   const len=(c.sampleRate*1.2)|0, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
   for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
   this.noise=b;
  }catch(e){ this.c=null; this.master=null; this.bad=1; }
 },
 init(){
  if(!this.c) this.prep();
  const c=this.c; if(!c||c.state==='running') return;
  try{   // 指が触れたときだけ鳴らせるようにする（無音を1つ鳴らしてから resume）
   const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0);
   const p=c.resume();   // 鳴らせるようになった時にまだ押していれば、モーターの音をつける
   if(p&&p.then) p.then(()=>{ try{ if(MX.press&&!this.motor){ this.motorOn(); this.motorSet(MX.level,MX.fruit); } }catch(e){} },()=>{});
  }catch(e){}
 },
 live(){ return !!(this.c && this.c.state==='running' && this.master); },
 suspend(){ this.motorOff(); if(this.c && this.c.state==='running'){ try{ const p=this.c.suspend(); if(p&&p.catch)p.catch(()=>{});}catch(e){} } },
 tone(f,dur,o){ if(!this.live())return; o=o||{}; const c=this.c, t0=c.currentTime+(o.at||0);
  const osc=c.createOscillator(), g=c.createGain(); osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(f,t0); if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+dur);
  const v=o.vol==null?.2:o.vol, a=o.attack||.006;
  g.gain.setValueAtTime(.0001,t0); g.gain.linearRampToValueAtTime(v,t0+a); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  osc.connect(g); g.connect(this.master); osc.start(t0); osc.stop(t0+dur+.05);
 },
 nz(dur,o){ if(!this.live()||!this.noise)return; o=o||{}; const c=this.c, t0=c.currentTime+(o.at||0);
  const s=c.createBufferSource(); s.buffer=this.noise; s.loop=true;
  const fl=c.createBiquadFilter(); fl.type=o.type||'bandpass'; fl.frequency.setValueAtTime(o.freq||1200,t0);
  if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t0+dur); fl.Q.value=o.q==null?1:o.q;
  const g=c.createGain(), v=o.vol==null?.15:o.vol, a=o.attack||.006;
  g.gain.setValueAtTime(.0001,t0); g.gain.linearRampToValueAtTime(v,t0+a); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t0,Math.random()*.6); s.stop(t0+dur+.05);
 },
 motorOn(){ if(!this.live()||this.motor)return; const c=this.c, t=c.currentTime;
  try{
   const o1=c.createOscillator(); o1.type='sawtooth'; o1.frequency.value=72;
   const o2=c.createOscillator(); o2.type='square'; o2.frequency.value=73;
   const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.Q.value=5;
   const ns=c.createBufferSource(); ns.buffer=this.noise; ns.loop=true;
   const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=800; bp.Q.value=1.4;
   const gn=c.createGain(); gn.gain.value=.07;
   const lfo=c.createOscillator(); lfo.frequency.value=11; const lg=c.createGain(); lg.gain.value=.04; lfo.connect(lg); lg.connect(gn.gain);
   const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.13,t+.03);
   o1.connect(lp); o2.connect(lp); lp.connect(g); ns.connect(bp); bp.connect(gn); gn.connect(g); g.connect(this.master);
   o1.start(t); o2.start(t); ns.start(t); lfo.start(t);
   this.motor={o1,o2,lp,bp,g,ns,lfo};
  }catch(e){ this.motor=null; }
 },
 motorSet(level,fruit){ const m=this.motor; if(!m||!this.c)return; const t=this.c.currentTime;
  let f=72+Math.min(level,1)*90; if(fruit==='b'&&level>1) f=170+(level-1)*110; if(fruit==='p') f=60+Math.min(level,1)*70;
  m.o1.frequency.setTargetAtTime(f,t,.05); m.o2.frequency.setTargetAtTime(f*1.013,t,.05);
  m.lp.frequency.setTargetAtTime(480+Math.min(level,2)*650,t,.07);
  m.bp.frequency.setTargetAtTime(fruit==='b'&&level>1?2400:700+Math.min(level,1)*900,t,.08);
 },
 motorOff(){ const m=this.motor; if(!m)return; this.motor=null; if(!this.c)return; const t=this.c.currentTime;
  try{ m.g.gain.cancelScheduledValues(t); m.g.gain.setValueAtTime(.1,t); m.g.gain.exponentialRampToValueAtTime(.0001,t+.12);
   [m.o1,m.o2,m.ns,m.lfo].forEach(n=>{try{n.stop(t+.15);}catch(e){}}); }catch(e){}
 }
};
const SFX={
 tap(){AU.tone(880,.08,{type:'triangle',vol:.12,f2:1250});},
 wiggle(){AU.tone(1250,.07,{vol:.07,f2:1700}); AU.tone(1500,.05,{vol:.04,at:.05});},
 plop(){AU.tone(320,.16,{vol:.24,f2:120}); AU.nz(.07,{freq:900,vol:.07});},
 toss(){AU.tone(500,.18,{type:'triangle',vol:.08,f2:900});},
 press(){AU.tone(170,.07,{type:'square',vol:.07,f2:95});},
 squish(){AU.nz(.08,{freq:rr(450,950),q:2.5,vol:.13}); AU.tone(rr(200,300),.06,{vol:.06,f2:120});},
 mixed(){AU.tone(660,.12,{type:'triangle',vol:.14}); AU.tone(990,.2,{type:'triangle',vol:.12,at:.08});},
 stretch(){AU.tone(260,.55,{vol:.2,f2:880}); AU.tone(270,.5,{type:'triangle',vol:.06,f2:860,at:.03}); AU.tone(1320,.25,{vol:.05,at:.4});},
 boing(){AU.tone(180,.3,{vol:.16,f2:420}); AU.tone(420,.12,{vol:.05,at:.18,f2:300});},
 emptySpin(){AU.tone(140,.12,{type:'square',vol:.04,f2:110});},
 glug(i){AU.tone(460-i*45,.1,{vol:.17,f2:250-i*20});},
 scribble(){AU.nz(.06,{freq:rr(2200,3600),q:1.2,vol:.05});},
 pop(){AU.tone(520,.1,{type:'triangle',vol:.16,f2:1040});},
 small(){AU.tone(700,.08,{type:'triangle',vol:.1,f2:1000}); AU.tone(940,.1,{type:'triangle',vol:.07,at:.07});},
 success(){[523,659,784,1047].forEach((f,i)=>AU.tone(f,.3,{type:'triangle',vol:.16,at:i*.085})); AU.tone(1568,.55,{vol:.08,at:.34}); AU.tone(2093,.4,{vol:.05,at:.42});},
 cheer(){AU.tone(700,.12,{type:'square',vol:.04,f2:1100}); AU.tone(900,.16,{type:'square',vol:.04,f2:1400,at:.12});},
 honk(){[0,.2].forEach(a=>{AU.tone(392,.15,{type:'square',vol:.07,at:a}); AU.tone(494,.15,{type:'square',vol:.045,at:a});});},
 siren(){for(let i=0;i<4;i++) AU.tone(i%2?740:988,.22,{type:'triangle',vol:.06,at:i*.22,attack:.02});},
 spray(d){AU.nz(d,{freq:3200,q:.5,vol:.11,type:'highpass',attack:.06});},
 vine(){[392,440,523,587,659,784].forEach((f,i)=>AU.tone(f,.18,{type:'triangle',vol:.1,at:i*.1}));},
 rain(d){for(let i=0;i<16;i++) AU.tone(rr(1700,3200),.03,{vol:.035,at:R()*d}); AU.nz(d,{freq:5200,type:'highpass',vol:.045,attack:.3});},
 chime(){[1047,1319,1568,2093].forEach((f,i)=>AU.tone(f,.42,{vol:.08,at:i*.07}));},
 creak(){AU.tone(110,.25,{type:'sawtooth',vol:.035,f2:85});},
 rope(){AU.tone(220,.4,{vol:.15,f2:640});},
 heave(){AU.tone(150,.12,{type:'triangle',vol:.15,f2:95}); AU.nz(.05,{freq:420,vol:.05});},
 knock(){AU.tone(260,.06,{type:'square',vol:.07}); AU.tone(250,.06,{type:'square',vol:.07,at:.16});},
 shutter(){for(let i=0;i<7;i++) AU.tone(300+i*70,.04,{type:'square',vol:.035,at:i*.07});},
 whoosh(){AU.nz(1.8,{freq:180,f2:1600,q:.7,type:'lowpass',vol:.24,attack:.35}); AU.tone(62,1.9,{vol:.18,f2:42,attack:.3});},
 drum(){AU.tone(95,.25,{vol:.28,f2:52}); AU.nz(.05,{freq:320,vol:.07});},
 fue(){AU.tone(1180,.18,{type:'triangle',vol:.05,f2:1320}); AU.tone(1320,.22,{type:'triangle',vol:.05,at:.2,f2:1180});},
 launch(){AU.tone(480,.7,{vol:.045,f2:1500,attack:.05});},
 boom(){AU.nz(.7,{freq:680,f2:120,type:'lowpass',vol:.2}); AU.tone(72,.5,{vol:.16,f2:42}); for(let i=0;i<5;i++) AU.tone(rr(2000,4000),.05,{vol:.025,at:.25+R()*.45});},
 flip(){AU.nz(.55,{freq:1400,f2:4200,q:.7,vol:.12,attack:.05});}
};

/* ============================================================
   レイアウト
   ============================================================ */
let W=1,H=1,DPR=1,SA={t:0,r:0,b:0,l:0},PORT=false;
const TW=960, TH=1050;                 // 町（まんがの紙）の論理サイズ
const PG={s:1,x:0,y:0,w:TW,h:TH};      // 紙の画面上の矩形
const ST={x:0,y:0,w:100,h:100,u:1,lw:4}; // 屋台の画面上の矩形
const LY={};                           // 屋台の部品位置（画面px）
function readSA(){ try{const cs=getComputedStyle(saEl);
 SA={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}catch(e){} }
function layout(){
 W=Math.max(1,window.innerWidth|0); H=Math.max(1,window.innerHeight|0);
 DPR=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.max(1,Math.round(W*DPR)); cv.height=Math.max(1,Math.round(H*DPR));
 cv.style.width=W+'px'; cv.style.height=H+'px';
 readSA();
 PORT = H>=W*1.02;
 const m=6, ax=SA.l+m, ay=SA.t+m, aw=Math.max(50,W-SA.l-SA.r-2*m), ah=Math.max(50,H-SA.t-SA.b-2*m);
 if(!PORT){
  let sw=clamp(aw*.35,220,480);
  const s=Math.max(.05,Math.min((aw-sw-12)/TW, ah/TH));
  const pw=TW*s, ph=TH*s;
  sw=Math.min(aw-pw-12, 540);
  const gap=Math.max(0,aw-pw-12-sw);
  PG.s=s; PG.w=pw; PG.h=ph; PG.x=ax+sw+12+gap*.6; PG.y=ay+(ah-ph)/2;
  ST.x=ax+gap*.4; ST.y=ay; ST.w=sw; ST.h=ah;
 }else{
  const sh0=clamp(ah*.36,190,440);
  const s=Math.max(.05,Math.min(aw/TW,(ah-sh0-10)/TH));
  const pw=TW*s, ph=TH*s;
  PG.s=s; PG.w=pw; PG.h=ph; PG.x=ax+(aw-pw)/2; PG.y=ay;
  ST.x=ax; ST.y=ay+ph+10; ST.w=aw; ST.h=Math.max(120,ay+ah-ST.y);
 }
 stallLayout();
 buildCaches();
}
function stallLayout(){
 const x=ST.x,y=ST.y,w=ST.w,h=ST.h;
 if(!PORT){
  const u=Math.min(w/420,h/760); ST.u=u; ST.lw=clamp(4.2*u,2.4,5);
  LY.awn={h:clamp(h*.085,30,70)};
  LY.counter=y+h*.745;
  // スイッチ・ミキサー・台がぶつからないように、低い画面では縮める
  const br=clamp(Math.min(w*.16,h*.078),40,72);
  const by=Math.min(y+h*.655,LY.counter-br*.95-6);
  const top=y+LY.awn.h+w/16+ST.lw+4;   // のれんの波の下から
  // スイッチのふたが（はねても）台にかからない高さに、ミキサーをおさめる
  const lw0=ST.lw, jh=Math.max(60,Math.min(h*.29,w*.6,(by-br-lw0-8-top)/1.38));
  const jy=Math.max(top+jh*.64,Math.min(y+h*.355,by-br-lw0-4-jh*.74));
  LY.jar={x:x+w*.5,y:jy,h:jh,w:jh*.72};
  LY.base={x:LY.jar.x,y:LY.jar.y+jh*.5,w:jh*.9,h:jh*.24};
  LY.btn={x:x+w*.5,y:by,r:br};
  const fr=Math.min(clamp(Math.min(w*.105,h*.062),30,54),(w-14-2.6*ST.lw)/9.32);
  const fm=fr*1.42+4, fs=(w-2*fm)/3;   // さそいの輪が屋台の外へはみ出さず、お皿どうしも重ならない
  LY.fruits=FKEYS.map((k,i)=>({k,x:x+fm+fs*i,y:y+h*.865,r:fr}));
  LY.plat={k:'p',x:Math.min(x+w*.84,x+w-fr*1.08*1.45-4),y:y+h*.63,r:fr*1.08};
  LY.boy={x:x+w*.19,y:LY.counter-6*u,s:clamp(u*1.55,.8,2)};
  LY.photo={x:x+w*.18,y:y+h*.2,w:clamp(78*u,46,96),h:clamp(88*u,52,108)};
  LY.photo.x=Math.max(x+LY.photo.w*.6+ST.lw,Math.min(LY.photo.x,LY.jar.x-jh*.4-LY.photo.w*.56-8));   // ミキサーのふたに触れない
  LY.photo.y=Math.max(LY.photo.y,top+LY.photo.h*.56+Math.max(4,LY.photo.w*.07)+2);   // ピンも、のれんの波にかからない
  LY.penHome={x:x+w*.86,y:y+h*.22};
 }else{
  const u=Math.min(w/390,h/330); ST.u=u; ST.lw=clamp(4.2*u,2.4,5);
  LY.awn=null;
  const br=clamp(Math.min(h*.15,w*.13),36,66), lw0=ST.lw;
  // ふた〜台〜スイッチが縦に重ならないよう、ミキサーの高さを残りの場所に合わせる
  const jh=Math.max(48,Math.min(h*.47,w*.42,(h*.95-br*2.68-lw0*2-10)/1.36));
  LY.jar={x:x+w*.215,y:y+h*.05+jh*.64+lw0*.5+2,h:jh,w:jh*.72};
  LY.base={x:LY.jar.x,y:LY.jar.y+jh*.5,w:jh*.9,h:jh*.22};
  LY.btn={x:x+w*.215,y:Math.min(y+h-br*1.52-4,LY.base.y+LY.base.h+br*1.16+lw0*1.5+4),r:br};
  LY.counter=y+h*.62;
  const fr=clamp(Math.min(w*.095,h*.12),26,50);
  const fxR=Math.min(x+w*.885,x+w-fr*1.42-4), fxL=Math.min(x+w*.665,fxR-fr*2.3);   // さそいの輪が画面や屋台の外へ出ない
  LY.fruits=[{k:'s',x:fxL,y:y+h*.2},{k:'m',x:fxR,y:y+h*.2},{k:'b',x:fxL,y:y+h*.53},{k:'u',x:fxR,y:y+h*.53}];
  LY.fruits.forEach(f=>f.r=fr);
  LY.plat={k:'p',x:Math.min(x+w*.865,x+w-fr*1.05*1.45-4),y:y+h*.86,r:fr*1.05}; LY.plat.y=Math.min(LY.plat.y,y+h-LY.plat.r*1.45-4);
  LY.boy={x:x+w*.6,s:clamp(u*1.1,.6,1.8)}; LY.boy.y=y+h-ST.lw-6*LY.boy.s-1;   // 靴が屋台の枠にかからない
  LY.photo={x:x+w*.455,y:y+h*.83,w:clamp(50*u,38,86),h:clamp(56*u,44,96)};
  LY.penHome={x:x+w*.47,y:y+h*.07};
 }
 // さそいでスイッチがはねても、台にぶつからない高さまで
 LY.btn.hop=Math.max(0,Math.min(LY.btn.r*.16,(LY.btn.y-LY.btn.r*.84-ST.lw)-(LY.base.y+LY.base.h+ST.lw*.5)-3));
 LY.spout={x:LY.base.x+LY.base.w*.5,y:LY.base.y+LY.base.h*.45};
}
const toSX=x=>PG.x+x*PG.s, toSY=y=>PG.y+y*PG.s;
const toTX=x=>(x-PG.x)/PG.s, toTY=y=>(y-PG.y)/PG.s;

/* ============================================================

const GY=950;
const G={
 riverL:665, riverR:805, waterY:984, bridgeL:646, bridgeR:824, bridgeH:34,
 truckHome:90, waitX:556, farX:872, venueX:470,
 ladX:178, slTop:846, slL:216, slEnd:326, kidWait:350,
 ramp:[[372,950],[602,682],[628,682],[392,402],[340,390]],
 hillY:390, flowers:[46,88,130,172,214], gardX:242,
 girlX:646, postX:660, armX:702, armY:848, cargoX:726, cargoY:980,
 shopL:826, shopR:944, shopTop:832, tankX:902, tankY:798,

/* ---------- 経路 ---------- */
function groundY(x){ if(F.bridge&&BR.g>.98&&x>G.bridgeL&&x<G.bridgeR) return GY-G.bridgeH*Math.sin(PI*(x-G.bridgeL)/(G.bridgeR-G.bridgeL)); return GY; }
function route(x1,x2){ const pts=[], step=14, d=x2>x1?1:-1;
 for(let x=x1+d*step; d>0?x<x2:x>x2; x+=d*step) pts.push([x,groundY(x)]);
 pts.push([x2,groundY(x2)]); return pts; }
function rampPts(up){ const r=G.ramp, out=[];
 for(let i=0;i<r.length-1;i++){ const a=r[i],b=r[i+1], n=Math.max(1,Math.ceil(dist(a[0],a[1],b[0],b[1])/18));
  for(let j=1;j<=n;j++) out.push([lerp(a[0],b[0],j/n),lerp(a[1],b[1],j/n)]); }
 if(up) return out;
 const rev=[]; for(let i=r.length-2;i>=0;i--){ const a=r[i+1],b=r[i], n=Math.max(1,Math.ceil(dist(a[0],a[1],b[0],b[1])/18));
  for(let j=1;j<=n;j++) rev.push([lerp(a[0],b[0],j/n),lerp(a[1],b[1],j/n)]); }
 return rev; }
function planPath(e,zoneTo,xTo){
 const pts=[]; let x=e.x, zone=e.zone;
 if(zone==='hill'&&zoneTo!=='hill'){ pts.push([G.ramp[4][0],G.ramp[4][1]]); pts.push(...rampPts(false)); x=G.ramp[0][0]; zone='near'; }
 if(zone==='far'&&zoneTo!=='far'){ pts.push(...route(x,G.bridgeL-8)); x=G.bridgeL-8; zone='near'; }
 if(zone==='near'){
  if(zoneTo==='hill'){ pts.push(...route(x,G.ramp[0][0])); pts.push(...rampPts(true)); if(Math.abs(xTo-G.ramp[4][0])>1) pts.push([xTo,hillY(xTo)]); }
  else pts.push(...route(x,xTo));
 }else if(zone==='far') pts.push(...route(x,xTo));
 else if(zone==='hill') pts.push([xTo,hillY(xTo)]);
 return pts;
}
function goTo(e,zone,x,cb){
 const pts=planPath(e,zone,x);
 e.path=pts.length?pts:null; e.pi=0;
 const fin=()=>{ e.zone=zone; e.moving=false; if(cb) cb(); };
 if(!e.path){ fin(); return; }
 e.onArrive=fin; e.moving=true;
}
function stepPath(e,dt,spd){
 if(!e.path||e.freeze) return;
 let rem=(spd||e.spd)*dt;
 while(rem>0&&e.path){
  const tg=e.path[e.pi], dx=tg[0]-e.x, dy=tg[1]-e.y, d=Math.hypot(dx,dy);
  if(Math.abs(dx)>.3) e.dir=dx>0?1:-1;
  if(d>.001) e.ang=Math.atan2(dy,dx);
  if(d<=rem){ e.x=tg[0]; e.y=tg[1]; rem-=d; e.pi++;
   if(e.pi>=e.path.length){ const cb=e.onArrive; e.path=null; e.onArrive=null; e.moving=false; if(cb) cb(); return; } }
  else { e.x+=dx/d*rem; e.y+=dy/d*rem; rem=0; e.moving=true; }
 }
}

function truckAppear(){ Object.assign(TR,{on:true,state:'appear',t:0,pop:0,x:G.truckHome,y:GY,dir:1,zone:'near',tilt:0,path:null,freeze:false}); }
function nozzle(){ const lx=30*TR.dir, ly=-82, c=Math.cos(TR.tilt), s=Math.sin(TR.tilt); return [TR.x+lx*c-ly*s, TR.y+lx*s+ly*c]; }
function sprayTarget(k,t){
 if(k==='slide'){ const q=slideCurve(.15+.7*(.5+.5*Math.sin(t*3.2))); return [q[0],q[1]-6]; }
 if(k==='tank') return [G.tankX,G.tankY-24];
 if(k==='flowers') return [lerp(214,46,c01(t/2.2))+Math.sin(t*9)*6,366];
 if(k==='up') return [TR.x+TR.dir*20,TR.y-230];
 return [TR.x,TR.y-100];
}
function startSpray(kind){ const d=kind==='slide'?2.8:kind==='tank'?2.4:2.6; TR.state='spray'; TR.t=0; TR.spray={kind,t:0,dur:d}; SFX.spray(d); }
function truckThink(){
 if(!F.slideClean){ TR.state='move'; goTo(TR,'near',G.truckHome+14,()=>{TR.dir=1; startSpray('slide');}); return; }
 const jobs=[]; if(F.bridge&&BR.g>.98&&!F.shopOpen&&!SHOPQ) jobs.push(['shop',F.mk.bridge]); if(F.slope&&RP.g>.98&&!F.flowers) jobs.push(['flowers',F.mk.slope]);
 jobs.sort((a,b)=>b[1]-a[1]);
 if(jobs.length){ TR.state='move';
  if(jobs[0][0]==='shop') goTo(TR,'far',G.farX,()=>{TR.dir=1; startSpray('tank');});
  else goTo(TR,'hill',G.ramp[4][0],()=>{TR.dir=-1; startSpray('flowers');});
  return; }
 if(F.night){ paradeJoin(TR); return; }
 // 橋ができあがるまでは手前で待つ（のびている途中の橋は渡らない）
 if(!(F.bridge&&BR.g>.98)){ TR.state='move'; goTo(TR,'near',G.waitX,()=>{TR.dir=1; TR.state='wait'; TR.t=0;}); return; }
 // お店のタンクに水を入れたら、いったん橋をもどってお店の前をあける
 if(SHOPQ){ TR.state='move'; goTo(TR,'near',600,()=>{ TR.dir=1; TR.state='idle'; TR.t=0; TR.idleDur=rr(1.6,3); }); return; }
 const opts=['near','near']; if(F.bridge) opts.push('far'); if(F.slope) opts.push('hill');
 const o=opts[(R()*opts.length)|0];
 const x=o==='near'?rr(80,600):o==='far'?G.farX:G.ramp[4][0];
 TR.state='move'; goTo(TR,o,x,()=>{ TR.state='idle'; TR.t=0; TR.idleDur=rr(2.2,4.5); if(o==='hill') TR.dir=-1; if(R()<.45) SFX.honk(); });
}
function truckUpdate(dt){
 if(!TR.on) return;
 TR.t+=dt; TR.wig=Math.max(0,TR.wig-dt*2.5); TR.pop=Math.min(1,TR.pop+dt*2.4);
 if(TR.fountain>0){ TR.fountain-=dt; const n=nozzle(); if(R()<.7) addP({kind:'drop',x:n[0],y:n[1],vx:rr(-60,60)+TR.dir*20,vy:rr(-430,-330),g:620,life:1.1,r:rr(3,6),col:K.water}); }
 if(TR.freeze) return;
 const climbing=TR.moving&&Math.abs(Math.sin(TR.ang))>.35;
 switch(TR.state){
  case 'appear': if(TR.t>1.1){ SFX.siren(); TR.state='think'; } break;
  case 'think': truckThink(); break;
  case 'move': stepPath(TR,dt,(climbing?78:(TR.y<GY-2?110:150))*(F.night?1.8:1)); TR.wheel+=dt*(climbing?6:11)*TR.dir;
   if(TR.moving&&R()<(climbing?.25:.08)) addP({kind:'puff',x:TR.x-TR.dir*62,y:TR.y-10,vx:-TR.dir*rr(20,50),vy:rr(-30,-10),g:0,life:.6,r:rr(5,9),col:'#ffffff'});
   break;
  case 'spray': { const s=TR.spray; s.t+=dt; const n=nozzle(), tg=sprayTarget(s.kind,s.t);
   if(R()<.85) addP({kind:'drop',x:tg[0]+rr(-6,6),y:tg[1]+rr(-4,4),vx:rr(-90,90),vy:rr(-160,-40),g:600,life:rr(.3,.6),r:rr(2.5,5),col:K.water});
   if(s.kind==='slide'){ SL.mud=Math.max(0,1-s.t/(s.dur*.8)); SL.puddle=Math.max(0,1-s.t/s.dur);
    if(R()<.35){ const q=slideCurve(rr(.2,.9)); addP({kind:'mud',x:q[0],y:q[1]-4,vx:rr(40,110),vy:rr(-60,20),g:500,life:.7,r:rr(4,7),col:K.mud}); } }
   if(s.kind==='flowers'){ const i=Math.floor(c01(s.t/2.2)*5.99); for(let j=0;j<=Math.min(4,i);j++){ const k=4-j; if(FLW.b[k]<=0){ FLW.b[k]=.001; SFX.pop(); } } }
   if(s.t>=s.dur){ const k=s.kind; TR.spray=null; TR.state='think';
    if(k==='slide'){ F.slideClean=true; SL.mud=0; SL.puddle=0; save(); success(270,880); KD.state='yay'; KD.t=0; KD.mood='happy'; }
    else if(k==='tank'){ SHOPQ=true; SHOPT=0; }
    else if(k==='flowers'){ F.flowers=true; FLW.b=FLW.b.map(()=>Math.max(.001,1)); save(); success(140,340); GD.state='happy'; GD.mood='happy'; GD.cheerT=2; }
    TR.state=k==='tank'?'think':'pause'; TR.t=0; }
   break; }
  case 'pause': if(TR.t>1.2) TR.state='think'; break;
  case 'wait': TR.honkT-=dt; if(TR.honkT<=0){ TR.honkT=rr(7,11); SFX.honk(); TR.wig=.6; }
   if(F.bridge&&BR.g>.98) TR.state='think'; if(F.slope&&!F.flowers) TR.state='think'; if(F.night) TR.state='think'; break;
  case 'idle': if(TR.t>TR.idleDur||F.night) TR.state='think'; break;
  case 'parade': paradeStep(TR,dt); if(TR.moving){ TR.wheel+=dt*11*TR.dir; if(R()<.1) addP({kind:'puff',x:TR.x-TR.dir*62,y:TR.y-10,vx:-TR.dir*rr(20,50),vy:rr(-30,-10),g:0,life:.6,r:rr(5,9),col:'#ffffff'}); } break;
 }
 const tgt=TR.moving?(Math.cos(TR.ang)>=0?TR.ang:TR.ang+PI):0;
 let tn=((tgt+PI)%TAU+TAU)%TAU-PI; TR.tilt=lerp(TR.tilt,tn,c01(dt*10));
}
function shopOpen(){ SHOPQ=false; if(F.shopOpen) return; F.shopOpen=true; save(); SK.state='opening'; SK.t=0; SFX.shutter();
 later(.7,()=>success(885,880,true));
 if(GL.zone==='far'){ GL.cup=1; GL.cheerT=2; GL.mood='happy'; } }

/* ============================================================

function kidUpdate(dt){
 const k=KD; k.t+=dt; k.wig=Math.max(0,k.wig-dt*2.5); k.waveT=Math.max(0,k.waveT-dt); k.cheerT=Math.max(0,k.cheerT-dt);
 if(F.night&&NT.pp&&!k.pm&&(k.state==='wait'||k.state==='toLad'||k.state==='stroll'||k.state==='back'||(k.state==='yay'&&k.t>1))) paradeJoin(k);
 if(k.pm){ paradeStep(k,dt); paradePose(k); return; }
 switch(k.state){
  case 'wait': k.pose='stand'; k.mood='sad'; k.dir=-1;
   if(TR.on){ k.lx=TR.x<k.x?-1:1; k.ly=0; } else { k.lx=-.7; k.ly=-.6; }
   break;
  case 'yay': k.pose='jump'; k.mood='happy'; if(k.t>1.4){ k.state='toLad'; k.t=0; } break;
  case 'toLad': k.pose='walk'; k.mood='happy'; if(!k.path&&!k.moving){ goTo(k,'near',G.ladX-2,()=>{ k.state='climb'; k.t=0; }); } stepPath(k,dt); break;
  case 'climb': k.pose='climb'; k.x=G.ladX-2; k.y=lerp(GY,G.slTop-2,c01(k.t/.9)); if(k.t>.9){ k.state='plat'; k.t=0; } break;
  case 'plat': k.pose='walk'; k.dir=1; k.y=G.slTop-2; k.x=lerp(G.ladX-2,G.slL,c01(k.t/.35)); if(k.t>.35){ k.state='slide'; k.t=0; } break;
  case 'slide': { k.pose='sit'; k.dir=1; const u=eIn(c01(k.t/.75)); const q=slideCurve(u); k.x=q[0]; k.y=q[1]-4; k.mood='happy';
   if(R()<.3) addP({kind:'line',x:k.x-14,y:k.y-20+rr(-10,10),vx:-80,vy:-30,g:0,life:.25,r:16,col:K.ink});
   if(k.t>.75){ k.state='hop'; k.t=0; k.x0=k.x; k.y0=k.y; } break; }
  case 'hop': k.pose='jump'; k.x=lerp(k.x0,G.kidWait,c01(k.t/.35)); k.y=lerp(k.y0,GY,c01(k.t/.35))-Math.sin(c01(k.t/.35)*PI)*22;
   if(k.t>.35){ k.y=GY; k.loops++; k.t=0;
    if(!F.night&&k.loops%3===0&&R()<.65){ k.state='stroll'; }
    else k.state='toLad'; }
   break;
  case 'stroll': k.pose='walk'; if(!k.path&&!k.moving){
    if(F.bridge&&BR.g>.98&&F.shopOpen&&R()<.6){ goTo(k,'far',846,()=>{ k.cup=1; k.cheerT=1.2; k.state='back'; k.t=0; }); }
    else { const sx=TR.on&&Math.abs(TR.x-600)<100?Math.max(G.kidWait+40,TR.x-125):600; goTo(k,'near',sx,()=>{ k.waveT=1.6; k.state='back'; k.t=0; }); }
   } stepPath(k,dt); break;
  case 'back': k.pose=k.moving?'walk':'stand'; if(k.t>1.6&&!k.path){ goTo(k,'near',G.kidWait,()=>{ k.state='toLad'; k.t=0; }); } stepPath(k,dt); break;

 }
 if(k.state!=='wait'){ k.lx=k.dir*.6; k.ly=0; }
}

/* ============================================================
   ベレー帽の女の子
   ============================================================ */
function girlUpdate(dt){
 const g=GL; g.t+=dt; g.wig=Math.max(0,g.wig-dt*2.5); g.waveT=Math.max(0,g.waveT-dt); g.cheerT=Math.max(0,g.cheerT-dt);
 if(F.night&&NT.pp&&!g.pm&&['watch','waitTruck','farWait','farIdle','cross'].includes(g.state)) paradeJoin(g);
 if(g.pm){ paradeStep(g,dt); paradePose(g); return; }
 // 目はペンを追う
 const px=toTX(PEN.x), py=toTY(PEN.y); let dx=px-g.x, dy=py-(g.y-60); const dl=Math.hypot(dx,dy)||1;
 const watchPen=PEN.state!=='home'||FL.on||MX.press;
 switch(g.state){
  case 'watch': g.pose='stand';
   if(watchPen||!F.rope||CG.state!=='float'){ g.lx=dx/dl; g.ly=dy/dl; g.dir=dx<0?-1:1; g.mood=watchPen?'wow':'neutral'; }
   else { const ph=(g.t%6); if(ph<2){ g.lx=.7; g.ly=.7; g.dir=1; g.mood='sad'; } else { g.lx=dx/dl; g.ly=dy/dl; g.dir=dx<0?-1:1; g.mood='neutral'; } }
   if(CG.state==='lift'&&g.zone==='near'){ g.pose='pull'; g.dir=1; g.mood='wow'; }
   // 橋ができていれば、いつでも（読みこみ直したあとでも）渡りはじめる
   if(F.bridge&&BR.g>.98&&!F.girlCrossed&&!F.night&&g.zone==='near'&&CG.state!=='lift'){ g.state='pre'; g.t=0; }
   break;
  case 'pre': g.pose='stand'; if(g.t>1.8){ g.t=0;
    if(!TR.on||F.shopOpen){ g.state='cross'; }
    else g.state='waitTruck'; }
   break;
  case 'waitTruck': g.pose='stand'; g.lx=TR.x<g.x?-1:1; g.ly=-.2; if(F.shopOpen){ g.state='cross'; g.t=0; } break;
  case 'cross': g.pose='walk'; g.mood='happy'; if(!g.path&&!g.moving){ goTo(g,'far',840,()=>{ g.state='arrive'; g.t=0; }); } stepPath(g,dt); break;
  case 'arrive': g.pose='stand'; g.dir=1;
   if(!F.girlCrossed){ F.girlCrossed=true; save(); if(!F.shopOpen){ g.state='knock'; g.t=0; break; } else { g.cheerT=1.5; SFX.cheer(); } }
   g.state=F.shopOpen?'treat':'farWait'; g.t=0; break;
  case 'knock': g.pose='knock'; g.dir=1; g.mood='neutral';
   if(g.t>.05&&!g.k1){ g.k1=1; SFX.knock(); }
   if(g.t>.7&&!g.k2){ g.k2=1; SK.peek=2.8; }
   if(g.t>1.6){ g.dir=-1; g.waveT=2.6; g.mood='happy'; g.state='farWait'; g.t=0; success(840,880); }
   break;
  case 'farWait': g.pose='stand'; g.dir=-1; g.lx=-1; g.ly=-.2; if(g.t>6){ g.t=0; g.waveT=1.8; }
   if(F.shopOpen){ g.state='treat'; g.t=0; } break;
  case 'treat': g.cup=1; g.mood='happy'; g.cheerT=Math.max(g.cheerT,1.4); g.state='farIdle'; g.t=0; break;
  case 'farIdle': g.pose=g.moving?'walk':'stand'; g.mood='happy';
   if(!g.path&&g.t>4){ g.t=0; goTo(g,'far',R()<.5?838:880,()=>{}); }
   stepPath(g,dt); break;
 }
}

function gardUpdate(dt){ const g=GD; g.t+=dt; g.wig=Math.max(0,g.wig-dt*2.5); g.cheerT=Math.max(0,g.cheerT-dt); g.waveT=Math.max(0,g.waveT-dt);
 if(F.night&&NT.pp&&!g.pm&&F.slope&&F.flowers&&g.state==='happy') paradeJoin(g);
 if(g.pm){ paradeStep(g,dt); paradePose(g); return; }
 if(g.state==='sad'){ g.mood='sad'; g.pose='stand'; g.dir=1; g.lx=.6; g.ly=.8; if(F.slope&&RP.g>.98){ g.lx=.9; g.ly=.6; } }

 // 夜：行進に来られないときは丘の上でちょうちんを振る
 if(F.night&&NT.pp){ g.pose='wave'; g.waveT=1; g.mood='happy'; g.ly=-1; g.dir=1; }

 if(!s.on){ if(F.night&&NT.pp&&F.shopOpen&&SK.open>=1){ Object.assign(s,{on:true,x:885,y:GY,zone:'far',dir:-1,pm:null,path:null,moving:false}); paradeJoin(s); SFX.small(); } return; }

 if(s.pm){ paradeStep(s,dt); paradePose(s); }

 if(SK.state==='opening'){ SK.open=Math.min(1,SK.open+dt*1.2); if(SK.open>=1) SK.state='open'; }

function cargoUpdate(dt){ const c=CG; c.t+=dt;
 if(c.state==='float'){ c.x=G.cargoX+Math.sin(TT*1.3)*3; c.y=G.cargoY+Math.sin(TT*2.1)*3; c.ang=Math.sin(TT*1.7)*.08; }
 else if(c.state==='hook'){ c.rope=c01(c.t/.5); if(c.t>.6){ c.state='lift'; c.t=0; c.x0=c.x; c.y0=c.y; SFX.rope(); } }
 else if(c.state==='lift'){ const u=eIO(c.t/1.6); c.x=lerp(c.x0,G.armX,u); c.y=lerp(c.y0,880,u); c.pul+=dt*6; c.ang=Math.sin(c.t*8)*.12*(1-u);
  if(Math.floor(c.t*3)!==Math.floor((c.t-dt)*3)) SFX.heave();
  if(c.t<.2&&R()<.5) splash(c.x,G.waterY,2);
  if(c.t>1.6){ c.state='swing'; c.t=0; c.x0=c.x; c.y0=c.y; } }
 else if(c.state==='swing'){ const u=eIO(c.t/.9); c.x=lerp(c.x0,612,u); c.y=lerp(c.y0,GY,u)-Math.sin(u*PI)*40; c.ang=Math.sin(u*PI)*-.4;
  if(c.t>.9){ c.state='land'; c.t=0; c.x=612; c.y=GY; c.ang=0; SFX.plop(); } }
 else if(c.state==='land'){ if(c.t>.35){ c.state='open'; c.t=0; SFX.pop(); } }
 else if(c.state==='open'){ c.lid=c01(c.t/.3); c.lan=eOut(c01((c.t-.2)/1.2)); if(c.t>1.5){ c.state='done'; c.t=0; F.cargoUp=true; save(); success(700,860); GL.cheerT=2; } }
 else if(c.state==='done'){ c.lan=1; c.lid=1; }
}

   雨→水路→水車→観覧車
   ============================================================ */
function rainUpdate(dt){
 RN.pop=Math.min(1,RN.pop+dt*2); RN.flash=Math.max(0,RN.flash-dt);
 if(!RN.on){ RN.lit=Math.max(0,RN.lit-dt); return; }
 RN.heavy=Math.max(0,RN.heavy-dt);
 const inten=RN.heavy>0?1:.28;
 RN.sndT-=dt; if(RN.heavy>0&&RN.sndT<=0){ RN.sndT=2.2; SFX.rain(2.4); }
 // 雨つぶ（上限あり）
 if(RN.drops.length<60&&R()<inten*dt*55){ RN.drops.push({x:rr(G.cloudX-70,G.cloudX+70),y:G.cloudY+28,v:rr(380,460)}); }
 for(let i=RN.drops.length-1;i>=0;i--){ const d=RN.drops[i]; d.y+=d.v*dt;
  const inFun=d.x>544&&d.x<656;
  if(inFun&&d.y>=200){ RN.drops.splice(i,1); RN.funnel=Math.min(1,RN.funnel+.012); continue; }
  if(d.y>=G.topG){ RN.drops.splice(i,1); if(R()<.4) splash(d.x,G.topG,1); } }
 RN.funnel=Math.max(0,RN.funnel-RN.flow*dt*.08);
 RN.flow=lerp(RN.flow,RN.funnel>.15?Math.min(1,RN.funnel*1.6):0,c01(dt*1.5));
 const tv=RN.flow*(RN.heavy>0?2.8:1.4);
 RN.wheelV=lerp(RN.wheelV,tv,c01(dt*1.2)); RN.wheelA+=RN.wheelV*dt; RN.ferA+=RN.wheelV*.16*dt;
 RN.creakT-=dt*RN.wheelV; if(RN.creakT<=0){ RN.creakT=2.5; SFX.creak(); }
 if(!RN.litDone&&RN.wheelV>.7){ RN.litDone=true; F.wheelLit=true; save(); SFX.chime(); success(G.ferX,G.ferY,true); RD.state='board'; RD.board=0; }
 RN.lit=lerp(RN.lit,F.wheelLit?1:0,c01(dt*2));
 // 滝が橋にかかると、つるに花が咲く
 if(F.bridge&&BR.g>.98&&RN.flow>.3&&!F.bloom){ BR.splashT+=dt; if(BR.splashT>2.2){ F.bloom=true; save(); SFX.vine(); focusLines(735,915,150,.7); starBurst(735,905,8); } }
 if(RN.flow>.2&&R()<.5) splash(772,G.waterY,1);
}

/* ============================================================
   夜祭り（黒インク）
   ============================================================ */
const PREP=['garage','truck','bridge','ramp','rope','wheel','cloud','shop','stall'];
function nightStart(ox,oy){
 if(F.night&&NT.phase) return;
 F.night=true; save();
 NT.phase='spread'; NT.t=0; NT.ox=ox; NT.oy=oy; NT.ink=0; NT.glow={}; NT.prepI=0; NT.curl=0; NT.pp=null; NT.slot=0; NT.bt=0;
 SFX.whoosh(); makeStrips();
 [TR,KD,GL,GD,SKW].forEach(a=>{ a.pm=null; });
}
/* ---------- 大行進：消防車を先頭に、助けた人たちが並んで川辺まで歩く ---------- */
const MARCH=220;
function lineX(e){ return e===TR?300:204-52*(e.pslot||0); }
function paradeJoin(e){
 if(e.pm) return;
 e.pm='toLine'; e.pslot=e===TR?-1:NT.slot++; e.path=null; e.onArrive=null; e.moving=false; e.cheerT=0; e.waveT=0; e.rt=0;
 if(e.zone!=='hill') e.zone=e.x>G.riverR-4?'far':'near';
 if(e===TR){ TR.state='parade'; TR.spray=null; }
}
function paradeStep(e,dt){
 const L=lineX(e), Wx=L+MARCH, rush=e===TR?230:150, mspd=56;
 switch(e.pm){
  case 'toLine': if(NT.pp&&NT.pp!=='line'){ e.pm='late'; paradeRetarget(e,Wx); stepPath(e,dt,rush); break; }
   if(!e.path){ if(e.zone==='near'&&Math.abs(e.x-L)<2){ e.pm='line'; e.dir=1; } else goTo(e,'near',L); }
   stepPath(e,dt,rush); break;
  case 'line': e.dir=1; if(NT.pp&&NT.pp!=='line'){ e.pm='march'; goTo(e,'near',Wx); } break;
  case 'march': stepPath(e,dt,mspd); if(!e.path){ e.pm='watch'; paradeArrive(e); } break;
  case 'late': paradeRetarget(e,Wx); if(!e.path){ if(e.zone==='near'&&Math.abs(e.x-Wx)<2){ e.pm='watch'; paradeArrive(e); break; } goTo(e,'near',Wx); }
   stepPath(e,dt,rush); break;
  case 'watch': e.dir=1; break;
 }
}
// 行進が始まってから列へ向かっていた人は、こちら岸の地面に着いたところで行き先へまっすぐ向かいなおす
function paradeRetarget(e,x){
 if(e.rt||!e.path) return;
 const onNear=(px,py)=>px<=G.bridgeL-8+.5&&Math.abs(py-GY)<.5;
 if(!onNear(e.x,e.y)) return;
 for(let i=e.pi;i<e.path.length;i++) if(!onNear(e.path[i][0],e.path[i][1])) return;
 e.rt=1; e.path=route(e.x,x); e.pi=0;
}

  case 'night': for(let i=0;i<=40;i++){ const t=i/40, a=t*TAU*2.2, r=8+t*70; o.push([480+Math.cos(a)*r,300+Math.sin(a)*r]); } return o;

function hitStall(x,y){

 tryHit('btn',null,LY.btn.x,LY.btn.y,LY.btn.r*1.3);
 LY.fruits.forEach(f=>tryHit('fruit',f.k,f.x,f.y,f.r*1.28));
 if(F.platter&&!F.night&&PLAT.show>.5) tryHit('fruit','p',LY.plat.x,LY.plat.y,LY.plat.r*1.28);
 if(best) return best;
 const J=LY.jar; if(Math.abs(x-J.x)<J.w*.6&&y>J.y-J.h*.62&&y<J.y+J.h*.5+LY.base.h) return {t:'jar'};

const SKEY='juiceink-261102-19';
let saveOK=true, saveFails=0, saveLastFail=-99;
function lsGet(){ try{ return window.localStorage?window.localStorage.getItem(SKEY):null; }catch(e){ return null; } }
function lsSet(v){ try{ if(!window.localStorage) return false; window.localStorage.setItem(SKEY,v); return true; }catch(e){ return false; } }
function lsDel(){ try{ window.localStorage&&window.localStorage.removeItem(SKEY); }catch(e){} }
function snapshot(){ const f=JSON.parse(JSON.stringify(F)); return {v:1,cyc:cycle,seed,f,jar:TOSS.on?TOSS.k:(MX.full?MX.fruit:(MX.next||MX.fruit)),ph:PHOTO.url||null,nf:NT.phase==='done'}; }
function save(force){
 // 何度も失敗したら少し間をあける（ずっと止めはしない）
 if(!force&&!saveOK&&saveFails>6&&TT-saveLastFail<12) return;
 const d=snapshot();
 let ok=lsSet(JSON.stringify(d));
 if(!ok&&d.ph){ d.ph=null; ok=lsSet(JSON.stringify(d)); }
 if(!ok){ saveFails++; saveOK=false; saveLastFail=TT; } else { saveOK=true; saveFails=0; }
}
function load(){
 const raw=lsGet(); if(!raw) return null;

}
const BOOLS=['truck','bridge','slope','rope','rain','slideClean','shopOpen','flowers','cargoUp','girlCrossed','bloom','wheelLit','night'];

 BOOLS.forEach(k=>{ f[k]=s[k]===true; });

 // 整合性
 if(!f.truck){ f.slideClean=false; f.shopOpen=false; f.flowers=false; f.truckPlus=0; }
 if(!f.bridge){ f.shopOpen=false; f.girlCrossed=false; f.bloom=false; }

 if(!f.rope) f.cargoUp=false;
 if(!f.rain) f.wheelLit=false;
 if(f.truck) f.used.s=true; if(f.bridge) f.used.m=true; if(f.slope||f.rope) f.used.b=true; if(f.rain) f.used.u=true;

 cycle=Number.isFinite(d.cyc)?Math.max(0,d.cyc|0):0;

  const im=new Image(); im.onload=()=>{ if(!PHOTO.img){ PHOTO.img=im; PHOTO.fly=1; } }; im.onerror=()=>{ PHOTO.url=null; }; PHOTO.url=d.ph; im.src=d.ph; }

function restoreEntities(nf){

 if(F.rain){ Object.assign(RN,{on:true,pop:1,heavy:0,funnel:.6,flow:.6,wheelV:1.2}); if(F.wheelLit){ RN.litDone=true; RN.lit=1; RD.state='ride'; RD.board=1; } }
 if(F.platter){ PLAT.show=1; PLAT.pop=1; }
 if(F.night&&!nf){   // 大行進や花火の途中で閉じたときは、夜の支度からもう一度
  Object.assign(NT,{phase:'prep',t:0,ink:1,dark:1,curl:0,strips:[],amb:2,pp:'line',slot:0,prepI:0,beatT:0,glow:{}});

function rrect(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function fillStroke(fill,lw){ if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(lw){ ctx.lineWidth=lw; ctx.strokeStyle=K.ink; ctx.stroke(); } }
function limb(x0,y0,x1,y1,lw,col){ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.lineWidth=lw*2.3; ctx.strokeStyle=K.ink; ctx.stroke(); ctx.lineWidth=lw*1.15; ctx.strokeStyle=col; ctx.stroke(); }
function blinkOn(seedT){ return ((TT+seedT)%3.7)<.12; }

/* ---------- 人（太い輪郭・平面塗り・表情） ---------- */
function drawPerson(o){
 const lw=o.lw||4.2, s=o.s||1, t=TT*(o.spd||1)+(o.anim||0), pose=o.pose||'stand';
 ctx.save(); ctx.translate(o.x,o.y);
 if(o.wig) ctx.rotate(Math.sin(o.wig*28)*.16*o.wig);
 let by=0;
 if(pose==='walk') by=-Math.abs(Math.sin(t*9))*3;
 else if(pose==='jump') by=-Math.abs(Math.sin(t*7.5))*16;
 else if(pose==='cheer') by=-Math.abs(Math.sin(t*8))*6;
 const dir=o.dir||1;
 ctx.scale(s*dir,s); ctx.translate(0,by);
 if(pose==='pull') ctx.rotate(-.2);
 ctx.lineJoin='round'; ctx.lineCap='round';
 const sit=pose==='sit';
 let la=0,ra=0;
 if(pose==='walk'){ la=Math.sin(t*9)*.55; ra=-la; }
 if(pose==='climb'){ la=Math.sin(t*10)*.4; ra=-la; }
 if(pose==='jump'){ la=.4; ra=-.3; }
 const legCol=o.bot||'#3d3b52';
 const leg=(x0,a)=>{ const fx=sit?x0+19:x0+Math.sin(a)*17, fy=sit?-17:-17+Math.cos(a)*17;
  limb(x0,-17,fx,fy,lw,legCol);
  ctx.beginPath(); ctx.ellipse(fx+2.5,fy+1,6.5,4.2,0,0,TAU); ctx.fillStyle=K.ink; ctx.fill(); };
 leg(-5,la); leg(5,ra);
 // 腕の角度（下=0、前に上がると正）
 let aB=.18, aF=-.12, short=false;
 switch(pose){
  case 'walk': aB=Math.sin(t*9)*.6; aF=-aB; break;
  case 'wave': aB=.15; aF=PI*.85+Math.sin(t*13)*.35; break;
  case 'cheer': aB=PI*.82+Math.sin(t*10)*.15; aF=PI*.82-Math.sin(t*10)*.15; break;
  case 'jump': aB=PI*.7; aF=PI*.75; break;
  case 'pull': aB=PI*.48+Math.sin(t*14)*.08; aF=PI*.52+Math.sin(t*14)*.08; break;
  case 'climb': aB=PI*.8+Math.sin(t*10)*.25; aF=PI*.8-Math.sin(t*10)*.25; break;
  case 'sit': aB=PI*.78; aF=PI*.85; break;
  case 'knock': aB=.1; aF=PI*.5+Math.sin(t*26)*.3; break;
  case 'cheeks': aB=PI*.78; aF=PI*.78; short=true; break;
  case 'toss': aB=.2; aF=PI*(.4+.5*Math.sin(t*6)); break;
 }
 if(o.waveT>0&&pose!=='climb'&&pose!=='sit'){ aF=PI*.85+Math.sin(t*13)*.35; }
 if(o.drumBeat){ aB=PI*.42+Math.sin(t*15)*.3; aF=PI*.42-Math.sin(t*15)*.3; }
 if(o.point!=null){ aF=o.point; }
 if(o.cup&&pose!=='cheer'&&pose!=='climb'&&pose!=='sit'&&!(o.waveT>0)) aF=PI*.38;
 const arm=(sx,a,col)=>{ const L=short?11:16; const hx=sx+Math.sin(a)*L, hy=-41+Math.cos(a)*L; limb(sx,-41,hx,hy,lw,col);
  ctx.beginPath(); ctx.arc(hx,hy,4.6,0,TAU); ctx.fillStyle=o.skin||K.skin; ctx.fill(); ctx.lineWidth=lw*.75; ctx.strokeStyle=K.ink; ctx.stroke(); return [hx,hy]; };
 arm(-6,aB,o.top||K.red);
 // 体
 ctx.beginPath(); ctx.moveTo(-10,-46); ctx.lineTo(10,-46); ctx.lineTo(sit?14:15,-15); ctx.lineTo(sit?-12:-15,-15); ctx.closePath(); fillStroke(o.top||K.red,lw);
 if(o.apron){ ctx.beginPath(); ctx.moveTo(-6,-38); ctx.lineTo(9,-38); ctx.lineTo(12,-16); ctx.lineTo(-8,-16); ctx.closePath(); fillStroke(o.apron,lw*.8); }
 // 頭
 ctx.beginPath(); ctx.arc(0,-60,15,0,TAU); fillStroke(o.skin||K.skin,lw);
 // 髪
 ctx.beginPath(); ctx.arc(0,-60,15.5,PI*1.02,PI*1.98); ctx.quadraticCurveTo(6,-66,-2,-63); ctx.quadraticCurveTo(-10,-60,-15.5,-58); ctx.closePath(); fillStroke(o.hair||'#2a211c',lw*.8);
 if(o.braid){ ctx.beginPath(); ctx.ellipse(-15,-50,5,8,.3,0,TAU); fillStroke(o.hair||'#2a211c',lw*.7); }
 // 帽子
 if(o.hat==='beret'){ ctx.beginPath(); ctx.ellipse(1,-74,19,7,-.18,0,TAU); fillStroke(o.hatCol||K.blue,lw*.85); ctx.beginPath(); ctx.moveTo(2,-81); ctx.lineTo(4,-86); ctx.lineWidth=lw*.8; ctx.strokeStyle=K.ink; ctx.stroke(); }
 else if(o.hat==='straw'){ ctx.beginPath(); ctx.ellipse(0,-71,27,6,0,0,TAU); fillStroke(o.hatCol||K.yellow,lw*.8); ctx.beginPath(); rrect(ctx,-12,-86,24,16,6); fillStroke(o.hatCol||K.yellow,lw*.8); ctx.beginPath(); ctx.rect(-12,-76,24,4); ctx.fillStyle=K.red; ctx.fill(); }
 else if(o.hat==='band'){ ctx.beginPath(); ctx.rect(-15,-70,30,6); fillStroke(K.red,lw*.7); ctx.beginPath(); ctx.moveTo(-15,-67); ctx.lineTo(-23,-72); ctx.lineTo(-22,-62); ctx.closePath(); fillStroke(K.red,lw*.6); }
 else if(o.hat==='cap'){ ctx.beginPath(); ctx.arc(0,-66,15,PI,0); ctx.closePath(); fillStroke(o.hatCol||K.green,lw*.8); ctx.beginPath(); ctx.rect(4,-68,16,4); fillStroke(o.hatCol||K.green,lw*.6); }
 // 顔
 const lx=clamp((o.lx||0)*dir,-1,1)*2.4, ly=clamp(o.ly||0,-1,1)*2.2, m=o.mood||'neutral';
 const bl=blinkOn(o.anim||0);
 ctx.fillStyle=K.ink; ctx.strokeStyle=K.ink; ctx.lineWidth=lw*.7;
 const ex=[2,11];
 if(m==='happy'&&!(o.lx||o.ly)){ ex.forEach(x=>{ ctx.beginPath(); ctx.arc(x,-59,3.4,PI*1.1,PI*1.9); ctx.stroke(); }); }
 else if(bl){ ex.forEach(x=>{ ctx.beginPath(); ctx.moveTo(x-3,-60); ctx.lineTo(x+3,-60); ctx.stroke(); }); }
 else { const er=m==='wow'?3.6:2.8; ex.forEach(x=>{ ctx.beginPath(); ctx.ellipse(x+lx,-60+ly,er*.8,er,0,0,TAU); ctx.fill(); }); }
 if(m==='sad'){ ctx.beginPath(); ctx.moveTo(-1,-68); ctx.lineTo(5,-66.5); ctx.moveTo(14,-68); ctx.lineTo(8,-66.5); ctx.stroke(); }
 ctx.beginPath();
 if(m==='happy'){ ctx.moveTo(1,-52); ctx.quadraticCurveTo(7,-43,13,-52); ctx.closePath(); ctx.fillStyle=K.red; ctx.fill(); ctx.stroke(); }
 else if(m==='sad'){ ctx.moveTo(3,-49); ctx.quadraticCurveTo(7,-53,11,-49); ctx.stroke(); }
 else if(m==='wow'){ ctx.ellipse(7,-50,3,3.6,0,0,TAU); ctx.fillStyle=K.red; ctx.fill(); ctx.stroke(); }
 else { ctx.moveTo(3,-51); ctx.quadraticCurveTo(7,-48,11,-51); ctx.stroke(); }
 ctx.beginPath(); ctx.ellipse(-2,-54,3.2,2,0,0,TAU); ctx.ellipse(15,-54,2.4,2,0,0,TAU); ctx.fillStyle=hexA(K.pink,.9); ctx.fill();
 if(o.drum){ ctx.beginPath(); ctx.moveTo(-1,-33); ctx.lineTo(-1,-21); ctx.ellipse(10,-21,11,4.5,0,PI,0,true); ctx.lineTo(21,-33); ctx.closePath(); fillStroke(K.red,lw*.8);
  ctx.beginPath(); ctx.ellipse(10,-33,11,4.5,0,0,TAU); fillStroke('#ffffff',lw*.8); }
 // 前の腕と持ち物
 const hand=arm(6,aF,o.top||K.red);
 if(o.cup){ ctx.save(); ctx.translate(hand[0]+2,hand[1]-4); ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(6,0); ctx.lineTo(4,9); ctx.lineTo(-4,9); ctx.closePath(); fillStroke('#ffffff',lw*.6); ctx.beginPath(); ctx.arc(0,0,6.5,PI,0); ctx.closePath(); fillStroke(o.cupCol||'#ff8f8f',lw*.6); ctx.restore(); }
 if(o.can){ ctx.save(); ctx.translate(hand[0]+6,hand[1]+2); ctx.rotate(o.canTilt||0); ctx.beginPath(); rrect(ctx,-6,-8,16,14,3); fillStroke('#7fb6f0',lw*.6); ctx.beginPath(); ctx.moveTo(10,-4); ctx.lineTo(20,-12); ctx.lineWidth=lw*.8; ctx.strokeStyle=K.ink; ctx.stroke(); ctx.restore(); }
 if(o.lantern){ ctx.save(); ctx.translate(hand[0]+2,hand[1]+12); ctx.beginPath(); ctx.ellipse(0,0,7,9,0,0,TAU); fillStroke(K.red,lw*.6); if(NT.dark>.5){ ctx.beginPath(); ctx.arc(0,0,16,0,TAU); ctx.fillStyle=hexA('#ffd36a',.25); ctx.fill(); } ctx.restore(); }
 ctx.restore();
}
function kidOpts(a,extra){ return Object.assign({x:a.x,y:a.y,dir:a.dir,pose:a.pose,mood:a.mood,lx:a.lx,ly:a.ly,wig:a.wig,anim:a.anim,waveT:a.waveT,cup:a.cup},extra); }
function actorPose(a){ if(a.cheerT>0&&a.pose!=='climb'&&a.pose!=='sit'&&!a.moving) return 'cheer'; return a.pose; }

/* ---------- 消防車 ---------- */
function drawTruck(){
 const t=TR; if(!t.on) return; const pop=eBack(t.pop); if(pop<=.02) return;
 ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.tilt);
 if(t.wig) ctx.rotate(Math.sin(t.wig*30)*.07*t.wig);
 const bo=t.moving?Math.abs(Math.sin(TT*16))*1.6:0;
 const climbing=t.moving&&Math.abs(Math.sin(t.ang))>.35;
 const sq=t.state==='spray'?Math.sin(TT*22)*.025:(t.state==='appear'?Math.sin(t.t*18)*.06*(1-c01(t.t)):0);
 ctx.scale(t.dir*pop*(1+sq),pop*(1-sq)); ctx.translate(0,-bo);
 ctx.lineJoin='round'; ctx.lineCap='round';
 const lw=4.5;
 // 効果線
 if(t.moving&&!t.pm){ ctx.lineWidth=3; ctx.strokeStyle=hexA(NT.dark>.5?'#ffffff':K.ink,.7); ctx.beginPath(); [-60,-42,-26].forEach((y,i)=>{ const o=(TT*90+i*20)%30; ctx.moveTo(-72-o,y); ctx.lineTo(-96-o,y); }); ctx.stroke(); }
 if(climbing){ ctx.lineWidth=3; ctx.strokeStyle=K.ink; ctx.beginPath(); for(let i=0;i<3;i++){ const a=-PI/2+(i-1)*.5; ctx.moveTo(44+Math.cos(a)*24,-86+Math.sin(a)*14); ctx.lineTo(44+Math.cos(a)*34,-86+Math.sin(a)*22); } ctx.stroke(); }
 // 車輪
 [[-36,-14],[38,-14]].forEach(([wx,wy])=>{ ctx.beginPath(); ctx.arc(wx,wy,14,0,TAU); fillStroke('#2a2830',lw); ctx.beginPath(); ctx.arc(wx,wy,6,0,TAU); fillStroke('#d9d6cc',3);
  ctx.beginPath(); for(let i=0;i<3;i++){ const a=t.wheel+i*TAU/3; ctx.moveTo(wx+Math.cos(a)*6,wy+Math.sin(a)*6); ctx.lineTo(wx+Math.cos(a)*12,wy+Math.sin(a)*12); } ctx.lineWidth=2.5; ctx.strokeStyle='#d9d6cc'; ctx.stroke(); });
 // 荷台
 ctx.beginPath(); rrect(ctx,-62,-64,86,48,6); fillStroke(K.red,lw);
 // 運転席
 ctx.beginPath(); ctx.moveTo(20,-16); ctx.lineTo(20,-82); ctx.lineTo(46,-82); ctx.quadraticCurveTo(62,-80,64,-58); ctx.lineTo(66,-16); ctx.closePath(); fillStroke(K.red,lw);
 ctx.beginPath(); ctx.rect(-62,-36,128,7); fillStroke('#ffffff',3);
 // 顔の窓
 ctx.beginPath(); rrect(ctx,26,-77,32,28,6); fillStroke('#ffffff',3.5);
 const lk=t.state==='wait'?1:(t.state==='spray'?.6:.3);
 const bl=blinkOn(3.1);
 ctx.fillStyle=K.ink;
 if(bl){ ctx.lineWidth=3; ctx.strokeStyle=K.ink; ctx.beginPath(); ctx.moveTo(32,-65); ctx.lineTo(38,-65); ctx.moveTo(44,-65); ctx.lineTo(50,-65); ctx.stroke(); }
 else { [35,47].forEach(x=>{ ctx.beginPath(); ctx.ellipse(x+lk*2,-65,2.8,3.8,0,0,TAU); ctx.fill(); }); }
 ctx.beginPath(); ctx.moveTo(36,-56); ctx.quadraticCurveTo(42,-50,48,-56); ctx.lineWidth=3; ctx.strokeStyle=K.ink; ctx.stroke();
 // バンパー・ライト
 ctx.beginPath(); rrect(ctx,58,-26,12,10,3); fillStroke('#d9d6cc',3);
 ctx.beginPath(); ctx.arc(62,-40,4,0,TAU); fillStroke(K.yellow,2.5);
 // はしご
 ctx.beginPath(); ctx.rect(-58,-75,78,9); fillStroke('#ffffff',3.5);
 ctx.beginPath(); for(let x=-50;x<18;x+=10){ ctx.moveTo(x,-75); ctx.lineTo(x,-66); } ctx.lineWidth=2.5; ctx.strokeStyle=K.ink; ctx.stroke();
 // ホース巻き
 ctx.beginPath(); ctx.arc(-26,-40,11,0,TAU); fillStroke('#ffffff',3.5); ctx.beginPath(); ctx.arc(-26,-40,5,0,TAU); ctx.lineWidth=2.5; ctx.stroke();
 // サイレン
 const fl=(NT.dark>.5||t.state==='appear'||t.state==='spray')&&Math.floor(TT*6)%2===0;
 ctx.beginPath(); rrect(ctx,30,-91,16,9,3); fillStroke(fl?K.yellow:K.blue,3);
 if(fl){ ctx.beginPath(); ctx.arc(38,-87,16,0,TAU); ctx.fillStyle=hexA(K.yellow,.3); ctx.fill(); }
 // 描き足した星
 for(let i=0;i<t.decor;i++){ starShape(-44+i*20,-50,7,K.yellow,2.5); }
 if(NT.dark>.5){ ctx.beginPath(); ctx.arc(70,-40,22,0,TAU); ctx.fillStyle=hexA('#fff3a0',.22); ctx.fill(); }
 ctx.restore();
}
function starShape(x,y,r,col,lw){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=-PI/2+i*PI/5, rr2=i%2?r*.45:r; i?ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2):ctx.moveTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2); } ctx.closePath(); fillStroke(col,lw); }

/* ---------- 町の動く部分 ---------- */
function bankX(y,near){ return near?G.riverL+(y-GY)/90*16:G.riverR-(y-GY)/90*16; }
function drawRiver(){
 const n=NT.dark, top=G.waterY;
 ctx.beginPath(); ctx.moveTo(bankX(top,true),top);
 for(let x=bankX(top,true);x<=bankX(top,false);x+=10) ctx.lineTo(x,top+Math.sin(x*.08+TT*2.4)*3);
 ctx.lineTo(bankX(1036,false),1036); ctx.lineTo(bankX(1036,true),1036); ctx.closePath();
 ctx.fillStyle=mixHex(K.water,'#22306a',n); ctx.fill();
 ctx.lineWidth=3; ctx.strokeStyle=mixHex(K.waterD,'#4f64b8',n);
 for(let r=0;r<2;r++){ ctx.beginPath(); for(let x=690;x<=780;x+=8){ const y=top+18+r*17+Math.sin(x*.12-TT*3+r*2)*3; x===690?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); }
 if(n>.5){ // 夜の映りこみ
  ctx.fillStyle=hexA('#ffd36a',.35*n); for(let i=0;i<5;i++){ const x=690+i*20, w=6+Math.sin(TT*3+i)*3; ctx.fillRect(x,top+8+i%2*14,w,3); } }
 ctx.beginPath(); for(let x=bankX(top,true);x<=bankX(top,false);x+=10){ const y=top+Math.sin(x*.08+TT*2.4)*3; x===bankX(top,true)?ctx.moveTo(x,y):ctx.lineTo(x,y); }
 ctx.lineWidth=4; ctx.strokeStyle=n>.5?'#9fb4ff':K.ink; ctx.stroke();
 // 岩
 ctx.beginPath(); ctx.moveTo(690,1000); ctx.quadraticCurveTo(694,978,708,976); ctx.quadraticCurveTo(722,978,724,1000); ctx.closePath(); fillStroke(n>.5?'#3a3f60':K.gray,4.5);
}
function cargoLanded(){ return CG.state==='land'||CG.state==='open'||CG.state==='done'; }
function drawCargo(){
 const c=CG;
 const x=c.x, y=c.y;
 ctx.save(); ctx.translate(x,y); ctx.rotate(c.ang); if(c.wig) ctx.rotate(Math.sin(c.wig*30)*.1*c.wig);
 ctx.beginPath(); rrect(ctx,-19,-30,38,30,4); fillStroke('#d79a4e',4.5);
 ctx.beginPath(); ctx.moveTo(-19,-15); ctx.lineTo(19,-15); ctx.moveTo(-6,-30); ctx.lineTo(-6,0); ctx.moveTo(7,-30); ctx.lineTo(7,0); ctx.lineWidth=2.5; ctx.strokeStyle=K.ink; ctx.stroke();
 // ふた
 ctx.save(); ctx.translate(-19,-30); ctx.rotate(-c.lid*1.9); ctx.beginPath(); rrect(ctx,0,-6,40,7,3); fillStroke('#e8b46a',4); ctx.restore();
 if(c.state==='float'){ ctx.beginPath(); ctx.ellipse(-24,-2,6,4,0,0,TAU); ctx.ellipse(24,-2,6,4,0,0,TAU); ctx.fillStyle=K.water; ctx.fill(); }
 ctx.restore();
 if(c.state==='float'){ ctx.beginPath(); ctx.moveTo(x-26,G.waterY+4); ctx.quadraticCurveTo(x,G.waterY+12+Math.sin(TT*3)*2,x+26,G.waterY+4); ctx.lineWidth=3; ctx.strokeStyle=K.waterD; ctx.stroke(); }
}
function lanternLine(){ return {x0:706,y0:842,cx:766,cy:872,x1:826,y1:822}; }
function qpt(L,t){ const u=1-t; return [u*u*L.x0+2*u*t*L.cx+t*t*L.x1, u*u*L.y0+2*u*t*L.cy+t*t*L.y1]; }
function drawRope(){
 // 滑車
 ctx.save(); ctx.translate(G.armX,G.armY); ctx.rotate(CG.pul); ctx.beginPath(); ctx.arc(0,0,7,0,TAU); fillStroke('#ffffff',3.5); ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(6,0); ctx.lineWidth=2; ctx.stroke(); ctx.restore();
 if(!F.rope) return;
 const st=CG.state;
 if(st==='hook'||st==='lift'||st==='swing'||st==='land'||(st==='open'&&CG.t<.4)){
  const bx=CG.x+Math.sin(CG.ang)*30, by=CG.y-30;
  ctx.beginPath(); ctx.moveTo(G.armX,G.armY+6); ctx.quadraticCurveTo((G.armX+bx)/2+(st==='hook'?10*(1-CG.rope):0),(G.armY+by)/2+(st==='hook'?16*(1-CG.rope):0),bx,by);
  ctx.lineWidth=7; ctx.strokeStyle=K.ink; ctx.stroke(); ctx.lineWidth=3.5; ctx.strokeStyle=FRUIT.b.thin; ctx.stroke();
 }
 if(CG.lan>0){ const L=lanternLine(), g=CG.lan;
  ctx.beginPath(); for(let i=0;i<=16;i++){ const t=i/16*g; const p=qpt(L,t); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }
  ctx.lineWidth=6; ctx.strokeStyle=K.ink; ctx.stroke(); ctx.lineWidth=3; ctx.strokeStyle=FRUIT.b.thin; ctx.stroke();
  const n=Math.min(9,5+F.ropePlus*2), cols=[K.red,K.yellow,'#ffffff',K.green,K.blue];
  const g2=g*4/3;   // 最後のちょうちんも、ひもに届くように
  const lpos=i=>{ const tt=(i+.5)/n; if(tt>g2) return null; const p=qpt(L,tt), k=c01((g2-tt)*3); return [lerp(CG.x,p[0],k),lerp(CG.y-20,p[1]+14,k)]; };
  if(NT.dark>.5) for(let i=0;i<n;i++){ const q=lpos(i); if(!q) continue; ctx.beginPath(); ctx.arc(q[0],q[1],20,0,TAU); ctx.fillStyle=hexA('#ffd36a',.22+.08*Math.sin(TT*5+i)); ctx.fill(); }
  for(let i=0;i<n;i++){ const q=lpos(i); if(!q) continue; const sw=Math.sin(TT*2+i)*.12;
   ctx.save(); ctx.translate(q[0],q[1]); ctx.rotate(sw);
   ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(0,-8); ctx.lineWidth=2.5; ctx.strokeStyle=K.ink; ctx.stroke();
   ctx.beginPath(); ctx.ellipse(0,2,8,10,0,0,TAU); fillStroke(cols[i%cols.length],3);
   ctx.beginPath(); ctx.rect(-5,-9,10,3); ctx.rect(-5,11,10,3); fillStroke('#2a2830',1.5);
   ctx.restore(); }
  if(F.ropePlus>=3&&g>=1) [.25,.5,.75].forEach(t=>{ const p=qpt(L,t); starShape(p[0],p[1]-16,7,K.yellow,2); });
 }
}
function drawWaterfall(){

 const w=4+RN.flow*9, x=772;
 ctx.beginPath(); ctx.moveTo(x-w/2,384); for(let y=384;y<=G.waterY;y+=24) ctx.lineTo(x-w/2+Math.sin(y*.05+TT*8)*1.5,y); ctx.lineTo(x+w/2,G.waterY); ctx.lineTo(x+w/2,384); ctx.closePath();

 ctx.save(); ctx.setLineDash([10,16]); ctx.lineDashOffset=-TT*220; ctx.beginPath(); ctx.moveTo(x,388); ctx.lineTo(x,G.waterY-4); ctx.lineWidth=2.5; ctx.strokeStyle='#ffffff'; ctx.stroke(); ctx.restore();
}
function bridgeY(x){ return GY-G.bridgeH*Math.sin(PI*(x-G.bridgeL)/(G.bridgeR-G.bridgeL)); }
function drawBridge(){
 if(!F.bridge||BR.g<=0) return;
 const g=eOut(BR.g), x1=lerp(G.bridgeL,G.bridgeR,g);
 ctx.beginPath(); for(let x=G.bridgeL;x<=x1;x+=6) x===G.bridgeL?ctx.moveTo(x,bridgeY(x)):ctx.lineTo(x,bridgeY(x));
 ctx.lineWidth=22; ctx.strokeStyle=K.ink; ctx.stroke(); ctx.lineWidth=14; ctx.strokeStyle=FRUIT.m.col; ctx.stroke();
 ctx.lineWidth=3; ctx.strokeStyle=FRUIT.m.dark; ctx.setLineDash([12,10]); ctx.stroke(); ctx.setLineDash([]);

 // 不透明な紙の下になる部分は写さない（紙のまわり4本だけ）
 const blit=(c,a)=>{ const cw=c.width, ch=c.height, X=clamp(Math.round((PG.x+2)*DPR),0,cw), Y=clamp(Math.round((PG.y+2)*DPR),0,ch), X2=clamp(Math.round((PG.x+PG.w-2)*DPR),0,cw), Y2=clamp(Math.round((PG.y+PG.h-2)*DPR),0,ch);
  const part=(sx,sy,sw,sh)=>{ if(sw>0&&sh>0) ctx.drawImage(c,sx,sy,sw,sh,sx,sy,sw,sh); };
  ctx.globalAlpha=a; if(X2<=X||Y2<=Y) part(0,0,cw,ch); else { part(0,0,cw,Y); part(0,Y2,cw,ch-Y2); part(0,Y,X,Y2-Y); part(X2,Y,cw-X2,Y2-Y); } ctx.globalAlpha=1; };
 const c0=bgCache(d===1?1:0), c1=d<0?bgCache(1):null;
 ctx.setTransform(1,0,0,1,0,0);
 blit(c0,1); if(c1) blit(c1,NT.dark);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(d>=0) bgFree(1-d);   // 使わないほうはすぐ手放す（メモリを2枚分使わない）
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 drawBackdrop();
 drawTown();
 drawFlip();
 drawBoy(); drawBase(); drawJar(); drawButton(); drawTray(); drawPhoto();
 drawHose(); drawPen(); drawToss(); drawParticles(true); drawHand();
}
let raf=0, running=false, lastT=0;
function frame(ts){
 raf=0; if(!running) return;
 let dt=(ts-lastT)/1000; lastT=ts; if(!(dt>0)) dt=1/60; dt=Math.min(dt,.05);
 for(let i=0;i<TSCALE;i++) update(dt);
 render();
 raf=requestAnimationFrame(frame);
}
function start(){ if(running) return; running=true; lastT=performance.now(); raf=requestAnimationFrame(frame); }
function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(MX.press) pressEnd(false); BTNP.clear(); stop(); AU.suspend(); save(true); } else { start(); } });
window.addEventListener('pagehide',()=>{ if(MX.press) pressEnd(false); BTNP.clear(); save(true); });
let rzT=0; function onResize(){ clearTimeout(rzT); rzT=setTimeout(()=>{ layout(); if(PEN.state==='home'){ PEN.x=LY.penHome.x; PEN.y=LY.penHome.y; } },60); }
window.addEventListener('resize',onResize); window.addEventListener('orientationchange',onResize);
document.addEventListener('touchend',()=>AU.init(),{passive:true});

/* ---------- 検査用（読み取りのみ） ---------- */
window.__jit={
 get F(){ return JSON.parse(JSON.stringify(F)); },
 get MX(){ return {fruit:MX.fruit,level:MX.level,full:MX.full,press:MX.press,btn:MX.btn,next:MX.next}; },
 get PEN(){ return PEN.state; }, get INV(){ return INV.t?(INV.t+(INV.k?':'+INV.k:'')):null; },
 get NT(){ return NT.phase; }, get HAND(){ return {on:HAND.on,done:HAND.done}; },
 get counts(){ return {pt:PT.length,fw:FW.length,fx:FX.length,ink:INK.length,drops:RN.drops.length}; },
 layout(){ return {W,H,PORT,PG:Object.assign({},PG),ST:Object.assign({},ST),btn:Object.assign({},LY.btn),fruits:LY.fruits.map(f=>Object.assign({},f)),plat:Object.assign({},LY.plat),photo:Object.assign({},LY.photo),penHome:Object.assign({},LY.penHome)}; },
 get NTpp(){ return NT.pp; },
 actors(){ const a=e=>({x:Math.round(e.x),y:Math.round(e.y),state:e.state,zone:e.zone,pm:e.pm||null}); return {TR:Object.assign(a(TR),{on:TR.on,decor:TR.decor}),KD:a(KD),GL:a(GL),GD:a(GD),SKW:Object.assign(a(SKW),{on:SKW.on}),SHOPQ,CG:{state:CG.state},SK:{state:SK.state,peek:SK.peek>0},RD:{state:RD.state},RN:{on:RN.on,wheelV:+RN.wheelV.toFixed(2),lit:+RN.lit.toFixed(2)},BR:{g:BR.g},cycle,photo:!!PHOTO.img,saveOK}; },
 toScreen(x,y){ return [toSX(x),toSY(y)]; }
};

/* ---------- 開始 ---------- */
function init(){
 makeVar(); resetWorld(); genChunks();
 try{ const d=load(); if(d) applyLoad(d); }catch(e){ makeVar(); resetWorld(); MX.fruit='s'; genChunks(); lsDel(); }
 layout(); makeBgPattern();
 PEN.x=LY.penHome.x; PEN.y=LY.penHome.y;
 render(); start();
 setTimeout(()=>{ try{ AU.prep(); }catch(e){} },400);
}
init();
})();

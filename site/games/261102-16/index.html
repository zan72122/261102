'use strict';
/* ===================== 基本 ===================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3), easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function easeBack(t){const c=1.9;t=clamp(t,0,1);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
function hs(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0;}
function mkR(seed){let s=(Math.imul(seed|0,2654435761)^0x9e3779b9)>>>0||7;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const C={navy:'#141c3a',navy2:'#0b1130',slope:'#232e62',slope2:'#2c3a76',red:'#e8452c',blue:'#3d63ea',yel:'#f6b81a',grn:'#21925a',
 dgrn:'#13643a',wht:'#f4efe2',skin:'#f3c9a2',ink:'#0a0f24',wood:'#7a4a2a',dark:'#1a1f3a'};
const BOXC=[C.red,C.blue,C.yel], BOXD=['#9c2c1c','#233f9e','#a8770e'];
const ITEMBOX={bottle:1,cloth:0,button:2,leaf:-1};
const ITEMCOL={bottle:C.blue,cloth:C.red,button:C.yel,leaf:C.grn};

const PAT={leaf:{0:'fire',1:'green',2:'yagura'},bottle:{0:'bath',2:'tower'},cloth:{1:'tent',2:'bakery'},button:{0:'candy',1:'observ'}};
const PATB={fire:['stripe',C.red,C.wht],green:['dot',C.wht,C.grn],yagura:['check',C.yel,C.grn],bath:['dot',C.red,C.blue],
 tower:['stripe',C.yel,C.blue],tent:['zig',C.blue,C.red],bakery:['check',C.yel,C.red],candy:['star',C.red,C.yel],observ:['star',C.blue,C.yel]};

/* ===================== 音 (Web Audio 合成) ===================== */
let AC=null, MG=null, NB=null;
function ensureAudio(){
 try{
  if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();MG=AC.createGain();MG.gain.value=.6;
   const comp=AC.createDynamicsCompressor();MG.connect(comp);comp.connect(AC.destination);
   NB=AC.createBuffer(1,AC.sampleRate*1.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state==='suspended')AC.resume();
 }catch(e){AC=null;}
}
function aok(){return AC&&AC.state==='running';}
function tone(f,dur,type,vol,when,f2,attack){
 if(!aok())return;const t=AC.currentTime+(when||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
 o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
 const a=attack||.006;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,freq,q,vol,when,lfo,f2){
 if(!aok())return;const t=AC.currentTime+(when||0);const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
 const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(freq,t);if(f2)bp.frequency.linearRampToValueAtTime(f2,t+dur);bp.Q.value=q;
 const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.setValueAtTime(vol,t+Math.max(.02,dur-.08));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(bp);bp.connect(g);
 if(lfo){const tg=AC.createGain();tg.gain.value=0;const lo=AC.createOscillator();lo.frequency.value=lfo;const ld=AC.createGain();ld.gain.value=1;
  lo.connect(ld);ld.connect(tg.gain);g.connect(tg);tg.connect(MG);lo.start(t);lo.stop(t+dur+.05);}else g.connect(MG);
 s.start(t,Math.random());s.stop(t+dur+.05);
}
const MATP={bottle:1.25,cloth:.8,button:1.5,leaf:1};
const SFX={
 grab(it){noise(.09,2600,1.5,.22);tone(380*MATP[it],.12,'triangle',.14,0,620*MATP[it]);},
 tap(){tone(900,.05,'triangle',.05);},
 kot(it,fill){const p=MATP[it]*(1+fill*.12);tone(210*p,.16,'sine',.55,0,95*p);noise(.035,1900,2,.3);tone(520*p,.07,'triangle',.18,.07,330*p);},
 flow(dur,base){noise(dur,base,1.1,.22,0,13,base*1.9);noise(dur*.8,base*2.4,3,.07,.05,9);},
 build(it){const b=[523,659,784,1046].map(f=>f*MATP[it]**.3);b.forEach((f,i)=>tone(f,.22,'triangle',.2,i*.07));tone(b[3]*2,.35,'sine',.08,.28);},
 wow(){[1318,1568,2093,2637].forEach((f,i)=>tone(f,.4,'sine',.12,.05+i*.09));tone(392,.5,'triangle',.18,0,784);},
 orb(){tone(880,.2,'sine',.15,0,1320);tone(1760,.25,'sine',.06,.08);},
 miss(){tone(440,.22,'sine',.12,0,300);},
 pop(){tone(700,.08,'triangle',.08,0,1000);},
 over(){tone(180,1.4,'sawtooth',.06,0,880,.3);tone(220,1.4,'triangle',.18,0,990,.3);noise(1.6,500,.7,.25,0,0,2400);},
 flood(){noise(2.2,300,.6,.3,0,6,900);[392,494,587,784].forEach((f,i)=>tone(f,.5,'triangle',.16,.6+i*.18));},
 cheer(){[784,988,1175].forEach(f=>tone(f,.3,'triangle',.13));noise(.25,3000,1,.08);},
 fin(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.5,'triangle',.16,i*.12));},
 roll(){noise(.9,900,.8,.2,0,0,300);}
};
// まつりばやし
let MUS={on:false,next:0,step:0};
const MEL=[0,2,4,7,4,2,0,-1, 4,7,9,7,4,2,4,-1, 7,9,12,9,7,4,2,-1, 4,2,0,2,4,7,4,-1];
const SC=[293.7,329.6,392,440,493.9,587.3,659.3,784,880,987.8,1174.7,1318.5,1568];
function music(){
 if(!aok())return;
 if(!MUS.on){return;}
 const bt=.3;if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.05;
 while(MUS.next<AC.currentTime+.25){
  const t=MUS.next-AC.currentTime,s=MUS.step%32;
  if(s%4===0)tone(90,.25,'sine',.45,t,50);
  if(s%8===6)tone(120,.15,'sine',.3,t,70);
  if(s%2===1)noise(.04,4000,2,.05,t);
  const m=MEL[s];if(m>=0){const f=SC[Math.min(SC.length-1,m)]*1;tone(f,.26,'triangle',.09,t,f*1.01,.03);}
  MUS.step++;MUS.next+=bt;
 }
}

/* ===================== クレヨン描画 ===================== */
function tracePoly(g,pts,closed){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);if(closed)g.closePath();}
function jit(pts,j,r){return pts.map(p=>[p[0]+(r()-.5)*j,p[1]+(r()-.5)*j]);}
function cStroke(g,pts,col,w,seed,closed){
 const r=mkR(seed);g.lineCap='round';g.lineJoin='round';g.strokeStyle=col;
 g.globalAlpha=.95;g.lineWidth=w;tracePoly(g,jit(pts,w*.4,r),closed);g.stroke();
 g.globalAlpha=.5;g.lineWidth=w*.5;tracePoly(g,jit(pts,w*1.1,r),closed);g.stroke();
 g.globalAlpha=1;
}
function hatch(g,pts,col,sp,ang,seed,lw){
 const r=mkR(seed);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of pts){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];}
 g.save();tracePoly(g,pts,true);g.clip();g.strokeStyle=col;g.lineWidth=lw||1.5*S;g.lineCap='round';
 const ca=Math.cos(ang),sa=Math.sin(ang),cx=(x0+x1)/2,cy=(y0+y1)/2,RR=Math.hypot(x1-x0,y1-y0)/2+2;
 g.beginPath();for(let d=-RR;d<=RR;d+=sp){const j=(r()-.5)*sp*.6,ox=cx-sa*(d+j),oy=cy+ca*(d+j),l1=-RR*(.6+r()*.4),l2=RR*(.6+r()*.4);
  g.moveTo(ox+ca*l1,oy+sa*l1);g.lineTo(ox+ca*l2,oy+sa*l2);}
 g.stroke();g.restore();
}
function cFill(g,pts,col,seed,h){
 const r=mkR(seed+3);g.fillStyle=col;tracePoly(g,jit(pts,1.6*S,r),true);g.fill();
 if(h!==0){hatch(g,pts,'rgba(255,255,255,.17)',4.2*S,-.9,seed+11);if(h===2)hatch(g,pts,'rgba(0,0,20,.16)',5*S,.6,seed+17);}
}
function cs(g,pts,fill,line,seed,lw,h){cFill(g,pts,fill,seed,h===undefined?1:h);if(line)cStroke(g,pts,line,(lw||2.6)*S,seed+1,true);}
function Rp(x,y,w,h){return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];}
function Ep(cx,cy,rx,ry,n){n=n||16;const p=[];for(let i=0;i<n;i++){const a=i/n*TAU;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return p;}
function mkPoly(pts){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,cum,len:cum[cum.length-1]};}
function ptAt(P,d){const c=P.cum,p=P.pts;if(d<=0)return p[0];if(d>=P.len)return p[p.length-1];let i=1;while(c[i]<d)i++;const t=(d-c[i-1])/((c[i]-c[i-1])||1);return[lerp(p[i-1][0],p[i][0],t),lerp(p[i-1][1],p[i][1],t)];}
function subPoly(P,d){const out=[P.pts[0]];for(let i=1;i<P.pts.length;i++){if(P.cum[i]<d)out.push(P.pts[i]);else{out.push(ptAt(P,d));break;}}return out;}
function patFill(g,pts,kind,c1,c2,seed,u){
 cFill(g,pts,c1,seed,0);
 const r=mkR(seed+40);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of pts){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}
 g.save();tracePoly(g,pts,true);g.clip();g.fillStyle=c2;g.strokeStyle=c2;
 if(kind==='stripe'){const w=u*.17;for(let x=x0+w*.5,i=0;x<x1;x+=w*2,i++){tracePoly(g,jit(Rp(x,y0-2,w,y1-y0+4),1.4*S,r),true);g.fill();}}
 else if(kind==='dot'){const sp=u*.3;let row=0;for(let y=y0+sp*.5;y<y1+sp;y+=sp,row++)for(let x=x0+(row%2?sp*.5:0);x<x1+sp;x+=sp){tracePoly(g,jit(Ep(x,y,u*.085,u*.085,9),1*S,r),true);g.fill();}}
 else if(kind==='check'){const sp=u*.22;let row=0;for(let y=y0;y<y1;y+=sp,row++)for(let x=x0+(row%2?sp:0);x<x1;x+=sp*2){tracePoly(g,jit(Rp(x,y,sp,sp),1.2*S,r),true);g.fill();}}
 else if(kind==='zig'){g.lineWidth=u*.11;g.lineJoin='miter';for(let y=y0+u*.12;y<y1+u*.2;y+=u*.3){g.beginPath();let up=0;for(let x=x0-u*.2;x<x1+u*.2;x+=u*.12){g.lineTo(x,y+(up?-u*.07:u*.07));up^=1;}g.stroke();}}
 else if(kind==='star'){const sp=u*.32;let row=0;for(let y=y0+sp*.5;y<y1+sp;y+=sp,row++)for(let x=x0+(row%2?sp*.5:sp*.1);x<x1+sp;x+=sp){g.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?u*.045:u*.11;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();g.fill();}}
 g.restore();
 hatch(g,pts,'rgba(255,255,255,.15)',4.2*S,-.9,seed+11);hatch(g,pts,'rgba(0,0,20,.13)',5*S,.6,seed+17);
}
// 光のスプライト
const GLOW=document.createElement('canvas');GLOW.width=GLOW.height=64;
(()=>{const g=GLOW.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,225,120,1)');gr.addColorStop(.35,'rgba(255,190,60,.55)');gr.addColorStop(1,'rgba(255,160,40,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);})();
let GRAIN=null, GRAINT=null, SCRATCH=null;
function mkPatterns(){
 const a=document.createElement('canvas');a.width=a.height=128;const g=a.getContext('2d');const r=mkR(99);
 for(let i=0;i<900;i++){g.fillStyle=r()<.8?`rgba(8,10,30,${.12+r()*.25})`:`rgba(255,250,235,${.04+r()*.06})`;g.fillRect(r()*128,r()*128,1+r()*1.6,1+r()*1.2);}
 GRAIN=ctx.createPattern(a,'repeat');GRAINT=townG.createPattern(a,'repeat');
 const b=document.createElement('canvas');b.width=b.height=96;const h=b.getContext('2d');h.strokeStyle='#000';h.lineCap='round';
 for(let i=0;i<70;i++){h.globalAlpha=.2+r()*.5;h.lineWidth=.6+r()*1.4;const x=r()*96,y=r()*96,l=3+r()*9;h.beginPath();h.moveTo(x,y);h.lineTo(x+l*.8,y-l*.5);h.stroke();}
 SCRATCH=b;
}

/* ===================== レイアウト / 幾何 ===================== */
let L={}, GEO={nodes:{},edges:{}};
const bgC=document.createElement('canvas'), bgG=bgC.getContext('2d');
const townC=document.createElement('canvas'), townG=townC.getContext('2d');
const baseC=document.createElement('canvas'), baseG=baseC.getContext('2d');let baseDirty=true,blitQ=[],incQ=[];
const EDEFS=[];const ED={};
for(let i=0;i<3;i++)for(let k=0;k<LV;k++)EDEFS.push({id:`L${i}_${k}`,kind:'lane',lane:i,level:k,a:k?`n${i}_${k-1}`:'b'+i,b:`n${i}_${k}`});
for(let i=0;i<2;i++)for(let k=0;k<LV;k++)EDEFS.push({id:`X${i}_${k}`,kind:'cross',lane:i,level:k,a:`n${i}_${k}`,b:`n${i+1}_${k}`});
for(let i=0;i<3;i++)EDEFS.push({id:'O'+i,kind:'over',lane:i,level:LV,a:`n${i}_${LV-1}`,b:'p'+i});
EDEFS.push({id:'P0',kind:'plaza',a:'p0',b:'p1'},{id:'P1',kind:'plaza',a:'p1',b:'p2'});
for(const d of EDEFS)ED[d.id]=d;
const colX=i=>L.colW*(i+.5);
function readSA(){const s=getComputedStyle(document.getElementById('sa'));SA={t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0};}
function layout(){
 W=Math.max(200,window.innerWidth);H=Math.max(200,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
 for(const c of [bgC,townC,baseC]){c.width=cv.width;c.height=cv.height;}
 readSA();
 const top=SA.t+4,bot=H-SA.b-2,ah=bot-top;
 S=clamp(Math.min((W-SA.l-SA.r)/390,ah/700),.62,2.2);
 L={top,bot,ah};
 L.colW=W/3;L.crateY=top+100*S;L.boxY=top+186*S;L.bh=72*S;L.bw=Math.min(L.colW*.74,122*S);
 L.laneTop=L.boxY+L.bh;L.lotTop=bot-Math.max(108*S,ah*.165);L.lotBot=bot;L.lotH=L.lotBot-L.lotTop;
 L.dy=(L.lotTop-L.laneTop)/4.35;
 L.bsz=Math.min(L.colW*.27,L.dy*.5,52*S);
 L.sp=Math.min(80*S,(W-SA.l-SA.r-16)/4.3);L.crateW=L.sp*4+18*S;
 L.slots=SLOT_TYPES.map((t,i)=>[W/2+(i-1.5)*L.sp,L.crateY-4*S]);
 L.btn=[W-SA.r-34*S,top+30*S];
 buildGeo();bakeBg();dirty=true;baseDirty=true;if(G)for(const b of G.bld)b.spr=null;
 if(G&&G.parade)G.parade.poly=null,G.parade.trail=[];
}
function buildGeo(){
 const N=GEO.nodes={};
 for(let i=0;i<3;i++){
  N['b'+i]=[colX(i),L.laneTop-6*S];
  for(let k=0;k<LV;k++){const z=((k+i)%2===0?-1:1)*L.colW*.15;N[`n${i}_${k}`]=[colX(i)+z,L.laneTop+(k+.8)*L.dy];}
  N['p'+i]=[colX(i),L.lotTop+L.lotH*.42];
 }
 GEO.edges={};
 for(const d of EDEFS){
  const A=N[d.a],B=N[d.b],dx=B[0]-A[0],dy=B[1]-A[1],len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;
  const r=mkR(hs(d.id));const bul=d.kind==='plaza'?0:(r()-.5)*len*(d.kind==='cross'?.1:.22);
  const qx=(A[0]+B[0])/2+nx*bul,qy=(A[1]+B[1])/2+ny*bul,pts=[];
  for(let j=0;j<=14;j++){const t=j/14,u=1-t;pts.push([u*u*A[0]+2*u*t*qx+t*t*B[0],u*u*A[1]+2*u*t*qy+t*t*B[1]]);}
  const P=mkPoly(pts);const m=ptAt(P,P.len*.5),m2=ptAt(P,P.len*.5+2);let tx=m2[0]-m[0],ty=m2[1]-m[1];const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;
  let sx=-ty,sy=tx;// 法線
  const gE={P,mid:m,tan:[tx,ty]};
  if(d.kind==='lane'||d.kind==='over'){if(sx>0){sx=-sx;sy=-sy;}// A=左
   const off=Math.min(L.colW*.31,L.bsz*1.2),cl=v=>clamp(v,L.bsz*.75,W-L.bsz*.75);gE.lotA=[cl(m[0]+sx*off),m[1]+sy*off+L.bsz*.45];gE.lotB=[cl(m[0]-sx*off),m[1]-sy*off+L.bsz*.45];
   gE.cside=[sx,sy];gE.coff=L.colW*.11;
  }else if(d.kind==='cross'){
   gE.lotA=[m[0],m[1]-7*S];gE.lotB=[m[0],m[1]+L.dy*.4];gE.cside=[0,1];gE.coff=L.dy*.14;
  }else{gE.cside=[0,1];gE.coff=0;}
  if(gE.coff){const cp=pts.map((p,j)=>{const a=pts[Math.max(0,j-1)],b=pts[Math.min(pts.length-1,j+1)];let ux=b[0]-a[0],uy=b[1]-a[1];const ul=Math.hypot(ux,uy)||1;let qx2=-uy/ul,qy2=ux/ul;if(qx2*gE.cside[0]+qy2*gE.cside[1]<0){qx2=-qx2;qy2=-qy2;}return[p[0]+qx2*gE.coff,p[1]+qy2*gE.coff];});
   gE.canal=mkPoly(cp);gE.canalMid=ptAt(gE.canal,gE.canal.len*.5);}
  GEO.edges[d.id]=gE;
 }
 // 区画どうし・道との重なりをほぐす
 const lots=[];for(const d of EDEFS){const gE=GEO.edges[d.id];if(gE.lotA)lots.push(gE.lotA);if(gE.lotB)lots.push(gE.lotB);}
 const road=[];for(const d of EDEFS){if(d.kind==='plaza'||d.kind==='over')continue;for(const p of GEO.edges[d.id].P.pts)road.push(p);}
 const mx=L.bsz*1.3,my=L.bsz*1.05;
 for(let it=0;it<40;it++){

function buildAdj(){ADJ={};for(const d of EDEFS){if(!G.edges[d.id].vis)continue;(ADJ[d.a]=ADJ[d.a]||[]).push({e:d.id,o:d.b});(ADJ[d.b]=ADJ[d.b]||[]).push({e:d.id,o:d.a});}}

}

function nextParadeEdge(){

 else if(P.plan.length){if(P.plan[0]===u)P.plan.shift();if(P.plan.length&&nb.some(n=>n.o===P.plan[0]))next=P.plan.shift();else P.plan=[];}

  let best=-1e9;const cands=nb.length>1?nb.filter(n=>n.e!==P.eid):nb;
  for(const c of cands){const at=edgeAttr(c.e,P);let sc=Math.random()*.5-1.6*(P.visited[c.e]||0)+at.s*1.2+(G.edges[c.e].bt>P.t0?1.4:0);

   if(sc>best){best=sc;next=c.o;}}

function updateParade(dt){

 if(!P.poly){P.poly=mkPoly(edgePtsFrom(P.eid,P.u));P.trail=[];P.tdist=0;}
 if(P.pause>0){P.pause-=dt;}
 else{
  P.d+=34*S*dt*(P.home?1.3:1);

  home,ph:r()*6,off:(r()-.5)*7*S,hat:(r()*4)|0,a:0,leaving:false,target:null,born:now});

function targetsFor(p){
 const out=[];const night=G.parade?1:0;
 for(const b of G.bld){if(!b.vis||b.gone||b.type==='bridge')continue;let w=0;
  const age=now-b.t0;
  if(p.kind==='res'){if(b.pat)w=2.5+Math.min(3,b.heat*.25)+3*Math.exp(-age/50);else if(b.type==='stall')w=b.litV?1.6+night:.6;else if(b.type==='fountain')w=1;else if(b.type==='garden')w=.8;else if(b.type==='stage')w=1+night*2;else if(b===p.home)w=.8;}
  else if(p.kind==='shop'){if(b.type==='stall'&&b.litV)w=4;else if(b.type==='lamp')w=.6;else if(b.pat)w=.8;}

  else if(p.kind==='fire'){if(b.type==='fountain')w=3;else if(b.type==='lamp')w=2;else if(b===p.home)w=1;else if(b.type==='stall'&&b.litV)w=1;}

function bAccess(b){if(b.type==='stage')return{e:'P0',t:.97};if(b.lot==='att')return{e:BM[b.att].edge,t:.3};return{e:b.edge,t:.5};}
function planTo(p,te,tt){
 if(!G.edges[te].vis)return false;
 if(p.e===te){p.segs=[{e:te,t0:p.t,t1:tt}];return true;}
 const d=ED[p.e],td=ED[te];let best=null;
 for(const ex of[d.a,d.b]){const path=bfs(ex,n=>n===td.a||n===td.b);if(path&&(!best||path.length<best.path.length))best={ex,path};}

 for(let i=0;i<pa.length-1;i++){const e=edgeBetween(pa[i],pa[i+1]);segs.push({e,t0:ED[e].a===pa[i]?0:1,t1:ED[e].a===pa[i]?1:0});}

function chooseTarget(p){
 const ts=targetsFor(p);let tot=0;for(const t of ts)tot+=t[1];
 for(let tries=0;tries<3&&tot>0;tries++){let r=Math.random()*tot,pick=null;for(const t of ts){r-=t[1];if(r<=0){pick=t[0];break;}}if(!pick)pick=ts[ts.length-1][0];
  const ac=bAccess(pick);if(planTo(p,ac.e,ac.t+(Math.random()-.5)*.12)){p.target=pick;return;}}
 // 近くをぶらぶら
 const nb=ADJ[Math.random()<.5?ED[p.e].a:ED[p.e].b]||[];if(nb.length){const n=nb[(Math.random()*nb.length)|0];planTo(p,n.e,.2+Math.random()*.6);p.target=null;}
}
function syncPeople(){
 let lit=0;for(const b of G.bld)if(b.type==='stall'&&b.litV&&!b.gone)lit++;
 const want=Math.min(9,Math.round(lit*2*(G.parade?1.5:1)));const have=countKind('shop');
 if(have<want){const st=G.bld.filter(b=>b.type==='stall'&&b.litV);const cand=EDEFS.filter(d=>G.edges[d.id].vis);if(cand.length&&st.length){const e=cand[(Math.random()*cand.length)|0];addPerson('shop',e.id,null);}}
 else if(have>want){const p=PEOPLE.find(q=>q.kind==='shop'&&!q.leaving);if(p)p.leaving=true;}
}
function updatePeople(dt){
 for(let i=PEOPLE.length-1;i>=0;i--){const p=PEOPLE[i];
  p.a=Math.min(1,p.a+dt*2);if(p.leaving){p.a-=dt*3;if(p.a<=0){PEOPLE.splice(i,1);continue;}}
  if(!G.edges[p.e]||!G.edges[p.e].vis){PEOPLE.splice(i,1);continue;}
  if(p.wait>0){p.wait-=dt;continue;}
  if(!p.segs.length){chooseTarget(p);if(!p.segs.length)p.wait=1+Math.random();continue;}
  const s=p.segs[0];p.e=s.e;const len=GEO.edges[s.e].P.len||1;const dir=s.t1>=s.t0?1:-1;
  p.t+=dir*p.spd*dt/len;p.ph+=dt*p.spd*.33/S;
  if((dir>0&&p.t>=s.t1)||(dir<0&&p.t<=s.t1)){p.t=s.t1;p.segs.shift();if(p.segs.length){p.e=p.segs[0].e;p.t=p.segs[0].t0;}else{p.wait=1.2+Math.random()*2.2;if(p.target){p.target.heat+=.4;if(p.target.pat&&Math.random()<.5){const bp=bPos(p.target);burst(bp[0],bp[1]-L.bsz*1.1,'#ff7aa0',2,'heart');}}}}
 }
 for(const b of G.bld)b.heat*=Math.pow(.985,dt*10);
}
function personPos(p){const g=GEO.edges[p.e];const d=p.t*g.P.len;const a=ptAt(g.P,d),b=ptAt(g.P,d+2);let tx=b[0]-a[0],ty=b[1]-a[1];const tl=Math.hypot(tx,ty)||1;return[a[0]-ty/tl*p.off,a[1]+tx/tl*p.off];}

function updateParts(dt){for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.life+=dt;if(p.life>=p.max){PARTS.splice(i,1);continue;}

 }else{
  burst(x,y,'rgba(244,239,226,.8)',3,'dust');
  for(let i=0;i<3;i++){if(Math.abs(x-colX(i))<L.bw/2&&y>L.boxY-20*S&&y<L.boxY+L.bh){BOXS[i].sq=now-.05;}}
  ensureAudio();SFX.tap();
 }
}
function onMove(e){
 if(e.pointerId!==activeId||!held)return;e.preventDefault();
 const x=e.clientX,y=e.clientY;held.moved=Math.max(held.moved,Math.hypot(x-held.sx,y-held.sy));
 const dd=Math.hypot(x-held.px,y-held.py);held.px=x;held.py=y;held.lastDust+=dd;
 const it=SLOTS[held.slot];if(it&&held.lastDust>9*S){held.lastDust=0;burst(it.x,it.y+10*S,ITEMCOL[it.type],1,'dust');}
 lastInput=now;
}
function release(ok){
 const h=held;held=null;activeId=null;if(!h)return;const it=SLOTS[h.slot];if(!it)return;
 let bx=-1;if(ok&&h.moved>10*S){const c=clamp(Math.floor(h.px/L.colW),0,2);if(h.py>L.boxY-80*S&&h.py<L.laneTop+L.dy*.8)bx=c;}
 if(bx>=0){FLY.push({type:it.type,slot:it.slot,bx,t0:now,x0:it.x,y0:it.y,seed:it.seed});SLOTS[h.slot]=null;BOXS[bx].open=1;}
 else{it.state='return';if(h.moved>20*S)SFX.miss();}
}
function onUp(e){if(e.pointerId!==activeId)return;e.preventDefault();release(true);}
function onCancel(e){if(e.pointerId!==activeId)return;release(false);}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',onCancel);
cv.addEventListener('lostpointercapture',e=>{if(e.pointerId===activeId)release(true);});
for(const ev of['contextmenu','gesturestart','gesturechange','dblclick','selectstart'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
document.addEventListener('touchend',()=>ensureAudio(),{passive:true});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
function newTown(){
 const img=document.createElement('canvas');img.width=townC.width;img.height=townC.height;img.getContext('2d').drawImage(townC,0,0);
 initGame();rollAway={t0:now,img};lastInput=now;
}

/* ===================== ループ ===================== */
let cost=0,costMax=0,running=true,lastTs=0,frameN=0,raf=0,resizeT=0;
function frame(ts){
 raf=0;if(!running)return;
 const dt=lastTs?Math.min(.05,Math.max(0,(ts-lastTs)/1000)):.016;lastTs=ts;now+=dt;frameN++;
 const c0=performance.now();try{update(dt);render();}catch(err){console.warn(err);}cost=cost*.95+(performance.now()-c0)*.05;if(performance.now()-c0>costMax)costMax=performance.now()-c0;
 raf=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){running=false;if(raf){cancelAnimationFrame(raf);raf=0;}if(held)release(false);try{AC&&AC.suspend();}catch(_){}}
 else{if(!running){running=true;lastTs=0;try{AC&&AC.resume();}catch(_){}if(!raf)raf=requestAnimationFrame(frame);}}
});
window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(held)release(false);layout();},60);});
window.addEventListener('orientationchange',()=>{setTimeout(()=>{if(held)release(false);layout();},200);});
mkPatterns();G=newState();layout();initGame();
raf=requestAnimationFrame(frame);
// 検証用（ゲームの動作には使わない）
window.__ZZ={get G(){return G;},get L(){return L;},get held(){return held;},get people(){return PEOPLE;},get parts(){return PARTS.length;},get frames(){return frameN;},
 get now(){return now;},slot:t=>{const s=SLOTS.find(x=>x&&x.type===t);return s?[s.x,s.y]:null;},box:i=>[colX(i),L.boxY+L.bh*.3],node:n=>GEO.nodes[n],suggest,
 bpos:b=>bPos(b),get boxes(){return BOXS;},get demo(){return demo;},get audio(){return AC?AC.state:'none';},get cost(){return cost;},get costMax(){return costMax;},resetMax(){costMax=0;},get btn(){return L.btn;}};
</script>

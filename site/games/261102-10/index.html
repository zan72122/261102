<!doctype html>
<html lang="ja">
<head>

<title>ちりん、どん！</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;background:#000}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>

<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(() => {
'use strict';
// ============================================================
//  ちりん、どん！しろくろペンギンの音のおかたづけ劇場
//  sticker_place / geo_mono : 黒地に白い線だけ
// ============================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const saEl = document.getElementById('sa');

const COLS = 7, ROWS = 5, SH = 1.8;          // 床グリッドと棚の高さ（セル単位）
const KINDS = ['cup', 'book', 'ball'];
const BASE = { cup: 7, book: 4, ball: 1 };    // 物ごとの音高（ペンタトニック番号）
const PENTA = [];
(() => { const deg = [0, 2, 4, 7, 9]; for (let o = 0; o < 3; o++) for (const d of deg) PENTA.push(196 * Math.pow(2, (d + 12 * o) / 12)); })();
const MAXP = 90;                              // 粒子上限
const STORE_KEY = 'gf261102-10-song';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - (1 - t) * (1 - t);
const TAU = Math.PI * 2;

// ============================================================
//  レイアウト
// ============================================================
const L = { W: 0, H: 0, dpr: 1, cell: 50, ox: 0, oy: 0, R: 40, P: 100, st: {}, peng: { x: 0, y: 0 }, tray: {} };
function readInsets() {
  try {
    const cs = getComputedStyle(saEl);
    return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  } catch (e) { return { t: 0, r: 0, b: 0, l: 0 }; }
}
function doLayout() {
  const W = Math.max(200, window.innerWidth), H = Math.max(200, window.innerHeight);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  L.W = W; L.H = H; L.dpr = dpr;
  const ins = readInsets(); const pad = 10;
  const ax = ins.l + pad, ay = ins.t + pad, aw = W - ins.l - ins.r - 2 * pad, ah = H - ins.t - ins.b - 2 * pad;
  L.area = { x: ax, y: ay, w: aw, h: ah };
  const wW = COLS + 0.2, wH = SH + ROWS + 0.2;
  L.portrait = aw / ah < 1.05;
  if (L.portrait) {
    const minTray = Math.max(150, ah * 0.26);
    const cell = Math.min(aw / wW, (ah - minTray) / wH);
    L.cell = cell; L.ox = ax + (aw - COLS * cell) / 2;
    const spare = Math.max(0, ah - minTray - wH * cell);
    L.oy = ay + 0.1 * cell + spare * 0.3;
    const ty = L.oy + (SH + ROWS) * cell + 0.1 * cell;
    L.tray = { x: ax, y: ty, w: aw, h: ay + ah - ty };
    L.R = clamp(Math.min(L.tray.h * 0.26, aw * 0.12, cell * 1.0), 30, 66);
    const cy = L.tray.y + L.tray.h * 0.5;
    L.st = { bell: { x: ax + aw * 0.17, y: cy }, drum: { x: ax + aw * 0.45, y: cy } };
    L.P = clamp(Math.min(L.tray.h * 0.6, aw * 0.3), 70, 200);
    L.peng = { x: ax + aw * 0.79, y: cy + L.P * 0.04 };
  } else {
    const trayW = clamp(aw * 0.26, 200, 360);
    const cell = Math.min((aw - trayW) / wW, ah / wH);
    L.cell = cell;
    L.oy = ay + (ah - (SH + ROWS) * cell) / 2;
    L.ox = ax + ((aw - trayW) - COLS * cell) / 2;
    const tx = L.ox + COLS * cell + 0.15 * cell;
    L.tray = { x: tx, y: ay, w: ax + aw - tx, h: ah };
    L.R = clamp(Math.min(L.tray.w * 0.2, ah * 0.1, cell * 0.8), 30, 66);
    const cx = L.tray.x + L.tray.w * 0.5;
    L.P = clamp(Math.min(L.tray.w * 0.55, ah * 0.3), 70, 220);
    L.peng = { x: cx, y: ay + ah * 0.28 };
    const dx = Math.max(L.R * 1.2, L.tray.w * 0.25);
    L.st = { bell: { x: cx - dx, y: ay + ah * 0.68 }, drum: { x: cx + dx, y: ay + ah * 0.68 } };
  }
  // 縦画面では最初の一枚を中央で差し出し、貼った後は手前に補充する。
  if (L.portrait && !S.stickerPlaced) L.st.bell = { x: ax + aw * 0.5, y: ay + ah * 0.5 };
}
const X = x => L.ox + x * L.cell;
const Y = y => L.oy + y * L.cell;
const cellX = c => c + 0.5;
const cellY = r => SH + r + 0.5;
const SLOT_Y = 1.13, NOTE_Y = 0.42, BOARD_Y = 1.45;

// ============================================================
//  盤面テンプレート（散らかり方）
// ============================================================
const key = (r, c) => r * COLS + c;
const rcOf = k => [Math.floor(k / COLS), k % COLS];
const ekey = (a, b) => a < b ? a + '_' + b : b + '_' + a;
let walls = new Set(), steps = new Set(), stepList = [];

function tplA() { // 右の門：本が近道をふさぎ、右の回り道の角に段差
  return {
    walls: [[1, 0], [1, 1], [1, 2], [1, 3], [1, 4]],
    steps: [[[2, 6], [1, 6]]],
    slots: { cup: 1, book: 3, ball: 5 },
    starts: { book: [2, 5], ball: [Math.random() < 0.5 ? 3 : 4, 5], cup: [0, 4] }
  };
}
function tplB() { // 三つの門：まん中の近道を本がふさぐ。左門に段差、右門は広さが変わる
  const wide = Math.random() < 0.5;
  const w = [[1, 0], [1, 2], [1, 4]]; if (!wide) w.push([1, 6]);
  return {
    walls: w,
    steps: [[[2, 1], [1, 1]]],
    slots: { book: 1, ball: 3, cup: 5 },
    starts: { book: [2, 3], ball: [Math.random() < 0.5 ? 3 : 4, 3], cup: [0, 2] }
  };
}
function mirrorTpl(t) {
  const m = c => COLS - 1 - c;
  const o = { walls: t.walls.map(([r, c]) => [r, m(c)]), steps: t.steps.map(([a, b]) => [[a[0], m(a[1])], [b[0], m(b[1])]]), slots: {}, starts: {} };
  for (const k of KINDS) { o.slots[k] = m(t.slots[k]); o.starts[k] = [t.starts[k][0], m(t.starts[k][1])]; }
  return o;
}
function makeTpl(round) {
  const seq = [[tplA, false], [tplB, false], [tplA, true], [tplB, true]];
  let s = round < seq.length ? seq[round] : [Math.random() < 0.5 ? tplA : tplB, Math.random() < 0.5];
  const t = s[0]();
  return s[1] ? mirrorTpl(t) : t;
}

// ============================================================
//  状態
// ============================================================
const S = {
  t: 0, phase: 'play', round: 0, selected: null, selTime: -9, drag: null, activeId: null,
  parts: [], flyers: [], arrivals: [], lastInput: 0, demo: null, demoShown: false, demoKeys: {},
  star: null, starAt: -1, combo: 0, lastRingT: -9, totalSteps: 0, press: { bell: -9, drum: -9 },
  stageK: 0, concert: null, memory: null, memMode: 'mem', replay: null, resetT: 0, everTouched: false,
  firstInputT: -1, stickerPlaced: false
};
const peng = { look: 0, tilt: 0, stompT: 9, stompSide: 1, stompAmp: 0.4, hopT: 9, pointT: -9, pointX: 0, pointY: 0, danceT: 9, danceKind: 0, danceDir: 1, wobT: 9, beatT: 9 };
const objs = KINDS.map(kind => ({
  kind, r: 0, c: 0, cell: 0, from: -1, slot: 0, x: 0, y: 0, rot: 0, inst: null, pending: 0, anim: null,
  waitT: 0, waiting: false, arrived: false, entering: false, hist: [], steps: 0, wigT: 9, bumpT: 9, bumpDx: 0, bumpDy: 0,
  stuck: null, badgeT: 9, lastT: -9, landT: 9, noteBounceT: 9, swapT: 9
}));

// ============================================================
//  保存（端末内のみ・失敗してもメモリで継続）
// ============================================================
function validSong(v) {
  if (!v || typeof v !== 'object' || v.v !== 1 || !Array.isArray(v.n)) return null;
  if (v.n.length < 1 || v.n.length > 24) return null;
  const out = [];
  for (const e of v.n) {
    if (!Array.isArray(e) || e.length !== 2) return null;
    const p = e[0], i = e[1];
    if (!Number.isInteger(p) || p < 0 || p >= PENTA.length) return null;
    if (i !== 0 && i !== 1) return null;
    out.push([p, i]);
  }
  return out;
}
function loadSong() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (!raw || raw.length > 2000) { S.memMode = raw ? 'bad' : 'empty'; return null; }
    let parsed = null; try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    const v = validSong(parsed);
    S.memMode = v ? 'ok' : 'bad';
    return v;
  } catch (e) { S.memMode = 'blocked'; return null; }
}
function saveSong(notes) {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, n: notes })); S.memMode = 'saved'; }
  catch (e) { S.memMode = 'memory'; }
}

// ============================================================
//  音（Web Audio 合成）
// ============================================================
let AC = null, master = null, noiseBuf = null;
function ensureAudio() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      master = AC.createGain(); master.gain.value = 0.7;
      master.connect(comp); comp.connect(AC.destination);
      const len = Math.floor(AC.sampleRate * 0.3);
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') { const p = AC.resume(); if (p && p.catch) p.catch(() => {}); }
  } catch (e) { AC = null; }
}
function aOK() { return AC && master && AC.state !== 'closed'; }
function tone(f, t0, dur, type, gain, attack, fEnd) {
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t0 + dur * 0.8);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + (attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function noise(t0, dur, gain, freq, q) {
  try {
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = AC.createGain();
    g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const pf = p => PENTA[clamp(p | 0, 0, PENTA.length - 1)];
function sBell(p, delay, vol) {
  if (!aOK()) return; const t = AC.currentTime + (delay || 0); const f = pf(p) * 2; const v = vol || 1;
  tone(f, t, 1.6, 'sine', 0.22 * v, 0.004);
  tone(f * 2.76, t, 0.7, 'sine', 0.06 * v, 0.003);
  tone(f * 5.4, t, 0.3, 'sine', 0.035 * v, 0.002);
  noise(t + 0.02, 0.18, 0.012 * v, 6000, 2);       // すべりのしゃらっ
}
function sDrum(p, delay, vol) {
  if (!aOK()) return; const t = AC.currentTime + (delay || 0); const v = vol || 1;
  const f = 70 + p * 7;
  tone(f * 2.2, t, 0.35, 'sine', 0.55 * v, 0.003, f);
  noise(t, 0.07, 0.18 * v, 900, 1.2);
  tone(pf(p), t + 0.01, 0.18, 'triangle', 0.05 * v, 0.004);
}
function sInst(inst, p, delay, vol) { if (inst === 'drum') sDrum(p, delay, vol); else sBell(p, delay, vol); }
function sChord(p, big) { // 到着：通常操作音と違う、きらっとした和音
  if (!aOK()) return; const t = AC.currentTime; const f = pf(p) * 2;
  const r = [1, 1.25, 1.5, 2];
  r.forEach((m, i) => { tone(f * m, t + i * 0.05, big ? 1.4 : 0.9, 'triangle', big ? 0.12 : 0.09, 0.01); });
  tone(f * 4, t + 0.2, 0.5, 'sine', 0.05, 0.005);
  if (big) tone(f * 6, t + 0.3, 0.6, 'sine', 0.04, 0.005);
}
function sBump() { if (!aOK()) return; const t = AC.currentTime; tone(210, t, 0.16, 'sine', 0.12, 0.005, 140); }
function sTick() { if (!aOK()) return; const t = AC.currentTime; tone(1300, t, 0.05, 'triangle', 0.05, 0.002); }
function sPick() { if (!aOK()) return; const t = AC.currentTime; tone(520, t, 0.09, 'sine', 0.12, 0.003, 980); }
function sTwinkle() { if (!aOK()) return; const t = AC.currentTime; [0, 0.07, 0.14].forEach((d, i) => tone(1568 * (1 + i * 0.25), t + d, 0.3, 'sine', 0.05, 0.003)); }
function sWhoosh() { if (!aOK()) return; const t = AC.currentTime; noise(t, 0.5, 0.05, 1500, 0.7); }

// ============================================================
//  粒子
// ============================================================
function addRing(x, y, r0, r1, life, w) { if (S.parts.length >= MAXP) S.parts.shift(); S.parts.push({ k: 0, x, y, r0, r1, life, t: 0, w: w || 2 }); }
function addDots(x, y, n, spd, life) {
  for (let i = 0; i < n; i++) {
    if (S.parts.length >= MAXP) S.parts.shift();
    const a = Math.random() * TAU, s = spd * (0.5 + Math.random() * 0.7);
    S.parts.push({ k: 1, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.7 + Math.random() * 0.5), t: 0 });
  }
}
function addStarP(x, y) { if (S.parts.length >= MAXP) S.parts.shift(); S.parts.push({ k: 2, x, y, vx: (Math.random() - .5) * 60, vy: -40 - Math.random() * 40, life: 0.9, t: 0, rot: Math.random() * TAU }); }

// ============================================================
//  盤面ロジック
// ============================================================
const inb = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;
const isFree = (r, c) => inb(r, c) && !walls.has(key(r, c));
function occAt(k, except) {
  for (const o of objs) {
    if (o === except || o.arrived) continue;
    if (o.cell === k || o.from === k) return o;
  }
  return null;
}
// 楽器ごとの経路：他の物はなるべく避け、段差もなるべく避ける（鈴は段差を越えられない）
function findPath(o, instOverride) {
  const inst = instOverride !== undefined ? instOverride : o.inst;
  if (o.arrived || o.cell < 0) return null;
  const N = ROWS * COLS, goal = key(0, o.slot);
  const dist = new Array(N).fill(Infinity), prev = new Array(N).fill(-1), jmp = new Array(N).fill(0), done = new Array(N).fill(false);
  dist[o.cell] = 0;
  for (let it = 0; it < N; it++) {
    let u = -1, best = Infinity;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0 || u === goal) break;
    done[u] = true;
    const [r, c] = rcOf(u);
    for (const [dr, dc] of [[-1, 0], [0, -1], [0, 1], [1, 0]]) {
      const nr = r + dr, nc = c + dc;
      if (!isFree(nr, nc)) continue;
      const v = key(nr, nc);
      let cost = 1;
      const oc = occAt(v, o);
      if (oc) cost += (inst && oc.inst === inst) ? 0.6 : 30;
      if (inst !== 'drum' && steps.has(ekey(u, v))) cost += 20;
      if (dist[u] + cost < dist[v]) { dist[v] = dist[u] + cost; prev[v] = u; jmp[v] = 0; }
      if (inst === 'drum' && oc) {
        const lr = r + 2 * dr, lc = c + 2 * dc;
        if (isFree(lr, lc)) {
          const lk = key(lr, lc);
          const lo = occAt(lk, o);
          const lcost = 1.2 + (lo ? 30 : 0);
          if (dist[u] + lcost < dist[lk]) { dist[lk] = dist[u] + lcost; prev[lk] = u; jmp[lk] = 1; }
        }
      }
    }
  }
  if (dist[goal] === Infinity) return null;
  const path = [];
  let k = goal;
  while (k !== o.cell && k >= 0) { path.push({ to: k, jump: !!jmp[k] }); k = prev[k]; }
  path.reverse();
  return path;
}
function remaining(o) { const p = findPath(o); return p ? p.length : 99; }

function stepDur(type) { return type === 'jump' ? 0.5 : type === 'hop' ? 0.4 : type === 'enter' ? 0.55 : 0.34; }
function startAnim(o, type, tx, ty, dur, extra) {
  o.anim = Object.assign({ type, fx: o.x, fy: o.y, tx, ty, t: 0, dur: dur || stepDur(type) }, extra || {});
}
function tryStep(o, dt) {
  if (o.cell === key(0, o.slot)) { // 棚へ入る
    o.from = o.cell; o.cell = -1; o.entering = true;
    o.pending = 0; o.hist.push(o.inst); o.steps++; S.totalSteps++;
    startAnim(o, 'enter', cellX(o.slot), SLOT_Y, 0.55, { inst: o.inst });
    o.stuck = null; o.waiting = false; o.waitT = 0;
    return;
  }
  const path = findPath(o);
  if (!path || !path.length) { bump(o, null); o.pending = 0; return; }
  let m = path[0];
  const [r, c] = rcOf(o.cell);
  if (o.inst !== 'drum' && !m.jump && steps.has(ekey(o.cell, m.to))) {
    const [tr, tc] = rcOf(m.to);
    bump(o, { type: 'step', x: (c + tc) / 2 + 0.5, y: SH + (r + tr) / 2 + 0.5, dx: tc - c, dy: tr - r });
    o.pending = 0; return;
  }
  if (m.jump) { // 跳び越す相手がもういなければ一歩だけ跳ねる
    const [tr, tc] = rcOf(m.to); const mr = (r + tr) / 2, mc = (c + tc) / 2; const mk = key(mr, mc);
    if (!occAt(mk, o)) m = { to: mk, jump: false };
  }
  let oc = occAt(m.to, o);
  if (oc && o.inst === 'drum' && !m.jump) { // 太鼓：前にいる物を跳び越せるなら跳ぶ
    const [tr, tc] = rcOf(m.to); const lr = 2 * tr - r, lc = 2 * tc - c;
    if (isFree(lr, lc) && !occAt(key(lr, lc), o)) { m = { to: key(lr, lc), jump: true }; oc = null; }
  }
  if (oc) { // 順番待ち（接触する前に止まって待つ）
    o.waiting = true; o.waitT += dt;
    if (o.waitT > 1.6) {
      const [tr, tc] = rcOf(m.to);
      bump(o, { type: 'obj', x: cellX(tc), y: cellY(tr), dx: tc - c, dy: tr - r, by: oc });
      o.pending = 0; o.waitT = 0; o.waiting = false;
    }
    return;
  }
  const [tr, tc] = rcOf(m.to);
  const type = o.inst === 'drum' ? (m.jump ? 'jump' : 'hop') : (o.kind === 'ball' ? 'roll' : 'slide');
  o.from = o.cell; o.cell = m.to;
  startAnim(o, type, cellX(tc), cellY(tr));
  o.pending--; o.steps++; S.totalSteps++; o.hist.push(o.inst);
  o.waitT = 0; o.waiting = false; o.stuck = null;
  o.dirX = Math.sign(tc - c); o.dirY = Math.sign(tr - r);
}
function bump(o, info) {
  o.bumpT = 0; o.bumpDx = info ? info.dx : 0; o.bumpDy = info ? info.dy : -1;
  sBump();
  if (info) {
    o.stuck = Object.assign({ t: S.t }, info);
    peng.pointT = S.t; peng.pointX = X(info.x); peng.pointY = Y(info.y);
  }
}

function pitchOf(o) { return BASE[o.kind] + Math.min(o.steps, 5); }
function ring(inst, src) {
  const members = objs.filter(o => !o.arrived && !o.entering && o.inst === inst);
  if (!members.length) return;
  const now = S.t;
  S.combo = (now - S.lastRingT < 1.3) ? S.combo + 1 : 0; S.lastRingT = now;
  members.forEach((o, i) => {
    o.pending = Math.min(o.pending + 1, 3);
    o.badgeT = 0; o.lastT = now;
    if (o.stuck && o.stuck.type === 'step' && inst === 'drum') o.stuck = null;

  drawParts();
  drawDragSticker();
  // 貼る瞬間の飛ぶシール
  for (const f of S.flyers) { const e = easeOut(f.t); const tx = X(f.o.x) + 0.27 * L.cell, ty = Y(f.o.y) - 0.27 * L.cell; ctx.globalAlpha = 1 - f.t * 0.5; drawSticker(f.inst, lerp(f.fx, tx, e), lerp(f.fy, ty, e) - Math.sin(e * Math.PI) * 30, lerp(L.R, 0.17 * L.cell, e)); ctx.globalAlpha = 1; }
  drawDemo();
}

// ============================================================
//  ループ（requestAnimationFrameのみ・非表示で停止）
// ============================================================
let raf = 0, lastT = 0, running = false;
function frame(ts) {
  raf = 0;
  if (!running) return;
  let dt = lastT ? (ts - lastT) / 1000 : 0.016;
  lastT = ts;
  dt = clamp(dt, 0, 0.05);                     // 復帰時も飛ばない
  // 動き中の物にさらに細かい刻みで追従
  update(dt);
  render();
  raf = requestAnimationFrame(frame);
}
function start() { if (running) return; running = true; lastT = 0; if (!raf) raf = requestAnimationFrame(frame); }
function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stop(); S.activeId = null; if (S.drag) { S.drag = null; S.selected = null; }
    try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {}
  } else {
    S.lastInput = S.t;
    try { if (AC && AC.state === 'suspended') AC.resume().catch(() => {}); } catch (e) {}
    start();
  }
});
window.addEventListener('resize', doLayout);
window.addEventListener('orientationchange', () => setTimeout(doLayout, 120));

doLayout();
S.memory = loadSong();
setupRound(false);
start();

// 検証用の読み取り口（ゲームの動作には使わない）
window.__g = { S, objs, L, peng, getHint, findPath, setupRound, X, Y, key, rcOf, walls: () => walls, steps: () => steps, validSong };
})();
</script>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>するする</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none;background:#000;outline:none}
#sa{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(() => {
'use strict';
/* ===================== basics ===================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const saEl = document.getElementById('sa');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const sstep = (a, b, x) => ease((x - a) / (b - a));

let W = 0, H = 0, DPR = 1;
const SA = { t: 0, b: 0, l: 0, r: 0 };
const VIEW_BOTTOM = 1000, GROUND = 930, LMAX = 345;
const ZOOM_TOP = -720;
const cam = { yTop: 0, yTopT: 0, scale: 1, base: 1, g: 1, cx: 0 };

function viewH() { return Math.max(100, H - SA.t - SA.b - 8); }
function scaleFor(yTop) { return Math.min(viewH() / (VIEW_BOTTOM - yTop), (W - SA.l - SA.r) / 420); }
function updCam() {
  cam.scale = scaleFor(cam.yTop);
  cam.base = scaleFor(0);
  cam.g = clamp(cam.base / cam.scale, 1, 1.6);
  cam.cx = SA.l + (W - SA.l - SA.r) / 2;
}
function oy() { return SA.t + 4 + (viewH() - (VIEW_BOTTOM - cam.yTop) * cam.scale); }
function w2s(x, y) { return [cam.cx + x * cam.scale, oy() + (y - cam.yTop) * cam.scale]; }
function s2w(sx, sy) { return [(sx - cam.cx) / cam.scale, (sy - oy()) / cam.scale + cam.yTop]; }
function halfW() { return (W - SA.l - SA.r) / 2 / cam.scale; }
function halfWFor(yTop) { return (W - SA.l - SA.r) / 2 / scaleFor(yTop); }
// ground cluster magnification (keeps loops large after the sky opens)
function gx(x) { return x * cam.g; }
function gy(y) { return GROUND - (GROUND - y) * cam.g; }

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const r = saEl.getBoundingClientRect();
  SA.t = r.top || 0; SA.l = r.left || 0; SA.b = Math.max(0, H - (r.bottom || H)); SA.r = Math.max(0, W - (r.right || W));
  updCam();
}

/* ===================== audio (Web Audio synth) ===================== */
let AC = null, master = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  try {
    AC = new C();
    master = AC.createGain(); master.gain.value = 0.5;
    const comp = AC.createDynamicsCompressor();
    master.connect(comp); comp.connect(AC.destination);
    const b = AC.createBuffer(1, 1, 22050); const s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0);
    if (AC.state === 'suspended') AC.resume().catch(() => {});
  } catch (e) { AC = null; }
}
let voices = 0;
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || AC.state !== 'running' || voices > 24) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur * 0.7);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  voices++; o.onended = () => { voices--; };
}
function bell(f, vol, delay, dur) {
  dur = dur || 1.1;
  tone(f, f, dur, 'sine', vol, delay); tone(f * 2.005, f * 2.005, dur * 0.55, 'sine', vol * 0.3, delay); tone(f * 3.01, f * 3.01, dur * 0.25, 'sine', vol * 0.12, delay);
}
function tremble(vol) {
  if (!AC || AC.state !== 'running' || voices > 22) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), mod = AC.createGain(), env = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.2);
  mod.gain.value = 0.5; l.frequency.value = 34; lg.gain.value = 0.45; l.connect(lg); lg.connect(mod.gain);
  env.gain.setValueAtTime(0.0001, t); env.gain.exponentialRampToValueAtTime(vol, t + 0.01); env.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
  o.connect(mod); mod.connect(env); env.connect(master);
  o.start(t); l.start(t); o.stop(t + 0.27); l.stop(t + 0.27);
  voices++; o.onended = () => { voices--; };
}
const SND = {
  press() { tone(260, 200, 0.08, 'sine', 0.12); },
  release() { tone(330, 520, 0.12, 'sine', 0.09); },
  tick(p) { const f = 520 + p * 380 + rnd(-15, 15); tone(f * 1.45, f, 0.09, 'sine', 0.1); },
  pop() { tone(900, 1500, 0.13, 'triangle', 0.09); tone(1800, 1800, 0.06, 'sine', 0.04, 0.03); },
  slack(p) { tone(420 - p * 120, 250 - p * 60, 0.15, 'sine', 0.05); },
  star() { bell(1046.5, 0.16, 0); bell(1568, 0.11, 0.09); bell(2093, 0.06, 0.18, 0.9); },
  reach() { tone(700, 760, 0.12, 'sine', 0.04); },
  ballIn() { tone(300, 620, 0.16, 'sine', 0.12); },
  clink() { tone(1760, 1760, 0.09, 'sine', 0.05); },
  moon() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => bell(f, 0.12, i * 0.12, 1.4)); },
  catch() { bell(1318.5, 0.14, 0); bell(1975.5, 0.08, 0.1); },
  bow() { tone(392, 392, 0.25, 'sine', 0.08); tone(523, 523, 0.3, 'sine', 0.08, 0.18); },
  close() { [784, 988, 1175, 1568].forEach((f, i) => bell(f, 0.12, i * 0.07, 1.2)); },
  lap() { [659, 784, 988, 1175, 1318, 1568].forEach((f, i) => bell(f, 0.09, i * 0.06, 0.6)); },
  land() { tone(180, 80, 0.22, 'sine', 0.16); },
  wiggle() { tone(700, 640, 0.05, 'sine', 0.035); },
  retangle() { [1318, 1046, 784, 659, 523].forEach((f, i) => tone(f, f * 0.98, 0.18, 'sine', 0.07, i * 0.08)); }
};

/* ===================== world objects ===================== */
const KNOT = { x: -85, y: 905 };
const LOOP_BASE = [{ x: -170, r: 40 }, { x: 25, r: 58 }, { x: 165, r: 40 }];
const loops = LOOP_BASE.map((b, i) => ({ i, bx: b.x, r: b.r, ox: 0, oy: 0, vx: 0, vy: 0, tx: 0, ty: 0, press: 0, unw: 0, wig: 0, hop: 0 }));
let stars = [];
const moon = { x: -35, y: 110, r: 38, wig: 0, reached: false, pop: 1, glow: 0 };
let crossings = [];
let bgDots = [];
const kite1 = mkKite(1), kite2 = mkKite(2);

function mkKite(type) {
  const k = { type, x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, rot: 0, rv: 0, yaw: 0, bow: 0, bowT: -1, hes: 0, jig: 0, wig: 0, vis: 0, tail: [] };
  for (let i = 0; i < 5; i++) k.tail.push({ x: 0, y: 0, px: 0, py: 0 });
  return k;
}
function resetTail(k) { for (const p of k.tail) { p.x = p.px = k.x; p.y = p.py = k.y + 20; } }

const BASE_STARS = [
  { id: 'L1', row: 1, x: -200, y: 640 }, { id: 'M1', row: 1, x: -80, y: 590 }, { id: 'R1', row: 1, x: 70, y: 625 },
  { id: 'L2', row: 2, x: -165, y: 330 }, { id: 'R2', row: 2, x: 95, y: 300 }
];
function G0() { return { x: KNOT.x, y: KNOT.y - 30 }; }
function validLayout(st, mn) {
  const G = G0(), M = LMAX - 18;
  const r1 = st.filter(s => s.row === 1), r2 = st.filter(s => s.row === 2);
  for (let i = 0; i < st.length; i++) {
    if (Math.abs(st[i].x) > 200) return false;
    for (let j = i + 1; j < st.length; j++) if (dist(st[i].x, st[i].y, st[j].x, st[j].y) < 95) return false;
  }
  for (const s of r1) {
    if (dist(G.x, G.y, s.x, s.y) > M) return false;
    if (!r2.some(t => dist(s.x, s.y, t.x, t.y) < M)) return false;
  }
  for (const s of r2) if (dist(s.x, s.y, mn.x, mn.y) - (mn.r + 16) > M) return false;
  if (dist(r2[0].x, r2[0].y, r2[1].x, r2[1].y) > M) return false;
  return true;
}
function genRound() {
  let st = null, mn = null;
  for (let tries = 0; tries < 120; tries++) {
    const s = BASE_STARS.map(b => ({ id: b.id, row: b.row, x: b.x + rnd(-22, 22), y: b.y + rnd(-20, 20) }));
    const m = { x: -35 + rnd(-60, 60), y: 110 + rnd(-14, 14), r: 38 };
    if (validLayout(s, m)) { st = s; mn = m; break; }
  }
  if (!st) { st = BASE_STARS.map(b => ({ id: b.id, row: b.row, x: b.x, y: b.y })); mn = { x: -35, y: 110, r: 38 }; }
  stars = st.map(s => Object.assign(s, { r: 22, hooked: false, wig: 0, spin: 0, pop: 0, tw: rnd(0, TAU), glow: 0 }));
  moon.x = mn.x; moon.y = mn.y; moon.r = mn.r; moon.reached = false; moon.pop = 0; moon.glow = 0; moon.wig = 0;
  // loops overlap & size vary a little
  loops.forEach((l, i) => { l.bx = LOOP_BASE[i].x + rnd(-8, 8); l.r = LOOP_BASE[i].r + rnd(-3, 4); l.unw = 0; });
  // crossings in the knot
  crossings = [];
  const thr = [[6, 62, 135], [6, 48, 105, 175], [6, 62, 135]];
  for (let i = 0; i < 3; i++) {
    thr[i].forEach((t, j) => {
      const side = i === 0 ? -1 : i === 2 ? 1 : 0.35;
      crossings.push({ loop: i, thr: t + rnd(-3, 3), ox: side * rnd(4, 26) + rnd(-8, 8), oy: -rnd(4, 34), rx: rnd(12, 18), ry: rnd(7, 11), rot: rnd(0, Math.PI), out: 0, popped: false, grow: 0 });
    });
  }
  bgDots = [];
  for (let i = 0; i < 46; i++) bgDots.push({ x: rnd(-700, 700), y: rnd(-700, -30), s: rnd(1, 2.2), tw: rnd(0, TAU) });
}

/* ===================== game state ===================== */
const S = {
  phase: 'PRE', t: 0, idle: 0, anyInput: false, firstDemoDone: false, kiteDemoDone: false,
  R: 0, T: 1, lastLoop: 1, theta: 0, thetaT: 0, targetObj: null,
  anchors: [], hook: null, ball: null, pulses: [], unwindRate: 0, tickAcc: 0, slackAcc: 0, pulseAcc: 0,
  mt: 0, P1: null, P2: null, k2from: null, spacing: 0, tail: 0, closeT: 0,
  tri: null, laps: 0, landed: [false, false], rt: 0, demo: null, flash: 0, triHint: 1, stats: {}
};
const stat = k => { S.stats[k] = (S.stats[k] || 0) + 1; };

function newRound(first) {
  genRound();
  S.phase = 'PRE'; S.R = 0; S.T = 1; S.theta = rnd(-0.08, 0.08); S.thetaT = S.theta; S.targetObj = null;
  S.anchors = []; S.hook = null; S.ball = null; S.pulses = []; S.tail = 0; S.tri = null; S.laps = 0; S.landed = [false, false];
  S.P1 = S.P2 = null; S.flash = 0;
  cam.yTopT = 0;
  if (first) {
    stars.forEach(s => s.pop = 1); moon.pop = 1;
    kite1.x = gx(KNOT.x); kite1.y = gy(KNOT.y - 30); kite1.vis = 1; resetTail(kite1);
    kite2.vis = 0;
  }
}

/* ===================== geometry helpers ===================== */
function Gpt() { return { x: gx(KNOT.x), y: gy(KNOT.y - 30) }; }
function pathPts() { const p = [Gpt()]; for (const a of S.anchors) p.push(a); return p; }
function polyLen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += dist(p[i - 1].x, p[i - 1].y, p[i].x, p[i].y); return L; }
function lastAnchor() { return S.anchors.length ? S.anchors[S.anchors.length - 1] : Gpt(); }
function angFrom(A, x, y) { return Math.atan2(x - A.x, -(y - A.y)); }
function segPoint(p, s) { // point along polyline at distance s
  for (let i = 1; i < p.length; i++) {
    const L = dist(p[i - 1].x, p[i - 1].y, p[i].x, p[i].y);
    if (s <= L || i === p.length - 1) { const u = L > 0 ? clamp(s / L, 0, 1) : 0; return { x: lerp(p[i - 1].x, p[i].x, u), y: lerp(p[i - 1].y, p[i].y, u), i, u, L, ex: L ? (p[i].x - p[i - 1].x) / L : 1, ey: L ? (p[i].y - p[i - 1].y) / L : 0 }; }
    s -= L;
  }
  return { x: p[0].x, y: p[0].y, i: 1, u: 0, L: 0, ex: 1, ey: 0 };
}
function kiteFree() { return S.R - polyLen(pathPts()); }

/* choose where a loop sends the kite (with snapping assist) */
function pickTarget(li) {
  const A = lastAnchor();
  const cands = [];
  for (const s of stars) {
    if (s.hooked || s === S.hook?.star) continue;
    const d = dist(A.x, A.y, s.x, s.y); if (d < 40) continue;
    const a = angFrom(A, s.x, s.y); if (Math.abs(a) > 1.5) continue;
    cands.push({ obj: s, a, d });
  }
  if (S.anchors.length) {
    const d = dist(A.x, A.y, moon.x, moon.y), a = angFrom(A, moon.x, moon.y);
    if (Math.abs(a) < 1.3) cands.push({ obj: moon, a, d: d - moon.r - 10 });
  }
  const inCat = c => li === 0 ? c.a < -0.12 : li === 2 ? c.a > 0.12 : Math.abs(c.a) <= 0.5;
  let pool = cands.filter(c => inCat(c) && c.d <= LMAX + 6);
  const reach = pool.length > 0;
  if (!reach) pool = cands.filter(inCat);
  if (!pool.length) return { a: li === 0 ? -0.7 : li === 2 ? 0.7 : 0, obj: null, reach: false };
  pool.sort((p, q) => {
    const sp = (p.obj === moon ? -1000 : 0) + (li === 1 ? Math.abs(p.a) * 300 : 0) + p.d;
    const sq = (q.obj === moon ? -1000 : 0) + (li === 1 ? Math.abs(q.a) * 300 : 0) + q.d;
    return sp - sq;
  });
  return { a: pool[0].a, obj: pool[0].obj, reach };
}

/* ===================== particles ===================== */
const P = [], PMAX = 120;
function burst(x, y, n, spd, life) {
  for (let i = 0; i < n && P.length < PMAX; i++) {
    const a = rnd(0, TAU), v = rnd(0.3, 1) * spd;
    P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life || rnd(0.4, 0.8), age: 0, sh: (Math.random() * 3) | 0, sz: rnd(2.2, 4.5), rot: rnd(0, TAU) });
  }
}
function updParticles(dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.age += dt; if (p.age >= p.life) { P.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-2.5 * dt); p.vy = p.vy * Math.exp(-2.5 * dt) + 60 * dt; p.rot += dt * 4;
  }
}

/* ===================== pulses (tension tremble travelling on the line) ===================== */
function emitPulse(e, li) {
  const last = S.pulses[S.pulses.length - 1];
  if (last && last.s < 70) { last.e += e; last.amp = Math.min(9, last.amp + e * 0.03); last.li = li; return; }
  if (S.pulses.length >= 7) S.pulses.shift();
  S.pulses.push({ s: 0, e, amp: Math.min(9, 3 + e * 0.03), li });
}
function pulsePath() {
  const p = pathPts();
  let ballS = -1;
  if (S.phase === 'TRI' && S.tri) {
    const base = polyLen(p), Sv = S.tri.S;
    const order = S.tri.dir > 0 ? [kite1, kite2, Sv] : [kite2, kite1, Sv];
    for (const o of order) p.push({ x: o.x, y: o.y });
    if (S.ball && S.ball.mode === 'tri') { const per = triPerim(); ballS = base + (S.tri.dir > 0 ? S.ball.u : (per - S.ball.u) % per); }
    return { p, ballS };
  }
  if (S.ball && S.ball.mode === 'line' && S.anchors.length >= 2) ballS = dist(p[0].x, p[0].y, p[1].x, p[1].y) + S.ball.s;
  if (S.phase !== 'RETANGLE') p.push({ x: kite1.x, y: kite1.y });
  if ((S.phase === 'TWO' || S.phase === 'CLOSE' || (S.phase === 'MOON' && S.mt > 2.5)) && kite2.vis) p.push({ x: kite2.x, y: kite2.y });
  return { p, ballS };
}
function pulseDisp(s) {
  let d = 0;
  for (const q of S.pulses) { const x = s - q.s; if (x > -70 && x < 70) d += q.amp * Math.exp(-(x * x) / 700) * Math.sin(x * 0.28); }
  return d * clamp((S.T - 0.25) / 0.5, 0, 1);
}
function updPulses(dt) {
  if (!S.pulses.length) return;
  const { p, ballS } = pulsePath();
  const L = polyLen(p);
  for (let i = S.pulses.length - 1; i >= 0; i--) {
    const q = S.pulses[i], s0 = q.s;
    q.s += 950 * dt;
    if (ballS >= 0 && s0 < ballS && q.s >= ballS && S.T > 0.35) pushBall(q);
    if (q.s > L + 80) S.pulses.splice(i, 1);
  }
}

/* ===================== the ball ===================== */
function spawnBall() {
  const a = S.anchors, A = a[a.length - 2], B = a[a.length - 1];
  const segL = dist(A.x, A.y, B.x, B.y);
  const before = polyLen(a.slice(0, a.length - 1));
  S.ball = { mode: 'line', s: before + segL * rnd(0.3, 0.7), v: 0, scale: 0, roll: 0, u: 0, rest: false };
  SND.ballIn(); stat('ball');
}
function ballLinePos() {
  const a = S.anchors; const sp = segPoint(a, S.ball.s);
  const sag = segSag(sp.L); return { x: sp.x, y: sp.y + 4 * sag * sp.u * (1 - sp.u), ex: sp.ex, ey: sp.ey };
}
function pushBall(q) {
  const b = S.ball; if (!b) return;
  if (b.mode === 'line') {
    const sp = segPoint(S.anchors, b.s);
    const dx = q.li === 0 ? -1 : q.li === 2 ? 1 : 0, dy = q.li === 1 ? -1 : 0;
    let dot = sp.ex * dx + sp.ey * dy; if (Math.abs(dot) < 0.15) dot = q.li === 1 ? 0 : (dot >= 0 ? 0.15 : -0.15);
    b.v += Math.sign(dot) * Math.min(340, 120 + q.e * 1.6);
    b.rest = false;
  } else if (b.mode === 'tri' && S.tri) {
    S.tri.E = Math.min(720, S.tri.E + q.e * 1.7 + 60);
  }
}
function segSag(L) { return (1 - S.T) * 0.07 * L + 1.5; }
function triPts() { const t = S.tri; return [t.S, { x: kite1.x, y: kite1.y }, { x: kite2.x, y: kite2.y }, t.S]; }
function triPerim() { return polyLen(triPts()); }

function updBall(dt) {
  const b = S.ball; if (!b) return;
  b.scale = Math.min(1, b.scale + dt * 3);
  const taut = sstep(0.32, 0.75, S.T);
  if (b.mode === 'line') {
    const a = S.anchors; if (a.length < 2) return;
    const L = polyLen(a);
    const sp = segPoint(a, b.s);
    if (taut > 0.02) b.v += 300 * sp.ey * taut * dt;
    b.v *= Math.exp(-(0.9 + (1 - taut) * 9) * dt);
    if (taut < 0.05 && Math.abs(b.v) < 8) b.v = 0;
    b.s += b.v * dt; b.roll += b.v * dt / 11;
    // stars on the way are little stops
    let acc = 0;
    for (let i = 1; i < a.length; i++) {
      acc += dist(a[i - 1].x, a[i - 1].y, a[i].x, a[i].y);
      if (i < a.length - 1 && Math.abs(b.s - acc) < 3 && Math.abs(b.v) < 30) { b.v = 0; }
    }
    if (b.s <= 0) { if (b.v < -40) { SND.clink(); a[0].glow = 1; } b.s = 0; b.v = Math.max(0, -b.v * 0.2); }

    const keep = S.rtLen * (1 - ease(S.rt / 0.9));
    const rp = S.rtPath; let acc = 0;
    ctx.moveTo(rp[0].x, rp[0].y);
    for (let i = 1; i < rp.length && acc < keep; i++) {
      const L = dist(rp[i - 1].x, rp[i - 1].y, rp[i].x, rp[i].y);
      const u = Math.min(1, (keep - acc) / (L || 1));
      ctx.lineTo(lerp(rp[i - 1].x, rp[i].x, u), lerp(rp[i - 1].y, rp[i].y, u)); acc += L;
    }
    const p = Gpt(); ctx.moveTo(p.x, p.y); ctx.lineTo(kite1.x, kite1.y + 6);
  } else {
    for (let i = 1; i < pts.length; i++) {
      const L = dist(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y);
      s0 += drawSeg(pts[i - 1], pts[i], segSag(L), s0, true);
    }
    const A = pts[pts.length - 1];
    if (S.phase === 'TRI' || S.phase === 'LAND1') {
      const t = S.tri, Sv = t.S;
      const ord = S.tri.dir > 0 ? [kite1, kite2, Sv] : [kite2, kite1, Sv];
      let prev = Sv;
      for (let i = 0; i < 3; i++) {
        const q = ord[i];
        const landedEdge = S.phase === 'LAND1' && ((q === kite1 && S.landed[0]) || (q === kite2 && S.landed[1]) || (prev === kite1 && S.landed[0]) || (prev === kite2 && S.landed[1]));
        if (!landedEdge) { const L = dist(prev.x, prev.y, q.x, q.y); s0 += drawSeg(prev, { x: q.x, y: q.y }, segSag(L) * 0.6, s0, true); }
        else s0 += dist(prev.x, prev.y, q.x, q.y);
        prev = q;
      }
      if (S.phase === 'LAND1') { // the landed kite's string runs down to the knot
        const lk = S.landed[0] ? kite1 : kite2, fk = S.landed[0] ? kite2 : kite1;
        const G = Gpt();
        ctx.moveTo(G.x, G.y); ctx.quadraticCurveTo((G.x + lk.x) / 2, GROUND - 20, lk.x, lk.y);
        ctx.moveTo(Sv.x, Sv.y); ctx.lineTo(fk.x, fk.y);
      }
    } else if (S.phase === 'PRE' && S.hook) {
      const st = S.hook.star;
      const L1 = dist(A.x, A.y, st.x, st.y);
      drawSeg(A, st, 1, s0, true);
      drawSeg(st, { x: kite1.x, y: kite1.y }, 1, s0 + L1, true);
    } else {
      const L = dist(A.x, A.y, kite1.x, kite1.y);
      const sag = (S.phase === 'PRE' && !S.anchors.length && kiteFree() < 14) ? 6 : segSag(L) * 0.8;
      s0 += drawSeg(A, { x: kite1.x, y: kite1.y + 4 }, sag, s0, true);
      if (kite2.vis && S.phase !== 'PRE') {
        if (S.phase !== 'MOON' || S.mt > 2.5) {
          const grow = S.phase === 'MOON' ? ease((S.mt - 2.5) / 0.3) : 1;
          const tx = lerp(kite1.x, kite2.x, grow), ty = lerp(kite1.y, kite2.y, grow);
          const L2 = dist(kite1.x, kite1.y, tx, ty);
          s0 += drawSeg({ x: kite1.x, y: kite1.y }, { x: tx, y: ty }, segSag(L2) * 0.7, s0, true);
        }
        if ((S.phase === 'TWO' || S.phase === 'CLOSE') && S.tail > 2) {
          const Sl = lastAnchor();
          const dx = Sl.x - kite2.x, dy = Sl.y - kite2.y, dl = Math.hypot(dx, dy) || 1;
          const len = Math.min(S.tail, dl);
          const ex = kite2.x + dx / dl * len, ey = kite2.y + dy / dl * len + (S.phase === 'CLOSE' ? 0 : 10);
          drawSeg({ x: kite2.x, y: kite2.y }, { x: ex, y: ey }, 6 + (1 - len / dl) * 30, 0, false);
          ctx.moveTo(ex + lw(5), ey); ctx.arc(ex, ey, lw(5), 0, TAU);
        }
      }
    }
  }
  ctx.stroke();
  // wrap around the star being hooked
  if (S.hook) {
    const st = S.hook.star, u = clamp(S.hook.t / 0.34, 0, 1);
    ctx.lineWidth = lw(2); ctx.beginPath(); ctx.arc(st.x, st.y, st.r + 5, -Math.PI / 2, -Math.PI / 2 + u * TAU); ctx.stroke();
  }
  // knot + loops
  drawKnot();
  const hl = hintLoop();
  for (const l of loops) drawLoop(l, hl);

  // ball
  if (S.ball) {
    const bp = ballPos();
    if (bp) {
      const r = 11 * kScale() * ease(S.ball.scale) * (1 + (S.ball.wig || 0) * 0.2 * Math.sin(S.t * 30));
      ctx.save(); ctx.translate(bp.x, bp.y - r * 0.7); ctx.rotate(S.ball.roll);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = lw(2.2); ctx.beginPath(); ctx.moveTo(-r * 0.55, 0); ctx.lineTo(r * 0.55, 0); ctx.stroke();
      ctx.restore();
    }
  }
  // kites
  drawKite(kite2);
  drawKite(kite1);
  // landing glow on the remaining kite (LAND1 hint)
  if (S.phase === 'LAND1') {
    const fk = S.landed[0] ? kite2 : kite1, ph = (S.t % 1.4) / 1.4;
    ctx.save(); ctx.globalAlpha = (1 - ph) * 0.8; ctx.lineWidth = lw(2); ctx.beginPath(); ctx.arc(fk.x, fk.y, (40 + ph * 30) * kScale(), 0, TAU); ctx.stroke(); ctx.restore();
  }
  // particles
  for (const p of P) {
    const a = 1 - p.age / p.life, z = lw(p.sz) * (0.5 + a * 0.5);
    ctx.globalAlpha = Math.min(1, a * 1.4);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.sh === 0) ctx.fillRect(-z / 2, -z / 2, z, z);
    else if (p.sh === 1) { ctx.beginPath(); ctx.arc(0, 0, z * 0.55, 0, TAU); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(0, -z * 0.7); ctx.lineTo(z * 0.6, z * 0.5); ctx.lineTo(-z * 0.6, z * 0.5); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // flash ring on big moments (screen space, white line only)
  if (S.flash > 0) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.strokeStyle = '#fff'; ctx.globalAlpha = S.flash * 0.6; ctx.lineWidth = 3;
    const m = 6 + (1 - S.flash) * 10; ctx.strokeRect(SA.l + m, SA.t + m, W - SA.l - SA.r - 2 * m, H - SA.t - SA.b - 2 * m); ctx.globalAlpha = 1;
  }
  // hand demo
  const hd = demoHand();
  if (hd && hd.alpha > 0) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = hd.alpha; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#000'; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
    const x = hd.x, y = hd.y, z = hd.press ? 0.92 : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(z, z); ctx.rotate(-0.25);
    ctx.beginPath(); ctx.rect(-5, 0, 11, 30); ctx.fill(); ctx.stroke();            // finger
    ctx.beginPath(); ctx.rect(-14, 26, 32, 30); ctx.fill(); ctx.stroke();          // palm
    ctx.beginPath(); ctx.rect(-26, 32, 12, 9); ctx.fill(); ctx.stroke();           // thumb
    ctx.restore();
    if (hd.press) { ctx.beginPath(); ctx.arc(x, y, 14, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
}

/* ===================== loop / lifecycle ===================== */
let raf = 0, lastT = 0, running = false;
function frame(now) {
  raf = 0;
  if (!running) return;
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0.016;
  dt = Math.min(dt, 1 / 30);
  try { update(dt); render(); } catch (err) { console.warn(err); }
  raf = requestAnimationFrame(frame);
}
function start() { if (running) return; running = true; lastT = performance.now(); raf = requestAnimationFrame(frame); }
function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { endActive(true); stop(); if (AC && AC.state === 'running') AC.suspend().catch(() => {}); }
  else { if (AC && AC.state === 'suspended' && S.anyInput) AC.resume().catch(() => {}); start(); }
});
window.addEventListener('blur', () => endActive(true));
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
cv.addEventListener('pointerdown', onDown, { passive: false });
cv.addEventListener('pointermove', onMove, { passive: false });
cv.addEventListener('pointerup', onUp, { passive: false });
cv.addEventListener('pointercancel', onUp, { passive: false });
cv.addEventListener('lostpointercapture', onUp);
['contextmenu', 'selectstart', 'dragstart', 'gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

resize();
newRound(true);
start();

// test/inspection hook (read-only helpers, no network)
window.__ss = {
  S, loops, moon, kite1, kite2, cam,
  get stars() { return stars; },
  loopScreen(i) { const g = loopGeom(loops[i]); return w2s(g.mx, g.my); },
  loopTopScreen(i) { const g = loopGeom(loops[i]); return w2s(g.tx, g.ty + g.r * 0.4); },
  kiteScreen(n) { const k = n === 2 ? kite2 : kite1; return w2s(k.x, k.y); },
  starScreen(id) { const s = stars.find(q => q.id === id); return s ? w2s(s.x, s.y) : null; },
  ballScreen() { const b = ballPos(); return b ? w2s(b.x, b.y) : null; },
  hint: () => hintLoop(),
  pick: i => { const p = pickTarget(i); return { a: p.a, id: p.obj ? (p.obj === moon ? 'moon' : p.obj.id) : null, reach: p.reach }; },
  free: () => kiteFree(), active: () => active, particles: () => P.length,
  perim: () => S.tri ? triPerim() : 0
};
})();
</script>

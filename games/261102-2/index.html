<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4a2f1c">
<title>びよーん！ピザ生地のちびっこ鉄道タウン</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#4a2f1c;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;position:fixed;inset:0}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="safe"></div>
<script>
(()=>{
'use strict';
/* =========================================================
   びよーん！ピザ生地のちびっこ鉄道タウン  (single file, no network)
   ========================================================= */
const TAU=Math.PI*2, N=36, NN=N*N;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x)};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const outBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const hyp=Math.hypot;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG=mulberry((Date.now()^0x5a5a)&0x7fffffff);
const rnd=(a=1,b)=>b===undefined?RNG()*a:a+RNG()*(b-a);
function h2(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c}

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const safeEl=document.getElementById('safe');
let W=390,H=844,DPR=1,S=1,portrait=true;
const safe={t:0,r:0,b:0,l:0};
const TR={x:0,y:0,side:300,rim:10,cell:8};
const TA={dx:0,dy:0,sc:1};
const LY={};
let gameTime=0;

/* ================= AUDIO (Web Audio synth) ================= */
const AU={ctx:null,master:null,noise:null,rubG:null,rubF:null,ok:false,lastChug:0,lastPop:0};
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended'&&!document.hidden){AU.ctx.resume().catch(()=>{})} return }
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ac=new AC(); AU.ctx=ac;
    const comp=ac.createDynamicsCompressor(); comp.connect(ac.destination);
    const mg=ac.createGain(); mg.gain.value=0.75; mg.connect(comp); AU.master=mg;
    const len=(ac.sampleRate*1.2)|0, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    AU.noise=buf;
    const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=500; bp.Q.value=1.6;
    const g=ac.createGain(); g.gain.value=0; src.connect(bp); bp.connect(g); g.connect(mg); src.start();
    AU.rubG=g; AU.rubF=bp; AU.ok=true;
    if(ac.state==='suspended') ac.resume().catch(()=>{});
  }catch(e){AU.ok=false}
}
function tone(f,dur,o={}){
  if(!AU.ok)return; const ac=AU.ctx, t0=ac.currentTime+(o.at||0);
  try{
    const os=ac.createOscillator(); os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t0);
    if(o.glide) os.frequency.exponentialRampToValueAtTime(Math.max(30,f*o.glide),t0+dur*(o.gl||1));
    const g=ac.createGain(), v=o.vol||0.15, att=o.att||0.006;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+att);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    os.connect(g); g.connect(AU.master); os.start(t0); os.stop(t0+dur+0.05);
  }catch(e){}
}
function noise(freq,dur,o={}){
  if(!AU.ok)return; const ac=AU.ctx, t0=ac.currentTime+(o.at||0);
  try{
    const s=ac.createBufferSource(); s.buffer=AU.noise; s.playbackRate.value=o.rate||1;
    const f=ac.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(freq,t0); f.Q.value=o.q||1;
    if(o.glide) f.frequency.exponentialRampToValueAtTime(Math.max(40,freq*o.glide),t0+dur);
    const g=ac.createGain(), v=o.vol||0.15;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+(o.att||0.01));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(AU.master); s.start(t0,Math.random()*0.8); s.stop(t0+dur+0.05);
  }catch(e){}
}
const SND={
  knock(){tone(1750,0.09,{type:'triangle',vol:0.10});tone(2620,0.06,{vol:0.05});noise(3200,0.04,{vol:0.05,q:2})},
  poff(){noise(380,0.16,{type:'lowpass',vol:0.22});tone(150,0.14,{vol:0.14,glide:0.6})},
  boing(){tone(330,0.13,{vol:0.12,glide:0.65});tone(200,0.32,{type:'triangle',vol:0.12,glide:1.6,at:0.07})},
  pick(){tone(620,0.1,{vol:0.10,glide:1.5})},
  drop(){tone(520,0.12,{type:'triangle',vol:0.11,glide:0.7});noise(500,0.08,{vol:0.06})},
  wiggle(){tone(420,0.08,{vol:0.05,glide:1.25})},
  ovenOpen(){noise(700,0.45,{type:'lowpass',vol:0.12,glide:0.5});tone(120,0.35,{type:'triangle',vol:0.06})},
  crackle(){noise(2400+Math.random()*2000,0.05,{vol:0.05,q:3})},
  ding(){tone(1568,1.3,{vol:0.16});tone(2093,1.0,{vol:0.08,at:0.01});tone(3136,0.6,{vol:0.04,at:0.02})},
  reveal(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.5,{type:'triangle',vol:0.09,at:i*0.08}))},
  whistle(){tone(740,0.18,{type:'triangle',vol:0.09});tone(1110,0.18,{vol:0.03});tone(740,0.5,{type:'triangle',vol:0.09,at:0.24});tone(1110,0.5,{vol:0.03,at:0.24})},
  chug(){noise(900,0.05,{vol:0.025,q:2})},
  splash(){noise(1300,0.28,{vol:0.08,glide:0.5})},
  success(){[523,659,784].forEach((f,i)=>tone(f,0.8,{type:'triangle',vol:0.12,at:i*0.09}));tone(1047,1.1,{type:'triangle',vol:0.13,at:0.27});tone(2093,0.9,{vol:0.06,at:0.4});tone(2637,0.8,{vol:0.05,at:0.5})},
  hat(){tone(988,0.12,{vol:0.08});tone(1319,0.22,{vol:0.08,at:0.1})},
  pop(){if(gameTime-AU.lastPop<0.07)return;AU.lastPop=gameTime;tone(880+Math.random()*300,0.07,{vol:0.04,glide:1.6})},
  evening(){[262,330,392,494].forEach((f,i)=>tone(f,2.6,{type:'sine',vol:0.05,att:0.6,at:i*0.15}))},
  taiko(){tone(95,0.25,{vol:0.13,glide:0.55});noise(200,0.08,{type:'lowpass',vol:0.06})},
  flute(f){tone(f,0.5,{type:'sine',vol:0.035,att:0.05});tone(f*2,0.4,{vol:0.008,att:0.05})},
  tick(){tone(1400,0.04,{vol:0.03})},
  slide(){noise(600,0.5,{vol:0.08,glide:2})},
  sweep(){noise(2600,0.18,{vol:0.05,glide:0.6})}
};
function rub(level,pitch){
  if(!AU.ok)return; const t=AU.ctx.currentTime;
  try{AU.rubG.gain.setTargetAtTime(level,t,0.05);AU.rubF.frequency.setTargetAtTime(pitch,t,0.05)}catch(e){}
}

/* ================= PARTICLES ================= */
const PMAX=170; const parts=[];
function spawn(o){ if(parts.length>=PMAX){parts.shift()} parts.push(Object.assign({x:0,y:0,vx:0,vy:0,life:1,max:1,size:2,col:'#fff',kind:'dot',g:0,drag:0.9},o)) }
function flourPuff(x,y,n,spd){for(let i=0;i<n;i++){const a=rnd(TAU),v=rnd(0.3,1)*(spd||40)*S;spawn({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-10*S,life:rnd(0.4,0.9),max:0.9,size:rnd(1.2,2.8)*S,col:'rgba(255,253,245,',kind:'flour',g:20*S,drag:0.9})}}
function sparkle(x,y,n,col){for(let i=0;i<n;i++){const a=rnd(TAU),v=rnd(30,110)*S;spawn({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(0.5,1.1),max:1.1,size:rnd(2,4)*S,col:col||'#fff3b0',kind:'star',g:30*S,drag:0.92})}}
function confetti(x,y,n){const cs=['#ff6b6b','#ffd93d','#6bcB77','#4d96ff','#ffffff'];for(let i=0;i<n;i++){const a=rnd(TAU),v=rnd(40,140)*S;spawn({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60*S,life:rnd(0.9,1.6),max:1.6,size:rnd(2,4)*S,col:cs[i%cs.length],kind:'conf',g:120*S,drag:0.96,rot:rnd(TAU)})}}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
    const dr=Math.pow(p.drag,dt*60);p.vx*=dr;p.vy*=dr;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.rot!==undefined)p.rot+=dt*8}
}
function drawParts(){
  for(const p of parts){const a=clamp(p.life/p.max,0,1);
    if(p.kind==='flour'){ctx.fillStyle=p.col+(a*0.85).toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill()}
    else if(p.kind==='star'){ctx.fillStyle=p.col;ctx.globalAlpha=a;const s=p.size*(0.6+a*0.6);ctx.beginPath();ctx.moveTo(p.x,p.y-s*1.6);ctx.lineTo(p.x+s*0.4,p.y-s*0.4);ctx.lineTo(p.x+s*1.6,p.y);ctx.lineTo(p.x+s*0.4,p.y+s*0.4);ctx.lineTo(p.x,p.y+s*1.6);ctx.lineTo(p.x-s*0.4,p.y+s*0.4);ctx.lineTo(p.x-s*1.6,p.y);ctx.lineTo(p.x-s*0.4,p.y-s*0.4);ctx.closePath();ctx.fill();ctx.globalAlpha=1}
    else if(p.kind==='conf'){ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.size,-p.size*0.5,p.size*2,p.size);ctx.restore();ctx.globalAlpha=1}
    else if(p.kind==='smoke'){ctx.fillStyle='rgba(235,230,225,'+(a*0.35).toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1.8-a),0,TAU);ctx.fill()}
    else if(p.kind==='heat'){ctx.fillStyle='rgba(255,170,60,'+(a*0.6).toFixed(3)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill()}
    else if(p.kind==='ring'){ctx.strokeStyle='rgba(255,255,255,'+(a*0.7).toFixed(3)+')';ctx.lineWidth=1.5*S;ctx.beginPath();ctx.ellipse(p.x,p.y,p.size*(2-a),p.size*(2-a)*0.6,0,0,TAU);ctx.stroke()}
  }
}

/* ================= DOUGH FIELD ================= */
const G={m:new Float32Array(NN),c:new Float32Array(NN),tm:new Float32Array(NN),tc:new Float32Array(NN),strokes:0,dirty:true,cx:N/2,cy:N/2};
function samp(F,x,y){
  x-=0.5;y-=0.5;const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,i1=i+1,j1=j+1;
  const ok0=i>=0&&i<N, ok1=i1>=0&&i1<N, oj0=j>=0&&j<N, oj1=j1>=0&&j1<N;
  const a=(ok0&&oj0)?F[j*N+i]:0, b=(ok1&&oj0)?F[j*N+i1]:0, c=(ok0&&oj1)?F[j1*N+i]:0, d=(ok1&&oj1)?F[j1*N+i1]:0;
  return (a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy;
}
function initDough(){
  const ph=rnd(TAU);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const x=i+0.5-N/2,y=j+0.5-N/2,d=hyp(x,y),an=Math.atan2(y,x);
    const r=10.6+0.5*Math.sin(an*3+ph)+0.3*Math.sin(an*5-ph);
    const cov=clamp(r-d+0.5,0,1);const k=j*N+i;
    G.c[k]=cov;G.m[k]=cov*(1+0.03*Math.sin(i*0.9+ph)*Math.cos(j*0.8));
  }
  G.strokes=0;G.dirty=true;updCentroid();
}
function doughT(k){return G.c[k]>0.02?G.m[k]/G.c[k]:0}
function covAt(x,y){return samp(G.c,x,y)}
function updCentroid(){let sx=0,sy=0,sw=0;for(let j=0;j<N;j++)for(let i=0;i<N;i++){const w=G.c[j*N+i];if(w>0.5){sx+=(i+0.5)*w;sy+=(j+0.5)*w;sw+=w}}if(sw>0){G.cx=sx/sw;G.cy=sy/sw}}
/* advection step: dough under finger (gaussian) moves by d; Jacobian keeps mass -> stretching thins, pushing piles */
function advect(fx,fy,dx,dy,len){
  const sig=2.5,s2=sig*sig,inv=1/(2*s2),m=G.m,c=G.c,tm=G.tm,tc=G.tc;tm.set(m);tc.set(c);
  const R=sig*3.3,i0=Math.max(0,Math.floor(fx-R)),i1=Math.min(N-1,Math.ceil(fx+R)),j0=Math.max(0,Math.floor(fy-R)),j1=Math.min(N-1,Math.ceil(fy+R));
  const step=hyp(dx,dy);
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const x=i+0.5,y=j+0.5,rx=x-fx,ry=y-fy,w=Math.exp(-(rx*rx+ry*ry)*inv);if(w<0.003)continue;
    const ux=dx*w,uy=dy*w,div=-(dx*rx+dy*ry)/s2*w;const J=clamp(1/(1+div),0.6,1.7);
    const k=j*N+i;let mm=samp(tm,x-ux,y-uy)*J,cc=samp(tc,x-ux,y-uy);
    if(cc>1)cc=1;
    // pinch gathers dough into a bump at the start of a pull
    if(len<2.6&&cc>0.3){const t=mm/cc;if(t<1.8)mm*=1+0.24*step*w*w}
    // long pulls relax the bump and stretch the neck thin
    if(len>4.2&&cc>0.3){const t=mm/cc;if(t>1.0)mm-=(mm-cc*1.0)*0.07*step*w*w;if(w>0.12&&w<0.75)mm*=1-0.05*step}
    m[k]=mm;c[k]=cc;
  }
  for(let i=0;i<N;i++){m[i]=c[i]=0;m[(N-1)*N+i]=c[(N-1)*N+i]=0;m[i*N]=c[i*N]=0;m[i*N+N-1]=c[i*N+N-1]=0}
}
function press(fx,fy,amt){
  const m=G.m,c=G.c;
  for(let j=Math.max(0,Math.floor(fy-3));j<=Math.min(N-1,Math.ceil(fy+3));j++)for(let i=Math.max(0,Math.floor(fx-3));i<=Math.min(N-1,Math.ceil(fx+3));i++){
    const k=j*N+i;if(c[k]<0.2)continue;const d=hyp(i+0.5-fx,j+0.5-fy);
    const w=Math.exp(-d*d/(2*1.1*1.1)), rimw=Math.exp(-(d-2.2)*(d-2.2)/1.2);
    m[k]=Math.max(0,m[k]*(1-amt*w)+amt*0.25*rimw*c[k]);
  }
}

/* ================= LAYOUT ================= */
const TOPS=[{kind:'tomato'},{kind:'tomato'},{kind:'tomato'},{kind:'olive'}];
function readSafe(){try{const cs=getComputedStyle(safeEl);safe.t=parseFloat(cs.paddingTop)||0;safe.r=parseFloat(cs.paddingRight)||0;safe.b=parseFloat(cs.paddingBottom)||0;safe.l=parseFloat(cs.paddingLeft)||0}catch(e){}}
function layout(){
  W=Math.max(200,window.innerWidth||390);H=Math.max(200,window.innerHeight||844);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  readSafe();portrait=H>=W;S=clamp(Math.min(W,H)/390,0.8,2.6);
  const aL=safe.l+6,aR=W-safe.r-6,aT=safe.t+6,aB=H-safe.b-6;
  if(portrait){
    const shelfH=Math.max(34,40*S);
    const side=Math.min(aR-aL-6,(aB-aT-shelfH)*0.57);
    TR.side=side;TR.x=(W-side)/2;TR.y=aT+shelfH+6*S;
    const by0=TR.y+side,bh=aB-by0;
    LY.shelf={x:aL+4,y:aT+2,sz:shelfH-6};
    const ovSz=Math.min(bh*0.62,(aR-aL)*0.42,180*S);
    LY.oven={x:aR-ovSz*0.56,y:by0+bh*0.54,sz:ovSz};
    LY.train={x:TR.x+side*0.14,y:by0+Math.max(22*S,bh*0.11)};
    const avail=(aR-aL)-ovSz*1.1, st=Math.min(48*S,avail*0.24), tx=aL+avail*0.12+8, ty=by0+bh*0.38;
    LY.tops=[{x:tx,y:ty},{x:tx+st,y:ty+st*0.15},{x:tx+st*2,y:ty},{x:tx+st*1.1,y:ty+st*0.95}];
    LY.staff={x:aL+avail*0.62,y:by0+bh*0.80};
    LY.newTray={x:aL-4,y:by0+bh*0.42,dir:1};
  }else{
    const side=Math.min(aB-aT-6,(aR-aL)*0.56);
    TR.side=side;TR.x=(aL+aR)/2-side/2;TR.y=(aT+aB)/2-side/2;
    const lw=TR.x-aL,rx0=TR.x+side,rw=aR-rx0;
    LY.shelf={x:aL+4,y:aT+4,sz:Math.min(44*S,lw*0.27)};
    LY.train={x:TR.x-lw*0.32,y:TR.y+side*0.88};
    const st=Math.min(lw*0.27,50*S),tx=aL+lw*0.24,ty=TR.y+side*0.38;
    LY.tops=[{x:tx,y:ty},{x:tx+st,y:ty+st*0.2},{x:tx+st*0.2,y:ty+st},{x:tx+st*1.25,y:ty+st*1.2}];
    const ovSz=Math.min(rw*0.82,side*0.42,200*S);
    LY.oven={x:rx0+rw*0.5,y:TR.y+side*0.36,sz:ovSz};
    LY.staff={x:rx0+rw*0.45,y:TR.y+side*0.80};
    LY.newTray={x:aR+4,y:TR.y+side*0.82,dir:-1};
  }
  TR.rim=TR.side*0.035;TR.cell=(TR.side-2*TR.rim)/N;
  buildBg();buildTray();buildFlour();
  if(T.baked)buildTerrainLayer();
  G.dirty=true;for(const th of gallery)th.can=null;parts.length=0;
}
function g2s(gx,gy){const cx=TR.x+TR.side/2,cy=TR.y+TR.side/2;return{x:cx+TA.dx+(gx-N/2)*TR.cell*TA.sc,y:cy+TA.dy+(gy-N/2)*TR.cell*TA.sc}}
function s2g(x,y){const cx=TR.x+TR.side/2,cy=TR.y+TR.side/2;return{x:(x-cx-TA.dx)/(TR.cell*TA.sc)+N/2,y:(y-cy-TA.dy)/(TR.cell*TA.sc)+N/2}}
function U(){return TR.cell*TA.sc}

/* ================= STATIC LAYERS ================= */
let bgCan=null,trayCan=null,flourCan=null,flourCtx=null;
function buildBg(){
  bgCan=mkCanvas(W*DPR,H*DPR);const b=bgCan.getContext('2d');b.scale(DPR,DPR);
  const r=mulberry(77);
  let g=b.createLinearGradient(0,0,W,H);g.addColorStop(0,'#c09062');g.addColorStop(1,'#9a6a40');b.fillStyle=g;b.fillRect(0,0,W,H);
  const ph=Math.max(60,95*S);
  for(let y=0,n=0;y<H;y+=ph,n++){
    const tone=(r()-0.5)*18;b.fillStyle=`rgba(${tone>0?255:60},${tone>0?220:35},${tone>0?170:10},${Math.abs(tone)/140})`;b.fillRect(0,y,W,ph);
    b.strokeStyle='rgba(70,40,18,0.35)';b.lineWidth=1.5;b.beginPath();b.moveTo(0,y+0.5);b.lineTo(W,y+0.5);b.stroke();

}

  dist.fill(Infinity);prev.fill(-1);closed.fill(0);
  const hk=[],hd=[];const push=(k,d)=>{hk.push(k);hd.push(d);let i=hk.length-1;while(i>0){const p=(i-1)>>1;if(hd[p]<=hd[i])break;[hk[p],hk[i]]=[hk[i],hk[p]];[hd[p],hd[i]]=[hd[i],hd[p]];i=p}};
  const pop=()=>{const k=hk[0];const lk=hk.pop(),ld=hd.pop();if(hk.length){hk[0]=lk;hd[0]=ld;let i=0;for(;;){const l=i*2+1,r=l+1;let m=i;if(l<hk.length&&hd[l]<hd[m])m=l;if(r<hk.length&&hd[r]<hd[m])m=r;if(m===i)break;[hk[m],hk[i]]=[hk[i],hk[m]];[hd[m],hd[i]]=[hd[i],hd[m]];i=m}}return k};
  dist[start]=0;push(start,0);
  while(hk.length){const k=pop();if(closed[k])continue;closed[k]=1;if(k===goal)break;
    const i=k%N,j=(k/N)|0;
    for(let d=0;d<8;d++){const ii=i+DX8[d],jj=j+DY8[d];if(ii<0||jj<0||ii>=N||jj>=N)continue;const kk=jj*N+ii;if(closed[kk])continue;
      if(d>=4&&(kindOf(j*N+ii)<0||kindOf(jj*N+i)<0))continue;
      const c=stepCost(mode,k,kk,d>=4);if(c===Infinity)continue;const nd=dist[k]+c;if(nd<dist[kk]){dist[kk]=nd;prev[kk]=k;push(kk,nd)}}
  }
  if(dist[goal]===Infinity)return null;const p=[];for(let k=goal;k>=0;k=prev[k]){p.push(k);if(k===start)break}return p.reverse();
}
const cc=k=>({x:k%N+0.5,y:((k/N)|0)+0.5});
function chaikin(pts,it){let p=pts;for(let n=0;n<it;n++){if(p.length<3)return p;const q=[p[0]];for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];q.push({x:a.x*0.75+b.x*0.25,y:a.y*0.75+b.y*0.25},{x:a.x*0.25+b.x*0.75,y:a.y*0.25+b.y*0.75})}q.push(p[p.length-1]);p=q}return p}
function mkLine(pts,smooth){
  const p=smooth===false?pts.slice():chaikin(pts,2);const cum=[0];for(let i=1;i<p.length;i++)cum.push(cum[i-1]+hyp(p[i].x-p[i-1].x,p[i].y-p[i-1].y));
  return{p,cum,len:cum[cum.length-1]};
}
function linePt(L,s){
  const p=L.p,cum=L.cum;if(p.length===1)return{x:p[0].x,y:p[0].y,a:0};s=clamp(s,0,L.len);
  let lo=0,hi=cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(cum[m]<=s)lo=m;else hi=m}
  const a=p[lo],b=p[hi],seg=cum[hi]-cum[lo]||1,t=(s-cum[lo])/seg;return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,a:Math.atan2(b.y-a.y,b.x-a.x)};
}
// split a cell path into legs: land / boat / gap
function toLegs(path,isMain){
  const legs=[];if(!path||!path.length)return legs;
  const kinds=path.map(k=>kindOf(k));let i=0;
  while(i<path.length){
    const kd=kinds[i];let j=i;while(j+1<path.length&&kinds[j+1]===kd)j++;
    if(kd===0){const cells=path.slice(i,j+1);legs.push({kind:'land',cells})}
    else{const a=path[i-1],b=path[j+1],mid=path.slice(i,j+1);legs.push({kind:kd===1?'boat':'gap',cells:[a,...mid,b],a,b})}
    i=j+1;
  }
  // land legs adjacent to boat/gap legs already share endpoint cells (a / b)
  const out=[];
  legs.forEach((lg,n)=>{
    if(lg.kind==='land'){
      const pts=lg.cells.map(cc);
      if(isMain&&n===0){pts.unshift({x:T.E.x,y:T.E.y});lg.kind='rail';lg.line=mkLine(pts)}
      else{if(pts.length<2)return;lg.kind='walk';lg.line=mkLine(pts)}
    }else if(lg.kind==='boat'){
      const A=cc(lg.a),B=cc(lg.b),w=lg.cells.slice(1,-1).map(cc);
      const dA={x:(A.x+w[0].x)/2,y:(A.y+w[0].y)/2},dB={x:(B.x+w[w.length-1].x)/2,y:(B.y+w[w.length-1].y)/2};
      lg.line=mkLine([dA,...w,dB]);lg.pierA={a:A,b:dA};lg.pierB={a:B,b:dB};
    }else{const A=cc(lg.a),B=cc(lg.b);lg.line=mkLine([A,B],false)}
    lg.key=lg.kind+':'+lg.cells[0]+'-'+lg.cells[lg.cells.length-1]+':'+lg.cells.length;
    out.push(lg);
  });
  return out;
}
function nearestCell(x,y,pred,maxR){
  let best=-1,bd=Infinity;const R=maxR||N;
  for(let j=Math.max(0,Math.floor(y-R));j<=Math.min(N-1,Math.ceil(y+R));j++)for(let i=Math.max(0,Math.floor(x-R));i<=Math.min(N-1,Math.ceil(x+R));i++){const k=j*N+i;if(!pred(k))continue;const d=hyp(i+0.5-x,j+0.5-y);if(d<bd&&d<=R){bd=d;best=k}}
  return best;
}

/* ================= NETWORK ================= */
function rebuildNetwork(first){
  const st=station();const Sk=cellOf(st.gx,st.gy);
  T.Hc=nearestCell(T.E.x,T.E.y,k=>isLand(k)&&T.cls[k]!==CL.VAL);if(T.Hc<0)T.Hc=nearestCell(T.E.x,T.E.y,k=>T.cls[k]>0);
  const main=T.Hc>=0?dijkstra(T.Hc,Sk,'rail'):null;
  let mainLegs=main?toLegs(main,true):[];
  if(!mainLegs.length&&T.Hc>=0){mainLegs=[{kind:'rail',cells:[T.Hc],line:mkLine([{x:T.E.x,y:T.E.y},cc(T.Hc)]),key:'rail:solo'}]}
  const hl=houses().map(h=>{const hk=cellOf(h.gx,h.gy);const p=dijkstra(hk,Sk,'walk');return p?toLegs(p,false):null});
  const all=[...mainLegs];hl.forEach(l=>l&&all.push(...l));
  const gaps=all.filter(l=>l.kind==='gap');
  const connected=!!main&&!mainLegs.some(l=>l.kind==='gap')&&hl.every(l=>l&&!l.some(x=>x.kind==='gap'));
  const old=T.net;T.net={main:mainLegs,houses:hl,gaps,connected,all};
  // vehicles
  const keep=new Map();
  for(const lg of all){
    if(lg.kind!=='rail'&&lg.kind!=='boat')continue;
    if(keep.has(lg.key)){lg.veh=keep.get(lg.key);continue}
    let v=null;
    if(lg.kind==='rail'){v=T.train||mkVehicle('rail');T.train=v}
    else v=T.veh.get(lg.key)||mkVehicle('boat');
    if(v.leg!==lg){const op=v.leg?linePt(v.leg.line,v.s):null;v.leg=lg;
      if(op){let bs=0,bd=Infinity;for(let s=0;s<=lg.line.len;s+=0.5){const q=linePt(lg.line,s);const d=hyp(q.x-op.x,q.y-op.y);if(d<bd){bd=d;bs=s}}v.s=bs}else v.s=0;
      if(v.s>lg.line.len)v.s=lg.line.len;}
    lg.veh=v;keep.set(lg.key,v);
  }
  for(const [k,v] of T.veh)if(!keep.has(k)){for(const p of v.riders)dropRider(p,v)}
  T.veh=keep;
  if(T.train&&!keep.has(mainLegs[0]&&mainLegs[0].key)){}
  // passengers re-path
  for(const p of T.people){if(p.state==='ride'){if(p.veh&&[...keep.values()].includes(p.veh)){reJourney(p,true)}continue}if(p.state!=='gone'&&p.state!=='fest'&&p.state!=='exit')reJourney(p,false)}
  if(T.night)buildNight(false);
  updateStaffPlan();
  if(!first&&old&&connected&&!old.connected){SND.success();const s=g2s(st.gx,st.gy);confetti(s.x,s.y,24)}
  checkArm();
}
function mkVehicle(kind){return{kind,leg:null,s:0,dir:1,dwell:0.8,riders:[],cap:kind==='rail'?6:3,bob:rnd(TAU)}}
function checkArm(){
  if(T.night||!T.net)return;
  T.armed=T.net.connected&&(T.bridgesBuilt>0||T.relocations>=3);
}

/* ================= PASSENGERS ================= */
const PCOL=['#e76f51','#f4a261','#2a9d8f','#e9c46a','#8ab17d','#b56576','#6d9dc5','#f28482','#84a59d'];
function newPerson(x,y,home){return{x,y,home,state:'idle',journey:[],li:0,s:0,veh:null,col:PCOL[(rnd(PCOL.length))|0],hair:rnd()<0.5?'#3b2a20':'#6b4a2a',bob:rnd(TAU),fade:1,visitor:false,tx:0,ty:0,wait:0,festT:0,climb:0}}
function journeyFrom(p,x,y){
  // walking route to the goal (station in daytime, festival at night), then the main line toward the depot
  const st=station();const start=nearestCell(x,y,k=>isLand(k),3);if(start<0)return null;
  if(T.night&&T.F){const fk=T.F.landK;const pth=dijkstra(start,fk,'walk');if(!pth)return null;return toLegs(pth,false).map(l=>({leg:l,rev:false})).concat([{fest:true}])}
  const Sk=cellOf(st.gx,st.gy);const pth=dijkstra(start,Sk,'walk');if(!pth)return null;
  const j=toLegs(pth,false).map(l=>({leg:l,rev:false}));
  for(let i=T.net.main.length-1;i>=0;i--)j.push({leg:T.net.main[i],rev:true});
  j.push({exit:true});return j;
}
function reJourney(p,riding){
  if(riding){ // keep riding, rebuild the rest after alighting
    const v=p.veh;const curLeg=v.leg;const rest=[];let found=false;
    const mainIdx=T.net.main.indexOf(curLeg);
    if(mainIdx>=0){const rev=p.journey[p.li]&&p.journey[p.li].rev;rest.push({leg:curLeg,rev});
      if(rev){for(let i=mainIdx-1;i>=0;i--)rest.push({leg:T.net.main[i],rev:true});rest.push({exit:true})}
      else{for(let i=mainIdx+1;i<T.net.main.length;i++)rest.push({leg:T.net.main[i],rev:false});if(T.night&&T.F){rest.push({toFest:true})}else rest.push({fest:true})}
      found=true}
    if(!found){rest.push({leg:curLeg,rev:p.journey[p.li]?!!p.journey[p.li].rev:false});rest.push({repath:true})}
    p.journey=rest;p.li=0;return;
  }
  const j=journeyFrom(p,p.x,p.y);
  if(!j){p.journey=[];p.li=0;p.state='lost';return}
  if(p.visitor&&!T.night){p.journey=j;}
  p.journey=j;p.li=0;beginLeg(p);
}
function dropRider(p,v){const q=linePt(v.leg.line,v.s);p.x=q.x;p.y=q.y;p.veh=null;p.state='idle';const k=cellOf(p.x,p.y);if(!isLand(k)){const nk=nearestCell(p.x,p.y,isLand,4);if(nk>=0){const c=cc(nk);p.x=c.x;p.y=c.y}else{p.state='gone'}}}
function legStart(it){const L=it.leg.line;return it.rev?L.p[L.p.length-1]:L.p[0]}
function beginLeg(p){
  if(p.li>=p.journey.length){p.state='gone';return}
  const it=p.journey[p.li];
  if(it.exit){p.state='exit';p.festT=1.2;return}
  if(it.fest){p.state='fest';p.festT=rnd(14,20);p.tx=p.x;p.ty=p.y;return}
  if(it.toFest||it.repath){const j=journeyFrom(p,p.x,p.y);if(!j){p.state='lost';return}p.journey=j;p.li=0;beginLeg(p);return}
  const sp=legStart(it);
  if(hyp(sp.x-p.x,sp.y-p.y)>0.2){p.state='goto';p.tx=sp.x;p.ty=sp.y;return}
  const k=it.leg.kind;
  if(k==='walk'){p.state='walk';p.s=0}
  else if(k==='gap'){p.state='stuck'}
  else{p.state='wait';p.wait=0}
}
function walkSpeed(x,y){const h=htAt(x,y);return 1.5/(1+Math.max(0,h-1.05)*4.5)}
function updPeople(dt){
  const ppl=T.people;
  for(const p of ppl){
    p.bob+=dt*8;
    const it=p.journey[p.li];
    if(p.state==='goto'){const sp=walkSpeed(p.x,p.y);const dx=p.tx-p.x,dy=p.ty-p.y,d=hyp(dx,dy);if(d<0.05){p.x=p.tx;p.y=p.ty;beginLeg(p)}else{const st=Math.min(d,sp*dt);p.x+=dx/d*st;p.y+=dy/d*st;p.climb=sp<1?1:0}}
    else if(p.state==='walk'){const L=it.leg.line;const sp=walkSpeed(p.x,p.y);p.climb=sp<1.0?1:0;p.s+=sp*dt;const q=linePt(L,it.rev?L.len-p.s:p.s);p.x=q.x;p.y=q.y;if(p.s>=L.len){p.li++;beginLeg(p)}}
    else if(p.state==='wait'){p.wait+=dt;const v=it.leg.veh;if(v&&v.leg===it.leg&&v.dwell>0.15){const atEnd=v.s<=0.01?0:(v.s>=v.leg.line.len-0.01?1:-1);const myEnd=it.rev?1:0;if(atEnd===myEnd&&v.riders.length<v.cap){p.state='ride';p.veh=v;v.riders.push(p)}}}
    else if(p.state==='ride'){const v=p.veh;if(!v||!v.leg){p.state='idle';continue}const q=linePt(v.leg.line,v.s);p.x=q.x;p.y=q.y}
    else if(p.state==='exit'){p.festT-=dt;p.fade=clamp(p.festT/1.2,0,1);if(p.festT<=0)p.state='gone'}
    else if(p.state==='fest'){p.festT-=dt;if(p.festT<1)p.fade=clamp(p.festT,0,1);if(p.festT<=0)p.state='gone'}
    else if(p.state==='lost'||p.state==='idle'){p.wait+=dt;if(p.wait>6){p.state='gone'}}
  }
  for(let i=ppl.length-1;i>=0;i--)if(ppl[i].state==='gone')ppl.splice(i,1);
  // spawn residents
  if(phase==='town'&&T.lay>=1){
    houses().forEach((h,i)=>{T.spawnT[i]-=dt;if(T.spawnT[i]<=0){T.spawnT[i]=rnd(5.5,9.5);
      const mine=ppl.filter(p=>p.home===i).length;if(mine<3&&ppl.length<18){const hp={x:h.gx,y:h.gy+0.6};const p=newPerson(hp.x,hp.y,i);const j=journeyFrom(p,hp.x,hp.y);if(j){p.journey=j;p.li=0;ppl.push(p);beginLeg(p)}}}});
    if(T.night&&T.dusk>=1&&T.net){T.visT-=dt;if(T.visT<=0){T.visT=rnd(2.5,4);if(ppl.filter(p=>p.visitor).length<10&&ppl.length<22){
      const p=newPerson(T.E.x,T.E.y,-1);p.visitor=true;const j=T.net.main.map(l=>({leg:l,rev:false}));j.push({toFest:true});p.journey=j;p.li=0;ppl.push(p);beginLeg(p)}}}
  }
}
// queue positions for waiting people
function queuePos(p){
  const it=p.journey[p.li];if(!it||!it.leg)return{x:p.x,y:p.y};
  const L=it.leg.line,sp=legStart(it),nx=it.rev?linePt(L,L.len-0.6):linePt(L,0.6);
  let vx=nx.x-sp.x,vy=nx.y-sp.y;const d=hyp(vx,vy)||1;vx/=d;vy/=d;
  const same=T.people.filter(q=>(q.state==='wait'||q.state==='stuck')&&q.journey[q.li]&&q.journey[q.li].leg===it.leg&&!!q.journey[q.li].rev===!!it.rev);
  const idx=same.indexOf(p);
  return{x:sp.x-vx*(0.5+idx*0.55)+(-vy)*0.55,y:sp.y-vy*(0.5+idx*0.55)+vx*0.55};
}

/* ================= VEHICLES ================= */
function updVehicles(dt){
  for(const v of T.veh.values()){
    if(!v.leg)continue;const L=v.leg.line.len;v.bob+=dt*3;
    if(v.kind==='rail'&&T.lay<1){v.s=0;v.dwell=0.6;continue}
    if(v.dwell>0){v.dwell-=dt;if(v.dwell<=0){v.dir=v.s<=0.01?1:-1;if(L<0.3){v.dwell=1;continue}if(v.kind==='rail'&&onScreenOK())SND.whistle()}continue}
    let sp=v.kind==='rail'?3.0:1.7;
    if(v.kind==='rail'){const q=linePt(v.leg.line,v.s);sp/=1+Math.max(0,htAt(q.x,q.y)-1.1)*3;if(gameTime-AU.lastChug>0.28){AU.lastChug=gameTime;SND.chug()}}
    v.s+=v.dir*sp*dt;
    if(v.s>=L){v.s=L;arrive(v,1)}else if(v.s<=0){v.s=0;arrive(v,0)}
  }
}
function onScreenOK(){return !document.hidden}
function arrive(v,end){
  v.dwell=v.kind==='rail'?1.9:1.5;
  if(v.kind==='boat')SND.splash();
  const still=[];
  for(const p of v.riders){const it=p.journey[p.li];const myEnd=it&&it.rev?0:1;if(end===myEnd){const q=linePt(v.leg.line,v.s);p.x=q.x;p.y=q.y;p.veh=null;p.li++;beginLeg(p)}else still.push(p)}
  v.riders=still;
  if(v.kind==='rail'&&end===1&&T.armed&&!T.night&&v.leg===T.net.main[0]&&T.net.main.length===1)startEvening();
}

/* ================= STAFF ================= */
function mkStaff(){return{x:T.E.x,y:T.E.y,mode:'lay',path:null,s:0,carry:'broom',tilt:0,hat:0,timer:0,face:1,walk:0,target:null}}
function staffGo(tx,ty,then){
  const st=T.staff;const a=nearestCell(st.x,st.y,isLand,4),b=nearestCell(tx,ty,isLand,4);
  let pts=null;if(a>=0&&b>=0){const p=dijkstra(a,b,'patrol');if(p)pts=p.map(cc)}
  if(!pts)pts=[{x:st.x,y:st.y},{x:tx,y:ty}];else{pts.unshift({x:st.x,y:st.y});pts.push({x:tx,y:ty})}
  st.path=mkLine(pts);st.s=0;st.mode='go';st.then=then;
}
function updateStaffPlan(){
  const st=T.staff;if(!st||st.mode==='lay'||phase!=='town')return;
  if(st.mode==='cheer')return;
  if(T.night){if(st.mode!=='patrol'){st.carry='lantern';if(T.patrol){st.mode='patrol';st.s=0;const q=T.patrol.p[0];st.x=q.x;st.y=q.y}}return}
  const gap=T.net&&T.net.gaps[0];
  if(T.plank&&(!gap||!T.net.gaps.includes(T.plank.gap))){
    // the gap was solved another way (station moved): staff takes the plank back
    if(!T.plank.carried){T.plank=null;st.carry='broom'}
  }
  if(gap&&!T.plank){
    // walk from the reachable side (cliff A) with a breadstick plank
    const A=gap.line.p[0];st.carry='plank';staffGo(A.x+0.6,A.y+0.4,()=>{placePlank(gap);st.carry='broom';st.mode='atGap'});return;
  }
  if(gap&&T.plank&&st.mode==='atGap')return;
  if(!gap){const s=station();st.carry='broom';if(st.mode!=='idle'||hyp(st.x-s.gx-1.6,st.y-s.gy-0.4)>2)staffGo(s.gx+1.6,s.gy+0.4,()=>{st.mode='idle'})}
}
function placePlank(gap){
  const A=gap.line.p[0],B=gap.line.p[gap.line.p.length-1];const ang=Math.atan2(B.y-A.y,B.x-A.x);
  // lie the plank on the near shore, slightly back from the cliff
  T.plank={x:A.x-Math.cos(ang)*0.9,y:A.y-Math.sin(ang)*0.9,hx:A.x-Math.cos(ang)*0.9,hy:A.y-Math.sin(ang)*0.9,ang,gap,carried:false,wig:0,back:0};
  SND.drop();
}
function updStaff(dt){
  const st=T.staff;if(!st)return;
  st.tilt=lerp(st.tilt,st.mode==='atGap'?Math.sin(gameTime*2)*0.35+0.15:0,dt*4);
  if(st.hat>0)st.hat=Math.max(0,st.hat-dt*0.7);
  if(st.mode==='lay'){
    const lg=T.net&&T.net.main[0];if(!lg){st.mode='idle';return}
    T.layLen=lg.line.len;const nearHill=hillNear(st.x,st.y);
    T.lay=Math.min(1,T.lay+dt*(nearHill?7:13)/Math.max(4,lg.line.len));
    const q=linePt(lg.line,T.lay*lg.line.len);st.face=Math.cos(q.a)>=0?1:-1;st.x=q.x;st.y=q.y-0.2;st.walk+=dt*10;st.point=nearHill?1:0;
    if(Math.random()<0.25)SND.tick();
    if(T.lay>=1){st.mode='idle';st.point=0;updateStaffPlan()}
    return;
  }
  if(st.mode==='go'){const L=st.path;const sp=2.4/(1+Math.max(0,htAt(st.x,st.y)-1.1)*3);st.s+=sp*dt;const q=linePt(L,st.s);st.face=Math.cos(q.a)>=0?1:-1;st.x=q.x;st.y=q.y;st.walk+=dt*10;if(st.s>=L.len){st.mode='idle';const f=st.then;st.then=null;if(f)f()}}
  else if(st.mode==='cheer'){st.timer-=dt;if(st.timer<=0){st.mode='idle';updateStaffPlan()}}
  else if(st.mode==='patrol'&&T.patrol){const L=T.patrol;st.s+=1.6*dt/(1+Math.max(0,htAt(st.x,st.y)-1.1)*3);if(st.s>L.len){st.s-=L.len}const q=linePt(L,st.s);st.face=Math.cos(q.a)>=0?1:-1;st.x=q.x;st.y=q.y;st.walk+=dt*9;
    for(const l of T.lanterns){if(!l.lit&&hyp(l.x-st.x,l.y-st.y)<0.9){l.lit=1;l.pop=1;SND.pop()}}}
}

    if(theme==='lake'){const k=nearestCell(F.x+Math.cos(a)*2,F.y+Math.sin(a)*2,k=>standable(k)&&hyp(cc(k).x-F.x,cc(k).y-F.y)>1,5);if(k<0)continue;x=cc(k).x;y=cc(k).y}

function startBake(){

function autoPlace(){
  const used=[];const ok=(k,minD)=>standable(k)&&T.edge[k]>=1.5&&used.every(u=>hyp(cc(u).x-cc(k).x,cc(u).y-cc(k).y)>=minD);
  const st=station();
  const Hk=nearestCell(T.E.x,T.E.y,k=>standable(k));
  const far=(pred)=>{let b=-1,bd=-1;for(let k=0;k<NN;k++){if(!pred(k))continue;const d=hyp(cc(k).x-T.E.x,cc(k).y-T.E.y);if(d>bd){bd=d;b=k}}return b};
  const place=(t,pred)=>{let k=-1;if(t.onTray){k=nearestCell(t.gx,t.gy,kk=>pred(kk),6)}if(k<0)k=pred===null?-1:k;return k};
  // station
  let sk=st.onTray?nearestCell(st.gx,st.gy,k=>ok(k,0)&&(Hk<0||hyp(cc(k).x-cc(Hk).x,cc(k).y-cc(Hk).y)>=4),8):-1;
  if(sk<0&&Hk>=0){
    // prefer a spot whose route meets what the child made: a gorge first, then a lake
    const cand=[];for(let k=0;k<NN;k++){if(ok(k,0)&&T.cls[k]===CL.PLAIN){const d=hyp(cc(k).x-cc(Hk).x,cc(k).y-cc(Hk).y);if(d>=9)cand.push([d,k])}}
    cand.sort((a,b)=>b[0]-a[0]);let boatK=-1;
    for(let n=0;n<cand.length&&n<60;n+=2){const k=cand[n][1];const p=dijkstra(Hk,k,'rail');if(!p)continue;const kinds=p.map(kindOf);if(kinds.includes(2)){sk=k;break}if(boatK<0&&kinds.includes(1))boatK=k}
    if(sk<0)sk=boatK;
  }
  if(sk<0)sk=far(k=>ok(k,0)&&T.cls[k]===CL.PLAIN);if(sk<0)sk=far(k=>standable(k));
  if(sk>=0){st.from=topScreen(st);st.onTray=true;st.gx=cc(sk).x;st.gy=cc(sk).y;used.push(sk)}
  houses().forEach((h,n)=>{let k=h.onTray?nearestCell(h.gx,h.gy,kk=>ok(kk,2.5),8):-1;
    if(k<0){let b=-1,bd=-1;for(let kk=0;kk<NN;kk++){if(!ok(kk,4.5)||T.cls[kk]!==CL.PLAIN)continue;let md=Infinity;for(const u of used)md=Math.min(md,hyp(cc(u).x-cc(kk).x,cc(u).y-cc(kk).y));md=Math.min(md,hyp(cc(kk).x-T.E.x,cc(kk).y-T.E.y)*0.8);md+=h2(kk,n)*0.8;if(md>bd){bd=md;b=kk}}k=b}
    if(k<0)k=nearestCell(G.cx,G.cy,kk=>ok(kk,1.5));if(k<0)k=nearestCell(G.cx,G.cy,standable);
    if(k>=0){h.from=topScreen(h);h.onTray=true;h.gx=cc(k).x;h.gy=cc(k).y;used.push(k)}});
}
function updBake(dt){

  if(t>=0.7&&t<1.7){const k=ease((t-0.7)/1.0);TA.dx=(mouth.x-tc.x)*k;TA.dy=(mouth.y-tc.y)*k;TA.sc=lerp(1,0.12,k)}

    const c=g2s(G.cx,G.cy),rad=T.reveal*TR.cell*N*0.85;for(let i=0;i<2;i++){const a=rnd(TAU);sparkle(c.x+Math.cos(a)*rad,c.y+Math.sin(a)*rad,1,'#fff8d0')}

/* ================= INVITATION (one target) ================= */
let inv=null,lastInput=0,hint=null,hintDone=false;
function handles(){
  // dough edge "pinch" points: east, west, south, north
  const out=[];const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dx,dy] of dirs){let x=G.cx+dx*(N/2),y=G.cy+dy*(N/2);x=clamp(x,0.6,N-0.6);y=clamp(y,0.6,N-0.6);
    let found=false;for(let s=0;s<N;s+=0.25){const px=x-dx*s,py=y-dy*s;if(px<0||py<0||px>N||py>N)continue;if(covAt(px,py)>=0.5){x=px;y=py;found=true;break}}
    out.push({x:x-dx*0.2,y:y-dy*0.2,dx,dy,ok:found});}
  return out;
}
function computeInvite(){
  if(phase==='shape'){
    if(G.strokes===0){const h=handles()[0];return{kind:'handle',h,idx:0}}
    if(G.strokes===1){const h=handles()[1];return{kind:'handle',h,idx:1}}
    return{kind:'oven'};
  }
  if(phase!=='town'||T.lay<1)return null;
  if(T.night){if(T.newTray&&T.newTray.vis>=1&&T.nightT>12)return{kind:'newTray'};return{kind:'top',t:houses()[0]}}
  if(T.plank&&!T.plank.carried)return{kind:'plank'};
  if(T.relocations===0)return{kind:'top',t:station()};
  if(T.houseMoves===0)return{kind:'top',t:houses()[0]};
  return{kind:'top',t:T.relocations%2?houses()[1]:station()};
}
function invPos(v){
  if(!v)return null;
  if(v.kind==='handle')return g2s(v.h.x,v.h.y);
  if(v.kind==='oven')return{x:LY.oven.x,y:LY.oven.y};
  if(v.kind==='plank')return g2s(T.plank.x,T.plank.y);
  if(v.kind==='top')return topScreen(v.t);
  if(v.kind==='newTray')return newTrayPos();
  return null;
}
function isInv(kind,obj){return inv&&inv.kind===kind&&(obj===undefined||inv.t===obj||inv.idx===obj)}
function suggestSpot(t){
  // where the demo hand drags a station/house to
  let best=-1,bd=Infinity;const lake=nearestCell(t.gx,t.gy,k=>T.cls[k]===CL.LAKE);
  for(let k=0;k<NN;k++){if(!standable(k)||T.edge[k]<1.2)continue;const p=cc(k);const d=hyp(p.x-t.gx,p.y-t.gy);if(d<3)continue;
    let sc=d;if(lake>=0){const nl=nearestCell(p.x,p.y,kk=>T.cls[kk]===CL.LAKE,2);sc+=nl>=0?0:20}else{sc=Math.abs(d-6)+(T.cls[k]===CL.HILL?0:2)}
    if(tops.some(o=>o!==t&&hyp(o.gx-p.x,o.gy-p.y)<2.5))continue;if(sc<bd){bd=sc;best=k}}
  return best>=0?cc(best):{x:t.gx+3,y:t.gy};
}
function startHint(){
  if(!inv)return;const p=invPos(inv);if(!p)return;let a=p,b=p,tap=false;
  if(inv.kind==='handle'){const h=inv.h;b=g2s(h.x+h.dx*5,h.y+h.dy*5)}
  else if(inv.kind==='oven'){tap=true}
  else if(inv.kind==='plank'){const g=T.plank.gap.line;const m=linePt(g,g.len/2);b=g2s(m.x,m.y)}
  else if(inv.kind==='top'){const s=suggestSpot(inv.t);b=g2s(s.x,s.y)}

/* ================= INPUT ================= */
let act=null;
function hitR(min,cells){return Math.max(min*S,TR.cell*cells)}
function newTrayPos(){const nt=T.newTray;if(!nt)return{x:-999,y:-999};const w=TR.side*0.32;return{x:LY.newTray.x+LY.newTray.dir*w*0.45*nt.vis+nt.off,y:LY.newTray.y}}
function pick(x,y){
  const P={x,y};const d=(q)=>hyp(q.x-x,q.y-y);
  if(phase==='town'||phase==='shape'){
    // shelf memories
    for(let i=0;i<gallery.length;i++){const r=shelfRect(i);if(x>=r.x&&x<=r.x+r.s&&y>=r.y&&y<=r.y+r.s)return{type:'thumb',i}}
  }
  if(phase==='town'){
    if(T.newTray&&T.newTray.vis>0.6&&d(newTrayPos())<hitR(44,3))return{type:'newTray'};
    if(T.plank&&!T.plank.carried&&d(g2s(T.plank.x,T.plank.y))<hitR(30,2.8))return{type:'plank'};
    let best=null,bd=Infinity;for(const t of tops){const q=topScreen(t);const dd=d({x:q.x,y:q.y-TR.cell*0.6});if(dd<hitR(26,2.3)&&dd<bd){bd=dd;best=t}}
    if(best)return{type:'top',t:best};
    if(T.staff){const q=g2s(T.staff.x,T.staff.y);if(d({x:q.x,y:q.y-TR.cell})<hitR(22,1.8))return{type:'staffT'}}
    if(T.train&&T.train.leg){const q=linePt(T.train.leg.line,T.train.s);const s=g2s(q.x,q.y);if(d(s)<hitR(24,2))return{type:'trainT'}}
  }
  if(phase==='shape'){
    let best=null,bd=Infinity;for(const t of tops){const q=topScreen(t);const dd=d(q);if(dd<hitR(26,2.2)&&dd<bd){bd=dd;best=t}}
    if(best)return{type:'top',t:best};
  }
  const ov=LY.oven;if(Math.abs(x-ov.x)<ov.sz*0.5&&y>ov.y-ov.sz*0.55&&y<ov.y+ov.sz*0.4)return{type:'oven'};
  if(phase==='shape'){
    if(d({x:LY.staff.x,y:LY.staff.y-Math.max(TR.cell*1.9,15*S)*1.0})<hitR(34,3))return{type:'staff'};
    if(d(LY.train)<hitR(30,2.6))return{type:'train'};
    const g=s2g(x,y);
    // pinch handles: generous grab
    const hs=handles();for(const h of hs){if(h.ok&&d(g2s(h.x,h.y))<hitR(30,2.6))return{type:'dough',gx:h.x,gy:h.y,g}}
    if(g.x>0&&g.y>0&&g.x<N&&g.y<N){

function update(dt){
  gameTime+=dt;
  inv=computeInvite();
  // idle demo hand: once per quiet stretch
  if(!hint&&!act&&!hintDone&&gameTime-lastInput>4.2&&inv&&(phase==='shape'||phase==='town')){startHint();hintDone=true}
  if(hint){hint.t+=dt;if(hint.t>2.4)hint=null}
  if(act&&act.kind==='dough'&&phase==='shape'){
    const g=s2g(act.x,act.y);let tx=clamp(g.x+act.off.x,1.3,N-1.3),ty=clamp(g.y+act.off.y,1.3,N-1.3);
    let dx=tx-act.f.x,dy=ty-act.f.y;const dl=hyp(dx,dy);
    if(dl>0.01){const steps=Math.ceil(dl/0.3);const sx=dx/steps,sy=dy/steps;
      for(let i=0;i<steps;i++){advect(act.f.x,act.f.y,sx,sy,act.len);act.f.x+=sx;act.f.y+=sy;act.len+=hyp(sx,sy)}
      act.dir.x=lerp(act.dir.x,dx/dl,0.3);act.dir.y=lerp(act.dir.y,dy/dl,0.3);const dn=hyp(act.dir.x,act.dir.y)||1;act.dir.x/=dn;act.dir.y/=dn;
      G.dirty=true;const s=g2s(act.f.x,act.f.y);if(Math.random()<0.5)flourPuff(s.x,s.y,1,25);flourStamp(s.x,s.y);
      rub(Math.min(0.32,0.05+dl/dt*0.012),Math.min(2600,320+act.len*95));
    }else rub(0.02,320+act.len*95);
  }
  for(let i=springs.length-1;i>=0;i--){const sp=springs[i];advect(sp.f.x,sp.f.y,sp.dx,sp.dy,1);sp.f.x+=sp.dx;sp.f.y+=sp.dy;G.dirty=true;if(--sp.n<=0)springs.splice(i,1)}
  // wiggles / decay
  oven.wig=Math.max(0,oven.wig-dt*2);tableStaff.sweep=Math.max(0,tableStaff.sweep-dt*1.5);trainToy.hop=Math.max(0,trainToy.hop-dt*2);
  tops.forEach(t=>{t.wig=Math.max(0,t.wig-dt*2);t.lift=lerp(t.lift,t.drag?1:0,dt*12)});gallery.forEach(g=>g.wig=Math.max(0,(g.wig||0)-dt*2));
  if(T.plank){T.plank.wig=Math.max(0,T.plank.wig-dt*2)}
  if(T.train&&T.train.hop)T.train.hop=Math.max(0,T.train.hop-dt*2);
  // oven smoke
  oven.smokeT-=dt;if(oven.smokeT<=0){oven.smokeT=phase==='baking'?0.12:0.9;const o=LY.oven;spawn({x:o.x+o.sz*0.22,y:o.y-o.sz*0.62,vx:rnd(-4,4)*S,vy:-rnd(12,22)*S,life:2.2,max:2.2,size:rnd(3,5)*S,kind:'smoke',g:-2*S,drag:0.99})}
  if(phase==='baking')updBake(dt);
  if(phase==='next')updNext(dt);
  if(phase==='town'){
    if(T.trainEnter<1)T.trainEnter=Math.min(1,T.trainEnter+dt*0.9);
    updStaff(dt);updVehicles(dt);updPeople(dt);
    for(const b of T.bridges)b.t=Math.min(1,b.t+dt*2);
    if(T.night){T.dusk=Math.min(1,T.dusk+dt/4);T.nightT+=dt;
      T.stalls.forEach(s=>{if(T.dusk>0.5&&s.pop<1){s.pop=Math.min(1,s.pop+dt*2);if(s.pop>=1)SND.pop()}});
      T.lanterns.forEach(l=>{l.pop=Math.max(0,l.pop-dt*2)});
      if(T.dusk>=1&&!T.newTray)T.newTray={vis:0,off:0};
      festMusic(dt);
    }
    if(T.newTray){const nt=T.newTray;nt.vis=Math.min(1,nt.vis+dt*1.2);if(act&&act.kind==='newTray'){nt.off=clamp((act.x-act.x0)*LY.newTray.dir,-20*S,TR.side*0.6)*LY.newTray.dir}}
  }
  updParts(dt);
}

const KEY='pizzaRailTown.v1';
function enc(F){let s='';for(let i=0;i<F.length;i++)s+=String.fromCharCode(clamp(Math.round(F[i]*100),0,250));try{return btoa(s)}catch(e){return ''}}

function save(){
  try{
    const o={v:1,phase:phase==='town'||phase==='baking'?'town':'shape',m:enc(G.m),c:enc(G.c),strokes:G.strokes,
      tops:tops.map(t=>[t.onTray?1:0,+t.gx.toFixed(2),+t.gy.toFixed(2)]),br:T.bridges.map(b=>[+b.ax.toFixed(2),+b.ay.toFixed(2),+b.bx.toFixed(2),+b.by.toFixed(2)]),
      rel:T.relocations,hm:T.houseMoves,bb:T.bridgesBuilt,night:T.night?1:0,seed:T.seed,gal:gallery.map(g=>({cls:g.cls,rail:g.rail,hs:g.hs,st:g.st,night:g.night}))};
    localStorage.setItem(KEY,JSON.stringify(o));
  }catch(e){/* storage refused: keep playing */}
}
function load(){
  let s=null;try{s=localStorage.getItem(KEY)}catch(e){return false}

    const gal=Array.isArray(o.gal)?o.gal.filter(g=>g&&typeof g.cls==='string'&&g.cls.length===NN&&Array.isArray(g.rail)&&Array.isArray(g.hs)&&Array.isArray(g.st)).slice(0,4).map(g=>({cls:g.cls,rail:g.rail,hs:g.hs,st:g.st,night:g.night?1:0,can:null,wig:0})):[];
    G.m.set(m);G.c.set(c);G.strokes=Math.max(0,o.strokes|0);gallery=gal;updCentroid();G.dirty=true;
    o.tops.forEach((a,i)=>{if(!Array.isArray(a)||a.length!==3||!isFinite(a[1])||!isFinite(a[2]))throw 0;tops[i].onTray=!!a[0];tops[i].gx=clamp(+a[1],0.5,N-0.5);tops[i].gy=clamp(+a[2],0.5,N-0.5)});
    if(o.phase==='town'){
      computeTerrain();T.seed=(o.seed|0)||T.seed;T.baked=true;
      if(Array.isArray(o.br))o.br.forEach(b=>{if(Array.isArray(b)&&b.length===4&&b.every(isFinite)){const [ax,ay,bx,by]=b;for(let k=0;k<NN;k++){if(T.cls[k]!==CL.VAL)continue;const p=cc(k);if(segDist(p.x,p.y,ax,ay,bx,by)<0.85)T.bridged[k]=1}T.bridges.push({ax,ay,bx,by,t:1})}});
      // keep buildings on land after restore
      tops.forEach(t=>{const k=cellOf(t.gx,t.gy);if(!standable(k)){const nk=nearestCell(t.gx,t.gy,standable);if(nk>=0){t.gx=cc(nk).x;t.gy=cc(nk).y}}t.onTray=true});
      buildTerrainLayer();const keepBr=T.bridges,keepBd=T.bridged.slice();
      T.relocations=o.rel|0;T.houseMoves=o.hm|0;T.bridgesBuilt=o.bb|0;
      enterTown(false);T.bridges=keepBr;T.bridged.set(keepBd);rebuildNetwork(true);
      if(o.night){T.dusk=0;startEvening()}
    }
    return true;
  }catch(e){
    try{localStorage.removeItem(KEY)}catch(_){}
    // reset to a clean start
    initDough();gallery=[];tops.forEach(t=>{t.onTray=false});T.baked=false;phase='shape';
    return false;
  }
}

/* ================= LOOP ================= */
let raf=0,last=0;
function frame(ts){
  raf=requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  try{update(dt);draw()}catch(e){if(!frame.err){frame.err=1;console.warn(e)}}
}
function start(){if(raf)return;raf=requestAnimationFrame(ts=>{last=ts;frame(ts)})}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();if(act)endAct(true);rub(0,300);if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend().catch(()=>{})}
  else{lastInput=gameTime;if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});start()}
});
let rzT=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(act)endAct(true);layout()},60)});
window.addEventListener('orientationchange',()=>{setTimeout(()=>{if(act)endAct(true);layout()},200)});

initDough();
layout();
load();
if(T.baked)buildTerrainLayer();
start();

// read-only probe for automated checks (no cheats)
window.__pz={get phase(){return phase},get strokes(){return G.strokes},get night(){return T.night},get theme(){return T.theme},
  stats(){const c=[0,0,0,0,0];for(let k=0;k<NN;k++)c[T.cls[k]]++;return c},
  doughStats(){let thin=0,hole=0,thick=0,n=0;for(let k=0;k<NN;k++){if(G.c[k]<0.5)continue;n++;const t=G.m[k]/G.c[k];if(t<TH.val)hole++;else if(t<TH.lake)thin++;else if(t>=TH.hill)thick++}return{n,thin,hole,thick}},
  net(){const n=T.net;if(!n)return null;return{main:n.main.map(l=>l.kind+':'+l.line.len.toFixed(1)),houses:n.houses.map(h=>h?h.map(l=>l.kind+':'+l.line.len.toFixed(1)).join(','):'none'),gaps:n.gaps.length,connected:n.connected}},
  people(){return T.people.map(p=>p.state)},
  tops(){return tops.map(t=>({k:t.kind,on:t.onTray,x:+t.gx.toFixed(1),y:+t.gy.toFixed(1)}))},
  g2s(x,y){return g2s(x,y)},
  plank(){return T.plank?{x:T.plank.x,y:T.plank.y,gap:T.plank.gap.line.p.map(p=>[+p.x.toFixed(1),+p.y.toFixed(1)])}:null},
  staff(){return T.staff?{mode:T.staff.mode,x:+T.staff.x.toFixed(1),y:+T.staff.y.toFixed(1)}:null},
  bridges(){return T.bridges.length},gallery(){return gallery.length},inv(){return inv?inv.kind:null},
  cls(){return Array.from(T.cls)},ht(){return Array.from(T.ht).map(v=>+v.toFixed(2))},
  hint(){return !!hint},rel(){return T.relocations},armed(){return T.armed},
  train(){return T.train&&T.train.leg?{s:+T.train.s.toFixed(1),len:+T.train.leg.line.len.toFixed(1),riders:T.train.riders.length}:null},
  newTray(){return T.newTray?newTrayPos():null},parts(){return parts.length},ly(){return JSON.parse(JSON.stringify(LY))},topPos(i){return topScreen(tops[i])},
  gapMid(){const g=T.net&&T.net.gaps[0];if(!g)return null;const m=linePt(g.line,g.line.len/2);return g2s(m.x,m.y)},plankS(){return T.plank?g2s(T.plank.x,T.plank.y):null},staffS(){return T.staff?g2s(T.staff.x,T.staff.y):null},dusk(){return T.dusk},audio(){return AU.ctx?AU.ctx.state:'none'},running(){return !!raf},gt(){return gameTime}};
})();

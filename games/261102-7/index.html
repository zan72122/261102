/* ============================================================

// ---------- 基本ユーティリティ ----------
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const easeOutBack = t => { const c = 1.9; t = clamp(t, 0, 1) - 1; return 1 + t * t * ((c + 1) * t + c); };
const hyp = Math.hypot;
let rngState = 1;
function srand(s) { rngState = (s >>> 0) || 1; }
function rnd() {
  let t = (rngState = (rngState + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rnd();
const mr = (a, b) => a + (b - a) * Math.random();
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const yawOf = (dx, dz) => Math.atan2(-dz, dx);         // +X前向きモデル用
const yawZ = (dx, dz) => Math.atan2(dx, dz);           // +Z前向きモデル用
function angDiff(a, b) { let d = b - a; while (d > PI) d -= TAU; while (d < -PI) d += TAU; return d; }
function approach(v, t, up, down, dt) { return v < t ? Math.min(t, v + up * dt) : Math.max(t, v - down * dt); }
const C = h => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];

// 色（黄土・深緑・赤・クリーム）
const COL = {
  ochre: C(0xc9953f), ochreD: C(0x9c6f2a), green: C(0x3e5c36), greenL: C(0x5f7f45), greenD: C(0x2c4428),
  red: C(0xb5432f), redD: C(0x8a2f22), cream: C(0xefe2c2), creamD: C(0xd9c9a2), white: C(0xf7f2e6),
  wood: C(0xa8743f), woodD: C(0x7a5130), woodL: C(0xc9a06a), table: C(0x8a5a33),
  stone: C(0x9a958a), stoneD: C(0x6f6a62), metal: C(0xb8b6b0), dark: C(0x2e2a26), black: C(0x1d1b19),
  water: C(0x3f7f7a), skin: C(0xf0c8a0), skin2: C(0xd9a57a), blue: C(0x3f5f8a), yellow: C(0xf2c230),
  orange: C(0xe07a2a), pink: C(0xf0a6b4), win: C(0xffd98a), ballast: C(0x8b8174), sand: C(0xcbb48a)

// ---------- 行列 (列優先) ----------
const M4 = {
  make() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  _t: new Float32Array(16),
  mul(o, a, b) {
    const t = M4._t;
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
      t[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    o.set(t); return o;
  },
  persp(o, fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2); o.fill(0); o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o; },
  ortho(o, l, r, b, t, n, f) { o.fill(0); o[0] = 2 / (r - l); o[5] = 2 / (t - b); o[10] = -2 / (f - n); o[12] = -(r + l) / (r - l); o[13] = -(t + b) / (t - b); o[14] = -(f + n) / (f - n); o[15] = 1; return o; },
  lookAt(o, e, c, u) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; let l = hyp(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx; l = hyp(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0; o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0; o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
    o[12] = -(xx * e[0] + xy * e[1] + xz * e[2]); o[13] = -(yx * e[0] + yy * e[1] + yz * e[2]); o[14] = -(zx * e[0] + zy * e[1] + zz * e[2]); o[15] = 1; return o;
  },
  // T * Ry(yaw) * Rz(rz) * Rx(rx) * S
  trs(o, x, y, z, yaw, sx, sy, sz, rz, rx) {
    rz = rz || 0; rx = rx || 0;
    const cy = Math.cos(yaw), sy_ = Math.sin(yaw), cz = Math.cos(rz), sz_ = Math.sin(rz), cx = Math.cos(rx), sx_ = Math.sin(rx);
    const a00 = cy * cz, a01 = -cy * sz_, a02 = sy_, a10 = sz_, a11 = cz, a12 = 0, a20 = -sy_ * cz, a21 = sy_ * sz_, a22 = cy;
    o[0] = a00 * sx; o[1] = a10 * sx; o[2] = a20 * sx; o[3] = 0;
    o[4] = (a01 * cx + a02 * sx_) * sy; o[5] = (a11 * cx + a12 * sx_) * sy; o[6] = (a21 * cx + a22 * sx_) * sy; o[7] = 0;
    o[8] = (-a01 * sx_ + a02 * cx) * sz; o[9] = (-a11 * sx_ + a12 * cx) * sz; o[10] = (-a21 * sx_ + a22 * cx) * sz; o[11] = 0;
    o[12] = x; o[13] = y; o[14] = z; o[15] = 1; return o;
  }
};

// ---------- メッシュビルダー ----------
// 頂点: pos3 nrm3 col4(rgb+glow) mat1  = 11 float
// mat: 0塗装 1木 2金属 3樹脂 4水 5紙 6芝(フロック) 7石
class MB {
  constructor(cap) { this.a = new Float32Array((cap || 2048) * 11); this.n = 0; this.M = M4.make(); this.stack = []; this.tmp = M4.make(); }
  reset() { this.n = 0; this.M = M4.make(); this.stack.length = 0; return this; }
  ensure(k) {
    if ((this.n + k) * 11 > this.a.length) {
      const b = new Float32Array(Math.max(this.a.length * 2, Math.ceil((this.n + k) * 11 * 1.5)));
      b.set(this.a.subarray(0, this.n * 11)); this.a = b;
    }
  }
  push() { this.stack.push(this.M.slice()); return this; }
  pop() { this.M = this.stack.pop(); return this; }
  tf(x, y, z, yaw, sx, sy, sz, rz, rx) { M4.trs(this.tmp, x, y, z, yaw || 0, sx || 1, sy || 1, sz || 1, rz || 0, rx || 0); M4.mul(this.M, this.M, this.tmp); return this; }
  v(x, y, z, nx, ny, nz, c, g, m) {
    const M = this.M, a = this.a, i = this.n * 11;
    a[i] = M[0] * x + M[4] * y + M[8] * z + M[12];
    a[i + 1] = M[1] * x + M[5] * y + M[9] * z + M[13];
    a[i + 2] = M[2] * x + M[6] * y + M[10] * z + M[14];
    let tx = M[0] * nx + M[4] * ny + M[8] * nz, ty = M[1] * nx + M[5] * ny + M[9] * nz, tz = M[2] * nx + M[6] * ny + M[10] * nz;
    const l = hyp(tx, ty, tz) || 1; a[i + 3] = tx / l; a[i + 4] = ty / l; a[i + 5] = tz / l;
    a[i + 6] = c[0]; a[i + 7] = c[1]; a[i + 8] = c[2]; a[i + 9] = g; a[i + 10] = m;
    this.n++;
  }
  tri(p0, p1, p2, c, g, m) {
    this.ensure(3);
    const ux = p1[0] - p0[0], uy = p1[1] - p0[1], uz = p1[2] - p0[2], wx = p2[0] - p0[0], wy = p2[1] - p0[1], wz = p2[2] - p0[2];
    const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
    this.v(p0[0], p0[1], p0[2], nx, ny, nz, c, g, m); this.v(p1[0], p1[1], p1[2], nx, ny, nz, c, g, m); this.v(p2[0], p2[1], p2[2], nx, ny, nz, c, g, m);
  }
  quad(p0, p1, p2, p3, c, g, m) { this.tri(p0, p1, p2, c, g, m); this.tri(p0, p2, p3, c, g, m); }
  // 底面中心(x,y,z) 幅w(x) 高h 奥行d(z)
  box(x, y, z, w, h, d, c, m, g, noBottom) {
    m = m || 0; g = g || 0;
    const x0 = x - w / 2, x1 = x + w / 2, y0 = y, y1 = y + h, z0 = z - d / 2, z1 = z + d / 2;
    this.quad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], c, g, m); // top
    this.quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], c, g, m); // +z
    this.quad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], c, g, m); // -z
    this.quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], c, g, m); // +x
    this.quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], c, g, m); // -x
    if (!noBottom) this.quad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], c, g, m);
  }
  cyl(x, y, z, r, h, seg, c, m, g, rTop, noCaps) {
    m = m || 0; g = g || 0; const rt = rTop === undefined ? r : rTop;
    for (let i = 0; i < seg; i++) {
      const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      const p0 = [x + c0 * r, y, z + s0 * r], p1 = [x + c1 * r, y, z + s1 * r], p2 = [x + c1 * rt, y + h, z + s1 * rt], p3 = [x + c0 * rt, y + h, z + s0 * rt];
      // 側面は滑らかな法線
      this.ensure(6);
      const sl = (r - rt) / h;
      const n0 = [c0, sl, s0], n1 = [c1, sl, s1];
      this.v(p0[0], p0[1], p0[2], n0[0], n0[1], n0[2], c, g, m); this.v(p2[0], p2[1], p2[2], n1[0], n1[1], n1[2], c, g, m); this.v(p1[0], p1[1], p1[2], n1[0], n1[1], n1[2], c, g, m);
      this.v(p0[0], p0[1], p0[2], n0[0], n0[1], n0[2], c, g, m); this.v(p3[0], p3[1], p3[2], n0[0], n0[1], n0[2], c, g, m); this.v(p2[0], p2[1], p2[2], n1[0], n1[1], n1[2], c, g, m);
      if (!noCaps) {
        if (rt > 0.0001) this.tri([x, y + h, z], [x + c1 * rt, y + h, z + s1 * rt], [x + c0 * rt, y + h, z + s0 * rt], c, g, m);
        this.tri([x, y, z], [x + c0 * r, y, z + s0 * r], [x + c1 * r, y, z + s1 * r], c, g, m);
      }
    }
  }
  sph(x, y, z, rx, ry, rz, seg, c, m, g) {
    m = m || 0; g = g || 0; const st = Math.max(3, seg >> 1);
    for (let j = 0; j < st; j++) {
      const t0 = j / st * PI, t1 = (j + 1) / st * PI;
      for (let i = 0; i < seg; i++) {
        const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
        const P = (t, a) => [Math.sin(t) * Math.cos(a), Math.cos(t), Math.sin(t) * Math.sin(a)];
        const q = [P(t0, a0), P(t0, a1), P(t1, a1), P(t1, a0)];
        this.ensure(6);
        const idx = [0, 2, 1, 0, 3, 2];
        for (const k of idx) { const n = q[k]; this.v(x + n[0] * rx, y + n[1] * ry, z + n[2] * rz, n[0] / rx, n[1] / ry, n[2] / rz, c, g, m); }
      }

  // 切妻屋根: 棟はx方向, 幅w(x) 奥行d(z) 高さh, 厚みあり
  roof(x, y, z, w, h, d, c, m, g, cEnd) {
    m = m === undefined ? 5 : m; g = g || 0; const ce = cEnd || c;
    const x0 = x - w / 2, x1 = x + w / 2, z0 = z - d / 2, z1 = z + d / 2, yt = y + h;
    this.quad([x0, y, z1], [x1, y, z1], [x1, yt, z], [x0, yt, z], c, g, m);
    this.quad([x1, y, z0], [x0, y, z0], [x0, yt, z], [x1, yt, z], c, g, m);
    this.tri([x1, y, z1], [x1, y, z0], [x1, yt, z], ce, g, m);
    this.tri([x0, y, z0], [x0, y, z1], [x0, yt, z], ce, g, m);
    this.quad([x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1], c, g, m);
  }
  disc(x, y, z, r, seg, c, m, g, rz) {
    m = m || 0; g = g || 0; const r2 = rz || r;
    for (let i = 0; i < seg; i++) { const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU; this.tri([x, y, z], [x + Math.cos(a1) * r, y, z + Math.sin(a1) * r2], [x + Math.cos(a0) * r, y, z + Math.sin(a0) * r2], c, g, m); }
  }
  // 三角の小旗 (縦)
  pennant(x, y, z, s, c, yaw) {
    this.push().tf(x, y, z, yaw || 0);
    this.tri([0, 0, -s * 0.5], [0, 0, s * 0.5], [0, -s, 0], c, 0, 5);
    this.pop();
  }
}

// ============================================================
//  レンダラ (WebGL1)
// ============================================================
const cv = document.getElementById('gl');
const uiCv = document.getElementById('ui');
const ui = uiCv.getContext('2d');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, depth: true, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' })
  || cv.getContext('experimental-webgl');
const GLOK = !!gl;

function mkShader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); }
  return s;
}
function mkProg(vs, fs, attrs) {
  const p = gl.createProgram();
  gl.attachShader(p, mkShader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fs));
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.warn(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace('[0]', '')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}

const HP = GLOK && gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT).precision > 0 ? 'highp' : 'mediump';

const VS_MAIN = `
attribute vec3 aPos; attribute vec3 aNrm; attribute vec4 aCol; attribute float aMat;
uniform mat4 uVP; uniform mat4 uM; uniform mat4 uLVP;
varying vec3 vW; varying vec3 vN; varying vec4 vC; varying float vM; varying vec4 vS;
void main(){ vec4 w=uM*vec4(aPos,1.0); vW=w.xyz; vN=mat3(uM)*aNrm; vC=aCol; vM=aMat; vS=uLVP*w; gl_Position=uVP*w; }`;
const FS_MAIN = `
precision ${HP} float;
uniform sampler2D uSh; uniform vec3 uL; uniform vec3 uLC; uniform vec3 uSky; uniform vec3 uGnd; uniform vec3 uEye;
uniform vec3 uGK; uniform vec4 uTint; uniform float uT; uniform float uAO; uniform float uShTex;
varying vec3 vW; varying vec3 vN; varying vec4 vC; varying float vM; varying vec4 vS;
float h3(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n3(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float unpack(vec4 c){ return dot(c, vec4(1.0, 1.0/255.0, 1.0/65025.0, 1.0/16581375.0)); }
float shadowF(float bias){
  vec3 p=vS.xyz/vS.w*0.5+0.5;
  if(p.x<0.0||p.x>1.0||p.y<0.0||p.y>1.0) return 1.0;
  float s=0.0; float t=uShTex*1.2;
  s+= (p.z-bias > unpack(texture2D(uSh,p.xy+vec2(-t,-t)))) ? 0.0 : 1.0;
  s+= (p.z-bias > unpack(texture2D(uSh,p.xy+vec2( t,-t)))) ? 0.0 : 1.0;
  s+= (p.z-bias > unpack(texture2D(uSh,p.xy+vec2(-t, t)))) ? 0.0 : 1.0;
  s+= (p.z-bias > unpack(texture2D(uSh,p.xy+vec2( t, t)))) ? 0.0 : 1.0;
  return s*0.25;
}
void main(){
  vec3 n=normalize(vN); vec3 base=vC.rgb*uTint.rgb; float m=vM;
  float spec=0.04; float shin=14.0; float twoSide=0.0;
  float g=n3(vW*61.0);
  if(m<0.5){ base*=0.92+0.12*g; }
  else if(m<1.5){ vec3 q=vW; if(abs(n.x)>0.7) q=q.zyx; float w=n3(vec3(q.x*0.9,q.y*5.0,q.z*9.0)); float rings=sin(q.z*30.0+q.y*20.0+w*6.0)*0.5+0.5; base*=0.86+0.12*rings+0.06*g; spec=0.1; shin=24.0; }
  else if(m<2.5){ base*=0.94+0.08*g; spec=1.1; shin=70.0; }
  else if(m<3.5){ base*=0.97+0.05*g; spec=0.28; shin=36.0; }
  else if(m<4.5){ float r=n3(vec3(vW.x*2.6+uT*0.35,uT*0.25,vW.z*2.6)); float r2=n3(vec3(vW.z*3.1,uT*0.3,vW.x*3.1-uT*0.3));
     n=normalize(n+vec3(r-0.5,0.0,r2-0.5)*0.35); spec=1.4; shin=110.0; base*=0.85+0.25*r; }
  else if(m<5.5){ base*=0.9+0.14*n3(vW*28.0); spec=0.02; twoSide=1.0; }
  else if(m<6.5){ float f=n3(vW*34.0); float f2=n3(vW*6.0); base*=0.70+0.22*f+0.22*f2+0.06*g; spec=0.0; }

const RX = 6.2, RZ = 3.35, STEP = 0.3, GAUGE = 0.34, END_GAP = 0.65;
const RING = (() => {
  const N = 720, pts = [], cum = [0];
  for (let i = 0; i <= N; i++) { const t = i / N * TAU; pts.push([RX * Math.cos(t), RZ * Math.sin(t), t]); if (i) cum.push(cum[i - 1] + hyp(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); }
  return { pts, cum, L: cum[N], N };
})();
function ringAt(a) {
  const L = RING.L; a = ((a % L) + L) % L;
  let lo = 0, hi = RING.N;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (RING.cum[m] <= a) lo = m; else hi = m; }
  const f = (a - RING.cum[lo]) / ((RING.cum[hi] - RING.cum[lo]) || 1);
  const t = lerp(RING.pts[lo][2], RING.pts[hi][2], f);
  const x = RX * Math.cos(t), z = RZ * Math.sin(t);
  let tx = -RX * Math.sin(t), tz = RZ * Math.cos(t); let l = hyp(tx, tz); tx /= l; tz /= l;
  let nx = x / (RX * RX), nz = z / (RZ * RZ); l = hyp(nx, nz); nx /= l; nz /= l;
  return { x, z, tx, tz, nx, nz };
}
const arcOfTheta = th => RING.cum[Math.round(((th % TAU + TAU) % TAU) / TAU * RING.N)];
function ringDist(x, z) { let best = 1e9; for (let i = 0; i < RING.N; i += 6) { const p = RING.pts[i]; const d = hyp(x - p[0], z - p[1]); if (d < best) best = d; } return best; }

function genLayout(seed) {
  srand(seed);
  const L = RING.L, d = rnd() < 0.5 ? 1 : -1, sp = L / 8;
  const arc0 = arcOfTheta(rr(0.6, 0.76) * PI);
  let rest;
  for (let tries = 0; tries < 50; tries++) {
    rest = shuffle(['bakery', 'toy', 'plaza', 'pond', 'house2', 'grove']);
    if (rest[0] !== 'pond' && rest[0] !== 'grove' && rest[5] !== 'pond') break;
  }
  const order = ['house1'].concat(rest);
  const LY = { seed, d, arc0, places: {}, trees: [], obstacles: [], benches: [], order };
  const mk = (type, k) => {
    const arc = arc0 + d * (k * sp + (k > 0 ? rr(-0.2, 0.2) : 0));
    const r = ringAt(arc);
    return { type, arc, x: r.x, z: r.z, tx: r.tx * d, tz: r.tz * d, nx: r.nx, nz: r.nz };
  };
  const P = LY.places;
  P.station = mk('station', 0);
  for (let k = 1; k < 8; k++) P[order[k - 1]] = mk(order[k - 1], k);
  const ob = (x, z, r, tag) => LY.obstacles.push({ x, z, r, tag });
  for (const key of ['house1', 'house2', 'bakery', 'toy']) {
    const p = P[key]; let off = 1.75;
    const half = key.startsWith('house') ? 0.8 : 0.9;
    for (let i = 0; i < 12; i++) { const bx = p.x + p.nx * off, bz = p.z + p.nz * off; if (Math.abs(bx) < BW - 0.4 - half && Math.abs(bz) < BD - 0.3 - half) break; off -= 0.08; }
    p.bx = p.x + p.nx * off; p.bz = p.z + p.nz * off; p.yaw = yawZ(-p.nx, -p.nz);
    const dd = half + 0.32;
    p.door = { x: p.bx - p.nx * dd, z: p.bz - p.nz * dd };
    p.trig = { x: p.x + p.nx * 0.3, z: p.z + p.nz * 0.3 };
    p.stake = { x: p.x, z: p.z };
    ob(p.bx, p.bz, key.startsWith('house') ? 1.0 : 1.12, key);
    ob(p.bx + p.tx * 0.55, p.bz + p.tz * 0.55, 0.75, key); ob(p.bx - p.tx * 0.55, p.bz - p.tz * 0.55, 0.75, key);

    const loc = (lx, lz) => { const c = Math.cos(p.yaw), s = Math.sin(p.yaw); return { x: p.bx + lx * c + lz * s, z: p.bz - lx * s + lz * c }; };
    p.loc = loc;
    p.tables = [loc(-0.75, 0.35), loc(0.75, 0.35), loc(0, -0.6)];
    p.door = loc(0, 0.75);
    p.trig = { x: p.x + p.nx * 0.35, z: p.z + p.nz * 0.35 };
    p.stake = { x: p.x, z: p.z };
    for (const t of p.tables) ob(t.x, t.z, 0.42, 'plaza');

    for (const side of [-1, 1]) for (const s2 of [-1, 1]) {
      let rad = 2.55; let bx, bz;
      for (let i = 0; i < 10; i++) { bx = p.x + p.nx * side * rad + p.tx * s2 * 0.85; bz = p.z + p.nz * side * rad + p.tz * s2 * 0.85; if (Math.abs(bx) < BW - 0.5 && Math.abs(bz) < BD - 0.5) break; rad -= 0.1; }

      LY.trees.push({ x, z, k: i === 0 ? 1 : 0, s: rr(0.9, 1.25) }); ob(x, z, 0.38, 'tree');
    }
  }
  { // 駅

    p.bx = p.x + p.nx * 0.78; p.bz = p.z + p.nz * 0.78; p.yaw = yawZ(-p.nx, -p.nz);
    p.trig = { x: p.x, z: p.z }; p.door = { x: p.x + p.nx * 0.5, z: p.z + p.nz * 0.5 };

let BASECAM = { tgt: [0, 0, 0], dist: 25 };

}
function fitCamera() {

  const sa = readSafe(); const m = 6;

      const mid = (lo + hi) / 2; camCompute(tgt, CAM.yaw, CAM.pitch, mid);
      let ok = true; for (const p of pts) { const s = project(p[0], p[1], p[2]); if (s[2] <= 0 || s[0] < R.l || s[0] > R.r || s[1] < R.t || s[1] > R.b) { ok = false; break; } }

    for (const p of pts) { const s = project(p[0], p[1], p[2]); x0 = Math.min(x0, s[0]); x1 = Math.max(x1, s[0]); y0 = Math.min(y0, s[1]); y1 = Math.max(y1, s[1]); }

  setTimeScale(s) { G.timeScale = s; },
  advance(sec) { const n = Math.ceil(sec * 60); for (let i = 0; i < n; i++) update(1 / 60); render(); },
  sim(sec) { const n = Math.ceil(sec * 60); for (let i = 0; i < n; i++) update(1 / 60); applyCamera(0); },
  state() {
    const T = G.train;
    return { cycle: G.cycle, closed: G.closed, laps: G.laps, mode: T.mode, track: T.tr.id, s: T.s, cargo: T.cargo.slice(), riders: T.riders.length, lit: T.lit,
      tracks: G.tracks.map(t => ({ id: t.id, len: t.len, n: t.pts.length, end: t.end ? t.end.tr.id : null, start: t.start ? t.start.tr.id : null, marks: t.marks.map(m => m.tg.kind + ':' + (m.tg.p.type)) })),
      fest: { stall: G.fest.stall, feast: G.fest.feast, flags: G.fest.stationFlags, pending: G.fest.pendingFlags, theme: G.fest.theme, growth: G.fest.growth.map(g => g.type), built: G.fest.built, yagura: !!G.fest.yagura },
      stake: G.stake ? { key: G.stake.key, x: G.stake.x, z: G.stake.z } : null, worker: { x: G.worker.x, z: G.worker.z }, env: ENV.k, people: G.people.length,
      benches: G.L.benches.map(b => ({ side: b.side, crowd: b.crowd, sit: b.sitters.filter(s => s.sit).length })), demo: !!G.demo, parts: G.parts.length };
  }
};
boot();

</script>
</body>
</html>

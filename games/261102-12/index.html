// ---------------------------------------------------------------- utils

// 輪郭付きの太い線（手足など）

  spin() { tone(600, 1.2, { to: 1200, sl: 1.2, v: .05, vib: 12 }); },
  reveal() { [392, 494, 587, 784].forEach((f, i) => tone(f, 1.4, { ty: 'triangle', v: .08, a: .1, dl: i * .12 })); noise(1.4, { f: 400, to: 3000, q: .7, v: .05 }); },
  nope() { tone(240, .12, { to: 200, v: .1 }); },
  arrive() { tone(1175, .12, { v: .045 }); tone(1568, .16, { v: .04, dl: .09 }); },
  refill() { tone(880, .08, { ty: 'triangle', v: .045 }); },
  tap() { tone(700, .06, { ty: 'triangle', v: .06 }); },
  giggle() { [988, 1175, 988, 1319].forEach((f, i) => tone(f, .07, { ty: 'triangle', v: .06, dl: i * .07 })); },
  demoTap() { tone(900, .05, { ty: 'triangle', v: .03 }); },
};

// =====================================================================
//  入力（Pointer Events・一本指・複数指でも壊れない）
// =====================================================================
const PTRS = new Map();
function handleTap(p) {
  const st = G.st, T = L.t;
  let best = -1, bd = 1e9;
  for (let i = 0; i < 6; i++) { const s = T.slots[i], d = Math.hypot(p.x - s[0], p.y - (s[1] + 2)); if (d < T.hitR && d < bd) { bd = d; best = i; } }
  if (best >= 0) { if (st.shelf[best].stack.length) trySell(best); else SFX.tap(); return; }
  const tp = trayPos();
  if (Math.abs(p.x - tp.x) < 50 && p.y > tp.y - 26 && p.y < tp.y + 56) { st.trayWig = G.T; SFX.tap(); return; }
  for (const c of G.cust) {
    if (!c || c.state === 'leave') continue;
    const cp = custPos(c), s = custS(), b = bubbleRect(c);
    const inBody = Math.abs(p.x - cp.x) < 44 * s && p.y < cp.y + 6 && p.y > cp.y - 178 * s;
    const inBub = c.state === 'wait' && Math.abs(p.x - b.x) < b.w / 2 && Math.abs(p.y - b.y) < b.h / 2;
    if (inBody || inBub) { c.wig = G.T; c.bubP = G.T; SFX.tap(); return; }
  }
  const sh = T.shop;
  if (Math.abs(p.x - sh.x) < 46 && p.y < sh.y && p.y > sh.y - 176) { G.shop.wig = G.T; SFX.giggle(); return; }
  const sg = T.sign;
  if (Math.abs(p.x - sg.x) < sg.w / 2 + 10 && Math.abs(p.y - sg.y) < sg.h / 2 + 10) { st.signWig = G.T; SFX.tap(); return; }
  const ms = st.medals || [];
  for (let i = 0; i < ms.length && i < 2; i++) { const m = T.medals[i]; if (Math.hypot(p.x - m[0], p.y - m[1]) < 32) { ms[i].wig = G.T; SFX.signBlink(); return; } }
  G.stats.other++;
}
function onDown(e) {
  if (e.cancelable) e.preventDefault();
  if (layoutDirty) doLayout();
  const p = s2v(e.clientX, e.clientY);
  PTRS.set(e.pointerId, p);
  G.stats.taps++;
  G.lastInput = G.T; G.demo = null;
  try {
    if (G.cine) burst(p.x, p.y, 3, [C.yel, C.white], 'star', 80, 3);
    else handleTap(p);
  } catch (err) { G.errors.push(String(err && err.stack || err)); }
  auInit();
}
function onUp(e) { PTRS.delete(e.pointerId); auInit(); }
function onCancel(e) { PTRS.delete(e.pointerId); }
cv.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointerup', onUp, { passive: true });
window.addEventListener('pointercancel', onCancel, { passive: true });
const stopEv = e => { if (e.cancelable) e.preventDefault(); };
document.addEventListener('touchstart', stopEv, { passive: false });
document.addEventListener('touchmove', stopEv, { passive: false });
document.addEventListener('touchend', e => { stopEv(e); auInit(); }, { passive: false });
document.addEventListener('gesturestart', stopEv, { passive: false });
document.addEventListener('gesturechange', stopEv, { passive: false });
document.addEventListener('gestureend', stopEv, { passive: false });
document.addEventListener('dblclick', stopEv, { passive: false });
document.addEventListener('contextmenu', stopEv);
document.addEventListener('selectstart', stopEv);
document.addEventListener('wheel', stopEv, { passive: false });

// =====================================================================
//  ループ（requestAnimationFrame のみ・非表示で停止）
// =====================================================================
function drawZoom() {
  const e = clamp(G.zoom, 0, 1), g = coinGeom();
  const mx = (L.vx0 + L.vx1) / 2, my = (L.vy0 + L.vy1) / 2;
  const cx = lerp(g.x, mx, eIO(e)), cy = lerp(g.y, my, eIO(e));
  const R1 = Math.hypot(L.vx1 - L.vx0, L.vy1 - L.vy0) / 2 / .8 * 1.06;
  const r = lerp(g.r, R1, e);
  ctx.save();
  bp(); cir(cx, cy, r * .8); ctx.clip();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(nextBG(G.next), 0, 0);
  setV();
  drawWorld(G.next, false);
  ctx.restore();
  setV(); ink(LW * 1.3);
  bp(); cir(cx, cy, r); ctx.moveTo(cx + r * .8, cy); ctx.arc(cx, cy, r * .8, 0, TAU, true); ctx.fillStyle = C.gold; ctx.fill(); ctx.stroke();
  ctx.save(); ctx.strokeStyle = C.goldL; ctx.lineWidth = r * .05; arcS(cx, cy, r * .9, 0, TAU); ctx.restore();
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + G.T; star4(cx + Math.cos(a) * r * .9, cy + Math.sin(a) * r * .9, 6 + r * .02, C.white); }
}
function update(dt) {
  G.T += dt; G.frame++;
  stepScripts();
  tweenUpdate();
  directorUpdate();
  refillUpdate();
  custUpdate();
  shopUpdate();
  moversUpdate(dt);
  partsUpdate(dt);
  for (let i = G.panels.length - 1; i >= 0; i--) if (G.T - G.panels[i].t0 > 1.1) G.panels.splice(i, 1);
  checkCarp();
  G.guide = computeGuide();
  demoUpdate();
}
function draw() {
  if (layoutDirty) doLayout();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  blitBG(G.st);
  setV();
  drawWorld(G.st, true);
  for (const f of G.flyers) drawFlyer(f);
  for (const pn of G.panels) drawPanel(pn);
  drawParts();
  if (G.zoom > 0 && G.next) drawZoom();
  setV();
  drawDemo();
}
let raf = 0, lastTS = 0, running = !document.hidden;
const PERF = { n: 0, sum: 0, max: 0, recent: [] };
function frame(ts) {
  raf = 0;
  if (!running) return;
  let dt = lastTS ? (ts - lastTS) / 1000 : 1 / 60;
  lastTS = ts;
  dt = clamp(dt, 0, 1 / 20) * SPEED;
  const t0 = performance.now();
  try { update(dt); draw(); } catch (e) { G.errors.push(String(e && e.stack || e)); try { ctx.restore(); } catch (e2) { } }
  const ms = performance.now() - t0;
  PERF.n++; PERF.sum += ms; if (ms > PERF.max) PERF.max = ms;
  PERF.recent.push(ms); if (PERF.recent.length > 240) PERF.recent.shift();
  raf = requestAnimationFrame(frame);
}
function startLoop() { if (!raf && running) { lastTS = 0; raf = requestAnimationFrame(frame); } }
function pause() {
  running = false; if (raf) cancelAnimationFrame(raf); raf = 0;
  try { if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend().catch(() => {}); } catch (e) { }
}
function resume() { running = true; lastTS = 0; if (AU.ctx) auInit(); layoutDirty = true; startLoop(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else resume(); });
window.addEventListener('pagehide', pause);
window.addEventListener('pageshow', () => { if (!document.hidden) resume(); });
window.addEventListener('resize', () => { layoutDirty = true; });
window.addEventListener('orientationchange', () => { layoutDirty = true; });
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { layoutDirty = true; });

// ---------------------------------------------------------------- 起動
doLayout();
G.st = makeStreet(0, null);
seedCustomers(G.st);
startLoop();

// ---------------------------------------------------------------- 自動テスト用の窓口（画面には出ない）
window.__gf = {
  G, L, PERF, AU, SLOTK,
  v2s, s2v,
  slotScreen(i) { const p = slotP(i); return v2s(p.x, p.y); },
  kindSlot(k) { return SLOT_OF[k]; },
  guide() { const g = G.guide; return g ? { slot: g.slot, kind: SLOTK[g.slot], spot: g.c.spot, cust: g.c.kind } : null; },
  trayScreen() { const p = trayPos(); return v2s(p.x, p.y); },
  custScreen(i) { const c = G.cust[i]; if (!c) return null; const p = custPos(c); return v2s(p.x, p.y - 80 * custS()); },
  summary() {
    const st = G.st, tw = st.town;
    return {
      T: +G.T.toFixed(2), street: st.idx, theme: st.theme, cine: G.cine,
      shelf: st.shelf.map(s => s.stack.slice()),
      cust: G.cust.map(c => c ? { kind: c.kind, order: c.order.map(o => o.k + (o.done ? '*' : '')), state: c.state } : null),
      night: +tw.night.toFixed(2), signLit: tw.signLit, roofs: tw.roofs.length, carts: tw.carts.length, roadOpen: tw.roadOpen, first: tw.first,
      lanterns: lanternCount(st), nightServed: st.nightServed, carpPending: st.carpPending, carpSpawned: st.carpSpawned,
      disc: G.disc.slice(), log: G.log.slice(), memory: G.memory.streets.map(m => ({ best: m.best, first: m.first, roofs: m.roofs, carts: m.carts, t: m.t })),
      errors: G.errors.slice(), flyers: G.flyers.length, tray: G.tray ? G.tray.kind + ':' + G.tray.phase : null,
      demo: !!G.demo, scripts: G.scripts.length, sales: st.sales.slice(), best: st.best.slice(), prefer: st.prefer, emblem: st.emblem,
      res: Object.assign({}, st.res), stats: Object.assign({}, G.stats), particles: PT.length, audio: AU.ctx ? AU.ctx.state : 'none',
      zoom: G.zoom, fold: Object.assign({}, st.fold),
    };
  },
};
})();

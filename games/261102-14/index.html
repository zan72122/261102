<script>
'use strict';
(function(){
// ============================================================
//  かちん！おきがえロボのびっくり設計図ひろば  (dressup / blueprint)
// ============================================================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const safeEl=document.getElementById('safe');

let W=0,H=0,DPR=1,U=40,LW=1.5,TS=50,BS=80,IS=50,portrait=true;
const box={x0:0,y0:0,x1:0,y1:0};
let T=0,DT=1/60,lastT=0,raf=0,needLayout=true,lastInput=0,started=false;
const BGC='#1d4e89';
const WA=a=>'rgba(255,255,255,'+a+')';
const CA=a=>'rgba(170,230,255,'+a+')';
const CY='#aae6ff';
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------------------------------------------------------- layout table
// [portrait fx,fy] , [landscape fx,fy]  (fractions of the safe box)
const LA={
  robot:[[.5,.8],[.25,.62]],
  cloud:[[.7,.5],[.33,.13]],
  wheel:[[.17,.73],[.135,.64]],
  puddle:[[.5,.54],[.46,.62]],
  step:[[.5,.475],[.525,.62]],
  windmill:[[.9,.5],[.49,.1]],
  bigSpot:[[.16,.6],[.15,.18]],
  shelf0:[[.77,.875],[.22,.92]],
  shelf1:[[.92,.875],[.31,.92]],
  shelf2:[[.86,.76],[.40,.92]],
  tray0:[[.13,.965],[.05,.3]],
  tray1:[[.37,.965],[.05,.48]],
  tray2:[[.63,.965],[.05,.66]],
  tray3:[[.87,.965],[.05,.84]]
};
const RIVER=[[.3,.42],[.57,.69]]; // portrait: y range ; landscape: x range
const SITES=[
  {id:'P1',big:0,L:[[.12,.2],[.79,.86]],routes:['near']},
  {id:'P2',big:0,L:[[.37,.2],[.79,.64]],routes:['near','far']},
  {id:'P3',big:0,L:[[.62,.2],[.79,.42]],routes:['far','bridge']},
  {id:'B1',big:0,L:[[.87,.2],[.79,.2]],routes:['bridge']},
  {id:'C1',big:1,L:[[.18,.075],[.925,.8]],routes:[]},
  {id:'C2',big:1,L:[[.5,.075],[.925,.5]],routes:[]},
  {id:'C3',big:1,L:[[.82,.075],[.925,.2]],routes:[]}
];
const RT={
  near:[[['puddle'],['step'],[.3,.435],[.28,.39,1],[.28,.335,1],[.28,.27,1]],
        [['puddle'],['step'],[.555,.8],[.6,.82,1],[.645,.82,1],[.705,.82,1]]],
  far:[[['puddle'],['step'],[.6,.435],[.62,.39,1],[.62,.335,1],[.62,.27,1]],
       [['puddle'],['step'],[.555,.52],[.6,.5,1],[.645,.5,1],[.705,.5,1]]],
  bridge:[[[.68,.63],[.82,.44],[.82,.36],[.82,.27]],
          [[.38,.45],[.555,.37],[.63,.37],[.705,.37]]]
};
const STONES={near:[[[.28,.39],[.28,.335]],[[.6,.82],[.645,.82]]],far:[[[.62,.39],[.62,.335]],[[.6,.5],[.645,.5]]]};
const BRIDGE=[[[.82,.43],[.82,.29]],[[.565,.37],[.695,.37]]];
const POS={};
function Pf(p){return [box.x0+p[0]*(box.x1-box.x0),box.y0+p[1]*(box.y1-box.y0)];}

// ---------------------------------------------------------- state
const ITEM_IDS=['boots','umbrella','scarf','helmet','gloves'];
const items={};
ITEM_IDS.forEach((id,i)=>{items[id]={id,
  slots:id==='boots'?['feet','hands']:(id==='umbrella'||id==='helmet')?['head']:id==='scarf'?['neck']:['hands'],
  home:id==='boots'?'bootsHome':'tray'+(i-1),x:0,y:0,state:'home',slot:null,sq:0,sqv:0,lift:0,wob:0,vx:0,vy:0,
  pitch:[1,1.19,1.33,0.89,1.12][i]};});
const worn={head:null,neck:null,hands:null,feet:null};
const toys=['slide','swing','seesaw','spin'].map((id,i)=>({id,kind:id,where:i<3?'shelf':'none',shelf:i<3?i:-1,site:null,x:0,y:0,sq:0,sqv:0,bt:1,ph:Math.random()*6,wob:0,org:null}));
const bigs=['ferris','clock'].map((id,i)=>({id,kind:id,where:i===0?'spot':'none',site:null,x:0,y:0,sq:0,sqv:0,bt:1,ph:Math.random()*6,wob:0,ox:0,oy:0,org:null}));
const R={x:0,y:0,legE:0,legEv:0,jumpH:0,ph:0,walking:0,sq:0,sqv:0,tilt:0,tiltv:0,tiltT:3,blink:0,blinkT:2,
  expr:'idle',exprT:0,eyeX:0,eyeY:0,lookO:null,morph:0,morphv:0,redraw:0,flash:0,holding:null,act:null,busy:false,
  stomp:0,umbFlex:0,umbFlexv:0,umbOpen:0,boomX:0,boomY:0,hook:null,swing:0,swingv:0,clap:0,armUp:0,laughT:0};
const S={built:{near:false,far:false,bridge:false},bt:{near:1,far:1,bridge:1},route:null,
  rflash:{near:0,far:0,bridge:0},rpulse:{near:0,far:0,bridge:0},ever:{bootsFeet:false},
  comboJump:false,comboBridge:false,wearTime:{},rainBoost:0,wheelA:0,wheelV:0,millA:0,millV:0,windBoost:0,
  ropeRun:0,opened:false,openT:0,grand:false,grandT:0,clockTimer:-1,spinTimer:-1,demoDone:false,demo:null,
  hint:null,fireT:4,wob:{},invite:null,rainAcc:0,windAcc:0,lampFlash:0,dropSound:0};
let drag=null; // active one-finger drag
const parts=[];const PMAX=160;

// ---------------------------------------------------------- audio
const AU={ctx:null,master:null,noise:null};
function audioStart(){
  try{
    if(AU.ctx){ if(AU.ctx.state==='suspended'&&!document.hidden) AU.ctx.resume().catch(()=>{}); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c=new AC(); AU.ctx=c;
    AU.master=c.createGain(); AU.master.gain.value=0.6;
    const comp=c.createDynamicsCompressor(); AU.master.connect(comp); comp.connect(c.destination);
    const len=Math.floor(c.sampleRate*0.8); const b=c.createBuffer(1,len,c.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1; AU.noise=b;
    // unlock with silent buffer
    const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0);
    if(c.state==='suspended') c.resume().catch(()=>{});
  }catch(e){ AU.ctx=null; }
}
function tone(f,dur,o){
  const c=AU.ctx; if(!c||c.state==='closed'||document.hidden) return; o=o||{};
  try{
    const t=c.currentTime+(o.delay||0); const os=c.createOscillator(), g=c.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t);
    if(o.to) os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    const v=o.vol||0.15; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.006));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    os.connect(g); g.connect(AU.master); os.start(t); os.stop(t+dur+0.03);
  }catch(e){}
}
function noise(dur,o){
  const c=AU.ctx; if(!c||!AU.noise||c.state==='closed'||document.hidden) return; o=o||{};
  try{
    const t=c.currentTime+(o.delay||0); const s=c.createBufferSource(); s.buffer=AU.noise;
    const f=c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.setValueAtTime(o.f||1000,t);
    if(o.to) f.frequency.exponentialRampToValueAtTime(o.to,t+dur); f.Q.value=o.q||1;
    const g=c.createGain(); const v=o.vol||0.1; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.01)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(AU.master); s.start(t); s.stop(t+dur+0.03);
  }catch(e){}
}
const SFX={
  touch(p){p=p||1; tone(440*p,0.13,{type:'triangle',vol:0.16,to:620*p}); },
  tick(sp){ tone(260+Math.min(900,sp*0.9),0.045,{type:'triangle',vol:0.035}); },
  snap(){ tone(2093,0.07,{type:'triangle',vol:0.22}); tone(3136,0.1,{vol:0.12,delay:0.035}); noise(0.03,{f:5200,q:2,vol:0.18}); },
  success(){ [523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,0.3,{type:'triangle',vol:0.15,delay:i*0.085})); tone(1568,0.6,{vol:0.07,delay:0.34}); },
  back(){ tone(620,0.22,{vol:0.1,to:310}); },
  stomp(l){ tone(150-l*14,0.22,{vol:0.32,to:48}); noise(0.09,{f:380,q:1,vol:0.14}); },
  drip(){ tone(1300+Math.random()*800,0.05,{vol:0.035,to:880}); },
  splash(){ noise(0.28,{f:1700,q:0.7,vol:0.16,to:900}); },
  wind(){ noise(0.7,{f:600,q:0.7,vol:0.1,to:1500,att:0.15}); },
  creak(){ tone(95,0.4,{type:'sawtooth',vol:0.04,to:72}); },
  motor(up){ tone(up?160:340,0.65,{type:'square',vol:0.045,to:up?340:160}); },
  jump(){ tone(280,0.4,{vol:0.18,to:950}); },
  land(){ tone(210,0.16,{vol:0.24,to:100}); noise(0.06,{f:600,vol:0.08}); },
  hop(){ tone(500,0.09,{type:'triangle',vol:0.07,to:760}); },
  grab(){ tone(700,0.07,{type:'square',vol:0.06}); tone(1050,0.08,{type:'square',vol:0.05,delay:0.06}); },
  nope(){ tone(392,0.12,{vol:0.1,to:349}); tone(330,0.18,{vol:0.09,delay:0.12,to:311}); },
  boop(){ tone(330,0.1,{type:'triangle',vol:0.1,to:420}); },
  ripple(){ tone(880,0.06,{vol:0.03,to:700}); },
  clap(){ noise(0.05,{f:2400,q:1.5,vol:0.2}); noise(0.05,{f:2600,q:1.5,vol:0.16,delay:0.12}); },
  lamp(){ tone(1568,0.12,{vol:0.08}); tone(2093,0.16,{vol:0.06,delay:0.06}); },
  route(){ [784,988,1175].forEach((f,i)=>tone(f,0.12,{type:'triangle',vol:0.08,delay:i*0.05})); },
  chime(){ [1046.5,784,880,523.3].forEach((f,i)=>tone(f,0.7,{vol:0.1,delay:i*0.32})); },
  fanfare(){ const n=[523.3,659.3,784,1046.5,784,1046.5,1318.5]; n.forEach((f,i)=>{tone(f,0.32,{type:'triangle',vol:0.14,delay:i*0.13}); tone(f/2,0.32,{type:'sine',vol:0.08,delay:i*0.13});}); noise(0.5,{f:3000,q:0.5,vol:0.05,delay:0.9}); },
  pop(){ noise(0.12,{f:2600,q:0.8,vol:0.08}); tone(1200+Math.random()*800,0.18,{vol:0.05,to:600}); }
};

// ---------------------------------------------------------- layout
function readSafe(){
  const cs=getComputedStyle(safeEl);
  return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
}
let bgCv=null;
function layout(){
  // finish any running action so positions remain consistent
  if(drag) endDrag(drag.x,drag.y,true);
  fastForward();
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  const sf=readSafe();
  portrait=H>=W;
  box.x0=sf.l+8; box.x1=W-sf.r-8; box.y0=sf.t+8; box.y1=H-sf.b-8;
  const bw=box.x1-box.x0, bh=box.y1-box.y0;
  U=portrait?Math.min(bw/10.4,bh/19):Math.min(bh/11,bw/17);
  U=Math.max(18,U);
  LW=Math.max(1.3,U*0.042); TS=U*1.25; BS=U*2.1; IS=U*1.25;
  for(const k in LA) POS[k]=Pf(LA[k][portrait?0:1]);
  POS.bootsHome=[POS.robot[0]+1.85*U,POS.robot[1]-0.45*U];
  SITES.forEach(s=>{const p=Pf(s.L[portrait?0:1]); s.x=p[0]; s.y=p[1];});
  R.x=POS.robot[0]; R.y=POS.robot[1]; R.jumpH=0;
  idleBoom(true);
  snapAll();
  buildBG();
  needLayout=false;
}
function homeOf(it){const p=POS[it.home]; return {x:p[0],y:p[1]};}
function shelfPos(i){const p=POS['shelf'+i]; return {x:p[0],y:p[1]};}
function siteById(id){for(const s of SITES) if(s.id===id) return s; return null;}
function snapAll(){
  ITEM_IDS.forEach(id=>{const it=items[id]; const p=itemTarget(it); it.x=p.x; it.y=p.y;});
  toys.forEach(t=>{const p=toyTarget(t); if(p){t.x=p.x;t.y=p.y;}});
  bigs.forEach(b=>{const p=bigTarget(b); if(p){b.x=p.x;b.y=p.y;}});
}
function buildBG(){
  bgCv=document.createElement('canvas'); bgCv.width=cv.width; bgCv.height=cv.height;
  const g=bgCv.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle=BGC; g.fillRect(0,0,W,H);
  const step=U*0.5;
  g.lineWidth=1;
  for(let x=0,i=0;x<=W;x+=step,i++){g.strokeStyle=i%2?'rgba(255,255,255,0.05)':'rgba(255,255,255,0.11)'; g.beginPath(); g.moveTo(x+0.5,0); g.lineTo(x+0.5,H); g.stroke();}
  for(let y=0,i=0;y<=H;y+=step,i++){g.strokeStyle=i%2?'rgba(255,255,255,0.05)':'rgba(255,255,255,0.11)'; g.beginPath(); g.moveTo(0,y+0.5); g.lineTo(W,y+0.5); g.stroke();}
  // drawing frame
  g.strokeStyle='rgba(255,255,255,0.35)'; g.lineWidth=1.2;
  g.strokeRect(box.x0-4,box.y0-4,box.x1-box.x0+8,box.y1-box.y0+8);
  g.strokeStyle='rgba(255,255,255,0.18)';
  g.strokeRect(box.x0,box.y0,box.x1-box.x0,box.y1-box.y0);
  // corner marks
  g.strokeStyle='rgba(255,255,255,0.4)';
  const cm=U*0.4;[[box.x0,box.y0,1,1],[box.x1,box.y0,-1,1],[box.x0,box.y1,1,-1],[box.x1,box.y1,-1,-1]].forEach(c=>{g.beginPath();g.moveTo(c[0]+c[2]*cm,c[1]);g.lineTo(c[0],c[1]);g.lineTo(c[0],c[1]+c[3]*cm);g.stroke();});
  // river banks hatch + park plan
  const rv=RIVER[portrait?0:1];
  g.strokeStyle='rgba(255,255,255,0.13)'; g.lineWidth=1;
  if(portrait){
    const yn=Pf([0,rv[1]])[1], yf=Pf([0,rv[0]])[1];
    for(let x=-U;x<W+U;x+=U*0.28){ g.beginPath(); g.moveTo(x,yn); g.lineTo(x+U*0.2,yn+U*0.2); g.stroke(); g.beginPath(); g.moveTo(x,yf); g.lineTo(x+U*0.2,yf-U*0.2); g.stroke(); }
  }else{
    const xn=Pf([rv[0],0])[0], xf=Pf([rv[1],0])[0];
    for(let y=-U;y<H+U;y+=U*0.28){ g.beginPath(); g.moveTo(xn,y); g.lineTo(xn-U*0.2,y+U*0.2); g.stroke(); g.beginPath(); g.moveTo(xf,y); g.lineTo(xf+U*0.2,y+U*0.2); g.stroke(); }
  }
  // title-block-like lines (no text)
  g.strokeStyle='rgba(255,255,255,0.22)';
  if(portrait){ const y=Pf([0,.915])[1]; g.setLineDash([U*0.1,U*0.1]); g.beginPath(); g.moveTo(box.x0,y); g.lineTo(box.x1,y); g.stroke(); g.setLineDash([]); }
  else { const x=Pf([.1,0])[0]; g.setLineDash([U*0.1,U*0.1]); g.beginPath(); g.moveTo(x,box.y0); g.lineTo(x,box.y1); g.stroke(); g.setLineDash([]); }
}

// ---------------------------------------------------------- draw helpers
function L(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function poly(p,close){ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);if(close)ctx.closePath();ctx.stroke();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,TAU);ctx.stroke();}
function arc(x,y,r,a0,a1){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),a0,a1);ctx.stroke();}
function rectS(x,y,w,h){ctx.strokeRect(x,y,w,h);}
function dash(a,b){ctx.setLineDash([a,b]);}
function nodash(){ctx.setLineDash([]);}
function cross(x,y,r){L(x-r,y,x+r,y);L(x,y-r,x,y+r);}
function dimLine(x1,y1,x2,y2){L(x1,y1,x2,y2);const a=Math.atan2(y2-y1,x2-x1)+PI/4,t=U*0.1,c=Math.cos(a)*t,s=Math.sin(a)*t;L(x1-c,y1-s,x1+c,y1+s);L(x2-c,y2-s,x2+c,y2+s);}
function hatch(x,y,w,h,gap){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.beginPath();for(let i=-h;i<w;i+=gap){ctx.moveTo(x+i,y+h);ctx.lineTo(x+i+h,y);}ctx.stroke();ctx.restore();}
function glowOn(k){ctx.shadowColor=CY;ctx.shadowBlur=U*(0.25+0.3*k);}
function glowOff(){ctx.shadowBlur=0;ctx.shadowColor='transparent';}
function isInv(key){return S.invite===key;}
function invK(){return 0.5+0.5*Math.sin(T*5);}
function invHop(){const p=(T*0.75)%1; return p<0.22?Math.sin(p/0.22*PI)*U*0.22:0;}

// ---------------------------------------------------------- particles
function addP(p){if(parts.length>=PMAX) parts.shift(); parts.push(p);}
function sparks(x,y,n,col,spd){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=spd*(0.4+Math.random()*0.8);addP({k:'s',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.45+Math.random()*0.35,t:0,c:col||0});}}
function ring(x,y,r,col,life){addP({k:'o',x,y,r:r||U*0.2,vr:U*2.2,life:life||0.5,t:0,c:col||0});}

// ---------------------------------------------------------- robot geometry
function geo(){
  const u=U, legLen=(0.5+0.62*R.legE)*u, footH=0.22*u;
  const hipY=-(footH+legLen), torsoH=1.2*u, topY=hipY-torsoH, headH=1.0*u, headW=1.45*u;
  const headBot=topY-0.1*u, headTop=headBot-headH;
  const gx=R.x, gy=R.y-R.jumpH;
  let rhx=1.12*u, rhy=topY+1.0*u, lhx=-1.12*u, lhy=rhy;
  if(R.holding){ rhx=1.0*u; rhy=topY+0.1*u; lhx=-0.95*u; lhy=topY+0.55*u; }
  if(R.armUp>0){ const k=R.armUp; rhx=lerp(rhx,1.0*u,k); rhy=lerp(rhy,topY-0.4*u,k); lhx=lerp(lhx,-1.0*u,k); lhy=lerp(lhy,topY-0.4*u,k); }
  if(R.clap>0){ const k=Math.sin(R.clap*PI); rhx=lerp(rhx,0.28*u,k); lhx=lerp(lhx,-0.28*u,k); rhy=lerp(rhy,topY+0.55*u,k); lhy=rhy; }
  return {u,legLen,footH,hipY,torsoH,topY,headH,headW,headBot,headTop,gx,gy,
    rhl:{x:rhx,y:rhy},lhl:{x:lhx,y:lhy},rh:{x:gx+rhx,y:gy+rhy},lh:{x:gx+lhx,y:gy+lhy}};
}
function craneGeo(){
  const u=U, x=R.x, y=R.y;
  const tt=y-2.3*u, cabTop=tt-0.75*u;
  const px=x+0.5*u, py=tt-0.45*u;
  const cable=0.75*u;
  const hx=R.boomX+Math.sin(R.swing)*cable, hy=R.boomY+Math.cos(R.swing)*cable;
  return {x,y,tt,cabTop,px,py,cable,hx,hy};
}
function idleBoom(snap){
  const cg={px:R.x+0.5*U,py:R.y-2.75*U};
  const tx=cg.px+(portrait?0.9:2.3)*U, ty=cg.py-(portrait?2.2:1.0)*U;
  if(snap){R.boomX=tx;R.boomY=ty;}
  return {x:tx,y:ty};
}
function isCrane(){return worn.hands==='boots';}
function slotPoints(slot){
  if(isCrane()&&R.morph>0.5){
    const c=craneGeo();
    if(slot==='hands') return [{x:c.hx,y:c.hy}];
    if(slot==='head') return [{x:c.x,y:c.cabTop-1.0*U}];
    if(slot==='neck') return [{x:c.x,y:c.cabTop}];
    if(slot==='feet') return [{x:c.x,y:c.y-0.4*U}];
  }
  const g=geo();
  if(slot==='head') return [{x:g.gx,y:g.gy+g.headTop-0.15*U}];
  if(slot==='neck') return [{x:g.gx,y:g.gy+g.topY}];
  if(slot==='hands') return [g.rh,g.lh];
  if(slot==='feet') return [{x:g.gx,y:g.gy-0.35*U}];
  return [];
}
function wornPos(it){
  const p=slotPoints(it.slot);
  if(it.id==='umbrella'&&p[0]) return {x:p[0].x,y:p[0].y-0.85*U};
  return p[0]||{x:R.x,y:R.y};
}
function itemTarget(it){
  if(it.state==='worn') return wornPos(it);
  if(it.state==='drag') return {x:it.x,y:it.y};
  return homeOf(it);
}
function heldPos(){const g=geo(); return {x:g.rh.x+0.35*U,y:g.rh.y-0.55*U};}
function toyTarget(t){
  if(t.where==='shelf') return shelfPos(t.shelf);
  if(t.where==='site'){const s=siteById(t.site); return {x:s.x,y:s.y};}
  if(t.where==='held') return heldPos();
  if(t.where==='drag') return {x:t.x,y:t.y};
  return null;
}
function hookedPos(){const c=craneGeo(); const r=c.cable+BS*0.48; return {x:R.boomX+Math.sin(R.swing)*r,y:R.boomY+Math.cos(R.swing)*r};}
function bigTarget(b){
  if(b.where==='spot') return {x:POS.bigSpot[0],y:POS.bigSpot[1]};
  if(b.where==='site'){const s=siteById(b.site); return {x:s.x,y:s.y};}
  if(b.where==='hook') return hookedPos();
  return null;
}

// ---------------------------------------------------------- generators (robot actions)
function* wait(t){while(t>0){t-=DT;yield;}}
function speed(){return (worn.feet==='boots'?5.2:3.4)*U;}
function* walkTo(x,y,sp){
  R.walking=1; let guard=0;
  while(guard++<2000){
    const d=dist(R.x,R.y,x,y); if(d<1.5){R.x=x;R.y=y;break;}
    const st=Math.min(d,(sp||speed())*DT); R.x+=(x-R.x)/d*st; R.y+=(y-R.y)/d*st;
    const prev=R.ph; R.ph+=DT*(sp||speed())/U*(worn.feet==='boots'?1.7:2.6);
    if(Math.floor(prev/PI)!==Math.floor(R.ph/PI)) tone(worn.feet==='boots'?110:170,0.05,{vol:0.06});
    yield;
  }
  R.walking=0;
}
function* hopTo(x,y,h,dur){
  const sx=R.x,sy=R.y; let t=0; SFX.hop();
  while(t<dur){t+=DT; const k=clamp(t/dur,0,1); R.x=lerp(sx,x,k); R.y=lerp(sy,y,k); R.jumpH=Math.sin(k*PI)*h; yield;}
  R.jumpH=0; R.sqv+=3;
}
function routePts(rt){
  return RT[rt][portrait?0:1].map(p=>{
    if(typeof p[0]==='string'){const q=POS[p[0]]; return {x:q[0],y:q[1],hop:false,tag:p[0]};}
    const q=Pf(p); return {x:q[0],y:q[1],hop:!!p[2],tag:''};
  });
}
function splashAt(x,y){ sparks(x,y,8,1,U*3); ring(x,y,U*0.3,1,0.6); SFX.splash(); }
function* followPts(pts){
  for(const p of pts){
    if(p.hop) yield* hopTo(p.x,p.y,0.7*U,0.36); else yield* walkTo(p.x,p.y);
    if(p.tag==='puddle') splashAt(p.x,p.y);
  }
}
function* goHome(pts){ // reverse of route
  const rev=pts.slice().reverse();
  for(let i=1;i<rev.length;i++){ const p=rev[i], prev=rev[i-1];
    if(prev.hop) yield* hopTo(p.x,p.y,0.7*U,0.36); else yield* walkTo(p.x,p.y);
    if(p.tag==='puddle') splashAt(p.x,p.y);
  }
  yield* walkTo(POS.robot[0],POS.robot[1]);
}
function standOf(s){
  const minY=box.y0+4.2*U;
  if(portrait) return {x:s.x+(s.x<W/2?1:-1)*0.95*U,y:Math.max(minY,s.y+0.8*U)};
  return {x:s.x-1.2*U,y:Math.max(minY,s.y+0.45*U)};
}
function setExpr(e,t){R.expr=e;R.exprT=t||1.2;}
function lookAt(x,y,t){R.lookO={x,y,t:t||1};}

function* strideSeq(){
  R.busy=true; setExpr('proud',3);
  const pts=routePts('near');
  yield* walkTo(pts[0].x,pts[0].y); splashAt(pts[0].x,pts[0].y);
  yield* walkTo(pts[1].x,pts[1].y);
  // look across the river, can't jump yet
  const rv=riverMid(); lookAt(rv.x,rv.y,1.2); yield* hopTo(pts[1].x,pts[1].y,0.15*U,0.2);
  setExpr('hmm',1.2); R.tiltv+=3; yield* wait(0.9);
  const um=items.umbrella; if(worn.head!=='umbrella'){ lookAt(um.x,um.y,1.4); setHint('item:umbrella',1.8); }
  yield* wait(0.7);
  yield* walkTo(pts[0].x,pts[0].y); splashAt(pts[0].x,pts[0].y);
  yield* walkTo(POS.robot[0],POS.robot[1]);
  setExpr('proud',1.5);
  R.busy=false;
}
function stonePts(which){return STONES[which][portrait?0:1].map(Pf);}
function* jumpSeq(which){
  R.busy=true; setExpr('proud',2);
  const pts=routePts(which); const already=S.built[which];
  yield* walkTo(pts[0].x,pts[0].y); splashAt(pts[0].x,pts[0].y);
  yield* walkTo(pts[1].x,pts[1].y);
  R.sqv+=7; yield* wait(0.35);
  SFX.jump(); R.umbOpen=1;
  const st=stonePts(which)[0]; const sx=R.x,sy=R.y; const dur=1.15, h=clamp(Math.min(sy,st[1])-box.y0-4.7*U,1.1*U,2.6*U); let t=0, built=already;
  while(t<dur){
    t+=DT; const k=clamp(t/dur,0,1);
    R.x=lerp(sx,st[0],k); R.y=lerp(sy,st[1],k); R.jumpH=Math.sin(k*PI)*h*(k>0.5?1-(k-0.5)*0.15:1);
    if(k>0.45&&!built){ built=true; S.built[which]=true; S.bt[which]=0; SFX.motor(true); }
    if(Math.random()<0.4) addP({k:'s',x:R.x+rnd(-0.6,0.6)*U,y:R.y-R.jumpH-3.6*U,vx:rnd(-20,20),vy:rnd(10,40),life:0.5,t:0,c:1});
    yield;
  }
  R.jumpH=0; R.umbOpen=0; R.sqv+=9; SFX.land(); sparks(R.x,R.y,14,1,U*4);
  S.route=which; S.rflash[which]=1.5; SFX.success(); setExpr('wow',1.6); save();
  yield* wait(0.8);
  // short hop to the next stone and back to show it holds
  const st2=stonePts(which)[1]; yield* hopTo(st2[0],st2[1],0.6*U,0.35); yield* wait(0.25);
  yield* hopTo(st[0],st[1],0.6*U,0.35);
  yield* hopTo(pts[2].x,pts[2].y,0.7*U,0.4);
  yield* walkTo(pts[1].x,pts[1].y);
  yield* walkTo(pts[0].x,pts[0].y); splashAt(pts[0].x,pts[0].y);
  yield* walkTo(POS.robot[0],POS.robot[1]);
  setExpr('proud',1.5); R.busy=false;
}
function* bridgeSeq(){
  R.busy=true; const already=S.built.bridge; const wm=POS.windmill;
  lookAt(wm[0],wm[1],3.5); S.windBoost=1.6; SFX.wind();
  yield* wait(0.9);
  if(!already){
    S.built.bridge=true; S.bt.bridge=0; let c=0;
    while(S.bt.bridge<1){ S.bt.bridge=Math.min(1,S.bt.bridge+DT/2.3); S.ropeRun+=DT*3; c+=DT; if(c>0.38){c=0;SFX.creak();} yield; }
    const b=bridgeEnds(); sparks(b[1][0],b[1][1],12,1,U*3); SFX.land();
  }else{ S.rpulse.bridge=1.2; yield* wait(0.7); }
  S.route='bridge'; S.rflash.bridge=1.5; SFX.success(); setExpr('wow',1.6); save();
  yield* wait(0.6); R.busy=false;
}
function* deliverSeq(toy,site,from){
  R.busy=true; const rt=S.route; const pts=routePts(rt); setExpr('proud',2);
  yield* followPts(pts);
  if(from){ const fs=siteById(from); const sp=standOf(fs); yield* walkTo(sp.x,sp.y); lookAt(fs.x,fs.y,0.5);
    yield* wait(0.2); toy.where='held'; toy.site=null; R.holding=toy; SFX.grab(); toy.sqv-=6; yield* wait(0.25); }
  const sp=standOf(site); yield* walkTo(sp.x,sp.y); lookAt(site.x,site.y,0.8);
  yield* wait(0.15);
  placeToy(toy,site);
  yield* wait(0.6);
  const last=pts[pts.length-1]; yield* walkTo(last.x,last.y);
  yield* goHome(pts);
  R.busy=false; afterPlacement();
}
function* fetchSeq(toy,from){
  R.busy=true; const pts=routePts(S.route);
  yield* followPts(pts);
  const fs=siteById(from); const sp=standOf(fs); yield* walkTo(sp.x,sp.y); lookAt(fs.x,fs.y,0.5);
  yield* wait(0.2); toy.where='held'; toy.site=null; R.holding=toy; SFX.grab(); save();
  const last=pts[pts.length-1]; yield* walkTo(last.x,last.y);
  yield* goHome(pts); R.busy=false;
}
function placeToy(toy,site){
  toy.where='site'; toy.site=site.id; toy.bt=0; toy.org=null; if(R.holding===toy) R.holding=null;
  SFX.snap(); SFX.success(); sparks(site.x,site.y,14,1,U*3.5); ring(site.x,site.y,U*0.4,1,0.7); setExpr('wow',1.4); save();
}
function* craneDrop(b,site){
  R.busy=true; const c0=craneGeo();
  const tx=site.x, ty=site.y-(c0.cable+BS*0.48);
  let t=0; const sx=R.boomX, sy=R.boomY;
  while(t<1){ t+=DT/0.7; const k=ease(t); R.boomX=lerp(sx,tx,k); R.boomY=lerp(sy,ty,k); yield; }
  SFX.motor(false); yield* wait(0.25);
  b.where='site'; b.site=site.id; b.bt=0; R.hook=null; b.org=null;
  SFX.snap(); SFX.success(); sparks(site.x,site.y,18,1,U*4); ring(site.x,site.y,U*0.6,1,0.8); setExpr('wow',1.4); save();
  yield* wait(0.4);
  const it=idleBoom(false); const bx=R.boomX, by=R.boomY; t=0;
  while(t<1){ t+=DT/0.8; const k=ease(t); R.boomX=lerp(bx,it.x,k); R.boomY=lerp(by,it.y,k); yield; }
  setExpr('careful',3); R.busy=false; afterPlacement();
}
function* craneReturn(b){
  R.busy=true; const o=b.org||{where:'spot'}; const dest=o.where==='site'?siteById(o.site):{x:POS.bigSpot[0],y:POS.bigSpot[1]};
  const c0=craneGeo(); const tx=dest.x, ty=dest.y-(c0.cable+BS*0.48);
  let t=0; const sx=R.boomX, sy=R.boomY;
  while(t<1){ t+=DT/0.6; const k=ease(t); R.boomX=lerp(sx,tx,k); R.boomY=lerp(sy,ty,k); yield; }
  b.where=o.where; b.site=o.where==='site'?o.site:null; b.org=null; R.hook=null; b.sqv+=5; SFX.back();
  const it=idleBoom(false); const bx=R.boomX, by=R.boomY; t=0;
  while(t<1){ t+=DT/0.6; const k=ease(t); R.boomX=lerp(bx,it.x,k); R.boomY=lerp(by,it.y,k); yield; }
  R.busy=false;
}
function startAct(gen){ if(R.act) fastForward(); R.act=gen; R.busy=true; }
function fastForward(){
  if(!R.act) return; const keep=DT; DT=0.1; let n=0;
  try{ while(n++<800){ const r=R.act.next(); if(r.done) break; } }catch(e){}
  DT=keep; R.act=null; R.busy=false; R.walking=0; R.jumpH=0;
}

// ---------------------------------------------------------- world helpers
function riverMid(){const rv=RIVER[portrait?0:1]; return portrait?{x:W/2,y:Pf([0,(rv[0]+rv[1])/2])[1]}:{x:Pf([(rv[0]+rv[1])/2,0])[0],y:H/2};}
function bridgeEnds(){return BRIDGE[portrait?0:1].map(Pf);}
function structPos(id){
  if(id==='bridge'){const b=bridgeEnds(); return {x:(b[0][0]+b[1][0])/2,y:(b[0][1]+b[1][1])/2};}
  const s=stonePts(id); return {x:(s[0][0]+s[1][0])/2,y:(s[0][1]+s[1][1])/2};
}
function siteOccupied(s){
  for(const t of toys) if(t.where==='site'&&t.site===s.id) return t;
  for(const b of bigs) if((b.where==='site'&&b.site===s.id)) return b;
  return null;
}
function routeReach(rt){ return SITES.filter(s=>!s.big&&s.routes.includes(rt)); }
function siteStatus(s,ignoreToy){
  if(s.big) return 'big';
  const occ=siteOccupied(s); if(occ&&occ!==ignoreToy) return 'full';
  if(S.route&&S.built[S.route]&&s.routes.includes(S.route)){
    if(S.route!=='bridge'&&worn.feet!=='boots') return 'needBoots';
    return 'ok';
  }
  const alt=s.routes.find(r=>S.built[r]); if(alt) return 'inactive:'+alt;
  return 'none';
}
function srcStatus(s){ // can the robot get to a toy sitting at site s
  if(S.route&&S.built[S.route]&&s.routes.includes(S.route)){
    if(S.route!=='bridge'&&worn.feet!=='boots') return 'needBoots';
    return 'ok';
  }
  const alt=s.routes.find(r=>S.built[r]); if(alt) return 'inactive:'+alt;
  return 'none';
}
function bestFreeSite(ignore){
  const ok=SITES.filter(s=>!s.big&&siteStatus(s,ignore)==='ok'); if(ok.length) return ok[0];
  return null;
}
function siteAt(x,y,big){
  let best=null,bd=(big?1.7:1.15)*U;
  for(const s of SITES){ if(!!s.big!==!!big) continue; const d=dist(x,y,s.x,s.y); if(d<bd){bd=d;best=s;} }
  return best;
}
function freeShelf(){ for(let i=0;i<3;i++){ if(!toys.some(t=>t.where==='shelf'&&t.shelf===i)) return i; } return -1; }
function setHint(key,t){ S.hint={key,t:t||2}; const p=keyPos(key); if(p) lookAt(p.x,p.y,t||2); }
function keyPos(key){
  if(!key) return null; const i=key.indexOf(':'); const t=key.slice(0,i), id=key.slice(i+1);
  if(t==='item'){const it=items[id]; return {x:it.x,y:it.y};}
  if(t==='toy'){for(const o of toys) if(o.id===id) return {x:o.x,y:o.y};}
  if(t==='big'){for(const o of bigs) if(o.id===id) return {x:o.x,y:o.y};}
  if(t==='site'){const s=siteById(id); return s?{x:s.x,y:s.y}:null;}
  if(t==='struct') return structPos(id);
  return null;
}

// ---------------------------------------------------------- wearing logic
function wear(it,slot){
  const prev=worn[slot];
  if(prev&&prev!==it.id){ const p=items[prev]; unwear(p); p.state='home'; p.sqv+=4; }
  worn[slot]=it.id; it.state='worn'; it.slot=slot; it.sqv-=10; it.lift=0;
  S.wearTime[it.id]=T;
  SFX.snap(); R.flash=1; R.sqv+=4; R.blink=0.15;
  const p=wornPos(it); sparks(p.x,p.y,10,1,U*3.2); ring(p.x,p.y,U*0.25,1,0.45);
  if(it.id==='boots'&&slot==='feet'){
    S.ever.bootsFeet=true; R.legEv+=6;
    if(worn.head==='umbrella'&&!S.comboJump){ S.comboJump=true; startAct(jumpSeq('far')); }
    else startAct(strideSeq());
  }
  if(it.id==='umbrella'){
    setExpr('laugh',1.5); R.umbFlexv+=8;
    if(worn.feet==='boots'&&!S.comboJump){ S.comboJump=true; startAct(jumpSeq('near')); }
  }
  if((it.id==='scarf'||it.id==='helmet')){
    if(it.id==='helmet'){ S.lampFlash=1; SFX.lamp(); }
    if(it.id==='scarf'){ S.windBoost=Math.max(S.windBoost,0.8); SFX.wind(); }
    if(worn.neck==='scarf'&&worn.head==='helmet'&&!S.comboBridge){ S.comboBridge=true; startAct(bridgeSeq()); }
    else setExpr('happy',1.2);
  }
  if(it.id==='gloves'){ R.clap=0.001; SFX.clap(); setExpr('happy',1.4); }
  if(it.id==='boots'&&slot==='hands'){
    R.redraw=1; SFX.motor(true); setExpr('careful',4); idleBoom(true);
  }
  save();
}
function unwear(it){
  if(it.state!=='worn') return;
  const slot=it.slot; if(worn[slot]===it.id) worn[slot]=null; it.slot=null;
  if(it.id==='boots'||it.id==='umbrella') S.comboJump=false;
  if(it.id==='scarf'||it.id==='helmet') S.comboBridge=false;
  if(it.id==='boots'&&slot==='hands'){
    R.redraw=1; SFX.motor(false);
    if(R.hook){ const b=R.hook; const o=b.org||{where:'spot'}; b.where=o.where; b.site=o.where==='site'?o.site:null; b.org=null; R.hook=null; }
    setExpr('happy',1.2);
  }
  if(it.id==='gloves'&&R.holding){ returnToy(R.holding); R.holding=null; }
  if(it.id==='boots'&&slot==='feet') R.legEv-=4;
}
function sendHome(it){ it.state='home'; it.slot=null; SFX.back(); it.sqv+=3; }
function returnToy(t){
  const o=t.org;
  if(o&&o.where==='site'){ const s=siteById(o.site); if(s&&!siteOccupied(s)){ t.where='site'; t.site=o.site; t.org=null; return; } }
  let i=(o&&o.where==='shelf')?o.shelf:-1;
  if(i<0||toys.some(x=>x!==t&&x.where==='shelf'&&x.shelf===i)) i=freeShelf();
  if(i<0){ const s=SITES.find(s=>!s.big&&!siteOccupied(s)); if(s){t.where='site';t.site=s.id;t.org=null;return;} i=0; }
  t.where='shelf'; t.shelf=i; t.site=null; t.org=null; t.sqv+=4;
}

// ---------------------------------------------------------- tap reactions on worn items
function tapWorn(it){
  it.sqv+=6;
  if(it.id==='boots'&&it.slot==='feet'){
    R.stomp=Math.min(4,R.stomp+1); R.sqv+=3+R.stomp*1.5; R.stompJ=0.001; SFX.stomp(R.stomp); setExpr('proud',1.6);
    sparks(R.x,R.y,4+R.stomp*2,1,U*(2+R.stomp*0.5));
  }else if(it.id==='umbrella'){
    R.umbFlexv+=10; S.rainBoost=Math.min(1,S.rainBoost+0.34); setExpr('laugh',1.8); SFX.drip(); SFX.drip();
  }else if(it.id==='scarf'){
    S.windBoost=Math.min(2,S.windBoost+0.7); SFX.wind(); setExpr('happy',1);
  }else if(it.id==='helmet'){
    S.lampFlash=1; SFX.lamp(); setExpr('wow',0.8);
  }else if(it.id==='gloves'){
    R.clap=0.001; SFX.clap(); setExpr('happy',1);
  }else if(it.id==='boots'&&it.slot==='hands'){
    R.swingv+=4; SFX.tick(400);
  }
}

// ---------------------------------------------------------- input
function pt(e){return {x:e.clientX,y:e.clientY};}
function hitTest(x,y){
  const hr=Math.max(0.78*U,24);
  let best=null,bd=1e9;
  const cand=(type,id,px,py,r)=>{const d=dist(x,y,px,py); if(d<r&&d<bd){bd=d;best={type,id};}};
  if(R.holding&&!R.busy){const p=heldPos(); cand('held',R.holding.id,p.x,p.y,Math.max(0.8*U,26));}
  for(const id of ITEM_IDS){ const it=items[id];
    if(it.state==='worn'){ for(const p of slotPoints(it.slot)){ const q=it.id==='umbrella'?{x:p.x,y:p.y-0.85*U}:p; cand('worn',id,q.x,q.y,hr*(it.id==='umbrella'?1.2:1)); } }
    else cand('item',id,it.x,it.y,hr);
  }
  if(best) return best;

// ---------------------------------------------------------- progression
function smallPlaced(){return toys.filter(t=>t.where==='site').length;}
function afterPlacement(){
  const ferris=bigs[0], clock=bigs[1];
  if(ferris.where==='site'&&clock.where==='none'&&S.clockTimer<0) S.clockTimer=rnd(9,20);
  if(smallPlaced()>=2&&toys[3].where==='none'&&S.spinTimer<0) S.spinTimer=rnd(3,8);
  if(!S.opened&&ferris.where==='site'&&smallPlaced()>=3){ startOpening(); }
  else if(S.opened&&!S.grand&&smallPlaced()>=4&&clock.where==='site'&&ferris.where==='site'){ S.grand=true; S.grandT=0.001; SFX.fanfare(); SFX.chime(); save(); }

  }

function computeInvite(){
  if(S.hint&&S.hint.t>0) return S.hint.key;

    if(drag.type==='held'||drag.type==='toy'||drag.type==='siteToy'){ const f=bestFreeSite(drag.type==='siteToy'?toys.find(o=>o.id===drag.id):R.holding); return f?'site:'+f.id:null; }
    if(drag.type==='hook'){ const f=SITES.find(q=>q.big&&!siteOccupied(q)); return f?'site:'+f.id:null; }
    return null;
  }
  if(R.busy) return null;
  if(R.holding){ const f=bestFreeSite(R.holding); if(f) return 'site:'+f.id; return smallRouteFix(); }
  const w=worn;
  if(!S.ever.bootsFeet) return 'item:boots';
  if(!S.built.near&&!S.built.far){ if(w.feet!=='boots') return 'item:boots'; return 'item:umbrella'; }
  if(!S.built.bridge){ if(w.neck!=='scarf') return 'item:scarf'; if(w.head!=='helmet') return 'item:helmet'; }
  const shelfToy=toys.find(t=>t.where==='shelf');
  const ferris=bigs[0], clock=bigs[1];
  if(shelfToy&&smallPlaced()<2) return smallInvite(shelfToy);
  if(ferris.where!=='site'){ if(w.hands!=='boots') return 'item:boots'; return 'big:ferris'; }
  if(shelfToy&&SITES.some(s=>!s.big&&!siteOccupied(s))) return smallInvite(shelfToy);

  if(!S.built.far){ if(w.feet==='boots'&&w.head!=='umbrella') return 'item:boots'; if(w.head!=='umbrella') return 'item:umbrella'; return 'item:boots'; }
  if(!S.built.near){ if(w.head==='umbrella'&&w.feet!=='boots') return 'item:umbrella'; if(w.feet!=='boots') return 'item:boots'; return 'item:umbrella'; }

  if(alt){ const r=alt.routes.find(r=>S.built[r]); if(r!==S.route) return 'struct:'+r; }
  return null;

  if(worn.hands!=='gloves') return 'item:gloves';

  return 'toy:'+t.id;

const SAVE_KEY='gf261102-14-park-v1';
function save(){
  try{
    const d={v:1,b:{near:!!S.built.near,far:!!S.built.far,bridge:!!S.built.bridge},r:S.route,t:{},g:{},o:!!S.opened,gr:!!S.grand,ck:bigs[1].where!=='none'};
    toys.forEach(t=>{ if(t.where==='site') d.t[t.id]=t.site; });
    bigs.forEach(b=>{ if(b.where==='site') d.g[b.id]=b.site; else if(b.where==='hook'&&b.org&&b.org.where==='site') d.g[b.id]=b.org.site; });
    window.localStorage.setItem(SAVE_KEY,JSON.stringify(d));
  }catch(e){}
}
function load(){
  let d=null;
  try{ const s=window.localStorage.getItem(SAVE_KEY); if(!s) return; d=JSON.parse(s); }catch(e){ return; }
  if(!d||typeof d!=='object'||d.v!==1) return;
  try{
    const b=d.b&&typeof d.b==='object'?d.b:{};
    ['near','far','bridge'].forEach(k=>{ S.built[k]=b[k]===true; S.bt[k]=1; });
    S.route=(typeof d.r==='string'&&S.built[d.r])?d.r:(['bridge','near','far'].find(k=>S.built[k])||null);
    const used={};
    if(d.t&&typeof d.t==='object') toys.forEach(t=>{ const sid=d.t[t.id]; const s=typeof sid==='string'?siteById(sid):null;
      if(s&&!s.big&&!used[s.id]&&s.routes.some(r=>S.built[r])){ used[s.id]=1; t.where='site'; t.site=s.id; t.shelf=-1; } });
    if(d.g&&typeof d.g==='object') bigs.forEach(o=>{ const sid=d.g[o.id]; const s=typeof sid==='string'?siteById(sid):null;
      if(s&&s.big&&!used[s.id]){ used[s.id]=1; o.where='site'; o.site=s.id; } });
    if(bigs[1].where==='none'&&d.ck===true&&bigs[0].where==='site') bigs[1].where='spot';
    // shelf for the rest
    let i=0; toys.forEach(t=>{ if(t.where==='site') return; if(t.id==='spin'){ t.where='none'; return; } t.where='shelf'; t.shelf=i++; });
    if(toys[3].where==='none'&&smallPlaced()>=2) S.spinTimer=rnd(3,8);
    S.opened=d.o===true&&bigs[0].where==='site'&&smallPlaced()>=3; if(S.opened) S.openT=1;
    S.grand=d.gr===true&&S.opened; if(S.grand) S.grandT=0;
    if(bigs[0].where==='site'&&bigs[1].where==='none') S.clockTimer=rnd(9,20);
    if(S.built.near||S.built.far) S.ever.bootsFeet=true;
  }catch(e){
    // corrupted: reset to empty
    ['near','far','bridge'].forEach(k=>{S.built[k]=false;}); S.route=null; S.opened=false; S.grand=false;
    toys.forEach((t,i)=>{t.where=i<3?'shelf':'none';t.shelf=i<3?i:-1;t.site=null;});
    bigs.forEach((o,i)=>{o.where=i===0?'spot':'none';o.site=null;});
  }
}

// ---------------------------------------------------------- loop & lifecycle
function frame(ts){
  raf=0;
  if(document.hidden) return;
  if(needLayout) layout();
  let dt=lastT?(ts-lastT)/1000:1/60; lastT=ts;
  if(!(dt>0)) dt=1/60; dt=Math.min(dt,1/20);
  DT=dt; T+=dt;
  try{ update(dt); draw(); }catch(e){ if(window.console) console.warn(e); }
  raf=requestAnimationFrame(frame);
}
function startLoop(){ if(!raf){ lastT=0; raf=requestAnimationFrame(frame); } }
function stopLoop(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ stopLoop(); if(drag) endDrag(drag.x,drag.y,true); try{ if(AU.ctx&&AU.ctx.state==='running') AU.ctx.suspend(); }catch(e){} }
  else { try{ if(AU.ctx&&AU.ctx.state==='suspended') AU.ctx.resume().catch(()=>{}); }catch(e){} lastT=0; startLoop(); }
});
window.addEventListener('pagehide',()=>{ stopLoop(); });
window.addEventListener('pageshow',()=>{ if(!document.hidden){ lastT=0; startLoop(); } });
window.addEventListener('resize',()=>{needLayout=true;});
window.addEventListener('orientationchange',()=>{needLayout=true;});
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});

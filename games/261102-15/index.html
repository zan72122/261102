<script>
(() => {
'use strict';
// ============================================================
//  ぽんっ！はねる機関車と積み木の橋まつり

const cv = document.getElementById('c');

// ---------- 小さな数学 ----------
const PI = Math.PI, TAU = PI * 2;

function mm(a, b) {
  return [
    a[0]*b[0]+a[1]*b[3]+a[2]*b[6], a[0]*b[1]+a[1]*b[4]+a[2]*b[7], a[0]*b[2]+a[1]*b[5]+a[2]*b[8],
    a[3]*b[0]+a[4]*b[3]+a[5]*b[6], a[3]*b[1]+a[4]*b[4]+a[5]*b[7], a[3]*b[2]+a[4]*b[5]+a[5]*b[8],
    a[6]*b[0]+a[7]*b[3]+a[8]*b[6], a[6]*b[1]+a[7]*b[4]+a[8]*b[7], a[6]*b[2]+a[7]*b[5]+a[8]*b[8]];

const rX = a => { const c = Math.cos(a), s = Math.sin(a); return [1,0,0, 0,c,-s, 0,s,c]; };
const rY = a => { const c = Math.cos(a), s = Math.sin(a); return [c,0,s, 0,1,0, -s,0,c]; };

function frameFrom(tx, ty, tz) {

}
let seed = (Date.now() ^ 0x5bd1e995) >>> 0;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

// ---------- 色 ----------
const COL = {
  red: '#d9442f', redD: '#a8301f', blue: '#2f6fd1', blueD: '#22509a', yel: '#f3c331', grn: '#3f9e4a', grnD: '#2e7a39',
  wood: '#c98d52', woodL: '#d9a066', woodD: '#9b6334', desk1: '#b97a42', desk2: '#a96c38', desk3: '#c4884c',
  white: '#f3ece0', black: '#2b2422', skin: '#f0c49a', rail: '#7b8590', tie: '#8c5a2e', cream: '#f7e2b6',
  pink: '#ef8fa6', orange: '#ee8a2c', purple: '#8a5cc7', gray: '#9aa3ad', roof: '#5c87c9', brown: '#7a4a24'

const rgbCache = {};
function hexRgb(h) {

  rgbCache[h] = c; return c;
}
const shadeCache = new Map();
function shade(h, k) {

// ---------- カメラ（角度固定・画角だけ変える） ----------
const cam = { d0: Math.SQRT1_2, d1: Math.SQRT1_2, r0: Math.SQRT1_2, r1: -Math.SQRT1_2, cp: 0.79, sp: 0.62,
  scale: 30, cx: 0, cy: 0, ox: 0, oy: 0, Vx: 0, Vy: 0, Vz: 0, tScale: 30, tcx: 0, tcy: 0, fromScale: 30, fromCx: 0, fromCy: 0, tw: 1, twDur: 1 };

function setYaw(deg, pitchDeg) {

  cam.r0 = cam.d1; cam.r1 = -cam.d0;

}
// 世界→画面（CSSピクセル）
function pu(x, y) { return x * cam.r0 + y * cam.r1; }

// ---------- メッシュ ----------
function boxMesh() {
  const v = [];
  for (let i = 0; i < 8; i++) v.push([(i & 1) ? 0.5 : -0.5, (i & 2) ? 0.5 : -0.5, (i & 4) ? 0.5 : -0.5]);
  const f = [
    { i: [0, 2, 6, 4], n: [-1, 0, 0] }, { i: [1, 5, 7, 3], n: [1, 0, 0] },
    { i: [0, 4, 5, 1], n: [0, -1, 0] }, { i: [2, 3, 7, 6], n: [0, 1, 0] },
    { i: [0, 1, 3, 2], n: [0, 0, -1] }, { i: [4, 6, 7, 5], n: [0, 0, 1] }];
  return { v, f };
}
// y軸方向に伸びるn角柱（車輪など）

  for (let i = 0; i < n; i++) { const a = (i + 0.5) / n * TAU; v.push([Math.cos(a) * 0.5, -0.5, Math.sin(a) * 0.5]); }
  for (let i = 0; i < n; i++) { const a = (i + 0.5) / n * TAU; v.push([Math.cos(a) * 0.5, 0.5, Math.sin(a) * 0.5]); }
  const f = [];
  const capA = [], capB = [];
  for (let i = 0; i < n; i++) { capA.push(n - 1 - i); capB.push(n + i); }
  f.push({ i: capA, n: [0, -1, 0] }, { i: capB, n: [0, 1, 0] });
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, a = (i + 1) / n * TAU;
    f.push({ i: [i, j, n + j, n + i], n: [Math.cos(a), 0, Math.sin(a)] });

}
// 屋根（三角柱：x方向に伸びる）
function roofMesh() {
  const v = [[-0.5, -0.5, -0.5], [0.5, -0.5, -0.5], [-0.5, 0.5, -0.5], [0.5, 0.5, -0.5], [-0.5, 0, 0.5], [0.5, 0, 0.5]];
  const s = 1 / Math.SQRT2;
  const f = [
    { i: [0, 4, 5, 1], n: [0, -s, s] }, { i: [2, 3, 5, 4], n: [0, s, s] },
    { i: [0, 2, 4], n: [-1, 0, 0] }, { i: [1, 5, 3], n: [1, 0, 0] }, { i: [0, 1, 3, 2], n: [0, 0, -1] }];
  return { v, f };
}
const M_BOX = boxMesh(), M_OCT = prismMesh(8), M_HEX = prismMesh(6), M_CYL = prismMesh(12), M_ROOF = roofMesh();

// ---------- 描画リスト ----------
const items = []; let nItems = 0;
const shadowPts = []; // 影の凸包リスト
function pushItem() {
  let it = items[nItems];
  if (!it) { it = {}; items[nItems] = it; }
  nItems++; return it;
}
// 箱（中心・寸法・回転・色）
function mesh(M, x, y, z, sx, sy, sz, rot, col, opt) {
  const it = pushItem();
  it.k = 0; it.M = M; it.x = x; it.y = y; it.z = z; it.sx = sx; it.sy = sy; it.sz = sz;
  it.rot = rot || I3; it.col = col; it.d = depthOf(x, y, z) + (opt && opt.bias || 0);
  it.sh = !(opt && opt.noShadow); it.cols = opt && opt.cols || null;
  return it;
}
const box = (x, y, z, sx, sy, sz, rot, col, opt) => mesh(M_BOX, x, y, z, sx, sy, sz, rot, col, opt);
function custom(d, fn) { const it = pushItem(); it.k = 1; it.d = d; it.fn = fn; return it; }

const tv = []; for (let i = 0; i < 32; i++) tv.push([0, 0, 0]);
const tp = []; for (let i = 0; i < 32; i++) tp.push([0, 0]);
function transformItem(it) {
  const m = it.rot, V = it.M.v;
  for (let i = 0; i < V.length; i++) {
    const lx = V[i][0] * it.sx, ly = V[i][1] * it.sy, lz = V[i][2] * it.sz;
    const w = tv[i];
    w[0] = m[0]*lx + m[1]*ly + m[2]*lz + it.x;
    w[1] = m[3]*lx + m[4]*ly + m[5]*lz + it.y;
    w[2] = m[6]*lx + m[7]*ly + m[8]*lz + it.z;
  }

}
function drawMeshItem(it) {
  const n = transformItem(it), m = it.rot;
  for (let i = 0; i < n; i++) { const p = P(tv[i][0], tv[i][1], tv[i][2]); tp[i][0] = p[0]; tp[i][1] = p[1]; }
  const F = it.M.f;
  for (let fi = 0; fi < F.length; fi++) {
    const f = F[fi], ln = f.n;
    const nx = m[0]*ln[0] + m[1]*ln[1] + m[2]*ln[2];
    const ny = m[3]*ln[0] + m[4]*ln[1] + m[5]*ln[2];
    const nz = m[6]*ln[0] + m[7]*ln[1] + m[8]*ln[2];
    if (nx * cam.Vx + ny * cam.Vy + nz * cam.Vz <= 0.002) continue;
    const lit = nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2];
    const k = 0.56 + 0.46 * Math.max(0, lit);
    const c = shade(it.cols ? (it.cols[fi] || it.col) : it.col, k);
    ctx.fillStyle = c; ctx.strokeStyle = c;
    ctx.beginPath();
    const ix = f.i;
    ctx.moveTo(tp[ix[0]][0], tp[ix[0]][1]);
    for (let j = 1; j < ix.length; j++) ctx.lineTo(tp[ix[j]][0], tp[ix[j]][1]);

// 影：机の上（z=0）へ光源方向に投影して凸包
const hullBuf = [];

  for (let i = 0; i < n; i++) {
    const w = tv[i]; const z = Math.max(0, w[2]);
    const p = P(w[0] - LIGHT[0] * z / LIGHT[2], w[1] - LIGHT[1] * z / LIGHT[2], 0);
    pts.push(p);

  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }

  const h = lo.concat(up);
  if (h.length < 3) return;
  ctx.moveTo(h[0][0], h[0][1]);
  for (let i = 1; i < h.length; i++) ctx.lineTo(h[i][0], h[i][1]);

  ctx.fillStyle = 'rgba(60,30,10,0.30)'; ctx.fill('nonzero');

// ============================================================
//  線路（辺のグラフ）
// ============================================================
function arcPts(cx, cy, r, a0, a1, n, z) {
  const o = [];

    const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1], p2[2] - p1[2]);
    const n = Math.max(1, Math.ceil(len / step));
    for (let k = 0; k < n; k++) {

  const pts = [];

    const a = ctrl[i], b = ctrl[i + 1];
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]) / step));
    for (let k = 0; k < n; k++) pts.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n), lerp(a[2], b[2], k / n)]);

// 主要な点
const J2 = [5, -1.0, 0], J1 = [-5, -1.0, 0];
const BS1 = [5, -0.2, 0], BS2 = [5, 1.5, 0];
const RS1 = [0.4, 3, 0], RS2 = [-3.2, 3, 0];
const UP_Y = -6.0, UP_Z = 2.0;
const BR0 = -3.4, BR1 = -1.7;        // 橋（x範囲）
const LF0 = -1.7, LF1 = 1.3;         // 昇降機の屋上レール
const ST0 = 1.3, ST1 = 3.9;          // 屋上駅
const TT = [4.8, UP_Y, UP_Z];        // 回転台
const RED_PAD = [-5, 0.5, 0], BLUE_PAD = [1.6, -3, 0], ST_PAD = [2.5, UP_Y, UP_Z];

const WHEEL_PAD = [7.6, -6.9, UP_Z];

const E = {};

  E.Lrs = makeEdge('Lrs', linePath([RS1, RS2], 0.1));
  E.L1c = makeEdge('L1c', linePath([RS2].concat(arcPts(-3.7, 1.7, 1.3, 90, 180, 10)).concat([J1]), 0.1));
  E.L2 = makeEdge('L2', linePath([J1].concat(arcPts(-3.7, -1.7, 1.3, 180, 270, 10)).concat(arcPts(3.7, -1.7, 1.3, 270, 360, 10)).concat([J2]), 0.1));

buildBaseEdges();
// 自作の支線（前の周で最後に倒れた積み木から）
function buildSpur(sp) {

    const ctrl = hill

// ============================================================
//  状態

  const bands = [[-10.2, 0.9, COL.desk2], [-8.1, 0.5, COL.desk3], [-6.6, 1.1, COL.desk2], [-4.1, 0.4, COL.desk3], [-2.6, 0.8, COL.desk2],

}
function drawRailFlat(e, from, to) {
  // 枕木
  const q = {};
  for (let d = from + 0.15; d < to; d += 0.42) {
    edgeAt(e, d, q);
    const l = Math.hypot(q.tx, q.ty) || 1, nx = -q.ty / l * 0.36, ny = q.tx / l * 0.36, fx = q.tx / l * 0.1, fy = q.ty / l * 0.1;
    poly([[q.x + nx - fx, q.y + ny - fy, q.z], [q.x + nx + fx, q.y + ny + fy, q.z], [q.x - nx + fx, q.y - ny + fy, q.z], [q.x - nx - fx, q.y - ny - fy, q.z]], COL.tie);
  }

  for (const side of [-0.22, 0.22]) {
    ctx.beginPath();
    for (let d = from, i = 0; d <= to + 0.001; d += 0.2, i++) {
      edgeAt(e, Math.min(d, to), q);
      const l = Math.hypot(q.tx, q.ty) || 1;

}
function drawGround() {

  if (G.parkOpen > 0.5) drawRailFlat(E.U2b, E.U2b.len - 0.9, E.U2b.len);
}

// 高架の線路（箱を連ねる）
function elevated(e, from, to, col) {
  const q = {}, step = 0.5;
  for (let d = from; d < to - 0.01; d += step) {
    const d1 = Math.min(to, d + step);
    edgeAt(e, (d + d1) / 2, q);
    if (q.z < 0.1) continue;
    const R = frameFrom(q.tx, q.ty, q.tz);
    box(q.x, q.y, q.z - 0.1, d1 - d + 0.04, 0.95, 0.2, R, col || COL.woodL, { cols: [null, null, null, null, null, COL.woodL] });

      ctx.strokeStyle = '#6f7882'; ctx.lineWidth = Math.max(1.5, cam.scale * 0.07);

function person(x, y, z, face, o) {
  o = o || {};
  const jump = o.jump || 0;
  z += jump;
  const R = rZ(face);
  const f = [Math.cos(face), Math.sin(face)], s = [-Math.sin(face), Math.cos(face)];
  const bias = o.bias || 0;
  if (!o.noLegs) box(x, y, z + 0.15, 0.22, 0.28, 0.3, R, COL.black, { bias });

  const hz = z + 0.8;
  box(x, y, hz, 0.3, 0.3, 0.3, R, COL.skin, { bias: bias + 0.01 });
  if (o.hat) {
    const hs = o.hatTall ? 0.26 : 0.1, lift = o.hatPop || 0;
    box(x, y, hz + 0.15 + hs / 2 + lift, 0.32, 0.32, hs, R, o.hat, { bias: bias + 0.02 });
    if (!o.hatTall) box(x + f[0] * 0.12, y + f[1] * 0.12, hz + 0.16 + lift, 0.18, 0.3, 0.04, R, o.hat, { bias: bias + 0.02 });
  }
  // 腕： a=0 下げる, 1=前へ, 2.6=頭へ
  const arm = (side, a, wave) => {
    const sx = x + s[0] * 0.22 * side, sy = y + s[1] * 0.22 * side, sz = z + 0.6;
    const Ra = mm(R, mm(rY(-a), rX(side * (wave || 0))));
    const c = ap(Ra, 0, 0, -0.15);
    box(sx + c[0], sy + c[1], sz + c[2], 0.11, 0.11, 0.3, Ra, o.body || COL.blue, { bias: bias + 0.005 });
  };
  arm(1, o.armR || 0, o.waveR || 0);
  arm(-1, o.armL || 0, o.waveL || 0);
  // 目
  const fx = x + f[0] * 0.152, fy = y + f[1] * 0.152;
  const vis = f[0] * cam.Vx + f[1] * cam.Vy;
  if (vis > 0.08) custom(depthOf(fx, fy, hz) + bias + 0.05, () => {
    const c = P(fx, fy, hz + 0.02), a = P(fx + s[0] * 0.07, fy + s[1] * 0.07, hz + 0.02);
    const ex = a[0] - c[0], ey = a[1] - c[1];
    const big = o.big || 0, r = cam.scale * (0.035 + big * 0.03);
    let lx = 0, ly = 0;
    if (o.look) { const t = P(o.look[0], o.look[1], o.look[2] || 0); const dx = t[0] - c[0], dy = t[1] - c[1], l = Math.hypot(dx, dy) || 1; lx = dx / l; ly = dy / l; }
    for (const k of [-1, 1]) {
      const px = c[0] + ex * k, py = c[1] + ey * k;
      if (o.squint) { ctx.strokeStyle = COL.black; ctx.lineWidth = Math.max(1, r * 0.6); ctx.beginPath(); ctx.moveTo(px - r, py); ctx.lineTo(px + r, py); ctx.stroke(); continue; }
      if (big > 0.05) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, r * 1.25, 0, TAU); ctx.fill(); }
      ctx.fillStyle = COL.black; ctx.beginPath();
      ctx.arc(px + lx * r * 0.45, py + ly * r * 0.45, r * (big > 0.05 ? 0.65 : 1), 0, TAU); ctx.fill();
    }
    if (o.smile) { ctx.strokeStyle = COL.black; ctx.lineWidth = Math.max(1, r * 0.5); ctx.beginPath(); ctx.arc(c[0], c[1] + r * 1.4, r * 1.1, 0.2, PI - 0.2); ctx.stroke(); }
    if (o.mouthO) { ctx.fillStyle = COL.black; ctx.beginPath(); ctx.arc(c[0], c[1] + r * 2.1, r * 0.75, 0, TAU); ctx.fill(); }
  });
}

//  赤い仕掛け：台・塔・シーソー・風車・橋
// ============================================================
const RT = [-6.2, 0.5];            // 赤い塔の土台
const SEE = [-6.25, -2.0];         // シーソー支点（y方向の板）
const WM = [-6.75, -4.3, 3.0];      // 風車ハブ
const WINCH = [BR0, UP_Y - 0.55, 2.45];
const BS = 0.55;                   // 積み木の大きさ
// 赤い塔の積み木の位置（redT からの関数）
function redBlocks(out) {
  const t = G.redT, dir = G.redDir === 'a' ? 1 : -1;
  for (let i = 0; i < 4; i++) {
    const h = (i + 0.5) * BS;
    let x = RT[0], y = RT[1], z = h, R = I3;
    if (t >= 0) {
      const a = easeIn(clamp(t / 0.6, 0, 1)) * PI / 2 * 0.98;
      // 土台の-y側の辺を軸に回転
      const py = RT[1] - BS / 2;
      y = py + (RT[1] - py) * Math.cos(a) - h * Math.sin(a);
      z = (RT[1] - py) * Math.sin(a) + h * Math.cos(a);
      R = rX(a);
      if (t > 0.6) {
        const k = backOut(clamp((t - 0.6) / 0.35, 0, 1));
        const rx = RT[0] + dir * 0.13 * i * i * 0.5 + (i === 3 ? 0 : 0), ry = RT[1] - BS / 2 - h;
        const rz = i === 3 ? 0.42 : BS / 2;
        x = lerp(x, rx, k); y = lerp(y, ry, k); z = lerp(z, rz, k);
        R = mm(rZ(dir * 0.22 * i * k), rX(PI / 2));
      }
      // 再タップでぴょこ
      if (G.redHop >= 0) { const ht = G.t - G.redHop - i * 0.07; if (ht > 0 && ht < 0.4) z += Math.sin(ht / 0.4 * PI) * 0.35; }
    }
    if (G.rebuildRed >= 0) { const rt = G.t - G.rebuildRed - (i * 0.15); x = RT[0]; y = RT[1]; R = I3; z = h + Math.max(0, 1 - easeIn(clamp(rt / 0.45, 0, 1))) * 4; if (rt < 0) z = 99; }
    out.push([x, y, z, R]);
  }
  return out;
}
function seesawTilt() { // + : A端(塔側,+y)が上
  if (G.redT < 0) return 0.32;
  const t = G.redT;
  if (t < 0.6) return 0.32;
  return lerp(0.32, -0.32, easeOut(clamp((t - 0.6) / 0.15, 0, 1)));
}
function flyBlock() { // シーソーで飛ぶ黄色い積み木
  const tilt = seesawTilt();
  const bx = SEE[0], by = SEE[1] - 0.95, bz = 0.42 - Math.sin(tilt) * 0.95 + 0.2;
  const t = G.redT;
  if (t < 0.75 || G.redT < 0) return [bx, by, bz, 0];
  const hit = [WM[0] + 0.45, WM[1] + 0.85, WM[2] - 0.9];
  if (t < 1.5) { const k = (t - 0.75) / 0.75; return [lerp(bx, hit[0], k), lerp(by, hit[1], k), lerp(bz, hit[2], k) + Math.sin(k * PI) * 1.6, k * 7]; }

  return [hit[0] + 0.3 * k, hit[1] + 0.5 * k, lerp(hit[2], 0.2, easeIn(k)), 7 + k * 3];
}
function drawRed() {
  // 台
  padDraw(RED_PAD, COL.red, G.redDone);
  const bl = redBlocks([]);
  for (let i = 0; i < 4; i++) {
    const b = bl[i]; if (b[2] > 50) continue;
    if (G.spur && G.spur.color === 'red' && G.spurT >= 0 && G.rebuildRed >= 0 && false) continue;
    box(b[0] + wob('red') * (i + 1) * 0.3, b[1], b[2], BS, BS, BS, b[3], i % 2 ? COL.red : COL.redD);
  }
  // シーソー
  const tilt = seesawTilt();
  box(SEE[0], SEE[1], 0.2, 0.5, 0.3, 0.4, null, COL.grnD);
  box(SEE[0], SEE[1], 0.42, 0.5, 2.3, 0.1, rX(tilt), COL.wood);
  const fb = flyBlock();
  box(fb[0], fb[1], fb[2], 0.4, 0.4, 0.4, mm(rX(fb[3]), rZ(fb[3] * 0.5)), COL.yel);
  // 風車
  box(WM[0] - 0.1, WM[1], 1.4, 0.8, 0.8, 2.8, null, COL.grn);
  mesh(M_ROOF, WM[0] - 0.1, WM[1], 3.1, 0.9, 0.95, 0.5, rZ(PI / 2), COL.red);
  mesh(M_CYL, WM[0] + 0.38, WM[1], WM[2], 0.3, 0.2, 0.3, rZ(PI / 2), COL.yel);
  for (let k = 0; k < 4; k++) {
    const a = G.windAng + k * PI / 2 + wob('wind');
    const Rb = rX(a);
    const c = ap(Rb, 0, 0, 0.75);
    box(WM[0] + 0.52, WM[1] + c[1], WM[2] + c[2], 0.08, 0.36, 1.3, Rb, k % 2 ? COL.white : COL.yel);

    const k = (i + belt) / n;
    box(lerp(WM[0] + 0.3, WINCH[0], k), lerp(WM[1] - 0.2, WINCH[1], k), lerp(WM[2] - 0.2, WINCH[2] + 0.3, k), 0.14, 0.14, 0.14, null, i % 2 ? COL.black : COL.gray, { noShadow: true });

  mesh(M_HEX, WINCH[0], WINCH[1], WINCH[2] + 0.3, 0.6, 0.3, 0.6, mm(rZ(PI / 2), rY(G.windAng)), COL.red);
  shaft(WINCH[0], -2.05, WINCH[1], 2.45, G.windAng);

  const ang = (1 - G.bridgeLow) * 1.25;
  const Rb = rY(-ang), L = BR1 - BR0;
  const c = ap(Rb, L / 2, 0, -0.1);
  box(BR0 + c[0], UP_Y + c[1], UP_Z + c[2], L, 0.95, 0.2, Rb, COL.woodL, { cols: [null, null, null, null, null, COL.woodL] });
  const r1 = ap(Rb, L / 2, -0.22, 0.01), r2 = ap(Rb, L / 2, 0.22, 0.01);
  box(BR0 + r1[0], UP_Y + r1[1], UP_Z + r1[2], L, 0.07, 0.06, Rb, COL.rail, { noShadow: true, bias: 0.03 });
  box(BR0 + r2[0], UP_Y + r2[1], UP_Z + r2[2], L, 0.07, 0.06, Rb, COL.rail, { noShadow: true, bias: 0.03 });
  // 橋の欄干（赤い積み木）
  for (const yy of [-0.5, 0.5]) { const q = ap(Rb, L * 0.5, yy, 0.12); box(BR0 + q[0], UP_Y + q[1], UP_Z + q[2], L * 0.9, 0.08, 0.16, Rb, COL.red); }
  // 橋の土台の柱
  box(BR0 - 0.1, UP_Y, UP_Z / 2 - 0.1, 0.5, 1.0, UP_Z - 0.2, null, COL.red);
}
function shaft(xa, xb, y, z, ang) {
  const n = Math.max(1, Math.round(Math.abs(xb - xa) / 0.35));
  for (let i = 0; i < n; i++) {
    const x = lerp(xa, xb, (i + 0.5) / n);
    box(x, y, z, Math.abs(xb - xa) / n, 0.12, 0.12, rX(ang + i * 0.4), i % 2 ? COL.gray : COL.white, { noShadow: true });
  }
}
function gear(x, y, z, ang, col) {
  mesh(M_OCT, x, y, z, 0.62, 0.16, 0.62, mm(rZ(PI / 2), rY(ang)), col);
  for (let k = 0; k < 4; k++) {
    const Rt = rX(ang + k * PI / 4);
    box(x, y, z, 0.12, 0.8, 0.12, Rt, col, { noShadow: true });
  }
}

//  青い仕掛け：台・塔・バケツ・昇降機（屋上レール）

const BT = [2.6, -4.05];
const BUCKET = [0.55, -4.25];
const PUL1 = [0.55, -4.25, 4.1], PUL2 = [-0.2, UP_Y, 4.1];
function bucketZ() { return lerp(2.3, 0.45, G.liftUp); }
function liftZ() { return lerp(0.75, UP_Z, G.liftUp); }
function blueBlocks(out) {
  const t = G.blueT, dir = G.blueDir === 'a' ? 1 : -1;
  for (let i = 0; i < 4; i++) {
    const h = (i + 0.5) * BS;
    let x = BT[0], y = BT[1], z = h, R = I3;
    if (t >= 0) {
      const a = easeIn(clamp(t / 0.5, 0, 1)) * 1.05;
      const px = BT[0] - BS / 2;
      x = px + (BT[0] - px) * Math.cos(a) - h * Math.sin(a);
      z = (BT[0] - px) * Math.sin(a) + h * Math.cos(a);
      R = rY(-a);
      // 一つずつバケツへ
      const st = 0.5 + (3 - i) * 0.13;
      if (t > st) {
        const k = clamp((t - st) / 0.42, 0, 1);
        const bz = bucketZ();
        const tx = BUCKET[0] + dir * ((i % 2) - 0.5) * 0.3, ty = BUCKET[1] + ((i >> 1) - 0.5) * 0.3 * dir, tz = bz - 0.15 + (i >> 1) * 0.12 + 0.25;
        x = lerp(x, tx, k); y = lerp(y, ty, k); z = lerp(z, tz, k) + Math.sin(k * PI) * 1.0;
        R = mm(rZ(k * 1.3 * dir), rY(-a * (1 - k)));
        if (k >= 1) { x = tx; y = ty; z = tz; }
      }
      if (G.blueHop >= 0) { const ht = G.t - G.blueHop - i * 0.07; if (ht > 0 && ht < 0.4) z += Math.sin(ht / 0.4 * PI) * 0.3; }
    }
    if (G.rebuildBlue >= 0) { const rt = G.t - G.rebuildBlue - (i * 0.15); x = BT[0]; y = BT[1]; R = I3; z = h + Math.max(0, 1 - easeIn(clamp(rt / 0.45, 0, 1))) * 4; if (rt < 0) z = 99; }
    out.push([x, y, z, R, t > 0.5 + (3 - i) * 0.13 + 0.42]);
  }
  return out;
}
function drawBlue() {
  padDraw(BLUE_PAD, COL.blue, G.blueDone);
  const bl = blueBlocks([]);
  const inBucket = G.blueT >= 0 && G.rebuildBlue < 0;
  const sz = inBucket ? 0.42 : BS;

let dprCap = 2;
let W = 0, H = 0, DPR = 1, SAFE = { t: 0, r: 0, b: 0, l: 0 }, portrait = false;
const CORE = [[-5, -3, 0], [5, 3, 0], [5, -3, 0], [-5, 3, 0], [-6.4, 0.5, 2.3], [-6.8, -4.3, 4.4], [-6.75, -5.7, 0], [BR0 + 0.6, UP_Y, UP_Z + 1.8],

const FULL = CORE.concat([[WHEEL[0], WHEEL[1], WHEEL[2] + 2.3], [WHEEL[0] - 2, WHEEL[1], 0], [WHEEL[0] + 2.5, WHEEL[1], WHEEL[2]], [WHEEL[0] + 1.5, WHEEL[1], WHEEL[2] + 2.0], [WHEEL[0] - 1.5, WHEEL[1] + 0.6, WHEEL[2] + 2.2], [10.4, -6.9, 0.6], [4.6, -10.2, 1.8],
  [9.2, -6, 0], [-4.7, 5.8, 1.8], [-5.4, 5.7, 0], [8.8, -1.1, 1.8], [8.8, -0.5, 0], [-1.6, 5.2, 0], [7.2, 1.2, 0], [8.4, -4.5, 2]]);

const follow = { on: false, u0: 0, u1: 0, v0: 0, v1: 0 };

G.redStart = -1; G.blueStart = -1; G.peekGapT = -1; G.tunnelPass = -1; G.cartDir = 0; G.custId = null; G.pendingSpur = null; G.wide = false;
function update(dt) {
  G.t += dt;
  G.redT = G.redStart >= 0 ? G.t - G.redStart : -1;
  G.blueT = G.blueStart >= 0 ? G.t - G.blueStart : -1;
  if (G.rebuildRed >= 0 && G.t - G.rebuildRed > 1.5) G.rebuildRed = -1;
  if (G.rebuildBlue >= 0 && G.t - G.rebuildBlue > 1.5) G.rebuildBlue = -1;
  runEvents();
  applyPendingSpur();
  // 橋・昇降機（到達状態は周の間保持）
  if (G.redT >= 0) G.bridgeLow = Math.max(G.bridgeLow, ease((G.redT - 1.9) / 1.55));
  else G.bridgeLow = Math.max(0, G.bridgeLow - dt / 1.6);
  if (G.blueT >= 0) G.liftUp = Math.max(G.liftUp, ease((G.blueT - 1.15) / 1.4));
  else G.liftUp = Math.max(0, G.liftUp - dt / 1.6);
  // 風車
  const wTarget = G.redT >= 1.5 ? (G.redT < 3.5 ? 4 : 1.6) : 0;
  G.windV += (wTarget - G.windV) * Math.min(1, dt * (wTarget > G.windV ? 3 : 0.6));
  G.windAng += G.windV * dt;
  if (G.tt) G.ttAng += dt * 1.4;
  // 遊園地
  G.parkOpen = G.connected ? Math.min(1, G.parkOpen + dt / 2.2) : Math.max(0, G.parkOpen - dt / 2);
  G.wheelBoost = Math.max(0, G.wheelBoost - dt * 0.8);
  const wv = (G.connected ? 0.35 : 0) + G.wheelBoost;
  G.wheelV += (wv - G.wheelV) * Math.min(1, dt * 1.5);
  G.wheelAng += G.wheelV * dt; G.cupsAng += G.wheelV * 2.2 * dt;
  // 荷車
  if (G.cartDir > 0) G.cartGo = Math.min(1, G.cartGo + dt / 1.0);

    const p = ap(frameFrom(train.tx, train.ty, train.tz), -0.3, 0, 1.4);

  if (train.cargoPos) pts.push([train.cargoPos.x, train.cargoPos.y, train.cargoPos.z + 0.5]);
  if (train.coachPos) pts.push([train.coachPos.x, train.coachPos.y, train.coachPos.z + 0.5]);
  for (let i = 0; i < pts.length; i++) { const c = P(pts[i][0], pts[i][1], pts[i][2]); if (Math.hypot(c[0] - px, c[1] - py) < (i ? r * 0.8 : r)) return true; }
  return false;
}
const POKE = [['red', [RT[0], RT[1], 1.1]], ['blue', [BT[0], BT[1], 1.1]], ['bucket', [BUCKET[0], BUCKET[1], 1.5]], ['wind', [WM[0], WM[1], WM[2]]]];
function onDown(e) {
  e.preventDefault();
  audioInit();
  input.pointers.set(e.pointerId, true);
  input.last = G.t; input.demoShown = false; input.demoT = -1;
  const px = e.clientX, py = e.clientY;
  if (hitTrain(px, py)) { requestJump(); return; }
  for (const k of POKE) { const c = P(k[1][0], k[1][1], k[1][2]); if (Math.hypot(c[0] - px, c[1] - py) < Math.max(36, cam.scale * 1.2)) { pokes[k[0]] = G.t; sfx.tick(); return; } }
}
function onUp(e) { input.pointers.delete(e.pointerId); }
cv.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
window.addEventListener('lostpointercapture', onUp);
for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'dblclick', 'contextmenu', 'selectstart'])
  document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

// ============================================================
//  ループ（rAFのみ・非表示で停止）
// ============================================================
let raf = 0, lastT = 0, running = false;
function frame(now) {
  raf = 0;
  if (!running) return;
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  if (dt > 0 && dt < 0.2) perfWatch(dt);
  raf = requestAnimationFrame(frame);
}
function start() { if (running) return; running = true; lastT = performance.now(); raf = requestAnimationFrame(frame); }
function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stop(); input.pointers.clear(); if (AC && AC.state === 'running') AC.suspend().catch(() => {}); }
  else { if (AC && AC.state === 'suspended') AC.resume().catch(() => {}); start(); }
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();
start();
// 検証用（ゲームには影響しない）
window.__pon = { G, train, E, cam, requestJump, startNextCycle, P, guide, parts, input, render,
  step(dt, n, nr) { for (let i = 0; i < n; i++) update(dt); if (!nr) render(); } };
})();
</script>

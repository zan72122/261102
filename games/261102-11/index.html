const F = { x: 0, y: 0, px: 0, py: 0, S: 40, a: 0, rot: 0, hx: 0, hy: 0, hr: 40, tilt: 0, lh: [0, 0], rh: [0, 0], comb: 0 };

function toW(lx, ly) {   // 椅子の座面を原点にした S 単位 → 画面（揺れの回転こみ）
  const x = F.x + lx * F.S, y = F.y + ly * F.S;

function updateFigure(dt) {
  const S = L.S, t = G.t, fc = G.face;

    : k === 's' ? [L.ball.x, L.ball.y] : k === 'd' ? [L.dough.x, L.dough.y - L.dough.r * 0.3] : [L.cup.x, L.cup.y - L.cup.s * 0.5];
  sShelf();
  flight({ mat: k, from: [s.x, s.y - L.slotR * 0.5], to: dest, dur: 0.85, onArrive: () => applyMaterial(k, m) });
}
function applyMaterial(k, m) {
  const gf = G.gifts, e = G.era;
  if (e < 1 || e > 3 || G.phase !== 'play') return;
  if (k === 'b') {
    const had = !!gf.branch; gf.branch = { i: m.i, p: m.p.map(q => q.slice()), e }; G.branchSel = null;
    if (!had) markOrder('tree'); sBranch(4); noteChoice('tree', !had);
    const gr = tab(TREE_G, G.ev.tree), pts = brCustom(m.i, m.p, gr, false), tp = pts[pts.length - 1];
    for (let j = 0; j < 6; j++) spark(L.win.x + tp[0], L.win.y + tp[1], 'leaf');
  } else if (k === 's') {
    const had = !!gf.silk; gf.silk = { n: m.n, e, rb: m.rb || G.rainbow };
    if (!had) markOrder('silk'); sLoop(m.n); noteChoice('silk', !had);
  } else if (k === 'd') {
    const had = !!gf.dough; G.dough = { o: m.o.slice(), d: m.d.map(q => q.slice()) };
    gf.dough = { o: m.o.slice(), d: m.d.map(q => q.slice()), e };
    G.doughSq = 0.8; G.doughSqT = 0; sDough(0.5); noteChoice('dough', !had);
  } else if (k === 'c') {
    const had = !!gf.cup; gf.cup = { e, reuse: true }; G.cupWobV += 7; G.cupShine = 0; sCup(false, 2); noteChoice('cup', !had);
  }
}
function startBranch(i, x, y) {
  const gr = tab(TREE_G, G.ev.tree);
  const def = brDefault(i, gr), tip = def[def.length - 1];
  const lx = clamp(x - L.win.x, 4, L.win.w - 4), ly = clamp(y - L.win.y, 4, L.tree.by - 6);
  let tapTgt;

    tapTgt = [clamp(tip[0] + dx / l * L.tree.TH * 0.16, 4, L.win.w - 4), clamp(tip[1] + dy / l * L.tree.TH * 0.16, 4, L.tree.by - 6)];
  } else tapTgt = [lx, ly];
  G.branchSel = { i, def, ext: [], tapTgt, grow: polyLen(def), live: def, done: false, maxExt: L.tree.TH * 0.55 };

}
function moveBranch(x, y) {
  const bs = G.branchSel; if (!bs || bs.done) return;
  const lx = clamp(x - L.win.x, 4, L.win.w - 4), ly = clamp(y - L.win.y, 4, L.tree.by - 6);
  if (!bs.ext.length && polyDist(lx, ly, bs.def) < 16) return;
  const last = bs.ext.length ? bs.ext[bs.ext.length - 1] : bs.def[bs.def.length - 1];
  if (Math.hypot(lx - last[0], ly - last[1]) > 7) {
    const extLen = polyLen([bs.def[bs.def.length - 1]].concat(bs.ext, [[lx, ly]]));

  }
}
function endBranch() {

}
function startGrab(p, x, y, soft) {
  p.mode = 'grab';
  HR.grab = { active: true, x, y, x0: x, y0: y, xs: x, ten: 0, pull: 0, cuts: 0, resist: false };
  hairPoke(x, y, soft ? 0.25 : 0.6);
  if (!soft) sSilk(1);
  tensionStart(); tensionSet(0);
  look(x, y, 1.6); G.face.sur = Math.max(G.face.sur, 0.45);
  G.rock.kick = Math.max(G.rock.kick, 0.35);
  for (let k = 0; k < 2; k++) spark(x, y, 'gold');
}
function moveGrab(p, x, y) {
  const gb = HR.grab; if (!gb) return;
  gb.x = x; gb.y = y;
  const dxs = x - gb.xs;
  let ten = Math.abs(dxs) / L.cutDist;
  const canCut = G.phase === 'play' && G.era < 4 && gb.cuts < 2 && !(G.era === 3 && gb.cuts >= 1);
  if (!canCut) { ten = Math.min(ten, 0.9); if (ten > 0.85 && !gb.resist) { gb.resist = true; G.face.sur = 0.9; } }
  gb.ten = clamp(ten, 0, 1); gb.pull = clamp(gb.ten * 0.95, 0, 0.88);
  tensionSet(gb.ten);
  look(x, y, 0.6);
  if (ten >= 1 && canCut) {
    const dir = dxs >= 0 ? 1 : -1;
    HR.strands.forEach(s => s.nodes.forEach((n, i) => { if (i) { n.vx -= dir * (150 + Math.random() * 250); n.vy -= Math.random() * 120; } }));
    gb.cuts++;
    doCut(dir, x, y);
    if (G.phase !== 'play') { endGrab(); p.mode = 'none'; return; }
    gb.xs = x; gb.y0 = y; gb.ten = 0; gb.pull = 0; tensionSet(0);
  }
}
function endGrab() {
  const gb = HR.grab; tensionStop();
  if (gb) {
    if (gb.resist || (gb.cuts === 0 && gb.ten > 0.25)) { sBoing(); HR.strands.forEach(s => s.nodes.forEach((n, i) => { if (i) n.vx += (Math.random() - 0.5) * 300; })); }
  }
  HR.grab = null;
}
function beginPointer(p) {
  const x = p.x0, y = p.y0, fc = G.face;
  if (G.phase === 'ff') {
    if (Math.hypot(x - F.hx, y - F.hy) < F.hr * 2.4) { fc.giggle = 1; sGiggle(); spark(F.hx, F.hy - F.hr, 'gold'); }
    look(x, y); return;
  }
  if (G.creation && !G.leaving) {
    const id = hitFuture(x, y);
    if (id) { touchFuture(id, x, y); p.mode = 'tap'; return; }
  }
  const e = G.era;
  if (e >= 1 && e <= 3) {
    const sk = hitShelf(x, y);
    if (sk) { useShelf(sk, x, y); p.mode = 'tap'; return; }
    if (AVAIL.tree[e]) { const bi = hitBranch(x, y); if (bi >= 0) { startBranch(bi, x, y); p.mode = 'branch'; return; } }
    if (AVAIL.silk[e] && hitBall(x, y)) { G.loopAnim = { x, y, t: 0, rb: G.rainbow }; sSilk(1); look(x, y); p.mode = 'loop'; return; }
    if (AVAIL.dough[e] && hitDough(x, y)) { pressDough(x, y, true); look(x, y); p.mode = 'dough'; p.lastDent = [x, y]; return; }
    if (AVAIL.cup[e] && hitCup(x, y)) { ringCup(); look(x, y); p.mode = 'tap'; return; }
  }
  const other = hitOther(x, y);
  if (other) { touchOther(other, x, y); look(x, y); p.mode = 'tap'; return; }
  if (hairHit(x, y, Math.max(L.S * 0.45, 22))) { startGrab(p, x, y, false); return; }
  // 何もない所：おばあちゃんがそちらを見る（最初のタップでも変化が見える）
  look(x, y); fc.sur = Math.max(fc.sur, 0.25);

}
function movePointer(p, x, y) {
  if (Math.hypot(x - p.x0, y - p.y0) > 8) p.moved = true;
  switch (p.mode) {
    case 'grab': moveGrab(p, x, y); break;
    case 'branch': moveBranch(x, y); break;
    case 'loop': if (G.loopAnim) { G.loopAnim.x = x; G.loopAnim.y = y; } break;
    case 'dough':
      if (hitDough(x, y) && Math.hypot(x - p.lastDent[0], y - p.lastDent[1]) > L.dough.r * 0.32) { pressDough(x, y, false); p.lastDent = [x, y]; }
      break;
    case 'free':
      if (G.phase === 'play' && hairHit(x, y, Math.max(L.S * 0.35, 18))) startGrab(p, x, y, true);
      break;
  }
  p.lx = x; p.ly = y;
}
function endPointer(p, cancelled) {
  switch (p.mode) {
    case 'grab': endGrab(); break;
    case 'branch': endBranch(); break;
    case 'loop':
      if (G.loopAnim) { if (!cancelled || G.loopAnim.t > 0.08) addLoop(); G.loopAnim = null; }
      break;
  }
  p.mode = 'none';
  if (G.ptr === p) G.ptr = null;
}
function onDown(e) {
  if (e.cancelable) e.preventDefault();
  audioStart();
  const x = e.clientX, y = e.clientY;
  G.lastInput = G.t; G.anyInput = true; G.hint = null;
  if (G.firstTapT < 0) G.firstTapT = G.t;
  if (G.ptr) {
    const old = G.ptr;
    // 置いたまま動かない指（手のひら等）があれば、新しい指へ乗りかえる
    if (!old.moved && G.t - old.t0 > 0.45 && old.mode !== 'grab') endPointer(old, true);
    else return;
  }
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
  const p = { id: e.pointerId, x0: x, y0: y, x, y, lx: x, ly: y, t0: G.t, moved: false, mode: 'none' };
  G.ptr = p;
  try { beginPointer(p); } catch (err) { reportErr(err); G.ptr = null; }
}
function onMove(e) {
  const p = G.ptr; if (!p || e.pointerId !== p.id) return;
  if (e.cancelable) e.preventDefault();
  G.lastInput = G.t;
  try { movePointer(p, e.clientX, e.clientY); } catch (err) { reportErr(err); }
}
function onUp(e) {
  audioStart();
  const p = G.ptr; if (!p || e.pointerId !== p.id) return;
  if (e.cancelable) e.preventDefault();
  G.lastInput = G.t;
  try { endPointer(p, false); } catch (err) { reportErr(err); G.ptr = null; }
}
function onCancel(e) {
  const p = G.ptr; if (!p || e.pointerId !== p.id) return;
  try { endPointer(p, true); } catch (err) { reportErr(err); G.ptr = null; }
}
function releaseAll() { if (G.ptr) { try { endPointer(G.ptr, true); } catch (err) { G.ptr = null; } } tensionStop(); HR.grab = null; }
cv.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointermove', onMove, { passive: false });
window.addEventListener('pointerup', onUp, { passive: false });
window.addEventListener('pointercancel', onCancel);
cv.addEventListener('lostpointercapture', e => { const p = G.ptr; if (p && e.pointerId === p.id) setTimeout(() => { if (G.ptr === p) onCancel(e); }, 0); });
window.addEventListener('blur', releaseAll);
['contextmenu', 'selectstart', 'dragstart', 'gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(n => document.addEventListener(n, e => { if (e.cancelable) e.preventDefault(); }, { passive: false }));
document.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', () => audioStart(), { passive: true });

// ---------------------------------------------------------------------
//  まわす：requestAnimationFrame だけ。見えないときは止める
// ---------------------------------------------------------------------
const ERRS = [];
function reportErr(e) { if (ERRS.length < 20) ERRS.push(String((e && e.stack) || e)); }
function update(dt) {
  G.t += dt;
  updateSched();
  updateTweens(dt);
  updateFF(dt);
  updateFigure(dt);
  updateHair(dt);
  updateItems(dt);
  updateFlights(dt);
  updateParts(dt);
  G.invite = computeInvite();
  G.inviteAt = anchorOf(G.invite);
  updateHint(dt);
  G.invSpark = (G.invSpark || 0) + dt;
  if (G.invite && G.inviteAt && !G.ptr && G.phase === 'play' && G.invSpark > 0.42) {
    G.invSpark = 0;
    const a = Math.random() * TAU, d = L.S * (0.25 + Math.random() * 0.45);

  }
}
function render(dt) {
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(C.bg.c, 0, 0, L.W, L.H);
  drawSunbeam();
  drawWindow();
  drawCurtains();
  drawStand();
  drawShelfItems();
  drawFloorShadow();
  drawChair();
  drawBody();
  drawHead();
  drawHair();
  drawHands();
  drawDebris();
  blit(C.table);
  drawSweets();
  drawCup();
  drawBasket();
  drawFlights();
  drawParts();
  drawRipples(dt);
  drawHint();
  drawVignette();
}
let raf = 0, lastTs = 0, running = false;
const PERF = { u: 0, r: 0 };
function frame(ts) {

  if (!running) return;
  let dt = lastTs ? (ts - lastTs) / 1000 : 1 / 60;
  lastTs = ts;
  if (!Q.fixed && dt > 0 && dt < 0.25) {
    Q.acc += dt; Q.n++;

      const avg = Q.acc / Q.n; Q.acc = 0; Q.n = 0;

}
function start() { if (running) return; running = true; lastTs = 0; raf = requestAnimationFrame(frame); }
function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
function rebuild() {
  layout(); buildRoom(); buildChair(); C.vig = null; C.out = null;
  updateFigure(0); hairRest();
  HR.strands.forEach(s => { s.nodes.forEach((n, i) => { const r = s.restN[i]; n.x = r[0]; n.y = r[1]; n.vx = 0; n.vy = 0; }); });
}
let rsPending = false;
function onResize() {
  if (rsPending) return; rsPending = true;
  requestAnimationFrame(() => { rsPending = false; try { releaseAll(); rebuild(); if (!running && !document.hidden) start(); else if (!running) { update(0); render(0); } } catch (e) { reportErr(e); } });
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stop(); releaseAll();
    try { if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend(); } catch (e) { /* noop */ }
  } else {
    start();
    try { if (AU.ctx && AU.started) AU.ctx.resume(); } catch (e) { /* noop */ }
  }

window.addEventListener('pagehide', () => { stop(); releaseAll(); });
window.addEventListener('pageshow', () => { if (!document.hidden) start(); });

// ---------------------------------------------------------------------
//  はじまり：開始メニューなし。部屋がそのまま遊び場
// ---------------------------------------------------------------------
if (window.__gfFixedQuality) Q.fixed = true;
loadSave();
layout(); buildRoom(); buildChair();
G.dough = newDough();
if (G.creation) {
  ['slide', 'swing', 'curtain', 'cookie', 'gold'].forEach(k => { G.rv[k] = 1; });
  G.cupHome = G.creation.c ? 'stand' : 'table';
}
updateFigure(0);
initHair();
update(0); render(0);
if (!document.hidden) start();

// 自動テスト用の読み取り口（画面には何も出さない）
window.__gf11 = {
  errors: ERRS,
  state() {
    return {
      era: G.era, phase: G.phase, cyc: G.cyc, invite: G.invite, hint: G.hint ? G.hint.kind : null, hintDone: Object.keys(G.hintDone),
      gifts: JSON.parse(JSON.stringify({ branch: G.gifts.branch, silk: G.gifts.silk, dough: G.gifts.dough, cup: G.gifts.cup, tTree: G.gifts.tTree, tSilk: G.gifts.tSilk, used: G.gifts.used })),
      creation: G.creation ? JSON.parse(JSON.stringify(G.creation)) : null, shelf: JSON.parse(JSON.stringify(G.shelf)),
      store: store.mode, canWrite: store.canWrite, audio: AU.ctx ? AU.ctx.state : 'none', frames: G.frame, running,
      parts: G.parts.length, maxParts: MAX_PARTS, rainbow: G.rainbow, hairLen: HR.strands.length ? HR.strands[0].len : 0,
      lockLen: HR.strands.length ? HR.strands[HR.lockIdx[0]].len : 0, tension: HR.grab ? HR.grab.ten : 0, grab: !!HR.grab, ptr: !!G.ptr,
      ev: Object.assign({}, G.ev), q: Q.level, rv: Object.assign({}, G.rv), cupHome: G.cupHome, swing: G.swing.w, ball: !!G.ball, flights: G.flights.length,
      visit: Object.assign({}, G.visit), touched: Object.assign({}, G.touched), dpr: L.dpr, W: L.W, H: L.H, S: L.S, cutDist: L.cutDist,

  },
  pos(id) {

  },
  layout() { return JSON.parse(JSON.stringify({ win: L.win, table: L.table, dough: L.dough, cup: L.cup, ball: L.ball, basket: L.basket, shelf: L.shelf, slots: L.slots, slotR: L.slotR, S: L.S, floorY: L.floorY, baseY: L.baseY, cx: L.cx, stand: L.stand, sillTop: L.sillTop, ins: L.ins })); },
  forceRainbow(v) { G.forceRainbow = v; },
  perf() { return { u: +PERF.u.toFixed(2), r: +PERF.r.toFixed(2) }; },
  profile(n) {   // 描画の内訳（ms）
    const parts = { bg: () => ctx.drawImage(C.bg.c, 0, 0, L.W, L.H), sun: drawSunbeam, win: drawWindow, curt: drawCurtains, shelf: drawShelfItems, chair: drawChair, body: drawBody, head: drawHead, hair: drawHair, hands: drawHands, table: () => { blit(C.table); drawSweets(); drawCup(); }, basket: drawBasket, parts: drawParts, vig: drawVignette };

    const t = performance.now(); for (let i = 0; i < n; i++) update(1 / 60); out.update = +((performance.now() - t) / n).toFixed(2);
    return out;
  },
};
})();

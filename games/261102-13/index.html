<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<title>ぱらりん</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#0a1633;overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;outline:none;background:#0a1633}
#sa{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(() => {
'use strict';
/* ============================================================
   ぱらりん！きえる道具と灯台のひかりみち
   - 背景は濃紺の単色。物・人物・影枠はすべて点の集合。
   - 点の色は「世界色」「現象色」の2役だけ（場面ごとに白・金・水色・珊瑚色を割り当て）。
   ============================================================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const saEl = document.getElementById('sa');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const rnd = (a, b) => a + Math.random() * (b - a);
const hyp = Math.hypot;
const sgn = v => v < 0 ? -1 : 1;
function mulberry(seed) {
  return function () {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------- screen / safe area / camera ---------------- */
let W = 0, H = 0, DPR = 1, WW = 400, WH = 700, U = 1, LT = 0;
const SA = { t: 0, b: 0, l: 0, r: 0 };
const ZIN = 1.25;                       // 灯台まわりの寄りの倍率
const cam = { z: ZIN, z0: ZIN, z1: ZIN, tw: 0, tl: 0, x0: 0, y0: 0 };
function camUpdate() {
  const vw = WW / cam.z, vh = WH / cam.z;
  cam.x0 = 0;                  // 左（灯台側）を固定
  cam.y0 = WH - vh;            // 下（工作台側）を固定
}
function view() { return { x0: cam.x0, y0: cam.y0, x1: cam.x0 + WW / cam.z, y1: cam.y0 + WH / cam.z }; }
const sxp = x => SA.l + (x - cam.x0) * cam.z;
const syp = y => SA.t + (y - cam.y0) * cam.z;
const wxp = px => (px - SA.l) / cam.z + cam.x0;
const wyp = py => (py - SA.t) / cam.z + cam.y0;

/* ---------------- palette: 背景＋2色 ---------------- */
const BG = '#0a1633';
const COL = { white: [246, 243, 232], gold: [255, 204, 86], aqua: [116, 214, 240], coral: [255, 128, 110] };
const SCENES = [['coral', 'aqua'], ['white', 'aqua'], ['white', 'gold'], ['coral', 'gold']];
const roleCol = [COL.coral.slice(), COL.aqua.slice()];
let sceneIdx = 0;
const spr = [document.createElement('canvas'), document.createElement('canvas')];
const sprKey = ['', ''];
function makeSprite(i) {
  const c = roleCol[i];
  const key = (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0);
  if (key === sprKey[i]) return;
  sprKey[i] = key;
  const s = spr[i];
  s.width = s.height = 32;
  const g = s.getContext('2d');
  g.clearRect(0, 0, 32, 32);
  g.fillStyle = 'rgb(' + key + ')';
  g.beginPath(); g.arc(16, 16, 14.5, 0, TAU); g.fill();
}
function updatePalette(dt, snap) {
  const tg = SCENES[sceneIdx];
  const k = snap ? 1 : 1 - Math.exp(-dt * 1.8);
  for (let i = 0; i < 2; i++) {
    const c = COL[tg[i]], r = roleCol[i];
    for (let j = 0; j < 3; j++) r[j] += (c[j] - r[j]) * k;
    makeSprite(i);
  }
}

/* ---------------- dot buckets（色2 × 透明度4） ---------------- */
const ALPHA = [0.22, 0.45, 0.7, 1];
const BCAP = 3200, DOT_CAP = 3000;
const bk = [], bn = new Int32Array(8);
for (let i = 0; i < 8; i++) bk.push(new Float32Array(BCAP * 3));
let frameDots = 0, maxDots = 0, lastDots = 0, dotLimit = DOT_CAP;
const passDots = [0, 0, 0, 0];
// world 座標で点を積む（c: 0=世界色 1=現象色, a: 0..1）
function D(x, y, r, c, a) {
  if (a < 0.07 || frameDots >= dotLimit) return;
  const pr = r * cam.z;
  const px = SA.l + (x - cam.x0) * cam.z, py = SA.t + (y - cam.y0) * cam.z;
  if (px < -pr || py < -pr || px > W + pr || py > H + pr) return;
  const ai = a < 0.33 ? 0 : a < 0.58 ? 1 : a < 0.85 ? 2 : 3;
  const b = c * 4 + ai, n = bn[b];
  if (n >= BCAP) return;
  const arr = bk[b], i = n * 3;
  arr[i] = px; arr[i + 1] = py; arr[i + 2] = pr < 0.7 ? 0.7 : pr;
  bn[b] = n + 1; frameDots++;
}
function flush() {
  for (let b = 0; b < 8; b++) {
    const n = bn[b];
    if (!n) continue;
    ctx.globalAlpha = ALPHA[b & 3];
    const s = spr[b >> 2], arr = bk[b];
    for (let i = 0, m = n * 3; i < m; i += 3) {
      const r = arr[i + 2];
      ctx.drawImage(s, arr[i] - r, arr[i + 1] - r, r + r, r + r);
    }
    bn[b] = 0;
  }
  ctx.globalAlpha = 1;
}

/* ---------------- layout（縦長テンプレと横長テンプレを補間） ---------------- */
const TOOLS = ['umbrella', 'fan', 'lamp', 'bell', 'kettle'];
const TPL = {
  hz: [0.335, 0.40],
  sun: [[0.40, 0.335], [0.47, 0.40]],
  mtn: [[[0.47, 0.35], [0.55, 0.27], [0.62, 0.21], [0.69, 0.15], [0.77, 0.085], [0.85, 0.12], [0.92, 0.18], [1.0, 0.22], [1.05, 0.35]],
        [[0.60, 0.42], [0.66, 0.33], [0.71, 0.27], [0.76, 0.19], [0.82, 0.11], [0.88, 0.15], [0.94, 0.22], [1.0, 0.27], [1.05, 0.42]]],
  mpath: [[[0.47, 0.345], [0.55, 0.30], [0.52, 0.26], [0.61, 0.22], [0.59, 0.18], [0.68, 0.14], [0.77, 0.095], [0.84, 0.13], [0.92, 0.18], [0.87, 0.23], [0.95, 0.28], [0.90, 0.33]],
          [[0.60, 0.415], [0.68, 0.36], [0.655, 0.31], [0.72, 0.27], [0.70, 0.225], [0.77, 0.18], [0.82, 0.125], [0.87, 0.175], [0.92, 0.235], [0.88, 0.29], [0.95, 0.34], [0.92, 0.40]]],
  pR: [[0.90, 0.37], [0.93, 0.445]],
  pRw: [0.09, 0.06],
  pL: [[0.09, 0.385], [0.085, 0.47]],
  fog: [[0.0, 0.165, 0.54, 0.355], [0.0, 0.215, 0.58, 0.43]],
  hb: [[0.36, 0.30], [0.075, 0.315]],
  pH: [[0.45, 0.338], [0.125, 0.36]],
  isl: [[0.06, 0.25], [0.43, 0.33]],
  ship: [[0.56, 0.338], [0.60, 0.405]],
  lh: [[0.16, 0.585, 0.255], [0.18, 0.665, 0.25]],
  pier: [[0.215, 1.0, 0.605], [0.215, 0.86, 0.685]],
  wheel: [[0.55, 0.633], [0.54, 0.712]],
  pen: [[0.30, 0.50, 0.74], [0.30, 0.50, 0.72]],
  partsY: [0.79, 0.85],
  partsX: [[0.18, 0.66], [0.34, 0.68]],
  dockY: [0.85, 0.905],
  shelfY: [0.925, 0.945],
  shelfX: [[0.12, 0.31, 0.50, 0.69], [0.30, 0.43, 0.56, 0.69]],
  bench: {
    umbrella: [[0.40, 0.465], [0.40, 0.52]],
    fan: [[0.66, 0.50], [0.63, 0.575]],
    lamp: [[0.66, 0.70], [0.74, 0.60]],
    bell: [[0.44, 0.71], [0.42, 0.62]],
    kettle: [[0.22, 0.69], [0.27, 0.575]],
  },
};
function mixT(a, b, t) {
  if (typeof a === 'number') return lerp(a, b, t);
  if (Array.isArray(a)) return a.map((v, i) => mixT(v, b[i], t));
  const o = {};
  for (const k in a) o[k] = mixT(a[k], b[k], t);
  return o;
}
let L = null;          // 現在のレイアウト（world px）
let LF = null;         // 現在のレイアウト（比率）
function layoutFractions(t) {
  const f = {};
  for (const k in TPL) {
    if (k === 'bench') {
      f.bench = {};
      for (const tn of TOOLS) f.bench[tn] = mixT(TPL.bench[tn][0], TPL.bench[tn][1], t);
    } else f[k] = mixT(TPL[k][0], TPL[k][1], t);
  }
  return f;
}
function buildLayout() {
  LT = clamp((WW / WH - 0.5) / (1.4 - 0.5), 0, 1);
  LF = layoutFractions(LT);
  const f = LF, X = v => v * WW, Y = v => v * WH, P = p => [p[0] * WW, p[1] * WH];
  L = {
    hz: Y(f.hz), sun: P(f.sun),
    mtn: f.mtn.map(P), mpath: f.mpath.map(P),
    pR: P(f.pR), pRw: X(f.pRw), pL: P(f.pL),
    fog: [X(f.fog[0]), Y(f.fog[1]), X(f.fog[2]), Y(f.fog[3])],
    hb: P(f.hb), pH: P(f.pH), isl: P(f.isl), ship: P(f.ship),
    lhX: X(f.lh[0]), lhBase: Y(f.lh[1]), lhTop: Y(f.lh[2]),
    px0: X(f.pier[0]), px1: X(f.pier[1]), py: Y(f.pier[2]),
    wheel: P(f.wheel), pen: f.pen.map(X),
    partsY: Y(f.partsY), partsX: [X(f.partsX[0]), X(f.partsX[1])],
    dockY: Y(f.dockY), shelfY: Y(f.shelfY), shelfX: f.shelfX.map(X),
    bench: {},
  };
  for (const tn of TOOLS) L.bench[tn] = P(f.bench[tn]);
  L.S = 46 * U;                                    // 道具の半サイズ
  L.homeX = L.lhX + 30 * U;                        // 灯台守の家（戸口）
  L.wheelR = 25 * U;
  L.penH = WH * 0.11;
  L.windLen = WW * lerp(0.30, 0.22, LT);
  L.ringMax = WW * lerp(0.44, 0.30, LT);
  L.lightR = WW * lerp(0.13, 0.085, LT);
}
// 旧レイアウト比率 → 新レイアウト比率へ、目印線で区分線形に写す
function keyLinesX(f) { return [0, f.lh[0], f.wheel[0], f.pier[1], 1]; }
function keyLinesY(f) { return [0, f.hz, f.pier[2], f.partsY, f.shelfY, 1]; }
function remap1(v, a, b) {
  if (v <= a[0]) return b[0] + (v - a[0]);
  for (let i = 1; i < a.length; i++) {
    if (v <= a[i]) { const t = (v - a[i - 1]) / Math.max(1e-6, a[i] - a[i - 1]); return lerp(b[i - 1], b[i], t); }
  }
  return b[b.length - 1] + (v - a[a.length - 1]);
}
function remapFrac(fx, fy, fOld, fNew) {
  return [remap1(fx, keyLinesX(fOld), keyLinesX(fNew)), remap1(fy, keyLinesY(fOld), keyLinesY(fNew))];
}

/* ---------------- scenery（景色の点を作る） ---------------- */
const NSEG = 28;
const SC = { stars: [], sun: [], sunRef: [], mtn: [], sea: [], lh: [], lhWin: [], rock: [], pier: [], dock: [], farR: [], farL: [], hidden: [], isl: [], fog: [] };
function inPoly(poly, x, y) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
  }
  return c;
}
function lineDots(arr, x0, y0, x1, y1, sp, r, a, extra) {
  const len = hyp(x1 - x0, y1 - y0), n = Math.max(1, Math.round(len / sp));
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const o = { x: lerp(x0, x1, t), y: lerp(y0, y1, t), r, a, p: Math.random() * TAU };
    if (extra) Object.assign(o, extra);
    arr.push(o);
  }
}
// Catmull-Rom で通過点をなめらかに等間隔サンプル
function sampleCurve(pts, sp) {
  const out = [];
  if (pts.length < 2) return out;
  const P = [pts[0]].concat(pts, [pts[pts.length - 1]]);
  let carry = 0, px = pts[0][0], py = pts[0][1];
  out.push([px, py]);
  for (let i = 1; i < P.length - 2; i++) {
    const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
    const steps = Math.max(4, Math.ceil(hyp(p2[0] - p1[0], p2[1] - p1[1]) / (sp * 0.25)));
    for (let s = 1; s <= steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
      const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
      let d = hyp(x - px, y - py);
      while (carry + d >= sp) {
        const need = sp - carry, k = need / d;
        px = px + (x - px) * k; py = py + (y - py) * k;
        out.push([px, py]);
        d = hyp(x - px, y - py); carry = 0;
      }
      carry += d; px = x; py = y;
    }
  }
  const last = pts[pts.length - 1];
  if (hyp(last[0] - out[out.length - 1][0], last[1] - out[out.length - 1][1]) > sp * 0.4) out.push([last[0], last[1]]);
  return out;
}
function buildScenery() {
  const R = mulberry(1302);
  for (const k in SC) SC[k] = [];
  const left = -SA.l - 10, right = WW + SA.r + 10;
  // 星（夜だけ見える）
  for (let i = 0; i < 38; i++) {
    const x = lerp(left, right, R()), y = lerp(-SA.t, L.hz - 0.05 * WH, R());
    if (inPoly(L.mtn, x, y)) continue;
    SC.stars.push({ x, y, r: (0.7 + R() * 0.7) * U, a: 0.4 + R() * 0.5, p: R() * TAU });
  }
  // 夕日（半円の同心点）と海への映り込み
  const sr = 30 * U;
  for (let k = 1; k <= 4; k++) {
    const rr = sr * k / 4, n = Math.max(3, Math.round(Math.PI * rr / (4.6 * U)));
    for (let i = 0; i <= n; i++) {
      const an = Math.PI + Math.PI * i / n;
      SC.sun.push({ x: L.sun[0] + Math.cos(an) * rr, y: L.hz + Math.sin(an) * rr - 1.5 * U, r: 1.5 * U, a: 0.95, p: R() * TAU });
    }
  }
  for (let k = 0; k < 6; k++) {
    const y = L.hz + (4 + k * k * 2.2) * U, w = sr * (1.1 - k * 0.12);
    lineDots(SC.sunRef, L.sun[0] - w, y, L.sun[0] + w, y, 5 * U, 1.1 * U, 0.6 - k * 0.07);
  }
  // 岩山（輪郭はやや密、中は疎）
  const M = L.mtn;
  for (let i = 0; i < M.length - 1; i++) lineDots(SC.mtn, M[i][0], M[i][1], M[i + 1][0], M[i + 1][1], 6.5 * U, 1.25 * U, 0.42, { lit: 0 });
  let minY = 1e9, maxY = -1e9, minX = 1e9, maxX = -1e9;
  for (const p of M) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); }
  const msp = 19 * U;
  for (let y = minY + msp * 0.5; y < maxY; y += msp * 0.87) {
    for (let x = minX + ((y / msp) % 2) * msp * 0.5; x < maxX; x += msp) {
      const jx = x + (R() - 0.5) * msp * 0.5, jy = y + (R() - 0.5) * msp * 0.5;
      if (inPoly(M, jx, jy)) SC.mtn.push({ x: jx, y: jy, r: 1.0 * U, a: 0.24, p: R() * TAU, lit: 0 });
    }
  }
  // 海の波（奥ほど細かく、手前ほど粗く）
  let d = 0.012 * WH, y = L.hz + d;
  while (y < WH + SA.b + 10) {
    const depth = clamp((y - L.hz) / (WH - L.hz), 0, 1);
    const gap = lerp(36, 95, depth) * U, off = R() * gap;
    for (let x = left + off; x < right; x += gap * (0.7 + R() * 0.6)) {
      for (let j = 0; j < 2; j++) SC.sea.push({ x: x + j * 4.5 * U * (0.6 + depth), y, r: lerp(0.8, 1.3, depth) * U, a: lerp(0.24, 0.42, depth), p: R() * TAU, dp: depth });
    }
    d *= 1.28; y += Math.max(d, 6 * U);
  }
  // 灯台
  const lx = L.lhX, base = L.lhBase, top = L.lhTop, h = base - top;
  const bw = 20 * U, tw = 13 * U, yGal = top + 0.17 * h, yRoof = top + 0.05 * h;
  L.lhWinY = (yRoof + yGal) / 2; L.lhGal = yGal; L.lhW = bw;
  lineDots(SC.lh, lx - bw, base, lx - tw, yGal, 6 * U, 1.3 * U, 0.9);
  lineDots(SC.lh, lx + bw, base, lx + tw, yGal, 6 * U, 1.3 * U, 0.9);
  for (const fy of [0.3, 0.55, 0.8]) {
    for (let r2 = 0; r2 < 2; r2++) {
      const yy = lerp(yGal, base, fy) + r2 * 4.5 * U, hw = lerp(tw, bw, fy + r2 * 0.02) - 2 * U;
      lineDots(SC.lh, lx - hw, yy, lx + hw, yy, 5 * U, 1.15 * U, 0.75);
    }
  }
  lineDots(SC.lh, lx - tw - 7 * U, yGal, lx + tw + 7 * U, yGal, 4.5 * U, 1.3 * U, 1);
  for (let i = -2; i <= 2; i++) lineDots(SC.lh, lx + i * (tw + 6 * U) / 2, yGal - 5 * U, lx + i * (tw + 6 * U) / 2, yGal, 5 * U, 1.0 * U, 0.8);
  lineDots(SC.lh, lx - tw - 7 * U, yGal - 6 * U, lx + tw + 7 * U, yGal - 6 * U, 5 * U, 1.0 * U, 0.75);
  // 窓（ランタン室）
  for (const ix of [-9, -3, 3, 9]) lineDots(SC.lhWin, lx + ix * U, yRoof + 2 * U, lx + ix * U, yGal - 7 * U, 3.8 * U, 1.2 * U, 0.9);
  lineDots(SC.lh, lx - 11 * U, yRoof, lx - 11 * U, yGal - 6 * U, 4.5 * U, 1.2 * U, 0.95);
  lineDots(SC.lh, lx + 11 * U, yRoof, lx + 11 * U, yGal - 6 * U, 4.5 * U, 1.2 * U, 0.95);
  for (let i = 0; i <= 10; i++) {
    const an = Math.PI + Math.PI * i / 10;
    SC.lh.push({ x: lx + Math.cos(an) * 13 * U, y: yRoof + Math.sin(an) * 9 * U, r: 1.3 * U, a: 1, p: 0 });
  }
  SC.lh.push({ x: lx, y: yRoof - 12 * U, r: 1.6 * U, a: 1, p: 0 });
  // 戸口とひさし
  for (let i = 0; i <= 8; i++) {
    const an = Math.PI + Math.PI * i / 8;
    SC.lh.push({ x: lx + 7 * U + Math.cos(an) * 6 * U, y: base - 12 * U + Math.sin(an) * 7 * U, r: 1.1 * U, a: 0.8, p: 0 });
  }
  lineDots(SC.lh, lx + 1 * U, base - 12 * U, lx + 1 * U, base - 1 * U, 4 * U, 1.1 * U, 0.8);
  lineDots(SC.lh, lx + 13 * U, base - 12 * U, lx + 13 * U, base - 1 * U, 4 * U, 1.1 * U, 0.8);
  L.eaveY = L.py - 48 * U;
  lineDots(SC.lh, lx + bw - 6 * U, L.eaveY - 3 * U, L.homeX + 16 * U, L.eaveY + 3 * U, 4 * U, 1.3 * U, 1);
  // 岩
  for (let i = 0; i < 46; i++) {
    const an = Math.PI * R(), rr = Math.sqrt(R());

  perf() { const a = Array.from(perf.dts).filter(v => v > 0), u = Array.from(perf.upd).filter(v => v > 0); return { meanDt: a.reduce((s, v) => s + v, 0) / Math.max(1, a.length), maxDt: Math.max(0, ...a), meanWork: u.reduce((s, v) => s + v, 0) / Math.max(1, u.length), maxWork: Math.max(0, ...u) }; },
};
init();
})();
</script>

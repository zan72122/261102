<style>

<script>
'use strict';
/* ===================== 10 基本 ===================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeInOut=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function easeBack(t){const c=1.7;t=clamp(t,0,1);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
const hyp=Math.hypot;
function mkR(seed){let s=(Math.imul(seed|0,2654435761)^0x9e3779b9)>>>0||7;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const vrand=mkR(20261102); // 演出用
function rr(a,b){return a+(b-a)*vrand();}
function angDiff(a,b){let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d;}

/* 素材 */
const MATS=['rubber','glass','felt','iron','wood','ice'];
const MP={
 clay:  {dens:1.6, e:.12,rr:1.3, slip:0,  c0:'#8f8c86',c1:'#d4d0c6',c2:'#4c4a45'},
 rubber:{dens:1.15,e:.80,rr:.45, slip:0,  c0:'#d3362a',c1:'#ff8f78',c2:'#6e130d'},
 glass: {dens:2.5, e:.50,rr:.22, slip:.1, c0:'#bfe6ee',c1:'#ffffff',c2:'#4f8592'},
 felt:  {dens:1.3, e:.04,rr:3.2, slip:0,  c0:'#ef9db4',c1:'#ffd6e1',c2:'#a6526c'},
 iron:  {dens:7.8, e:.18,rr:.28, slip:0,  c0:'#a3a9ae',c1:'#eef1f3',c2:'#454b51'},
 wood:  {dens:.58, e:.42,rr:.5,  slip:0,  c0:'#cf8635',c1:'#f6c37a',c2:'#7a4212'},
 ice:   {dens:.9,  e:.25,rr:.06, slip:.92,c0:'#cdeaf7',c1:'#ffffff',c2:'#78aecd'}
};
const G=1500;           // 重力 (world/s^2)

/* 画面 */
let W=0,H=0,DPR=1,SA={t:0,r:0,b:0,l:0};
const VIEW={s:1,ox:0,oy:0,orient:'P'};
let now=0, gameT=0;
function toWorld(px,py){return {x:(px-VIEW.ox)/VIEW.s,y:(py-VIEW.oy)/VIEW.s};}

/* パーティクル (上限あり) */
const PARTS=[]; const PMAX=150;
function addP(p){ if(PARTS.length>=PMAX) PARTS.shift(); PARTS.push(p); }
function burst(x,y,mat,n,spd,opt){
 opt=opt||{}; const m=MP[mat]||MP.clay;
 for(let i=0;i<n;i++){const a=opt.a!=null?opt.a+rr(-opt.spread||-.6,opt.spread||.6):rr(0,TAU), s=spd*rr(.35,1);
  addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(opt.up||0),life:0,max:rr(.45,.9)*(opt.life||1),r:rr(2.5,6)*(opt.size||1),
   col:vrand()<.5?m.c0:m.c1,g:opt.g==null?900:opt.g,kind:opt.kind||'chip',rot:rr(0,TAU),vr:rr(-8,8)});}
}
function sparkle(x,y,n,col){for(let i=0;i<n;i++){const a=rr(0,TAU),s=rr(60,240);
 addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:rr(.5,1),r:rr(3,7),col:col||'#fff6c8',g:-40,kind:'star',rot:rr(0,TAU),vr:rr(-4,4)});}}

/* 保存 (端末内) */
const SKEY='gf261102_17_v1';
const SAVE={ok:true,status:'init',data:{v:1,trophies:[],plays:0}};
function validSave(d){
 if(!d||typeof d!=='object'||d.v!==1||!Array.isArray(d.trophies))return false;
 for(const t of d.trophies){ if(!t||!Array.isArray(t.o)||t.o.length!==6)return false;
  for(const m of t.o) if(MATS.indexOf(m)<0) return false; }
 return true;
}
function loadSave(){
 let raw=null;
 try{ raw=window.localStorage.getItem(SKEY); }catch(e){ SAVE.ok=false; SAVE.status='blocked'; return; }
 if(raw==null){ SAVE.status='fresh'; return; }
 try{ const d=JSON.parse(raw); if(validSave(d)){ d.trophies=d.trophies.slice(-8); d.plays=+d.plays||0; SAVE.data=d; SAVE.status='restored'; return; } }catch(e){}
 SAVE.status='corrupt'; SAVE.data={v:1,trophies:[],plays:0};
 writeSave();
}
function writeSave(){
 try{ window.localStorage.setItem(SKEY,JSON.stringify(SAVE.data)); SAVE.ok=true; return true; }
 catch(e){ SAVE.ok=false; SAVE.status=SAVE.status==='init'?'blocked':SAVE.status; return false; }
}
/* ===================== 20 音 (Web Audio 合成のみ・サンプル無し) ===================== */
/* Public: ensureAudio aok audioSuspend audioResume sfx* setSlideLoop setHumLoop setWaterLoop sfxTest.
   Internals use the prefix "au" / object AU. Every public call silently no-ops without audio. */
const AU={ac:null,out:null,nz:null,last:{},ends:[],q:[],pend:-1e9,hid:false,fail:0,loops:{},cap:24,force:false,dbg:null, // force/dbg: test hooks
 hb:{rubber:250,glass:1760,iron:190,wood:440},                                       // pitched hit base (Hz)
 wr:{rubber:784,glass:1047,felt:659,iron:523,wood:587,ice:1175,clay:698},            // wear sparkle root
 sc:[[0,2,4,5],[0,1,2,4,5],[2,1,3,5],[0,2,1,3,5],[4,2,3,5],[0,4,3,7],[1,2,4,7],[0,1,3,2,5],[3,1,2,4,5],[0,2,4,7]],
 sr:[0,2,-3,5,-1,4,-5,3,7,-2],                                                      // success roots (semitones from C5)
 sl:{ice:[2600,4600,3,.5],glass:[1800,3200,2.5,.4],iron:[1700,2000,9,1.1],wood:[500,900,1.4,.55],
     rubber:[600,1100,2,.45],felt:[320,520,.8,.45],clay:[380,650,1.2,.5]},             // slide: f0,f1,Q,vol
 wt:{iron:[2200,'triangle',5000],wood:[900,'triangle',2000],rubber:[1300,'sine',1500],glass:[3100,'sine',6000],
     ice:[3600,'sine',7000],felt:[420,'sine',600],clay:[380,'sine',700]}};             // wheel ticks
function auNop(){}
function auPN(){return (window.performance&&performance.now)?performance.now():Date.now();}
function auNum(v,d){return (typeof v==='number'&&isFinite(v))?v:d;}
function auMat(m){return (typeof m==='string'&&Object.prototype.hasOwnProperty.call(MP,m))?m:'clay';}
function auSt(a){return a.state||'running';}                                         // very old WebKit: no .state
function auHz(semi){return 523.25*Math.pow(2,semi/12);}                               // semitones from C5
function auPent(i){return 12*Math.floor(i/5)+[0,2,4,7,9][i%5];}                        // major pentatonic

/* ---------- context ---------- */
function auBuild(a){
 const m=a.createGain(), c=a.createDynamicsCompressor();
 m.gain.value=.55;
 try{c.threshold.value=-16;c.knee.value=10;c.ratio.value=4;c.attack.value=.003;c.release.value=.25;}catch(e){}
 m.connect(c); c.connect(a.destination);
 const n=Math.floor(a.sampleRate), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
 for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
 AU.out=m; AU.nz=b; AU.loops={}; AU.ends=[]; AU.q=[];
}
function auStateCB(){const a=AU.ac; if(a&&auSt(a)==='running'&&AU.q.length) auFlush();}
function ensureAudio(){
 try{
  let a=AU.ac;
  if(a&&a.state==='closed') a=AU.ac=null;
  if(!a){
   if(AU.fail>2) return false;
   const C=window.AudioContext||window.webkitAudioContext;
   if(!C){AU.fail=9;return false;}
   try{a=new C({latencyHint:'interactive'});}catch(e){a=new C();}
   AU.ac=a; auBuild(a);
   try{a.addEventListener('statechange',auStateCB);}catch(e){a.onstatechange=auStateCB;}
  }
  AU.hid=false;
  if(auSt(a)!=='running'){
   AU.pend=auPN();
   const p=a.resume&&a.resume(); if(p&&p.then) p.then(auStateCB,auNop);
   try{const s=a.createBufferSource(); s.buffer=a.createBuffer(1,1,22050); s.connect(a.destination); s.start(0);}catch(e){} // iOS unlock
   return false;
  }
  if(AU.q.length) auFlush();
  return true;
 }catch(e){AU.fail++; AU.ac=null; return false;}
}
function aok(){const a=AU.ac; return !!a&&(auSt(a)==='running'||AU.force);}
function audioSuspend(){
 AU.hid=true; AU.q.length=0; const a=AU.ac;
 if(a&&a.state==='running'&&a.suspend){try{const p=a.suspend(); if(p&&p.catch) p.catch(auNop);}catch(e){}}
}
function audioResume(){
 AU.hid=false; const a=AU.ac;
 if(a&&a.state!=='running'&&a.state!=='closed'&&a.resume){try{const p=a.resume(); if(p&&p.then) p.then(auStateCB,auNop);}catch(e){}}
}
/* pointerdown on touch is not a "user activation" in Chrome/Safari; unlock also on the release events. */
try{['pointerdown','pointerup','touchend','mousedown','click','keydown'].forEach(ev=>
 window.addEventListener(ev,()=>{if(!AU.ac||auSt(AU.ac)!=='running') ensureAudio();},{capture:true,passive:true}));}catch(e){}

/* ---------- scheduling / voice budget ---------- */
// key: rate-limit key, ms: min gap, n: sources the sound starts, pri: allowed past the normal cap
function auPlay(key,ms,n,pri,fn){
 const a=AU.ac; if(!a) return;
 const st=auSt(a), run=st==='running'||AU.force;
 if(!run&&(st==='closed'||AU.hid||auPN()-AU.pend>400)) return;
 if(key){const tn=auPN(),l=AU.last[key]; if(l!=null&&tn-l<ms&&tn>=l) return; AU.last[key]=tn;}
 if(!run){ if(AU.q.length>=4) AU.q.shift(); AU.q.push({fn,n,pri,at:auPN()}); return; } // unlock in progress: replay on 'running'
 auFire(fn,n,pri);
}
function auFire(fn,n,pri){
 const a=AU.ac, t=a.currentTime, e=AU.ends;
 for(let i=e.length-1;i>=0;i--) if(e[i]<=t) e.splice(i,1);
 if(e.length+n>(pri?AU.cap*2.5:AU.cap)) return;
 try{fn(t+.01);}catch(err){if(AU.dbg) AU.dbg(err);}
}
function auFlush(){const q=AU.q,tn=auPN(); AU.q=[]; for(const c of q) if(tn-c.at<500) auFire(c.fn,c.n,c.pri);}

/* ---------- node helpers (each creates exactly one node) ---------- */
function auG(t,pk,at,dc,dst){ // gain with attack/exp-decay envelope
 const g=AU.ac.createGain(), p=g.gain; pk=Math.max(pk,.0002);
 p.setValueAtTime(0,t); p.linearRampToValueAtTime(pk,t+at); p.exponentialRampToValueAtTime(.0001,t+at+dc);
 g.connect(dst||AU.out); return g;
}
function auGS(t,pk,at,hold,rel,dst){ // gain with attack / hold / linear release
 const g=AU.ac.createGain(), p=g.gain;
 p.setValueAtTime(0,t); p.linearRampToValueAtTime(pk,t+at); p.setValueAtTime(pk,t+at+hold); p.linearRampToValueAtTime(0,t+at+hold+rel);
 g.connect(dst||AU.out); return g;
}
function auEnd(){try{this.disconnect();}catch(e){}}
function auSrc(s,t,d){s.start(t); s.stop(t+d); AU.ends.push(t+d); s.onended=auEnd; return s;}
function auO(type,f,t,d,dst){const o=AU.ac.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); o.connect(dst); return auSrc(o,t,d);}
function auN(t,d,dst,rate){
 const s=AU.ac.createBufferSource(); s.buffer=AU.nz; s.loop=true; if(rate) s.playbackRate.setValueAtTime(rate,t);
 s.connect(dst); s.start(t,Math.random()*.9); s.stop(t+d); AU.ends.push(t+d); s.onended=auEnd; return s;
}
function auF(type,f,q,t,dst){const b=AU.ac.createBiquadFilter(); b.type=type; b.frequency.setValueAtTime(f,t); b.Q.setValueAtTime(q,t); b.connect(dst); return b;}
function auX(prm,v,t){prm.exponentialRampToValueAtTime(Math.max(v,.0001),t);}

/* ---------- voices ---------- */
function auBoing(t,a,k,d){ // elastic pitch bend + decaying wobble (4 nodes)
 const f=250*k, g=auG(t,a,.004,d), o=auO('triangle',f*.7,t,d+.03,g);
 auX(o.frequency,f*1.4,t+.035); auX(o.frequency,f*.85,t+d);
 const lg=AU.ac.createGain(); lg.gain.setValueAtTime(f*.14,t); auX(lg.gain,f*.01,t+d); lg.connect(o.frequency);
 auO('sine',17*Math.sqrt(k),t,d+.03,lg);
}
function auHit(m,a,k,t){ // material impact, <=4 nodes
 switch(m){
 case 'rubber': auBoing(t,a*.75,k,.34); break;
 case 'glass':{const f=1760*k, g=auG(t,a*.42,.002,.6); auO('sine',f,t,.62,g);
  const g2=auG(t,a*.22,.001,.16); auO('sine',f*2.72,t,.18,g2); break;}
 case 'iron':{ // FM: low carrier, inharmonic modulator whose index falls -> clank then dull ring
  const f=190*k, g=auG(t,a*.55,.002,.55), c=auO('sine',f,t,.58,g), mg=AU.ac.createGain();
  mg.gain.setValueAtTime(f*4.5,t); auX(mg.gain,f*1.5,t+.14); mg.connect(c.frequency);
  auO('sine',f*2.76,t,.58,mg); break;}
 case 'ice':{ // 3 quick bright ticks on one osc + narrow noise sharing one envelope
  const g=AU.ac.createGain(), p=g.gain; g.connect(AU.out); p.setValueAtTime(0,t);
  const kk=Math.sqrt(k), o=auO('sine',2400*kk,t,.36,g); auN(t,.36,auF('bandpass',7200,5,t,g));
  let tt=t, v=a*.65;
  for(let i=0;i<3;i++){const gap=.038+Math.random()*.03, dc=i<2?gap-.006:.15;
   o.frequency.setValueAtTime(kk*[2093,2349,2637,3136][Math.random()*4|0],tt);
   p.setValueAtTime(0,tt); p.linearRampToValueAtTime(v,tt+.002); p.exponentialRampToValueAtTime(.0001,tt+dc);
   tt+=gap; v*=.55;}
  break;}
 case 'wood':{const f=440*k, g=auG(t,a*.95,.001,.16), o=auO('triangle',f*1.5,t,.18,g);
  auX(o.frequency,f,t+.012); auN(t,.025,auF('bandpass',f*3.1,1.5,t,g)); break;}
 case 'felt':{const g=auG(t,a*.6,.008,.15), o=auO('sine',240*k,t,.17,g);
  auX(o.frequency,130*k,t+.1); auN(t,.17,auF('lowpass',900*k,.7,t,g),.3); break;}
 default:{ // clay squish: swept formant on dark noise
  const g=auG(t,a*2.3,.006,.17), bp=auF('bandpass',1300*k,2.5,t,g);
  auX(bp.frequency,320*k,t+.15); auN(t,.19,bp,.6); }
 }
}
function auBlub(t,f,v){const g=auG(t,v,.004,.07), o=auO('sine',f,t,.09,g); auX(o.frequency,f*2.1,t+.05);}
function auGlugs(t,D,fA,fB,v,gap){ // many bubbles on a single osc (2 nodes)
 const g=AU.ac.createGain(), q=g.gain; g.connect(AU.out); q.setValueAtTime(0,t);
 const o=auO('sine',fA,t,D+.1,g); let tt=t+.04;
 while(tt<t+D-.08){const u=(tt-t)/D, f=(fA+(fB-fA)*u)*(.85+Math.random()*.3);
  o.frequency.setValueAtTime(f,tt); auX(o.frequency,f*1.8,tt+.05);
  q.setValueAtTime(0,tt); q.linearRampToValueAtTime(v*(1-u*.4),tt+.008); q.exponentialRampToValueAtTime(.0001,tt+.06);
  tt+=gap*(.8+Math.random()*.9);}
}
function auMal(t,f,v,d,lite){ // soft mallet note
 const g=auG(t,v,.003,d); auO('triangle',f,t,d+.02,g);
 if(!lite){const g2=auG(t,v*.3,.002,d*.3); auO('sine',f*4,t,d*.3+.02,g2);}
}
function auBrass(t,fs,v,d){ // gentle brass swell (saw -> opening lowpass)
 const g=AU.ac.createGain(), p=g.gain; g.connect(AU.out);
 p.setValueAtTime(0,t); p.linearRampToValueAtTime(v,t+.04); p.setTargetAtTime(v*.65,t+.04,.12); p.setTargetAtTime(0,t+d,.1);
 const lp=auF('lowpass',500,.8,t,g); auX(lp.frequency,2400,t+.05); lp.frequency.setTargetAtTime(1200,t+.05,.2);
 for(const f of fs){const o=auO('sawtooth',f,t,d+.6,lp); try{o.detune.setValueAtTime((Math.random()-.5)*12,t);}catch(e){}}
}
function auSpark(t,base,n,gap,v){for(let i=0;i<n;i++){const ts=t+i*gap+Math.random()*.02, g=auG(ts,v,.002,.16);
 auO('sine',base*Math.pow(2,auPent(Math.random()*6|0)/12),ts,.18,g);}}

/* ---------- impacts / material ---------- */
function sfxHit(mat,speed,combo){
 const s=clamp(auNum(speed,0),0,2200); if(s<25) return;
 const m=auMat(mat), x=Math.min(s/1600,1.2), a=.12+.55*Math.pow(Math.min(x,1),.8);
 const k=(.92+.14*x)*Math.pow(1.06,clamp(auNum(combo,0),0,8))*(.98+Math.random()*.04);
 auPlay('h'+m,35,2,0,t=>auHit(m,a,k,t));
}
function sfxWear(mat){
 const m=auMat(mat);
 auPlay('wear',120,10,1,t=>{
  auHit(m,.5,1,t);
  const r=AU.wr[m]; [1,1.26,1.5,2].forEach((q,i)=>{const tt=t+.09+i*.055, g=auG(tt,i<3?.13:.08,.003,.22);
   auO('sine',r*q,tt,.24,g); if(i===3){const g2=auG(tt,.04,.002,.3); auO('sine',r*q*2.01,tt,.32,g2);}});
 });
}
function sfxTap(){
 auPlay('tap',40,2,0,t=>{const r=.9+Math.random()*.25;
  const g=auG(t,.2,.004,.17), o=auO('sine',280*r,t,.2,g); auX(o.frequency,560*r,t+.06); auX(o.frequency,400*r,t+.17);
  const bp=auF('bandpass',700*r,4,t,auG(t,1.1,.006,.14)); auX(bp.frequency,1800*r,t+.05); auX(bp.frequency,600*r,t+.14);
  auN(t,.16,bp,.7);});
}
function sfxBell(speed){
 const a=.2+.3*clamp(auNum(speed,800)/1400,0,1);
 auPlay('bell',60,7,0,t=>{const f=932;
  for(const p of [[1,1,1.25],[2.02,.6,.9],[2.42,.4,.7],[2.98,.3,.45],[4.1,.2,.3],[5.4,.14,.18]]){
   const g=auG(t,a*p[1]*.42,.002,p[2]); auO('sine',f*p[0],t,p[2]+.02,g);}
  auN(t,.03,auF('highpass',5000,.7,t,auG(t,a*.5,.001,.025)));});
}
function sfxBoard(strong){
 const S=!!strong;
 auPlay('board',80,3,0,t=>{const f=S?92:130, d=S?.9:.55, g=auG(t,S?.45:.32,.003,d), lp=auF('lowpass',f*16,5,t,g);
  auX(lp.frequency,f*3,t+d);
  const o=auO('sawtooth',f*1.3,t,d+.02,lp); auX(o.frequency,f,t+.05);
  const lg=AU.ac.createGain(); lg.gain.setValueAtTime(f*.09,t); auX(lg.gain,f*.005,t+d); lg.connect(o.frequency);
  auO('sine',S?8:10,t,d+.02,lg);
  if(S){const g2=auG(t,.4,.003,.2), o2=auO('sine',120,t,.22,g2); auX(o2.frequency,55,t+.18);}});
}

/* ---------- water ---------- */
function sfxSplash(size){
 const z=clamp(auNum(size,.5),0,1);
 auPlay('splash',60,6,0,t=>{const d=.25+.45*z, lp=auF('lowpass',2600+3000*z,.8,t,auG(t,.55+.6*z,.006,d));
  auX(lp.frequency,380,t+d); auN(t,d+.02,lp);
  const n=2+Math.round(z*3); for(let i=0;i<n;i++) auBlub(t+.03+Math.random()*(.12+.3*z),500+Math.random()*900,.06+.06*Math.random());});
}
function sfxDrain(){
 auPlay('drain',400,4,0,t=>{const D=2, ac=AU.ac, g=auGS(t,.9,.25,1.15,.6), bp=auF('bandpass',900,3,t,g);
  auX(bp.frequency,220,t+D); auN(t,D,bp,.5);
  const lg=ac.createGain(); lg.gain.setValueAtTime(140,t); lg.gain.linearRampToValueAtTime(40,t+D); lg.connect(bp.frequency);
  auO('sine',5.5,t,D,lg);
  auGlugs(t,D,650,220,.22,.13);});
}
function sfxPour(){
 auPlay('pour',300,4,0,t=>{const D=1.5, ac=AU.ac, g=auGS(t,.9,.12,1.08,.3), bp=auF('bandpass',500,2.2,t,g);

function sfxSuccess(n){
 n=((Math.floor(auNum(n,0))%10)+10)%10;
 auPlay('succ',250,17,1,t=>{const c=AU.sc[n], r=AU.sr[n], sp=.1;
  c.forEach((ix,i)=>{const last=i===c.length-1; auMal(t+i*sp,auHz(r+auPent(ix)),last?.24:.18,last?.55:.22);});
  const tl=t+(c.length-1)*sp, g=auG(tl,.09,.03,.6);
  for(const s of [0,4,7]) auO('sine',auHz(r+s),tl,.66,g);                               // soft pad
  auSpark(tl+.08,auHz(r+24),3,.07,.05);});
}
function sfxTransform(){

  for(let i=0;i<N;i++) auMal(t+1.1*Math.pow(i/N,.75),auHz(-12+auPent(i)),.1+.06*i/N,.35,i%2);
  const g=auGS(t,.3,1.1,0,.5), bp=auF('bandpass',400,2,t,g); auX(bp.frequency,6000,t+1.2); auN(t,1.6,bp);
  const tc=t+1.15, gc=auG(tc,.09,.04,.65);

  const lg=ac.createGain(); lg.gain.setValueAtTime(.03,tc); auX(lg.gain,.0001,tc+.69); lg.connect(gc.gain); auO('sine',7,tc,.72,lg);

/* ---------- amusement rides ---------- */
function sfxRide(kind,mat,strength){
 const k=String(kind), m=auMat(mat), s=clamp(auNum(strength,.6),0,1);
 auPlay('r'+k,60,10,0,t=>auRide(k,m,s,t));
}
function auRide(k,m,s,t){
 const ac=AU.ac;
 switch(k){
 case 'tramp':{ // membrane thoomp + material layer
  const o=auO('triangle',190,t,.32,auG(t,(.22+.26*s)*(m==='felt'?.55:1),.004,.3)); auX(o.frequency,80,t+.22);
  if(m==='rubber') auBoing(t,.35+.3*s,.55,.75);
  else if(m==='iron'){auN(t,.14,auF('lowpass',300,1,t,auG(t,1+s,.003,.12)),.4); auHit('iron',.25,.6,t);}
  else {if(m!=='felt') auBoing(t,.12+.1*s,.8,.35); auHit(m,.18+.2*s,1,t);}
  break;}
 case 'seesaw':{
  auHit('wood',.35+.25*s,.55,t); auHit(m,.15+.2*s,1,t+.01);
  const o=auO('sine',420,t+.05,.45,auG(t+.05,.05+.05*s,.08,.35)); auX(o.frequency,700,t+.4);
  break;}
 case 'slide':{
  const P=AU.sl[m], D=(m==='ice'?.9:m==='felt'?.4:.65)*(.7+.4*s), g=auGS(t,P[3]*(.5+.7*s),.06,D*.55,D*.4);
  const bp=auF(m==='felt'||m==='clay'?'lowpass':'bandpass',P[0],P[2],t,g); auX(bp.frequency,P[1],t+D); auN(t,D+.1,bp,m==='wood'?.5:1);
  const gl=m==='glass', w=auO('sine',gl?2000:1300,t,D+.1,auGS(t,gl?.08:.04,.08,D*.5,D*.4)); auX(w.frequency,gl?900:520,t+D); // "wheee"
  if(m==='rubber'){const q=auO('sine',1000,t,.28,auG(t,.08,.02,.25)), lg=ac.createGain(); lg.gain.value=60; lg.connect(q.frequency); auO('sine',28,t,.28,lg);}
  else if(m==='iron') auO('sawtooth',85,t,D+.1,auF('lowpass',500,1,t,auGS(t,.1,.05,D*.6,D*.3)));
  else if(m==='ice') auHit('ice',.25,1,t+D-.1);
  break;}
 case 'hammock':{
  const D=1, g=ac.createGain(), p=g.gain; g.connect(AU.out);
  p.setValueAtTime(0,t); p.linearRampToValueAtTime(.5*(.5+.5*s),t+D*.5); p.linearRampToValueAtTime(0,t+D);
  const lp=auF('lowpass',250,.9,t,g); lp.frequency.linearRampToValueAtTime(750,t+D*.5); lp.frequency.linearRampToValueAtTime(250,t+D); auN(t,D,lp,.4);
  const o=auO('triangle',220,t,D,auGS(t,.035,.4,.1,.4)); o.frequency.linearRampToValueAtTime(262,t+D*.5);
  if(m==='rubber') auBoing(t+D*.5,.15,.9,.3); else if(m!=='felt') auHit(m,.14,m==='iron'?.8:1,t+D*.5);
  break;}
 case 'wheel':{ // accelerating ratchet ticks voiced by material
  const W=AU.wt[m], n=4+Math.round(4*s), g=ac.createGain(), p=g.gain; g.connect(AU.out); p.setValueAtTime(0,t);
  const o=auO(W[1],W[0],t,1.2,g); auN(t,1.2,auF('bandpass',W[2],4,t,g),.8);
  let tt=t, sp=.13-.05*s; const v=.32*(.6+.4*s)*(m==='felt'?.7:1);
  for(let i=0;i<n&&tt<t+1.05;i++){const dc=Math.min(.035,sp-.006);
   o.frequency.setValueAtTime(W[0]*(1+(i%2)*.12),tt); p.setValueAtTime(0,tt); p.linearRampToValueAtTime(v,tt+.002); p.exponentialRampToValueAtTime(.0001,tt+dc);
   tt+=sp; sp*=.93;}
  break;}
 default:{ // 'turn' (carousel): music-box phrase voiced by material + soft whoosh
  const ph=[[0,2,4],[4,2,0],[0,4,5],[2,4,7],[5,4,2],[0,2,5],[4,5,7]][MATS.indexOf(m)+1], r=AU.wr[m]/2, sp=.15;
  ph.forEach((ix,i)=>{const tt=t+i*sp, f=r*Math.pow(2,auPent(ix)/12), a=.25+.15*s;
   if(m==='rubber'||m==='glass'||m==='iron'||m==='wood') auHit(m,a,f/AU.hb[m],tt);
   else if(m==='ice') auHit('glass',a*.8,f*2/1760,tt);
   else auO(m==='felt'?'sine':'triangle',f,tt,.3,auG(tt,a*.4,m==='felt'?.03:.005,.25));});
  const bp=auF('bandpass',500,1.2,t,auGS(t,.3*s+.1,.2,.1,.3)); auX(bp.frequency,1400,t+.3); auX(bp.frequency,500,t+.6); auN(t,.6,bp,.6);
 }
 }
}

/* ---------- continuous loops (created lazily once audio runs; per-frame calls are cheap) ---------- */
function auLoop(id,lv,mk){
 if(!aok()) return;
 const ac=AU.ac, t=ac.currentTime, v=clamp(auNum(lv,0),0,1); let L=AU.loops[id];
 if(!L){ if(v<.01) return; try{L=mk(ac,t);}catch(e){if(AU.dbg) AU.dbg(e); return;} L.v=-1; L.z=t; AU.loops[id]=L; }
 if(v<.01){ if(L.v>0){L.v=0; L.z=t; L.g.gain.setTargetAtTime(0,t,.08);} else if(t-L.z>2.5) auKill(id); return; }
 if(Math.abs(v-L.v)<.004) return;
 L.v=v; try{L.up(v,t);}catch(e){if(AU.dbg) AU.dbg(e);}
}
function auKill(id){const L=AU.loops[id]; delete AU.loops[id]; if(!L) return;
 try{L.g.disconnect();}catch(e){} for(const s of L.s){try{s.stop();}catch(e){}}}
function auLG(ac){const g=ac.createGain(); g.gain.value=0; g.connect(AU.out); return g;}
function auLN(ac,t,dst,rate){const s=ac.createBufferSource(); s.buffer=AU.nz; s.loop=true; s.playbackRate.value=rate||1; s.connect(dst); s.start(t); return s;}
function auLO(ac,t,type,f,dst){const o=ac.createOscillator(); o.type=type; o.frequency.value=f; o.connect(dst); o.start(t); return o;}
function auMkSlide(ac,t){
 const g=auLG(ac), f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.6; f.frequency.value=600; f.connect(g);
 return {g,s:[auLN(ac,t,f)],up(v,tt){f.frequency.setTargetAtTime(500+2600*v,tt,.08); g.gain.setTargetAtTime(.75*v,tt,.06);}};
}
function auMkHum(ac,t){
 const g=auLG(ac), g2=ac.createGain(); g2.gain.value=.3; g2.connect(g);
 const o1=auLO(ac,t,'sine',70,g), o2=auLO(ac,t,'triangle',140,g2), o3=auLO(ac,t,'triangle',141.4,g2);
 return {g,s:[o1,o2,o3],up(v,tt){g.gain.setTargetAtTime(.28*v,tt,.08); o1.frequency.setTargetAtTime(70+6*v,tt,.1);
  o2.frequency.setTargetAtTime(140+12*v,tt,.1); o3.frequency.setTargetAtTime(141.4+12*v,tt,.1);}};
}
function auMkWater(ac,t){
 const g=auLG(ac), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.4; bp.frequency.value=900; bp.connect(g);
 const l1=ac.createGain(), l2=ac.createGain(); l1.gain.value=160; l2.gain.value=110; l1.connect(bp.frequency); l2.connect(bp.frequency);
 const s=[auLN(ac,t,bp,.9),auLO(ac,t,'sine',4.7,l1),auLO(ac,t,'sine',7.9,l2)];
 return {g,s,up(v,tt){g.gain.setTargetAtTime(1.1*v,tt,.1); bp.frequency.setTargetAtTime(600+700*v,tt,.15);}};
}
function setSlideLoop(level){auLoop('slide',level,auMkSlide);}
function setHumLoop(level){auLoop('hum',level,auMkHum);}
function setWaterLoop(level){auLoop('water',level,auMkWater);}

/* ===================== 30 素材テクスチャ / 描画ヘルパ ===================== */
const TEX={pat:{}};
const TXSPR=new Map();      // スプライトキャッシュ (解像度依存)
const TXMIP={};             // 128px 縮小版 (小さく描く時のちらつき防止)
let TXU=null;               // 単位座標のグラデーション (使い回し)
const TXM={clay:1,rubber:1,glass:1,felt:1,iron:1,wood:1,ice:1};

function txHex(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function txA(h,a){const c=txHex(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function txCan(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
const txSS=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const txFr=x=>x-Math.floor(x);
function txScale(){return Math.round(VIEW.s*DPR*100)/100||1;}
function txPut(k,v){if(TXSPR.size>400)TXSPR.clear();TXSPR.set(k,v);return v;}
function clearSpriteCache(){TXSPR.clear();}
function txReady(){if(!TEX.clay)buildTextures();return !!TEX.clay;}

/* 角丸矩形パス */
function txRR(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ---- 周期的バリューノイズ (タイル可能) ---- */
function txNoise(R,px,py){
 const g=new Float32Array(px*py);for(let i=0;i<g.length;i++)g[i]=R();
 return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y);let fx=x-xi,fy=y-yi;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  const x0=((xi%px)+px)%px,x1=(x0+1)%px,y0=((yi%py)+py)%py,y1=(y0+1)%py;
  const a=g[y0*px+x0],b=g[y0*px+x1],c=g[y1*px+x0],d=g[y1*px+x1];
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;};
}
function txFbm(R,px,py,oct){
 const ns=[];for(let i=0;i<oct;i++)ns.push(txNoise(R,px<<i,py<<i));
 return (u,v)=>{let s=0,a=1,t=0;for(let i=0;i<oct;i++){s+=ns[i](u*(px<<i),v*(py<<i))*a;t+=a;a*=.5;}return s/t;};
}
/* 3色ランプ t:0=暗 .5=基本 1=明 */
function txRamp(o,C,t){t=clamp(t,0,1);let a,b,k;if(t<.5){a=C[0];b=C[1];k=t*2;}else{a=C[1];b=C[2];k=(t-.5)*2;}
 o[0]=a[0]+(b[0]-a[0])*k;o[1]=a[1]+(b[1]-a[1])*k;o[2]=a[2]+(b[2]-a[2])*k;}
function txPix(w,h,fn){
 const cv=txCan(w,h),g=cv.getContext('2d'),id=g.createImageData(w,h),d=id.data,o=[0,0,0,255];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){o[3]=255;fn(x,y,o);const i=(y*w+x)*4;d[i]=o[0];d[i+1]=o[1];d[i+2]=o[2];d[i+3]=o[3];}
 g.putImageData(id,0,0);return cv;
}
const txC3=(a,b,c)=>[txHex(a),txHex(b),txHex(c)];

/* ---- 木目 (共通) : t=年輪位相, st=導管の筋, fn=細かい斑 ---- */
function txGrain(t,st,fn){const s=txFr(t),i=Math.floor(t),rv=txFr(Math.sin(i*12.9898)*43758.5453);
 const late=Math.pow(s,2.6)*(1-txSS(.94,1,s));
 return .66-late*(.3+rv*.16)+(rv-.5)*.1+(st-.5)*.5+(fn-.5)*.06;}

function txMkClay(){
 const R=mkR(11),f=txFbm(R,4,4,4),fn=txFbm(R,64,64,1),C=txC3('#5d5a54','#908d87','#c9c5bc');
 const wh=[[78,92,44],[186,168,38],[150,40,26]];
 const cv=txPix(256,256,(x,y,o)=>{const u=x/256,v=y/256;let t=.5+(f(u,v)-.5)*.75+(fn(u,v)-.5)*.16;
  for(const w of wh){const dx=x-w[0],dy=(y-w[1])*1.3,d=Math.sqrt(dx*dx+dy*dy);
   if(d<w[2]){const fa=1-d/w[2];t+=Math.sin(d*1.25+Math.atan2(dy,dx)*.6)*.05*fa*Math.min(1,d/5);}}
  txRamp(o,C,t);});
 const g=cv.getContext('2d');
 for(let i=0;i<220;i++){const x=R()*256,y=R()*256,r=.5+R()*1.4;
  g.fillStyle='rgba(50,46,40,'+(.12+R()*.14)+')';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  g.fillStyle='rgba(255,252,240,.14)';g.beginPath();g.arc(x-.5,y-.6,r*.6,0,TAU);g.fill();}
 return cv;
}
function txMkRubber(){
 const R=mkR(22),f=txFbm(R,3,3,4),fn=txFbm(R,128,128,1),C=txC3('#a6241b','#d3362a','#ee5c45');
 return txPix(256,256,(x,y,o)=>{const u=x/256,v=y/256;txRamp(o,C,.5+(f(u,v)-.5)*.42+(fn(u,v)-.5)*.1);});
}
function txFibres(g,R,n,x0,y0,w,h,len,cols){
 g.lineCap='round';
 for(const cl of cols){g.strokeStyle=cl[0];g.lineWidth=cl[1];g.beginPath();
  for(let i=0;i<n*cl[2];i++){const x=x0+R()*w,y=y0+R()*h,a=R()*TAU,l=len*(.4+R()*.8),b=(R()-.5)*1.4;
   g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+b)*l*.5,y+Math.sin(a+b)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);}
  g.stroke();}
}
function txMkFelt(){
 const R=mkR(33),f=txFbm(R,5,5,3),fz=txFbm(R,64,64,2),C=txC3('#c46e89','#ef9db4','#ffd2de');
 const cv=txPix(256,256,(x,y,o)=>{const u=x/256,v=y/256;txRamp(o,C,.5+(f(u,v)-.5)*.45+(fz(u,v)-.5)*.55);});
 txFibres(cv.getContext('2d'),R,900,-8,-8,272,272,9,[['rgba(170,80,110,.3)',.8,1],['rgba(255,225,235,.42)',.7,1.4],['rgba(255,182,202,.5)',1,.8]]);
 return cv;
}
function txMkIron(){
 const R=mkR(44),br=txFbm(R,2,128,2),bl=txFbm(R,4,4,4),fn=txFbm(R,128,128,1),C=txC3('#5f666d','#a3a9ae','#e2e6e9');
 const cv=txPix(256,256,(x,y,o)=>{const u=x/256,v=y/256;txRamp(o,C,.52+(br(u,v)-.5)*.6+(bl(u,v)-.5)*.42+(fn(u,v)-.5)*.08);});
 const g=cv.getContext('2d');g.lineCap='round';
 for(let i=0;i<46;i++){const x=20+R()*170,y=10+R()*236,l=12+R()*60,a=(R()-.5)*.12;
  g.strokeStyle=R()<.6?'rgba(255,255,255,.2)':'rgba(40,45,52,.16)';g.lineWidth=.5+R()*.6;
  g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
 return cv;
}
function txMkWood(){ // 琥珀色 / タイル可能 / 小さな節
 const R=mkR(55),wp=txFbm(R,2,6,3),st=txFbm(R,2,128,2),fn=txFbm(R,64,64,1),C=txC3('#80460f','#cf8635','#f6c27a');
 const kx=176,ky=92;
 return txPix(256,256,(x,y,o)=>{const u=x/256,v=y/256,dx=x-kx,dy=y-ky;
  const t=v*7+(wp(u,v)-.5)*1.3+.9*Math.exp(-(dx*dx/420+dy*dy/90));
  let g=txGrain(t,st(u,v),fn(u,v));
  const d=Math.sqrt(dx*dx*1.6+dy*dy*2.4);
  if(d<7){const k=d/7;g=lerp(.22+.08*Math.sin(d*2.4),g,txSS(.55,1,k));}
  txRamp(o,C,g);});
}
function txCrystal(g,x,y,s,a0){
 g.beginPath();
 for(let k=0;k<6;k++){const a=a0+k*PI/3,ca=Math.cos(a),sa=Math.sin(a);g.moveTo(x,y);g.lineTo(x+ca*s,y+sa*s);
  for(const f of [.4,.68]){const px=x+ca*s*f,py=y+sa*s*f,l=s*(.42-f*.3);
   for(const sd of [-1,1]){const b=a+sd*PI/3;g.moveTo(px,py);g.lineTo(px+Math.cos(b)*l,py+Math.sin(b)*l);}}}
 g.stroke();
}
function txMkIce(){
 const R=mkR(66),f=txFbm(R,4,4,4),fz=txFbm(R,48,48,2),C=txC3('#86bddc','#cdeaf7','#f6fcff');
 const cv=txPix(256,256,(x,y,o)=>{const u=x/256,v=y/256;txRamp(o,C,.52+(f(u,v)-.5)*1.1+(fz(u,v)-.5)*.3);});
 const g=cv.getContext('2d');g.lineCap='round';g.lineJoin='round';
 // ひび
 for(let i=0;i<5;i++){let x=R()*256,y=R()*256,a=R()*TAU;const pts=[[x,y]];
  for(let j=0;j<9;j++){a+=(R()-.5)*1.1;const l=7+R()*10;x+=Math.cos(a)*l;y+=Math.sin(a)*l;pts.push([x,y]);}
  for(const pass of [[1,1.1,'rgba(60,120,165,.3)'],[0,1.1,'rgba(255,255,255,.75)']]){g.strokeStyle=pass[2];g.lineWidth=pass[1];g.beginPath();
   pts.forEach((p,k)=>k?g.lineTo(p[0]+pass[0],p[1]+pass[0]):g.moveTo(p[0]+pass[0],p[1]+pass[0]));g.stroke();}}
 // 霜の結晶
 g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=.9;
 for(let i=0;i<9;i++)txCrystal(g,14+R()*228,14+R()*228,6+R()*11,R()*PI);
 // 気泡
 for(let i=0;i<34;i++){const x=R()*256,y=R()*256,r=.8+R()*2.8;
  g.fillStyle='rgba(255,255,255,.16)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  g.fillStyle='rgba(70,130,175,.22)';g.beginPath();g.arc(x+r*.25,y+r*.3,r*.75,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(x-r*.35,y-r*.35,r*.32,0,TAU);g.fill();}
 return cv;
}
function txMkGlass(){
 const R=mkR(77),cv=txCan(256,256),g=cv.getContext('2d');
 g.save();g.translate(128,128);g.rotate(-.75);
 for(let i=0;i<6;i++){const x=-180+R()*360,w=8+R()*34,gr=g.createLinearGradient(x,0,x+w,0);
  gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,'+(.08+R()*.12)+')');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(x,-200,w,400);}
 g.restore();
 g.lineCap='round';
 for(let i=0;i<10;i++){const x=R()*256,y=R()*256,l=20+R()*60;g.strokeStyle='rgba(235,255,255,'+(.12+R()*.16)+')';g.lineWidth=.6+R();
  g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+l*.5,y-l*.4+R()*10,x+l,y-l*.75);g.stroke();}
 for(let i=0;i<14;i++){const x=R()*256,y=R()*256,r=.6+R()*1.8;
  g.fillStyle='rgba(255,255,255,.3)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(x-r*.3,y-r*.3,r*.35,0,TAU);g.fill();}
 return cv;
}
function txMkTable(){ // 濃茶の板 512x256 横タイル
 const R=mkR(88),wp=txFbm(R,2,8,3),st=txFbm(R,4,128,2),fn=txFbm(R,128,128,1),C=txC3('#1e0f08','#4e2c18','#86542f');
 const off=[],tone=[],jx=[];for(let p=0;p<4;p++){off.push(R()*10);tone.push(.9+R()*.18);jx.push(40+R()*430);}
 return txPix(512,256,(x,y,o)=>{const u=x/512,v=y/256,p=y>>6,yy=y&63;
  const t=yy/64*3.6+off[p]+(wp(u,v)-.5)*1.4+Math.sin(u*TAU+p*2)*.35;
  let g=txGrain(t,st(u,v),fn(u,v));
  g=(g-.5)*1.15+.5;g*=(.84+.22*Math.sin(PI*(yy+.5)/64))*tone[p];
  if(yy<2)g=.04;else if(yy<3)g+=.22;else if(yy>60)g*=.78;
  const dj=x-jx[p];if(dj>=-1&&dj<1)g=.06;else if(dj>=1&&dj<2)g+=.18;
  txRamp(o,C,g);});
}
function txMkDarkwood(){ // 赤みの濃い木 縦目 256 タイル
 const R=mkR(99),wp=txFbm(R,6,2,3),st=txFbm(R,128,2,2),fn=txFbm(R,128,128,1),C=txC3('#1a0c07','#4a2216','#80412c');
 const off=[R()*10,R()*10];
 return txPix(256,256,(x,y,o)=>{const u=x/256,v=y/256,p=x>>7,xx=x&127;
  const t=xx/128*4.6+off[p]+(wp(u,v)-.5)*.8+Math.sin(v*TAU+p*2)*.22;
  let g=txGrain(t,st(u,v),fn(u,v));g=(g-.5)*1.1+.5;g*=.86+.2*Math.sin(PI*(xx+.5)/128);
  if(xx<2)g=.05;else if(xx<3)g+=.18;else if(xx>125)g*=.8;
  txRamp(o,C,g);});
}
function txMkWall(){ // クリーム色の漆喰 + リネン
 const R=mkR(111),m=txFbm(R,3,3,5),fn=txFbm(R,128,128,1),C=txC3('#c9b48f','#ecdcbf','#fcf5e6');
 const rn=[],cn=[];for(let i=0;i<64;i++){rn.push(.8+R()*.4);cn.push(.8+R()*.4);}
 return txPix(256,256,(x,y,o)=>{const u=x/256,v=y/256,i=x>>2,j=y>>2,fx=(x&3)+.5,fy=(y&3)+.5;
  const th=((i+j)&1)?.55+.45*Math.sin(PI*fx/4)*cn[i]:.55+.45*Math.sin(PI*fy/4)*rn[j];
  txRamp(o,C,.53+(m(u,v)-.5)*.36+(th-.9)*.22+(fn(u,v)-.5)*.08);});
}
function txMkCloth(){ // 藍の平織り 128
 const R=mkR(122),fn=txFbm(R,64,64,1),sl=txFbm(R,2,16,2),C=txC3('#101833','#2b4084','#6d8ccc');
 const rn=[],cn=[];for(let i=0;i<32;i++){rn.push(.85+R()*.3);cn.push(.85+R()*.3);}
 return txPix(128,128,(x,y,o)=>{const u=x/128,v=y/128,i=x>>2,j=y>>2,fx=(x&3)+.5,fy=(y&3)+.5,ov=(i+j)&1;
  const across=Math.sin(PI*(ov?fx:fy)/4),along=Math.sin(PI*(ov?fy:fx)/4),tv=ov?cn[i]:rn[j]*1.08;
  txRamp(o,C,.12+.62*across*(.72+.28*along)*tv+(fn(u,v)-.5)*.12+(sl(u,v)-.5)*.16);});
}
function txMip(cv){const s=txCan(cv.width/2,cv.height/2),g=s.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cv,0,0,s.width,s.height);return s;}

function buildTextures(){
 if(TEX.clay)return;
 TEX.clay=txMkClay();TEX.rubber=txMkRubber();TEX.felt=txMkFelt();TEX.iron=txMkIron();TEX.wood=txMkWood();
 TEX.ice=txMkIce();TEX.glass=txMkGlass();TEX.table=txMkTable();TEX.darkwood=txMkDarkwood();TEX.wall=txMkWall();TEX.cloth=txMkCloth();
 for(const m of ['clay','rubber','felt','iron','wood','ice','glass'])TXMIP[m]=txMip(TEX[m]);
}
function getPat(name){
 if(!TEX.pat[name]){txReady();if(!TEX[name])return null;try{TEX.pat[name]=ctx.createPattern(TEX[name],'repeat');}catch(e){return null;}}
 return TEX.pat[name];
}
/* 素材テクスチャ: 描画先の大きさ(device px)で縮小版を選ぶ */
function txT(m,devpx){return devpx<170&&TXMIP[m]?TXMIP[m]:TEX[m];}

/* ---- 単位座標グラデーション (一度だけ生成) ---- */
function txRad(g,x0,y0,r0,x1,y1,r1,st){const gr=g.createRadialGradient(x0,y0,r0,x1,y1,r1);for(const s of st)gr.addColorStop(s[0],s[1]);return gr;}
function txLin(g,x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);for(const s of st)gr.addColorStop(s[0],s[1]);return gr;}

 TXU.pshade=txRad(g,-.35,-.42,0,0,0,1.12,[[0,'rgba(255,250,240,.32)'],[.42,'rgba(255,250,240,0)'],[.78,'rgba(30,15,5,.04)'],[1,'rgba(30,15,5,.42)']]);

 TXU.pice=txRad(g,0,0,.4,0,0,1.05,[[0,'rgba(255,255,255,0)'],[.7,'rgba(255,255,255,.25)'],[1,'rgba(255,255,255,.7)']]);

 TXU.drop=txLin(g,0,-.12,0,.07,[[0,'rgba(235,250,255,.95)'],[1,'rgba(120,195,240,.95)']]);

function txSpec(c,x,y,rx,ry,rot,a,soft){c.save();c.translate(x,y);if(rot)c.rotate(rot);c.scale(rx,ry);c.globalAlpha*=a;c.fillStyle=soft?TXU.soft:TXU.spec;c.fillRect(-1,-1,2,2);c.restore();}
function txSquash(c,sq){if(sq&&sq.amt){const a=sq.a||0,m=clamp(sq.amt,-.35,.35);c.rotate(a);c.scale(1+m,1-m);c.rotate(-a);}}
/* はみ出しを切り詰めて drawImage (Safari 対策) */
function txBlit(c,img,sx,sy,sw,sh,dx,dy,dw,dh){
 const x0=Math.max(0,sx),y0=Math.max(0,sy),x1=Math.min(img.width,sx+sw),y1=Math.min(img.height,sy+sh);
 if(x1-x0<1||y1-y0<1)return;
 const kx=dw/sw,ky=dh/sh;c.drawImage(img,x0,y0,x1-x0,y1-y0,dx+(x0-sx)*kx,dy+(y0-sy)*ky,(x1-x0)*kx,(y1-y0)*ky);
}

/* ---- 接地影 ---- */
let TXSH=null;
function drawShadow(c,x,y,w,alpha){
 if(!(w>0)||!(alpha>0))return;
 if(!TXSH){TXSH=txCan(64,64);const g=TXSH.getContext('2d');
  g.fillStyle=txRad(g,32,32,0,32,32,32,[[0,'rgba(26,12,4,.8)'],[.4,'rgba(26,12,4,.5)'],[.75,'rgba(26,12,4,.15)'],[1,'rgba(26,12,4,0)']]);g.fillRect(0,0,64,64);}
 const ga=c.globalAlpha;c.globalAlpha=ga*Math.min(1,alpha);c.drawImage(TXSH,x-w/2,y-w*.13,w,w*.26);c.globalAlpha=ga;
}

/* ---- 玉: 仕上げオーバーレイ (単位座標, 素材ごとにキャッシュ) ---- */
const TXFIN={clay:[.16,.5,'#2f2b27',.12],rubber:[.3,.58,'#4a0a06',.42],felt:[.18,.42,'#6a2840',.1],iron:[.12,.5,'#1c2126',.3],
 wood:[.24,.55,'#4a2508',.26],ice:[.28,.34,'#3f7499',.25],pw:[.26,.55,'#3a200c',.3]};
function txPaintOv(g,k){
 if(k==='glass'){
  g.fillStyle=txRad(g,0,0,0,0,0,1,[[0,'rgba(205,242,250,.08)'],[.66,'rgba(190,235,245,.14)'],[.9,'rgba(150,214,232,.38)'],[1,'rgba(70,140,165,.72)']]);g.fillRect(-1,-1,2,2);
  g.fillStyle=txRad(g,-.35,-.4,0,-.1,-.1,1.3,[[0,'rgba(255,255,255,.22)'],[.38,'rgba(255,255,255,0)'],[.8,'rgba(10,50,70,0)'],[1,'rgba(10,50,70,.32)']]);g.fillRect(-1,-1,2,2);
  g.save();g.translate(.06,.6);g.scale(.5,.24);g.fillStyle=txRad(g,0,0,0,0,0,1,[[0,'rgba(255,255,225,.95)'],[.35,'rgba(215,255,255,.55)'],[1,'rgba(200,255,255,0)']]);g.fillRect(-1,-1,2,2);g.restore();
  g.lineCap='round';g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=.07;g.beginPath();g.arc(0,0,.84,PI*1.08,PI*1.42);g.stroke();
  g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=.05;g.beginPath();g.arc(0,0,.84,PI*.08,PI*.32);g.stroke();
  txSpec(g,-.4,-.47,.14,.085,-.7,1);txSpec(g,.44,.36,.05,.035,-.7,.6);
  return;
 }
 const F=TXFIN[k]||TXFIN.clay,dk=txHex(F[2]),D=a=>'rgba('+dk[0]+','+dk[1]+','+dk[2]+','+a+')';
 if(k==='iron')g.fillStyle=txRad(g,0,-2.4,0,0,-2.4,3.6,[[0,'rgba(255,255,255,0)'],[.33,'rgba(255,255,255,0)'],[.42,'rgba(255,255,255,.34)'],[.56,'rgba(255,255,255,.1)'],
   [.635,'rgba(60,66,74,.12)'],[.675,'rgba(26,30,36,.52)'],[.72,'rgba(40,44,50,.3)'],[.82,'rgba(120,90,62,.14)'],[1,'rgba(20,20,22,.2)']]),g.fillRect(-1,-1,2,2);
 g.fillStyle=txRad(g,-.38,-.42,0,-.1,-.1,1.25,[[0,'rgba(255,250,240,'+F[0]+')'],[.36,'rgba(255,250,240,0)'],[.62,D(0)],[1,D(F[1])]]);g.fillRect(-1,-1,2,2);
 if(k==='rubber'){txSpec(g,-.3,-.36,.55,.5,0,.3,1);txSpec(g,-.4,-.47,.18,.1,-.7,1);txSpec(g,.02,-.66,.05,.035,0,.7);}
 else if(k==='iron'){txSpec(g,-.36,-.42,.5,.42,-.6,.42,1);txSpec(g,-.42,-.5,.07,.05,-.7,.55);}
 else if(k==='wood'||k==='pw'){txSpec(g,-.38,-.45,.3,.18,-.7,k==='pw'?.75:.5,1);if(k==='pw')txSpec(g,-.4,-.48,.1,.06,-.7,.9);}
 else if(k==='clay')txSpec(g,-.32,-.38,.6,.55,0,.12,1);
 else if(k==='felt'){g.fillStyle=txRad(g,0,0,.62,0,0,1,[[0,'rgba(255,220,232,0)'],[1,'rgba(255,224,236,.32)']]);g.fillRect(-1,-1,2,2);txSpec(g,-.3,-.36,.55,.5,0,.16,1);}
 else if(k==='ice'){
  g.fillStyle=txRad(g,.12,.22,0,.12,.22,.62,[[0,'rgba(235,252,255,.4)'],[1,'rgba(235,252,255,0)']]);g.fillRect(-1,-1,2,2);
  g.fillStyle=txRad(g,0,0,.55,0,0,1,[[0,'rgba(255,255,255,0)'],[.6,'rgba(255,255,255,.28)'],[1,'rgba(255,255,255,.78)']]);g.fillRect(-1,-1,2,2);
  txSpec(g,-.4,-.46,.13,.08,-.7,.95);
  g.fillStyle='#fff';for(const s of [[-.5,-.12,.1],[.32,-.5,.07],[.48,.28,.085],[-.12,.52,.06],[.12,.05,.05]])txStar(g,s[0],s[1],s[2]);
 }
 const rc=k==='rubber'?'255,170,155':k==='ice'?'235,250,255':k==='felt'?'255,215,228':'255,236,214';
 g.fillStyle=txRad(g,-.28,-.3,0,-.28,-.3,1.42,[[0,'rgba('+rc+',0)'],[.8,'rgba('+rc+',0)'],[.95,'rgba('+rc+','+F[3]+')'],[1,'rgba('+rc+','+F[3]*.4+')']]);g.fillRect(-1,-1,2,2);

function txStar(g,x,y,s){g.beginPath();for(let i=0;i<4;i++){const a=i*PI/2,b=a+PI/4;
 if(!i)g.moveTo(x+Math.cos(a)*s,y+Math.sin(a)*s);g.quadraticCurveTo(x+Math.cos(b)*s*.18,y+Math.sin(b)*s*.18,x+Math.cos(a+PI/2)*s,y+Math.sin(a+PI/2)*s);}g.fill();}
function txUnitSpr(key,R,r,sc,paint){

const TXMQ=(()=>{
 if(typeof Path2D==='undefined')return null;
 const th=[0,.12,-.08,.06,.1,-.05].map((j,k)=>k*TAU/6+j),B=[];
 for(let k=0;k<6;k++){const a=th[k],dx=Math.cos(a),dy=Math.sin(a),sd=k%2?1:-1,nx=-dy*sd,ny=dx*sd,pts=[];
  const P=(t,b)=>pts.push([dx*t+nx*b,dy*t+ny*b]);
  for(let i=0;i<=3;i++){const t=.3+i*.1;P(t,.025*Math.sin(t*17+k));}
  for(let i=1;i<=10;i++){const u=i/10,t=.6+.2*u-.11*Math.sin(TAU*u);P(t,.14*Math.pow(Math.sin(PI*u),.8));}
  for(let i=1;i<=3;i++){const t=.8+i*.1;P(t,.03*Math.sin(t*13+k));}
  P(1.2,0);B.push(pts);}
 const sec=[],seam=new Path2D();
 for(let k=0;k<6;k++){const p=new Path2D(),A=B[k],N=B[(k+1)%6];p.moveTo(0,0);for(const q of A)p.lineTo(q[0],q[1]);
  let a0=th[k],a1=th[(k+1)%6];if(a1<a0)a1+=TAU;p.arc(0,0,1.2,a0,a1);for(let i=N.length-1;i>=0;i--)p.lineTo(N[i][0],N[i][1]);p.closePath();sec.push(p);
  A.forEach((q,i)=>i?seam.lineTo(q[0],q[1]):seam.moveTo(q[0],q[1]));}
 return {sec,seam};
})();

 for(let k=0;k<K;k++){q=m(k,(k+1)%K);c.quadraticCurveTo(P[k][0],P[k][1],q[0],q[1]);}c.closePath();

 // 布坂の棚受け
 // ガレージ
 const ga=l.garage; sg(ga.x0,ga.y0,ga.x1,ga.y0,'w'); sg(ga.x1,ga.y0,ga.x1,ga.y1,'w');
 // 素材ブロック

 // 光の屈折: くぼみ2か所から留め金/扉へ届くよう係数を合わせる

/* 着替え */
function wear(b,m){
 if(b.mat===m) return false;
 const prev=b.mat;
 if(prev!=='clay'){
  // 前の素材は小片として残る (同じ素材の小片は1つ)
  b.patches=b.patches.filter(p=>p.m!==prev);
  b.patches.push({m:prev,a:-b.ang+rr(-PI,PI),s:rr(.4,1)});
 }
 b.patches=b.patches.filter(p=>p.m!==m);
 b.mat=m;
 const first=b.got.indexOf(m)<0;
 if(first){ b.got.push(m); b.order.push(m); }
 b.face.ex=EXPR[m]; b.face.hold=1.2;
 b.sq.amt=.28; b.sq.v=0;
 burst(b.x,b.y,m,16,320,{up:120});
 sfxWear(m);
 if(b===BALL){
  if(first) pillarFlash(m);
  if(!ST.d['w_'+m]) ST.d['w_'+m]=1;
  if(b.got.length===6&&!b.pw) startPatchwork(b);
 }
 return true;
}

/* ---- 当たり判定 ---- */
function closest(ax,ay,bx,by,px,py){
 const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy; let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0; t=clamp(t,0,1);
 return {x:ax+dx*t,y:ay+dy*t,t};
}
const SURF_E={f:1,w:.9,cab:.9,pil:.9,blk:1,slope:.95,pond:.8,pondb:.6,rail:.6,boat:.7,cloth:.15,board:1,plate:.5,bridge:.9,park:1};
function collideBall(b){
 const r=b.r; let hit=null, best=0;
 const lists=[SEGS,DYN];
 for(let li=0;li<2;li++){const arr=lists[li];
  for(let i=0;i<arr.length;i++){const s=arr[i];
   if(s.up&&ST.park&&b!==PBALL) continue;
   if(b===PBALL&&li===0&&!s.frame) continue;
   if(s.k==='boat'&&MP[b.mat].dens>2) continue;
   if(b.mode==='drag'&&!s.ds&&!(s.k==='park'&&!s.o)){ if(s.k==='blk'||s.k==='ptile'){ const q=closest(s.ax,s.ay,s.bx,s.by,b.x,b.y); if(hyp(b.x-q.x,b.y-q.y)<r&&(s.k==='blk'||b.pw)) wear(b,s.o); } continue; }
   const minx=Math.min(s.ax,s.bx)-r, maxx=Math.max(s.ax,s.bx)+r; if(b.x<minx||b.x>maxx) continue;
   const miny=Math.min(s.ay,s.by)-r, maxy=Math.max(s.ay,s.by)+r; if(b.y<miny||b.y>maxy) continue;
   const q=closest(s.ax,s.ay,s.bx,s.by,b.x,b.y); let dx=b.x-q.x, dy=b.y-q.y, d=Math.sqrt(dx*dx+dy*dy);
   if(d>=r) continue;
   let nx,ny; if(d>1e-6){nx=dx/d;ny=dy/d;}else{const sx=s.bx-s.ax,sy=s.by-s.ay,sl=hyp(sx,sy)||1;nx=sy/sl;ny=-sx/sl;}
   const pen=r-d; b.x+=nx*pen; b.y+=ny*pen;
   const vn=b.vx*nx+b.vy*ny;
   if(vn<0){
    const imp=-vn; let e=MP[b.mat].e*(SURF_E[s.k]||1); if(imp<70) e=0;
    if(b.mode==='drag') e=0;
    b.vx-=(1+e)*vn*nx; b.vy-=(1+e)*vn*ny;
    if(imp>best){best=imp;hit={s,nx,ny,imp};}
   }
   onTouch(b,s,nx,ny,vn<0?-vn:0);
  }
 }
 if(hit){ onImpact(b,hit.s,hit.nx,hit.ny,hit.imp); }
}
function onImpact(b,s,nx,ny,imp){
 // 変形 (衝突で押しつぶされる)
 if(imp>90){ const k=b.mat==='rubber'?.0006:b.mat==='clay'?.0005:b.mat==='felt'?.0004:.00022;
  const a=Math.atan2(ny,nx)+PI/2; b.sq.a=a; b.sq.amt=clamp(b.sq.amt+imp*k,-.38,.38);
  if(imp>200&&b.face.hold<=0){b.face.ex=b.mat==='iron'?'strain':'squish'; b.face.hold=.25;}
  if(imp>260) burst(b.x-nx*b.r,b.y-ny*b.r,b.mat==='felt'?'felt':b.mat==='ice'?'ice':s.k==='blk'?s.o:b.mat,Math.min(8,imp/120|0),imp*.25,{life:.7,size:.8});
 }
 if(imp>110&&now-b.lastSnd>.05){
  b.combo=now-b.lastSnd<.6?Math.min(8,b.combo+1):0; b.lastSnd=now;
  sfxHit(b.mat,imp,b.combo);
  if(s.k==='blk') blockWob(s.o,imp);
 }
}
/* 接触ごとの処理 (継続接触も含む) */
function onTouch(b,s,nx,ny,imp){
 b.contact=.08; if(ny<-.35){b.cn.x=nx;b.cn.y=ny;}
 const k=s.k;
 if(k==='blk'){ if(b.mode!=='held') wear(b,s.o); if(s.o==='rubber'&&ny<-.5) rubberTop(b,imp); }
 else if(k==='ptile'){ if(b.pw) wear(b,s.o); }
 else if(k==='plate'){ if(ny<-.4) b.onPlate=.1; }
 else if(k==='cloth'){ if(imp>40&&b.mode==='free'){ const tx=-ny, ty=nx, vt=b.vx*tx+b.vy*ty; b.vx-=vt*.6*tx; b.vy-=vt*.6*ty; }
  if(b.mat==='felt'&&b.mode==='free'&&!b.stuck){ b.stuck={k:s.o,t:clamp(s.t0!=null?s.t0:.5,0,1)}; stickTo(b,s); sfxHit('felt',300,0);} else if(ny<-.3) b.onRamp=.1; }
 else if(k==='board'){ boardTouch(b,ny,imp); }
 else if(k==='plug'){ if(b.mat==='iron'&&ny<-.5) openPlug(); else if(imp>120) ST.plugWob=1; }
 else if(k==='pil'||k==='cab'){ if(b.pw&&b===BALL&&!ST.climb&&!ST.park&&b.mode!=='held') startClimb(b); }
 else if(k==='boat'){ if(ny<-.5) b.onBoat=.1; if(Math.abs(nx)>.5){ const push=(b.vx-ST.boatVX); ST.boatVX+=push*(b.sub>.15?.5:.25); } }
 else if(k==='park'&&s.o&&s.o.touch){ s.o.touch(b,s,nx,ny,imp); }
}
function stickTo(b,s){
 // 布坂上の位置を記録
 const q=closest(s.ax,s.ay,s.bx,s.by,b.x,b.y); b.stuck.t=q.t; b.vx=b.vy=0;

}

/* ---- 1ステップ ---- */
function stepBall(b,dt){
 if(b.mode==='climb'||b.mode==='script'||b.mode==='trophy') return;
 const mp=MP[b.mat];
 if(b.mode==='held'){ const p=magTip(); b.x=lerp(b.x,p.x,.35); b.y=lerp(b.y,p.y+b.r*.92,.35); b.vx=b.vy=0; return; }
 if(b.stuck){ const s=stuckSeg(b); if(s){const t=b.stuck.t, n=upN(s); b.x=lerp(s.ax,s.bx,t)+n.x*b.r; b.y=lerp(s.ay,s.by,t)+n.y*b.r; b.vx=b.vy=0; b.onRamp=.1; b.contact=.08; return;} b.stuck=null; }
 if(b.mode==='drag'){
  const tx=DRAG.wx, ty=DRAG.wy; let vx=(tx-b.x)*26, vy=(ty-b.y)*26; const sp=hyp(vx,vy); if(sp>2600){vx*=2600/sp;vy*=2600/sp;}
  b.vx=vx; b.vy=vy;
 } else {
  b.vy+=G*dt;
  // 水
  const w=waterAt(b);
  if(w){ const sub=clamp((b.y+b.r-w.y)/(2*b.r),0,1);
   if(sub>0&&b.sub<=0&&b.vy>220){ splash(b.x,w.y,clamp(b.vy/1200,.2,1)); }
   b.sub=sub;
   if(sub>0){ b.vy-=G*sub/mp.dens*dt*1.0; const dmp=1-clamp(2.2*sub*dt,0,1); b.vy*=dmp; b.vx*=1-clamp((mp.dens<1?.25:1.6)*sub*dt,0,1);
    if(mp.dens<1&&w.cur) b.vx+=w.cur*dt; }
  } else b.sub=0;
  // 磁石
  if(b.mat==='iron') magPull(b,dt);
 }
 b.x+=b.vx*dt; b.y+=b.vy*dt;
 collideBall(b);
 // 転がり抵抗
 if(b.contact>0&&b.mode!=='drag'){
  const tx=-b.cn.y, ty=b.cn.x; const vt=b.vx*tx+b.vy*ty;
  let f=mp.rr; if(b.onRamp>0&&b.mat!=='ice') f+=1.5;
  const nvt=vt*Math.max(0,1-f*dt); b.vx+=(nvt-vt)*tx; b.vy+=(nvt-vt)*ty;
 }
}
function upN(s){ const dx=s.bx-s.ax,dy=s.by-s.ay,l=hyp(dx,dy)||1; let nx=dy/l,ny=-dx/l; if(ny>0){nx=-nx;ny=-ny;} return {x:nx,y:ny}; }
function stuckSeg(b){ for(const s of DYN) if(s.k==='cloth'&&s.o===b.stuck.k) return s; return null; }
function waterAt(b){
 const pd=L.pond;
 if(b!==PBALL&&b.x>pd.x0&&b.x<pd.x1&&b.y+b.r>ST.wl&&ST.wl<pd.y1-4){ const dx=ST.boatX-b.x, bt=boatRect(); let cur=0; if(Math.abs(dx)<bt.w/2+b.r*.9&&b.y>bt.y) cur=-Math.sign(dx||1)*500; else if(Math.abs(dx)>b.r+bt.w/2+4&&b.y<ST.wl+b.r*.5) cur=Math.sign(dx)*160; return {y:ST.wl,cur}; }
 if(b===PBALL&&PARK.water) return PARK.water(b);
 return null;
}
function splash(x,y,s){
 for(let i=0;i<10+s*14;i++){const a=-PI/2+rr(-1,1),sp=rr(150,520)*s+80;
  addP({x:x+rr(-14,14),y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:rr(.4,.8),r:rr(2,5),col:vrand()<.5?'#cfeefc':'#8fcbe8',g:1200,kind:'drop'});}
 sfxSplash(s); ST.ripple=1; ST.ripX=x;
}

/* 玉の更新 (見た目) */
function updateBallLook(b,dt){
 // 転がり回転
 if(b.mode!=='held'&&!b.stuck){
  const slip=MP[b.mat].slip; let w=b.vx/b.r;
  if(b.contact<=0) w*=.0; // 空中では回転維持
  if(b.contact>0) b.spin=lerp(b.spin||0,w*(1-slip),.5);
  b.ang+=(b.spin||0)*dt;
 }
 b.contact-=dt; b.onRamp=(b.onRamp||0)-dt; b.onPlate=(b.onPlate||0)-dt; b.onBoat=(b.onBoat||0)-dt;
 // つぶれのばね
 const k=SQK[b.mat]; b.sq.v+=(-k[0]*b.sq.amt-k[1]*b.sq.v)*dt; b.sq.amt+=b.sq.v*dt;
 if(b.mode==='drag'){ const sp=hyp(b.vx,b.vy); if(sp>300){ b.sq.a=Math.atan2(b.vy,b.vx)+PI/2; b.sq.amt=lerp(b.sq.amt,-clamp(sp/5000,0,.22),.2);} }
 else if(b.contact<=0&&b.mode==='free'){ const sp=hyp(b.vx,b.vy); if(sp>700){ b.sq.a=Math.atan2(b.vy,b.vx)+PI/2; b.sq.amt=lerp(b.sq.amt,-clamp((sp-700)/9000,0,.12),.08);} }
 // 顔
 const f=b.face; f.hold-=dt;
 if(f.hold<=0){ f.ex=b.mode==='drag'?(b.mat==='clay'?'happy':EXPR[b.mat]):EXPR[b.mat]; if(b.mat==='clay'&&b.mode!=='drag') f.ex='idle'; }
 f.bt-=dt; if(f.bt<0){ f.blink=1; if(f.bt<-.12){ f.bt=rr(2,4.5); } } else f.blink=Math.max(0,f.blink-dt*10);
 // 視線
 let tx=f.tx, ty=f.ty;
 if(b.mode==='drag'){ tx=b.vx/600; ty=b.vy/600; }
 f.lx=lerp(f.lx,clamp(tx,-1,1),.12); f.ly=lerp(f.ly,clamp(ty,-1,1),.12);
}

/* ドラッグを離したとき棚などにめり込んでいたら上へ出す */
function overlapAny(b){ for(const arr of [SEGS,DYN]) for(const s of arr){ if(s.up&&ST.park&&b!==PBALL) continue; if(b===PBALL&&arr===SEGS&&!s.frame) continue;
  const q=closest(s.ax,s.ay,s.bx,s.by,b.x,b.y); if(hyp(b.x-q.x,b.y-q.y)<b.r-2) return true; } return false; }
function unstick(b){ if(!overlapAny(b)) return; const y0=b.y; for(let d=4;d<=b.r*4;d+=4){ b.y=y0-d; if(!overlapAny(b)) return; } for(let d=4;d<=b.r*3;d+=4){ b.y=y0+d; if(!overlapAny(b)) return; } b.y=y0; }
/* 落ちた玉はスタートへ戻す */
function rescue(b){
 const out=b.x<-60||b.x>L.W+60||b.y>L.H+80||b.y<-200||!isFinite(b.x)||!isFinite(b.y);
 if(out){ if(b===PBALL){ b.x=(L.park.x0+L.park.x1)/2; b.y=PARK.floorY()-b.r-60; b.vx=b.vy=0; b.mode='free'; } else placeAtStart(b,true); }
}
function placeAtStart(b,pop){
 b.mode='free'; b.stuck=null; b.x=L.start.x; b.y=pop?L.rail.y:L.TY-b.r-2; b.vx=0; b.vy=pop?-popV():0;
 if(pop){ ST.lidT=now; ST.popT=now; sfxPop(); }
}
function popV(){ return Math.sqrt(2*G*(L.rail.y-L.TY+L.R*2.6)); }

/* ---- 弾道計算 (着地点補正) ---- */
function ballistic(x0,y0,x1,y1,apex){
 apex=Math.min(apex,y0-8,y1-8);
 const vy=-Math.sqrt(2*G*(y0-apex)); const t1=-vy/G; const t2=Math.sqrt(2*(y1-apex)/G);
 return {vx:(x1-x0)/(t1+t2), vy};
}
/* ===================== 55 仕掛け ===================== */
const FX=[];            // 成功時の輪など
const BLKW={};          // ブロックのゆれ
function blockWob(m,imp){ const w=BLKW[m]||(BLKW[m]={t:0,a:0,s:0}); w.t=now; w.a=clamp(imp/2400,.03,.16)*(vrand()<.5?-1:1); w.s=clamp(imp/1500,.1,.5); }
let PFLASH=[];          // 柱のソケットの光
function pillarFlash(m){ const i=BALL.order.indexOf(m); if(i>=0){ PFLASH[i]=now; const s=L.sock[i];
  addP({x:BALL.x,y:BALL.y,tx:s.x,ty:s.y,life:0,max:.7,r:9,col:MP[m].c0,kind:'fly',g:0,vx:0,vy:0,m}); } }

function success(id,x,y){
 if(ST.d[id]) return false; ST.d[id]=now;
 sfxSuccess(ST.succN++%10);
 if(x!=null){ sparkle(x,y,16); FX.push({x,y,t:now,k:'ring'}); }

}
let LASTDISC=0;

/* ---- ゴム → 鐘 → 跳ね板 ---- */
function rubberTop(b,imp){
 if(b.mat!=='rubber'||b.mode!=='free'||ST.park) return;
 if(now-ST.lastLaunch<.45) return;
 const blk=L.blocks.rubber;
 if(b.y>blk.y-b.r*.5){ // 横から当たった → 上へはね上がる
  if(imp>40){ b.vy=-760; b.vx=((blk.x+blk.w/2)-b.x)*2.6; ST.lastLaunch=now-.25; }
  return;
 }
 if(now-ST.rubLoopT>7) ST.rubLoop=0;
 if(ST.rubLoop>=3) return;
 ST.rubLoop++; ST.rubLoopT=now; ST.lastLaunch=now;
 const v=ballistic(b.x,b.y,ST.boardX,L.TY-b.r-34,L.bell.y+8);
 b.vx=v.vx; b.vy=v.vy; b.sq.amt=.34; b.sq.a=0; b.face.ex='smile'; b.face.hold=1;
 sfxBoard(true);
}
function boardTouch(b,ny,imp){
 if(ST.boardUp<.8||ny>-.3||now-ST.lastLaunch<.35||b.mode!=='free') return;
 ST.lastLaunch=now; ST.boardKick=1;
 if(b.mat==='rubber'){
  const d=L.dests[ST.slot]; const v=ballistic(b.x,b.y,d.x,d.y,d.ap); b.vx=v.vx; b.vy=v.vy;
  b.sq.amt=.3; sfxBoard(true);
  success('board',b.x,b.y);
  if(ST.handleMoved) success('board2',b.x,b.y);
 } else { b.vy=-520; b.vx=(L.dests[ST.slot].x>b.x?1:-1)*120; sfxBoard(false); }
}

/* ---- 磁石 ---- */
function magTip(){ return {x:ST.magX,y:L.crane.y+34+ST.cable}; }
function holdCable(){ return L.crane.hold-L.R*.92-L.crane.y-34; }
function magPull(b,dt){
 if(!ST.gateOpen||ST.magOff>0||ST.held||b.mode!=='free'||ST.park) return;
 const t=magTip(); const dx=t.x-b.x, dy=t.y+b.r*.9-b.y, d=hyp(dx,dy);
 if(!ST.magArm){ if(d>270) ST.magArm=true; return; }
 if(d<250&&Math.abs(dx)<120){ const a=(1-d/250)*9000+1400; b.vx+=dx/d*a*dt; b.vy+=dy/d*a*dt-G*dt*.6;
  if(d<b.r*.6+14){ ST.held=true; b.mode='held'; b.face.ex='strain'; b.face.hold=1; sfxMagnet(); success('magnet',t.x,t.y); } }

function targets(b){

 const up=!ST.park;
 for(const m of MATS){ const k=l.blocks[m]; if(!up&&k.y<l.park.y1) continue; T.push({id:'blk:'+m,x:k.x+k.w/2,y:k.y-R+2,m}); }

 if(up){
  { const m=rampMid(); T.push({id:'ramp',x:m.x-10,y:m.y-R-4}); }
  T.push({id:'plate',x:l.plate.x,y:l.ledgeP.y-R});
  T.push({id:'slope',x:lerp(l.slope.x0,l.slope.x1,.7),y:lerp(l.slope.y0,l.slope.y1,.7)-R*1.2});
  T.push({id:'hi',x:l.hi.x,y:l.hi.y}); T.push({id:'lo',x:l.lo.x,y:l.lo.y});

function aimTarget(b,vx,vy){

}

  const w=BLKW[m]; let wb=0, sq=0; if(w){ const t=now-w.t; if(t<.9){ wb=Math.sin(t*26)*w.a*(1-t/.9); sq=Math.max(0,Math.sin(t*20))*w.s*(1-t/.9)*.5; } }
  wb+=wob(m,.08);

 const b=BALL||PBALL; const order=b?b.order:[];
 for(let i=0;i<6;i++){ const s=L.sock[i], m=order[i];
  if(m){ c.save(); c.beginPath(); c.arc(s.x,s.y,15,0,TAU); c.clip(); c.drawImage(TEX[m],s.x-18,s.y-18,36,36);
   const g=c.createRadialGradient(s.x-5,s.y-6,1,s.x,s.y,16); g.addColorStop(0,'rgba(255,255,255,.45)'); g.addColorStop(1,'rgba(0,0,0,.35)'); c.fillStyle=g; c.fillRect(s.x-16,s.y-16,32,32); c.restore();
   const f=PFLASH[i]; if(f!=null&&now-f<1) softG(c,s.x,s.y,40,'rgba(255,240,170,1)',1-(now-f)); }
  if(b&&b.pw) softG(c,s.x,s.y,26,'rgba(255,230,150,1)',.35+.2*Math.sin(now*5+i));
 }
}
function drawTrophies(c){
 const t=SAVE.data.trophies; if(!t.length) return; const cb=L.cab; const n=Math.min(6,t.length), r=Math.min(16,(cb.w-20)/(n*2.2));
 for(let i=0;i<n;i++){ const o=t[t.length-n+i].o; const x=cb.x+cb.w/2+(i-(n-1)/2)*r*2.3, y=cb.y-r;
  const tb={x,y,r,ang:i*.7+Math.sin(now*.6+i)*.15,mat:o[5],patches:[],pw:true,order:o,sq:{a:0,amt:0},face:{ex:'calm',lx:0,ly:0,blink:0}};
  drawShadow(c,x,y+r*.95,r*1.6,.3); drawBallSurface(c,tb); drawFace(c,tb); }
}
function drawParts(c,dt){
 for(let i=PARTS.length-1;i>=0;i--){ const p=PARTS[i]; p.life+=dt; if(p.life>p.max){ PARTS.splice(i,1); continue; }
  const k=p.life/p.max;
  if(p.kind==='fly'){ const e=easeInOut(k); const x=lerp(p.x,p.tx,e), y=lerp(p.y,p.ty,e)-Math.sin(e*PI)*60; c.save(); c.globalAlpha=1-k*.3; c.beginPath(); c.arc(x,y,p.r,0,TAU); c.clip(); c.drawImage(TEX[p.m],x-p.r,y-p.r,p.r*2,p.r*2); c.restore(); continue; }
  p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=(p.vr||0)*dt;
  c.save(); c.globalAlpha=1-k; c.translate(p.x,p.y); c.rotate(p.rot||0);
  if(p.kind==='star'){ c.fillStyle=p.col; c.beginPath(); for(let j=0;j<8;j++){ const rr2=j%2?p.r*.35:p.r; c.lineTo(Math.cos(j*PI/4)*rr2,Math.sin(j*PI/4)*rr2);} c.closePath(); c.fill(); }
  else if(p.kind==='drop'){ const g=c.createRadialGradient(-p.r*.3,-p.r*.3,0,0,0,p.r); g.addColorStop(0,'#ffffff'); g.addColorStop(1,p.col); c.fillStyle=g; c.beginPath(); c.arc(0,0,p.r,0,TAU); c.fill(); }
  else { const g=c.createLinearGradient(-p.r,-p.r,p.r,p.r); g.addColorStop(0,'rgba(255,255,255,.6)'); g.addColorStop(.3,p.col); g.addColorStop(1,'rgba(0,0,0,.35)'); c.fillStyle=g; c.beginPath(); c.moveTo(-p.r,-p.r*.6); c.lineTo(p.r*.8,-p.r); c.lineTo(p.r,p.r*.7); c.lineTo(-p.r*.6,p.r); c.closePath(); c.fill(); }
  c.restore();
 }
 for(const f of FX){ const k=(now-f.t)/1.2; c.save(); c.globalAlpha=(1-k)*.9; c.strokeStyle='#ffe28a'; c.lineWidth=5*(1-k)+1; c.beginPath(); c.arc(f.x,f.y,20+k*110,0,TAU); c.stroke(); c.restore(); }
}
/* 手のお手本 (最初に1回だけ) */
function drawDemo(c){
 if(!DEMO||!BALL) return; const t=now-DEMO.t0, per=2.6, k=(t%per)/per, cyc=Math.floor(t/per);
 if(cyc>=2){ DEMO=null; demoDone=true; firstInputDone=true; return; }
 const b=BALL, tg=L.blocks.rubber, tx=tg.x+tg.w/2, ty=tg.y-L.R;
 let x=b.x, y=b.y, press=0, gx=null, gy=null;
 if(k<.2){ x=b.x+40*(1-k/.2); y=b.y+60*(1-k/.2); }
 else if(k<.3){ press=(k-.2)/.1; }
 else if(k<.75){ const e=easeInOut((k-.3)/.45); x=lerp(b.x,tx,e); y=lerp(b.y,ty,e)-Math.sin(e*PI)*70; press=1; gx=x; gy=y; }
 else { x=tx; y=ty; press=1-(k-.75)/.25; }
 if(gx!=null){ c.save(); c.globalAlpha=.35; drawBallSurface(c,{x:gx,y:gy,r:b.r,ang:0,mat:'clay',patches:[],pw:false,order:[],sq:{a:0,amt:0}}); c.restore(); }
 // 手 (肌色のグラデーション)
 c.save(); c.translate(x+b.r*.15,y+b.r*.2); c.scale(1-press*.08,1-press*.08); c.globalAlpha=.92;
 const g=c.createLinearGradient(0,0,40,90); g.addColorStop(0,'#ffe3cc'); g.addColorStop(1,'#e8a982'); c.fillStyle=g;
 c.beginPath(); c.ellipse(4,0,11,22,-.15,0,TAU); c.fill();
 c.beginPath(); c.ellipse(18,52,30,34,-.2,0,TAU); c.fill();
 c.beginPath(); c.ellipse(-12,46,9,20,-.7,0,TAU); c.fill();
 c.fillStyle='rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(1,-12,5,6,-.15,0,TAU); c.fill();
 c.restore();
}

let FRAME_DT=0;
function render(dt){
 const c=ctx; c.setTransform(1,0,0,1,0,0);
 if(BGC) c.drawImage(BGC,0,0);
 worldTf(c);
 const l=L;
 drawWater(c,false);
 drawBoat(c); drawPlug(c);
 drawSockets(c);
 drawHint(c);
 drawMechs(c);
 drawBlocks(c);
 drawTrophies(c);
 drawBeam(c);
 if(BALL&&BALL!==PBALL) drawBall(c,BALL);
 drawWater(c,true);
 if(ST.parkP>0) PARK.draw(c);
 if(PBALL) drawBall(c,PBALL);
 drawParts(c,dt);
 drawDemo(c);
 if(DEBUG.on) drawDebug(c);
}
const DEBUG={on:false};
function drawDebug(c){
 c.save(); c.lineWidth=2; for(const s of SEGS.concat(DYN)){ c.strokeStyle=s.up&&ST.park?'rgba(0,0,255,.3)':s.k==='blk'?'#0f0':s.k==='cloth'?'#f0f':'#f00'; c.beginPath(); c.moveTo(s.ax,s.ay); c.lineTo(s.bx,s.by); c.stroke(); }
 // 跳ね板の行き先と鐘への弾道
 c.strokeStyle='rgba(0,200,255,.8)';
 const arc=(x0,y0,v)=>{ c.beginPath(); let x=x0,y=y0,vx=v.vx,vy=v.vy; c.moveTo(x,y); for(let i=0;i<120;i++){ vy+=G/120; x+=vx/120; y+=vy/120; c.lineTo(x,y); if(y>L.H) break;} c.stroke(); };
 for(const d of L.dests){ arc(ST.boardX,L.TY-L.R-30,ballistic(ST.boardX,L.TY-L.R-30,d.x,d.y,d.ap)); }
 const rb=L.blocks.rubber; arc(rb.x+rb.w/2,rb.y-L.R,ballistic(rb.x+rb.w/2,rb.y-L.R,ST.boardX,L.TY-L.R-34,L.bell.y+8));
 c.restore();
}
/* ===================== 90 起動・ループ ===================== */
function setupRound(keepBall){
 L=makeLayout(VIEW.orient,ROUND); buildStatic(); ST=newState();
 if(keepBall&&BALL){ BALL.mode='free'; BALL.x=L.start.x; BALL.y=L.TY-BALL.r-2; BALL.vx=BALL.vy=0; }
 else BALL=newBall(L.start.x,L.TY-L.R-2);
 PBALL=null; PFLASH=[]; FX.length=0;
 fitView(); clearSpriteCache(); renderBG();
}
function nextRound(){ ROUND++; SAVE.data.plays=(SAVE.data.plays||0)+1; writeSave(); setupRound(true); }

function readSA(){ try{ const cs=getComputedStyle(document.getElementById('sa')); SA={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0}; }catch(e){ SA={t:0,r:0,b:0,l:0}; } }
function fitView(){
 const aw=Math.max(50,W-SA.l-SA.r), ah=Math.max(50,H-SA.t-SA.b);
 VIEW.s=Math.min(aw/L.W,ah/L.H); VIEW.ox=SA.l+(aw-L.W*VIEW.s)/2; VIEW.oy=SA.t+(ah-L.H*VIEW.s)/2;
}
function resize(){
 W=window.innerWidth||document.documentElement.clientWidth||390; H=window.innerHeight||document.documentElement.clientHeight||844;
 DPR=Math.min(2,window.devicePixelRatio||1); readSA();
 cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
 const o=W>=H?'L':'P';
 if(!L||o!==VIEW.orient){
  VIEW.orient=o;
  if(L){ // 向きが変わった: 仕掛けの状態は保ったまま配置だけ切りかえ
   const old=ST; L=makeLayout(o,ROUND); buildStatic(); adaptState(old);
  } else { L=makeLayout(o,ROUND); buildStatic(); }
 }
 fitView(); clearSpriteCache(); renderBG();
}
function adaptState(o){
 cancelInput();
 o.boardX=L.board.slots[o.slot]; o.magX=L.crane.x1; o.held=false; o.cable=0;
 o.wl=o.drained||o.plugOpen?L.pond.y1+12:L.TY+14; o.refilling=false; if(o.drained){o.plugOpen=true;}
 o.boatX=(L.pond.x0+L.pond.x1)/2; o.boatVX=0;
 if(o.climb){ o.climb=null; }
 for(const b of [BALL]){ if(!b) continue; b.r=L.R; if(b.mode==='climb'){ b.mode='free'; } placeAtStart(b,false); }
 if(PBALL){ PBALL.r=L.R; PARK.relayout&&PARK.relayout(); }
}
function cancelInput(){
 if(DRAG.b){ const b=DRAG.b; DRAG.b=null; DRAG.id=null; b.mode='free'; b.vx=b.vy=0; }
 DRAG.id=null; HANDLE.id=null; HANDLE.drag=false; setHumLoop(0);
 if(PARK.cancel) PARK.cancel();
}

let lastT=null, rafId=0, running=false;
function frame(ts){
 rafId=requestAnimationFrame(frame);
 if(lastT==null){ lastT=ts; }
 let dt=(ts-lastT)/1000; lastT=ts; if(!(dt>0)) dt=0; if(dt>.05) dt=.05;
 now+=dt;
 try{ step(dt); render(dt); }catch(err){ if(!frame.err){ frame.err=1; setTimeout(()=>{throw err;}); } }
}
function step(dt){
 if(dt<=0) return;
 const n=Math.max(1,Math.ceil(dt*240)), h=dt/n;
 for(let i=0;i<n;i++){ buildDyn(); if(BALL) stepBall(BALL,h); if(PBALL) stepBall(PBALL,h); }
 updateMech(dt); updateClimb(dt); PARK.update(dt); updateHint(dt);
 for(const b of [BALL,PBALL]) if(b){ updateBallLook(b,dt); if(b.mode==='free') rescue(b); }
 const b=BALL; let sl=0; if(b&&b.contact>0&&b.mode==='free'&&(b.mat==='ice'||b.mat==='glass')){ const sp=hyp(b.vx,b.vy); if(sp>160) sl=clamp(sp/1300,0,1)*(b.mat==='ice'?1:.4); }
 setSlideLoop(sl);
 setHumLoop(ST.held&&HANDLE.drag?.7:ST.gateOpen&&BALL&&BALL.mat==='iron'&&!ST.held?.15:0);
}
function start(){ if(rafId) return; lastT=null; rafId=requestAnimationFrame(frame); running=true; }
function stop(){ if(rafId) cancelAnimationFrame(rafId); rafId=0; running=false; }

document.addEventListener('visibilitychange',()=>{
 if(document.hidden){ stop(); cancelInput(); setSlideLoop(0); setWaterLoop(0); audioSuspend(); }
 else { lastT=null; start(); audioResume(); }
});
window.addEventListener('pagehide',()=>{ cancelInput(); });
window.addEventListener('blur',()=>{ cancelInput(); });
window.addEventListener('resize',()=>{ resize(); });
window.addEventListener('orientationchange',()=>{ setTimeout(resize,120); });
cv.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',e=>onUp(e,false),{passive:false});
window.addEventListener('pointercancel',e=>onUp(e,true),{passive:false});
cv.addEventListener('lostpointercapture',e=>{ if(e.pointerId===DRAG.id||e.pointerId===HANDLE.id) onUp(e,true); });
for(const ev of ['touchstart','touchmove','touchend']) document.addEventListener(ev,e=>{ if(e.cancelable) e.preventDefault(); },{passive:false});
for(const ev of ['gesturestart','gesturechange','gestureend','contextmenu','dblclick','selectstart']) document.addEventListener(ev,e=>{ e.preventDefault(); },{passive:false});

/* 自動テスト用の読み取り専用の窓口 (画面には何も出さない) */
window.__toy={
 state(){ const b=BALL; return {mat:b&&b.mat,x:b&&b.x,y:b&&b.y,mode:b&&b.mode,got:b?b.got.slice():[],pw:!!(b&&b.pw),d:Object.keys(ST.d),park:ST.park,parkP:ST.parkP,
  save:SAVE.status,saveOk:SAVE.ok,trophies:SAVE.data.trophies.length,round:ROUND,orient:VIEW.orient,parts:PARTS.length,hint:HINT.t&&HINT.t.id,demo:!!DEMO,
  pball:PBALL?{mat:PBALL.mat,x:PBALL.x,y:PBALL.y}:null,running}; },
 toScreen(x,y){ return {x:x*VIEW.s+VIEW.ox,y:y*VIEW.s+VIEW.oy}; },
 layout(){ return L; }, st(){ return ST; },
 debug(v){ DEBUG.on=!!v; }
};

loadSave();
buildTextures();
resize();
setupRound(false);
start();
</script>

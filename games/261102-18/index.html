<script>
'use strict';
/*
 すーっ！星つぶ生地と夜あけパン屋 (261102-18)
 画風: particles（点描のみ）。色は 濃紺(背景)・金・珊瑚 の3色だけ。線・面塗り・グラデーションは使わない。
 核: 生地を一本指で引く → 形(舟/月/稲妻)を判定しながら生地が完成形へ寄る → 離すと粒がほどけて空で働く。
   舟 = 材料を探して運ぶ（行き先は 月/稲妻/星飾り/長さ/向き で変わる）
   月 = 屋根を照らし いちごを見つける
   稲妻 = 窯の歯車を回す（材料が届くと焼成）
   月+稲妻 = 窓の反射で隠れ航路 → 長い舟で ほしのみつ
   3つの星座がつながる → 夜空と町がくるりと回って朝 → パンを人へ配る → お礼の星飾り → 次の夜の舟で回収し飾りパン
*/
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sat=v=>v<0?0:v>1?1:v;
const smooth=t=>{t=sat(t);return t*t*(3-2*t);};
const easeIO=t=>{t=sat(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const easeOut=t=>{t=sat(t);return 1-Math.pow(1-t,3);};
const easeBack=t=>{t=sat(t);const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const hyp=Math.hypot;
function wrapA(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;}
function mkR(seed){let s=seed>>>0||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const R=Math.random, rr=(a,b)=>a+(b-a)*R(), ri=n=>(R()*n)|0;
/* 3色だけ */
const BG='#0c1538', PAL=['#ffd36e','#ff8b7b'];
const GOLD=0, CORAL=1;

/* ===================== 音（Web Audio 合成） ===================== */
let AC=null, MG=null, NBUF=null, STR=null, AUDIO_DEAD=false, AUNLOCK=false;
function audioOn(){
 if(AUDIO_DEAD)return;
 try{
  if(!AC){
   const A=window.AudioContext||window.webkitAudioContext; if(!A)return;
   AC=new A();
   const comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4;
   MG=AC.createGain(); MG.gain.value=.5; MG.connect(comp); comp.connect(AC.destination);
   NBUF=AC.createBuffer(1,(AC.sampleRate*1.2)|0,AC.sampleRate);
   const d=NBUF.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=R()*2-1;
  }
  if(AC.state!=='running'){const p=AC.resume(); if(p&&p.catch)p.catch(()=>{});}
  if(!AUNLOCK){ /* iOS: 無音を1つ鳴らして解錠 */
   const b=AC.createBuffer(1,1,AC.sampleRate), s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0);
   if(AC.state==='running')AUNLOCK=true;
  }
 }catch(e){try{AC&&AC.close&&AC.close();}catch(_){} AC=null; AUDIO_DEAD=true;}
}
function aok(){return !!(AC&&AC.state==='running');}
function tone(f,dur,type,vol,when,f2,att){
 if(!aok())return;
 try{
  f=clamp(f,30,12000); if(f2)f2=clamp(f2,30,12000);
  const t=AC.currentTime+(when||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const a=att||.006;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+a);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t+dur+.05);
 }catch(e){}
}
function noise(dur,freq,q,vol,when,f2,ftype){
 if(!aok())return;
 try{
  const t=AC.currentTime+(when||0), s=AC.createBufferSource(); s.buffer=NBUF; s.loop=true;
  const bp=AC.createBiquadFilter(); bp.type=ftype||'bandpass'; bp.frequency.setValueAtTime(freq,t);
  if(f2)bp.frequency.exponentialRampToValueAtTime(Math.max(40,f2),t+dur); bp.Q.value=q;
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bp); bp.connect(g); g.connect(MG); s.start(t,R()); s.stop(t+dur+.05);
 }catch(e){}
}
const PENT=[0,2,4,7,9];
function pent(k,base){k=Math.round(k); if(k>14)k=10+((k-10)%5+5)%5;const o=Math.floor(k/5), d=PENT[((k%5)+5)%5];return base*Math.pow(2,o+d/12);}
function bell(f,vol,when,dur){tone(f,dur||.9,'sine',vol,when);if(f<4000)tone(f*2.76,(dur||.9)*.4,'sine',vol*.28,when);if(f<2000)tone(f*5.4,.14,'sine',vol*.1,when);}
const SND={
 press(){noise(.13,700,.7,.22,0,180,'lowpass');tone(200,.17,'sine',.3,0,95);},
 stretchStart(){
  if(!aok()||STR)return;
  try{
   const s=AC.createBufferSource(); s.buffer=NBUF; s.loop=true;
   const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=300; bp.Q.value=2.2;
   const g=AC.createGain(); g.gain.value=.0001;
   s.connect(bp); bp.connect(g); g.connect(MG); s.start();
   STR={s,bp,g};
  }catch(e){STR=null;}
 },
 stretchSet(level,freq){
  if(!STR||!aok())return;
  try{const t=AC.currentTime; STR.g.gain.setTargetAtTime(clamp(level,0,.2),t,.05); STR.bp.frequency.setTargetAtTime(clamp(freq,120,2400),t,.06);}catch(e){}
 },
 stretchStop(){
  if(!STR)return; const S=STR; STR=null;
  try{const t=AC.currentTime; S.g.gain.setTargetAtTime(.0001,t,.04); S.s.stop(t+.3);}catch(e){}
 },
 tink(k,base){bell(pent(k,base||659),.075,0,.5);},
 lock(sh){
  if(sh==='boat'){tone(392,.3,'triangle',.12);tone(587,.35,'triangle',.1,.08);}
  else if(sh==='moon'){tone(523,.6,'sine',.1,0,0,.08);tone(659,.6,'sine',.08,.05,0,.08);tone(784,.6,'sine',.07,.1,0,.08);}
  else {tone(1046,.07,'square',.035);tone(1318,.07,'square',.035,.07);tone(1568,.1,'square',.035,.14);}
 },
 boing(L){const f=200+Math.min(L,300)*.6;tone(f,.32,'sine',.3,0,f*1.9);tone(f*1.9,.22,'sine',.1,.06,f);},
 launch(sh){
  for(let i=0;i<7;i++)bell(pent(7+i*2,523),.06,i*.045,.5);
  noise(.55,600,.8,.12,0,4200,'bandpass');
  if(sh==='moon'){tone(392,1.2,'sine',.09,.2,0,.25);tone(494,1.2,'sine',.07,.2,0,.25);}
  if(sh==='bolt'){tone(1760,.08,'square',.03,.1);}
 },
 gather(n){for(let i=0;i<4;i++)tone(pent(9+i+n,523),.14,'sine',.07,i*.035);},
 found(){[0,4,7,12].forEach((s,i)=>tone(523*Math.pow(2,s/12),.32,'triangle',.16,i*.08));bell(2093,.08,.3);},
 special(){[0,4,7,11,14,19].forEach((s,i)=>bell(523*Math.pow(2,s/12),.11,i*.09,1.1));},
 moonUp(){tone(262,1.8,'sine',.08,0,0,.4);tone(330,1.8,'sine',.07,0,0,.4);tone(392,1.8,'sine',.06,0,0,.4);bell(1046,.08,.4);},
 strike(){noise(.32,2600,.5,.22,0,700);tone(880,.1,'square',.04,0,330);bell(1318,.1,.08,.6);},
 whirr(){for(let i=0;i<5;i++)tone(170+i*14,.1,'triangle',.07,i*.09);},
 shrug(){tone(392,.2,'triangle',.11,.1);tone(311,.32,'triangle',.11,.3);},
 clap(){for(let i=0;i<3;i++)noise(.05,1700,1.1,.24,i*.14);},
 unload(){tone(330,.12,'sine',.2,0,180);tone(494,.12,'sine',.12,.1,260);},
 bakeStart(){noise(.6,400,.6,.08,0,900);tone(196,.5,'sine',.08,0,262);},
 bakeDone(){bell(1568,.18);bell(2093,.13,.12);[0,4,7,12,16].forEach((s,i)=>tone(523*Math.pow(2,s/12),.26,'triangle',.12,.25+i*.07));},
 route(){for(let i=0;i<9;i++)bell(pent(i+5,523),.07,i*.07,.8);},
 hmm(){tone(330,.18,'sine',.1);tone(294,.25,'sine',.1,.2);},
 link(i){bell(pent(12+i*3,523),.18,0,1.2);tone(pent(12+i*3,262),.6,'triangle',.06);},
 dawn(){
  [262,330,392,523,659].forEach((f,i)=>tone(f,2.6,'sine',.07,i*.05,0,.6));
  for(let i=0;i<10;i++)bell(pent(10+i,523),.07,.4+i*.12,.9);
 },
 open(){bell(1760,.14);bell(2349,.11,.16);},
 pick(){tone(660,.09,'triangle',.13,0,880);},
 drop(){tone(520,.12,'sine',.12,0,300);},
 give(p){tone(380,.2,'sine',.24,0,980);[[784,988,1175],[880,1109,1318],[698,880,1046]][p%3].forEach((f,i)=>bell(f,.13,.15+i*.1,.8));},
 ornUp(){for(let i=0;i<5;i++)bell(pent(14+i,523),.06,i*.06,.6);},
 dusk(){[523,440,392,330].forEach((f,i)=>tone(f,.9,'sine',.07,i*.18,0,.1));},
 wob(){tone(rr(700,1000),.09,'sine',.05,0,rr(500,700));},
 comet(){for(let i=0;i<8;i++)tone(2400-i*180,.08,'sine',.05,i*.04);bell(1318,.08,.35);},
 poke(){tone(520,.08,'sine',.05,0,620);},
};

/* ===================== レイアウト ===================== */
let W=0,H=0,DPR=1,DPRCAP=2,U=4,MD=400,PORT=true,X0=0,Y0=0,SW=1,SH=1,GY=0,DS=1.4,RD=80;
const A={};
const LT={
 port:{udiv:[92,172], moon:[.24,.1], sugar:[.76,.14], bolt:[.17,.3], dock:[.55,.235], sun:[.5,.11],
  orn:[[.36,.045],[.85,.275],[.07,.205]], rare:[[.3,.2],[.72,.3]],
  route:[[.5,.4],[.9,.37],[.955,.22],[.9,.065]],
  gy:.5, bak:.5, oven:.18, shelf:.82, man:.5, dough:[.5,.815], rD:19, ppl:[.19,.5,.81], pplY:.95,
  houses:[[.03,24,17,11],[.97,24,19,11]], stars:[.02,.46]},
 land:{udiv:[172,100], moon:[.2,.14], sugar:[.8,.13], bolt:[.25,.31], dock:[.64,.09], sun:[.5,.12],
  orn:[[.38,.11],[.68,.3],[.1,.16]], rare:[[.3,.18],[.76,.27]],
  route:[[.5,.35],[.86,.39],[.985,.25],[.95,.06]],
  gy:.46, bak:.5, oven:.25, shelf:.75, man:.5, dough:[.5,.855], rD:16, ppl:[.3,.5,.7], pplY:.96,
  houses:[[.05,24,18,11],[.15,19,13,9],[.85,19,14,9],[.95,24,18,11]], stars:[.02,.46]}
};
let LY=LT.port;
function readSA(){
 const e=document.getElementById('sa'), cs=getComputedStyle(e);
 return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
}
function P(f){return {x:X0+f[0]*SW,y:Y0+f[1]*SH};}
function layout(){
 W=Math.max(200,window.innerWidth|0); H=Math.max(200,window.innerHeight|0);
 DPR=Math.min(DPRCAP,window.devicePixelRatio||1); RCUT=2.3/DPR;
 cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
 const sa=readSA();
 X0=sa.l; Y0=sa.t; SW=W-sa.l-sa.r; SH=H-sa.t-sa.b;
 PORT=SH>SW*1.12; LY=PORT?LT.port:LT.land;
 U=Math.min(SW/LY.udiv[0],SH/LY.udiv[1]); MD=Math.min(SW,SH); DS=U*.33;
 GY=Y0+SH*LY.gy;
 ['moon','sugar','bolt','dock','sun'].forEach(k=>{A[k]=P(LY[k]);});
 A.orn=LY.orn.map(P); A.rare=LY.rare.map(P); A.route=LY.route.map(P);
 A.bak={x:X0+SW*LY.bak,y:GY};
 A.window={x:A.bak.x-5*U,y:GY-16*U};
 A.route[0]={x:A.window.x,y:A.window.y};
 A.oven={x:X0+SW*LY.oven,y:GY+17*U};
 A.mouth={x:A.oven.x,y:A.oven.y-7*U};
 A.gear={x:A.oven.x+(PORT?14.5:16)*U,y:A.oven.y-13*U};
 A.shelf={x:X0+SW*LY.shelf,y:GY+18*U};
 A.man={x:X0+SW*LY.man,y:GY+25.5*U};
 A.dough=P(LY.dough); RD=LY.rD*U;
 A.houses=LY.houses.map(h=>({x:X0+SW*h[0],y:GY-1.5*U,w:h[1],h:h[2],rh:h[3]}));
 A.ppl=LY.ppl.map(f=>({x:X0+SW*f,y:Y0+SH*LY.pplY}));
 A.berry=[{x:A.bak.x-11*U,y:GY-31*U,roof:'bak'}];
 const hs=A.houses; const h1=hs[0], h2=hs[hs.length-1];
 A.berry.push({x:h1.x+ (h1.x<X0+SW*.1? 3*U:0),y:h1.y-h1.h*U-h1.rh*U*.45,roof:0});
 A.berry.push({x:h2.x- (h2.x>X0+SW*.9? 3*U:0),y:h2.y-h2.h*U-h2.rh*U*.45,roof:hs.length-1});
 computeRoute();
}
let ROUTE={pts:[],cum:[],len:1};
function computeRoute(){
 // Catmull-Rom 補間で航路の点列
 const c=A.route, out=[];
 for(let i=0;i<c.length-1;i++){
  const p0=c[Math.max(0,i-1)],p1=c[i],p2=c[i+1],p3=c[Math.min(c.length-1,i+2)];
  for(let k=0;k<16;k++){const t=k/16,t2=t*t,t3=t2*t;
   out.push({x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
             y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)});}
 }
 out.push({x:c[c.length-1].x,y:c[c.length-1].y});
 const cum=[0]; for(let i=1;i<out.length;i++)cum.push(cum[i-1]+hyp(out[i].x-out[i-1].x,out[i].y-out[i-1].y));
 ROUTE={pts:out,cum,len:cum[cum.length-1]||1};
}
function routeAt(f){
 const s=sat(f)*ROUTE.len, c=ROUTE.cum; let lo=0,hi=c.length-1;
 while(hi-lo>1){const m=(lo+hi)>>1; if(c[m]<s)lo=m; else hi=m;}
 const a=ROUTE.pts[lo],b=ROUTE.pts[hi],t=(s-c[lo])/Math.max(1e-6,c[hi]-c[lo]);
 return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)};
}

/* ===================== 点描バッチ描画 ===================== */
const NLAY=7, NBK=16;
const BUF=[]; for(let i=0;i<NLAY*NBK;i++)BUF.push({a:new Float32Array(3*1024),n:0});
let LAYER=0, TR=null;
function setTR(px,py,ang,sc){TR={px,py,c:Math.cos(ang)*sc,s:Math.sin(ang)*sc,k:sc};}
function dot(x,y,r,c,a){
 if(a<.035||r<.2)return;
 if(TR){const dx=x-TR.px,dy=y-TR.py;x=TR.px+dx*TR.c-dy*TR.s;y=TR.py+dx*TR.s+dy*TR.c;r*=TR.k;}
 if(x<-8||y<-8||x>W+8||y>H+8)return;
 let k=(a*8)|0; if(k>7)k=7;
 const b=BUF[LAYER*NBK+c*8+k];
 if(b.n*3+3>b.a.length){const na=new Float32Array(b.a.length*2);na.set(b.a);b.a=na;}
 const o=b.n*3; b.a[o]=x; b.a[o+1]=y; b.a[o+2]=r; b.n++;
}
let DOTCOUNT=0, RCUT=1.15;
function flushLayer(l){
 for(let c=0;c<2;c++){
  ctx.fillStyle=PAL[c];
  for(let k=0;k<8;k++){
   const b=BUF[l*NBK+c*8+k]; if(!b.n)continue;
   ctx.globalAlpha=(k+.65)/8.3; ctx.beginPath();
   const a=b.a, m=b.n*3; DOTCOUNT+=b.n;
   for(let i=0;i<m;i+=3){const x=a[i],y=a[i+1],r=a[i+2];
    if(r<RCUT)ctx.rect(x-r,y-r,r*2,r*2); else {ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,TAU);}}
   ctx.fill(); b.n=0;
  }
 }
 ctx.globalAlpha=1;
}

/* ===================== 形（SDF）と点描スプライト ===================== */
function sdCircle(x,y,cx,cy,r){return hyp(x-cx,y-cy)-r;}
function sdBox(x,y,cx,cy,hw,hh){const dx=Math.abs(x-cx)-hw,dy=Math.abs(y-cy)-hh;return hyp(Math.max(dx,0),Math.max(dy,0))+Math.min(Math.max(dx,dy),0);}
function sdEll(x,y,cx,cy,rx,ry){return (hyp((x-cx)/rx,(y-cy)/ry)-1)*Math.min(rx,ry);}
function sdPoly(px,py,v){
 let d=Infinity,s=1;
 for(let i=0,j=v.length-1;i<v.length;j=i,i++){
  const ex=v[j][0]-v[i][0],ey=v[j][1]-v[i][1],wx=px-v[i][0],wy=py-v[i][1];
  const t=clamp((wx*ex+wy*ey)/(ex*ex+ey*ey||1),0,1),bx=wx-ex*t,by=wy-ey*t;
  d=Math.min(d,bx*bx+by*by);
  const c1=py>=v[i][1],c2=py<v[j][1],c3=ex*wy>ey*wx;
  if((c1&&c2&&c3)||(!c1&&!c2&&!c3))s=-s;
 }
 return s*Math.sqrt(d);
}
function starPoly(cx,cy,Ro,Ri,n,rot){const v=[];for(let i=0;i<n*2;i++){const a=(rot||-Math.PI/2)+i*Math.PI/n,r=i%2?Ri:Ro;v.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return v;}
/* sdf の内側を点で埋める（縁を少し濃く）: 返り値 [x,y,s,a,c] */
function fillS(out,rng,sdf,x0,y0,x1,y1,sp,col,aIn,aEdge,edgeW,smin,smax){
 for(let y=y0;y<=y1;y+=sp)for(let x=x0;x<=x1;x+=sp){
  const px=x+(rng()-.5)*sp*.95, py=y+(rng()-.5)*sp*.95, d=sdf(px,py);
  if(d<0){
   const e=d>-(edgeW||sp*1.2);
   out.push([px,py,lerp(smin||.8,smax||1.2,rng()),(e?aEdge:aIn)*lerp(.75,1.05,rng()),typeof col==='function'?col(px,py,rng):col]);
  }
 }
 return out;
}
function mkSprite(list,k){
 const n=list.length,d=new Float32Array(n*6);
 for(let i=0;i<n;i++){const p=list[i],o=i*6;d[o]=p[0];d[o+1]=p[1];d[o+2]=p[2];d[o+3]=p[3];d[o+4]=R()*TAU;d[o+5]=p[4];}
 return {n,d,k:k||1};
}
/* sc: 1ローカル単位あたりのpx */
function drawSprite(sp,ox,oy,sc,am,rot,tw,flip,colOv){
 if(!sp||am<.03)return;
 const d=sp.d, c=rot?Math.cos(rot):1, s=rot?Math.sin(rot):0, ds=DS*sc/U*sp.k, fx=flip?-1:1, tt=T*2.3;

function addFlyer(x,y,vx,vy,c,s,tgt,idx,delay){

 FL.push({x,y,vx,vy,c,s,tgt,idx,t:-(delay||0),hx:x,hy:y,px:x,py:y,ppx:x,ppy:y});
 return true;
}
function updFlyers(dt){
 let w=0;
 for(let i=0;i<FL.length;i++){
  const f=FL[i]; f.t+=dt; if(f.t<0){FL[w++]=f;continue;}
  f.ppx=f.px; f.ppy=f.py; f.px=f.x; f.py=f.y;
  const p=f.tgt.ptW(f.idx); const dx=p.x-f.x, dy=p.y-f.y, d=hyp(dx,dy);
  const k=lerp(2,90,sat(f.t/.9)), dm=lerp(1.5,13,sat(f.t/.9));
  f.vx+=(dx*k-f.vx*dm)*dt; f.vy+=(dy*k-f.vy*dm)*dt - (f.t<.35?U*30*dt:0);
  f.x+=f.vx*dt; f.y+=f.vy*dt;
  if((d<U*.6&&f.t>.5)||f.t>1.7){if(f.tgt.got!==undefined)f.tgt.got++; continue;}
  FL[w++]=f;
 }
 FL.length=w;
}
function drawFlyers(){
 LAYER=5; const mid=FL.length<600;
 for(const f of FL){ if(f.t<0){dot(f.x,f.y,f.s*DS,f.c,.8);continue;}
  dot(f.x,f.y,f.s*DS*1.05,f.c,.95); if(mid)dot(f.px*.5+f.x*.5,f.py*.5+f.y*.5,f.s*DS*.8,f.c,.5); dot(f.ppx,f.ppy,f.s*DS*.6,f.c,.28);}
}

const PTW={x:0,y:0};
function mkCon(type,sp,ax){
 return {type,sp,t:0,st:'form',got:0,ax,x:0,y:0,rot:0,flip:false,alpha:0,wob:0,_r:NaN,_c:1,_s:0,
  ptW(i){if(this.rot!==this._r){this._r=this.rot;this._c=Math.cos(this.rot);this._s=Math.sin(this.rot);}
   const d=this.sp.d,o=(i%this.sp.n)*6,c=this._c,s=this._s,lx=d[o]*(this.flip?-1:1)*U,ly=d[o+1]*U;
   PTW.x=this.x+lx*c-ly*s; PTW.y=this.y+lx*s+ly*c; return PTW;}};
}
function launchShape(sh){

 { const pd=buildPDraw(); if(pd)makeTpl(sh,pd,R0); } /* 最後の形で 半径・稲妻の線を決め直す */

  Object.assign(con,{Le:D.Le,aim,lenF,cap:D.mass>=1.25?2:1,cargo:[],legs:[],li:0,lt:0,from:null,stT:0,vx:0,hx:0,hy:0});

  K.boats.push(con);
  planTrip(con);
  con.rec={len:Math.round(D.Le/RD*10)/10,cap:con.cap,plan:con.plan,cargo:[]}; TONIGHT.trips.push(con.rec);
 } else if(sh==='moon'){
  const size=clamp((D.rm||R0)/(RD*1.12),.85,1.3)*(1+.18*(D.mass-1));
  con=mkCon('moon',genMoonCon(size),'moon'); con.size=size;
  if(K.moon){dissolveCon(K.moon);} K.moon=con; con.x=A.moon.x; con.y=A.moon.y;
 } else {
  let Q=D.boltQ; if(!Q||Q.length<2)Q=canonZig(p[0],p[p.length-1],R0);
  /* 始点へ戻ってきた線でも巨大にならないよう、いちばん遠い点を基準にする */
  const P0=Q[0]; let P1=Q[Q.length-1], cl=hyp(P1.x-P0.x,P1.y-P0.y), far=P1, fd=cl;
  for(const q of Q){const d=hyp(q.x-P0.x,q.y-P0.y); if(d>fd){fd=d;far=q;}}
  if(cl<fd*.6){P1=far;cl=fd;} cl=Math.max(cl,R0*.8);
  const ang=Math.atan2(P1.y-P0.y,P1.x-P0.x), rot=Math.PI/2-ang;
  const norm=Q.map(q=>{const dx=q.x-P0.x,dy=q.y-P0.y;return [clamp((dx*Math.cos(rot)-dy*Math.sin(rot))/cl,-1.2,1.2),clamp((dx*Math.sin(rot)+dy*Math.cos(rot))/cl,-.2,1.2)];});
  con=mkCon('bolt',genBoltCon(norm),'bolt'); con.str=clamp((D.an?D.an.folds:2),1,4)+(D.mass-1)*3;
  if(K.bolt){dissolveCon(K.bolt);} K.bolt=con; con.x=A.bolt.x; con.y=A.bolt.y;
 }
 /* 生地の粒をほどいて空へ */
 const n=D.n, take=Math.min(n,FCAP-FL.length);
 for(let i=0;i<n;i++){
  const vx=D.vx[i]*.3+(R()-.5)*U*20, vy=D.vy[i]*.3-U*rr(25,55);
  if(i<take&&i%2===0)addFlyer(D.x[i],D.y[i],vx,vy,D.c[i],D.s[i],con,i>>1,(1-D.rk[i])*.12);
  else if(i%3===0){pushSpk({x:D.x[i],y:D.y[i],vx:vx*.6,vy:vy*.6,t:0,life:rr(.5,1.1),c:D.c[i],s:D.s[i]*.9,g:-U*2,lay:5});}
 }
 TONIGHT.order.push(sh);
 SND.launch(sh);
 D.st='idle'; D.ghost=false; D.path=[]; D.L=0; D.Le=0; D.shape=null; D.conf=0;
 makeDough();
 spawnSpark(D.cx,D.cy-RD*.3,14,GOLD,1.3,{up:1});

function dissolveCon(c){

 for(let i=0;i<n;i++){const p=c.ptW(i*Math.max(1,(c.sp.n/n)|0)); pushSpk({x:p.x,y:p.y,vx:(R()-.5)*U*10,vy:(R()-.5)*U*10,t:0,life:rr(.4,.9),c:GOLD,s:1,g:0,lay:1});}

}
function updateCons(dt){

  const m=K.moon; m.beamT=(m.beamT||0)-dt;
  if(m.beamT<=0){m.beamT=.07; const lit=moonLit(); const tg=lit[ri(lit.length)];

   spawnMote(m.x+rr(-4,4)*U,m.y+rr(-2,4)*U,tp.x,tp.y,GOLD,rr(1.1,1.8),rr(.6,1));}

 if(K.bolt&&K.bolt.st==='work'){

function roofPt(i){const h=A.houses[i];return {x:h.x+rr(-h.w/2,h.w/2)*U*.8,y:h.y-h.h*U-rr(.5,h.rh*.8)*U};}
function moonLit(){

 const hs=A.houses; let near=0,best=1e9; [0,hs.length-1].forEach(i=>{const d=Math.abs(hs[i].x-A.moon.x);if(d<best){best=d;near=i;}});

function zap(b,str){

/* ===================== 舟の航海 ===================== */
function pickOrn(aim){
 /* 引いた向きに近い星飾りだけ（向きで選べる） */
 let best=null,bd=.75;
 for(const o of SKYORN){if(o.got||o.res)continue; const p=ornPos(o); const d=Math.abs(wrapA(Math.atan2(p.y-D.cy,p.x-D.cx)-aim)); if(d<bd){bd=d;best=o;}}
 return best;
}
function aimTo(p){return Math.atan2(p.y-D.cy,p.x-D.cx);}
/* 星のかけらを狙った？：かけらのある側へ はっきり斜めに引いたときだけ（まっすぐ上は ふつうの行き先） */
function rareSide(){const off=wrapA(aimTo(RARE.pos)+Math.PI/2); return off<0?-1:1;}
function rareAimed(aim){
 if(!(RARE.on&&!RARE.res&&RARE.fall>=1&&RARE.pos))return false;
 const ra=aimTo(RARE.pos), roff=wrapA(ra+Math.PI/2), off=wrapA(aim+Math.PI/2), side=roff<0?-1:1;
 if((off<0?-1:1)!==side)return false;
 if(Math.abs(off)<Math.max(.3,Math.abs(roff)*.6))return false;
 return Math.abs(wrapA(ra-aim))<.8;
}
function rareDemoAim(){const roff=wrapA(aimTo(RARE.pos)+Math.PI/2), side=roff<0?-1:1; return -Math.PI/2+side*clamp(Math.abs(roff),.55,Math.abs(roff)+.3);}
function boatPlanPreview(Le,aim,cap){
 /* 離す前の見通し：行き先を返す */
 const o=pickOrn(aim);
 if(rareAimed(aim))return {orn:o,mat:'comet',pos:RARE.pos};
 if(routeVisible()&&!RT.res){const f=Le/LREQ(); return {orn:o,mat:f>=1?'honey':'short',route:Math.min(1,f)};}
 const bi=BER.findIndex((b,i)=>b.st==='shown'&&!b.res);
 if(K.moon&&K.moon.st==='work'&&bi>=0)return {orn:o,mat:'berry',pos:A.berry[bi]};
 return {orn:o,mat:'sugar',pos:A.sugar};
}
function planTrip(b){
 const legs=[]; const pv=boatPlanPreview(b.Le,b.aim,b.cap);
 if(pv.orn){pv.orn.res=b; legs.push({to:()=>ornPos(pv.orn),stop:'orn',ref:pv.orn});}
 let mat=pv.mat;
 if(mat==='comet'){RARE.res=b; legs.push({to:()=>RARE.pos,stop:'comet'});}
 else if(mat==='honey'||mat==='short'){
  legs.push({to:()=>A.window,stop:null});
  if(mat==='honey'){RT.res=b; legs.push({route:[0,1],stop:'honey'}); legs.push({route:[1,0]});}
  else {const f=Math.max(.25,pv.route*.95); legs.push({route:[0,f],stop:'short'}); legs.push({route:[f,0]});
   let n=0; if(K.moon)for(let i=0;i<BER.length&&n<b.cap;i++){if(BER[i].st==='shown'&&!BER[i].res){BER[i].res=b;const ii=i;legs.push({to:()=>A.berry[ii],stop:'berry',ref:ii});n++;}}
   if(!n)legs.push({to:()=>A.sugar,stop:'sugar'});}
 }
 else if(mat==='berry'){
  let n=0; for(let i=0;i<BER.length&&n<b.cap;i++){if(BER[i].st==='shown'&&!BER[i].res){BER[i].res=b;const ii=i;legs.push({to:()=>A.berry[ii],stop:'berry',ref:ii});n++;}}
 }
 else legs.push({to:()=>A.sugar,stop:'sugar'});
 legs.push({to:()=>({x:A.mouth.x,y:A.mouth.y-2*U}),stop:'unload'});
 legs.push({to:()=>A.dock,stop:'dock'});
 b.legs=legs; b.li=0; b.lt=0; b.from=null; b.plan=(pv.orn?'orn+':'')+mat;
}
function boatSpeed(){const n=K.boats.reduce((a,b)=>a+(b.st==='sail'||b.st==='stop'?1:0),0); return MD*.62*(1+.3*Math.max(0,n-2));}
/* 古い舟を引退させる：集めた荷は窯へ、予約は手放す */
function retireBoat(b){
 for(const be of BER)if(be.res===b)be.res=null;
 if(RT.res===b)RT.res=null; if(RARE.res===b)RARE.res=null;
 for(const o of SKYORN)if(o.res===b&&!o.got)o.res=null;
 if(b.cargo.length){const items=b.cargo.splice(0); if(b.rec)b.rec.cargo=items.slice(); burstTo(b,A.mouth,GOLD,10); ovenAdd(items);}
 dissolveCon(b);
}
function updateBoats(dt){
 for(let bi=K.boats.length-1;bi>=0;bi--){
  const b=K.boats[bi]; b.t+=dt; b.alpha=sat((b.t-.4)/.8); b.wob=Math.max(0,b.wob-dt*2);
  if(b.st==='gone'){K.boats.splice(bi,1);continue;}
  if(b.st==='form'){const k=1-Math.exp(-dt*6); b.x=lerp(b.x,A.dock.x,k);b.y=lerp(b.y,A.dock.y,k); if(b.t>1.2){b.st='sail';b.from={x:b.x,y:b.y};} continue;}
  if(b.st==='dock'){b.x=lerp(b.x,A.dock.x,1-Math.exp(-dt*3));b.y=lerp(b.y,A.dock.y+Math.sin(T*1.6)*U*.6,1-Math.exp(-dt*3));b.rot=Math.sin(T*1.3)*.04;continue;}
  if(b.st==='stop'){b.stT-=dt; b.y+=Math.sin(T*6)*U*.05; if(b.stT<=0){b.st='sail';b.li++;b.lt=0;b.from={x:b.x,y:b.y};} continue;}
  const leg=b.legs[b.li]; if(!leg){b.st='dock';continue;}
  const ox=b.x, oy=b.y;
  if(leg.route){
   const len=Math.abs(leg.route[1]-leg.route[0])*ROUTE.len; b.lt+=dt*boatSpeed()/Math.max(20,len);
   const p=routeAt(lerp(leg.route[0],leg.route[1],sat(b.lt))); b.x=p.x; b.y=p.y;
  } else {
   const to=leg.to(), f=b.from; const dist=hyp(to.x-f.x,to.y-f.y);
   b.lt+=dt*boatSpeed()/Math.max(30,dist*1.15);
   const t=easeIO(sat(b.lt)), cx=(f.x+to.x)/2, cy=Math.min(f.y,to.y)-dist*.22;
   b.x=(1-t)*(1-t)*f.x+2*(1-t)*t*cx+t*t*to.x; b.y=(1-t)*(1-t)*f.y+2*(1-t)*t*cy+t*t*to.y;
  }
  const vx=b.x-ox, vy=b.y-oy; if(Math.abs(vx)>.3)b.flip=vx<0; b.rot=clamp(vy*.02*(b.flip?-1:1),-.25,.25);
  if(b.lt>=1)arrive(b,leg);
 }
}
function arrive(b,leg){
 b.st='stop'; b.stT=leg.stop?.65:0;
 const s=leg.stop;
 if(s==='orn'){const o=leg.ref; o.got=true; b.cargo.push('orn:'+o.type); burstTo(ornPos(o),b,CORAL,14); SND.found();}
 else if(s==='sugar'){for(let i=0;i<b.cap;i++)b.cargo.push('sugar'); burstTo(A.sugar,b,GOLD,16); SND.found();}
 else if(s==='berry'){const be=BER[leg.ref]; if(be.st==='shown'){be.st='taken';b.cargo.push('berry');} burstTo(A.berry[leg.ref],b,CORAL,14); SND.found();}
 else if(s==='honey'){RT.taken=true;RT.res=null;b.cargo.push('honey'); burstTo(A.route[A.route.length-1],b,GOLD,26); SND.special(); b.stT=.9;}
 else if(s==='comet'){RARE.on=false;RARE.res=null;RARE.next=PT+rr(40,60);b.cargo.push('comet'); burstTo(RARE.pos,b,CORAL,20); SND.comet(); SND.found();}
 else if(s==='short'){SND.hmm(); b.stT=.9; spawnSpark(b.x,b.y,6,GOLD,.6); RT.age=Math.min(RT.age,3);}
 else if(s==='unload'){
  if(b.cargo.length){burstTo(b,A.mouth,GOLD,14); const items=b.cargo.splice(0); if(b.rec)b.rec.cargo=items.slice(); ovenAdd(items); SND.unload(); manAct('clap'); SND.clap();}
  b.stT=.5;
 }
 else if(s==='dock'){b.st='dock'; if(K.dock&&K.dock!==b){dissolveCon(K.dock);} K.dock=b;}
}
function burstTo(from,to,c,n){

}

/* ===================== 窯とパン ===================== */
function ovenAdd(items){

 OV.items.push(...items); OV.qn.push(items.length);
 if(OV.on){if(!OV.bake)startBake();}
 else {MAN.look={x:A.bolt.x,y:A.bolt.y}; setTimeout0(()=>manAct('look'),.6);}
}
function ovenPower(str){
 const was=OV.on; OV.on=true; OV.gsT=2.6+str*.7;
 if(OV.items.length&&!OV.bake)startBake();
 else if(!OV.bake&&!OV.items.length){SND.whirr(); setTimeout0(()=>{if(!OV.bake&&!OV.items.length){manAct('shrug');SND.shrug();}},.5);}
}
function startBake(){
 const n=OV.qn.length?OV.qn.shift():OV.items.length, items=OV.items.splice(0,n);
 OV.bake={t:0,dur:3.6*3.4/(Math.max(OV.gs,OV.gsT)+.8),items,recipe:recipe(items)};
 SND.bakeStart();
}
function recipe(items){

function suggestGesture(){
 const sailing=boatsBusy();
 const made={boat:K.boats.length>0||!!K.dock,moon:!!K.moon,bolt:!!K.bolt};
 if(routeVisible()&&!RT.res&&!sailing)return 'long';
 if(OV.items.length&&!OV.on&&!K.bolt)return 'bolt';
 const ord=SUG[NIGHT%SUG.length];
 for(const s of ord){if(!made[s]){if(s==='boat'&&sailing)continue;return s;}}
 if(sailing)return null;
 if(K.moon&&K.moon.st==='work'&&BER.some(b=>b.st==='shown'&&!b.res))return 'boat';
 if(SKYORN.some(o=>!o.got&&!o.res))return 'boat';
 if(RARE.on&&!RARE.res&&RARE.fall>=1)return 'aim';
 if(!TONIGHT.breads.length&&!OV.bake)return 'boat';
 return null;
}
function computeInvite(){
 if(PH==='night'){
  if(CH.p>0)return null;
  const g=suggestGesture(); if(!g)return null;
  const dir=g==='moon'?0:g==='aim'&&RARE.pos?rareDemoAim():-Math.PI/2;
  const sig=NIGHT+'|'+g+'|'+(K.moon?1:0)+(K.bolt?1:0)+'|'+K.boats.length+'|'+OV.items.length+'|'+SKYORN.filter(o=>!o.got).length+'|'+(RT.taken?1:0)+(RARE.on?1:0);
  return {kind:'dough',g,dir,key:'n|'+sig};
 }
 if(PH==='morning'&&MOR.close<=0){
  let br=null; for(const s of SHELF)if(s.bread&&s.bread.base!=='plain'){br=s.bread;break;}
  if(!br)for(const w of WIN)if(w.bread){br=w.bread;break;}
  if(!br)for(const s of SHELF)if(s.bread){br=s.bread;break;}
  if(!br)return null;
  let pi=0,mg=99; PPL.forEach((p,i)=>{if(p.got<mg){mg=p.got;pi=i;}});
  return {kind:'bread',br,pi,key:'m|'+NIGHT+'|'+MOR.deliv};
 }
 return null;
}
function gesturePath(g){

 if(g==='moon'){const r=R0*1.22, mx=cx, my=cy-R0*.3; return u=>{const a=-u*5.5; return {x:mx+Math.cos(a)*r,y:my+Math.sin(a)*r*.92};};}

  return u=>{const s=u*(P.length-1), i=Math.min(P.length-2,Math.floor(s)), t=s-i; return {x:lerp(P[i].x,P[i+1].x,t),y:lerp(P[i].y,P[i+1].y,t)};};}
 if(g==='aim'&&RARE.pos){const a=rareDemoAim(); const L1=Math.min(R0*3.2,hyp(RARE.pos.x-cx,RARE.pos.y-cy)*.8);

function drawBoats(){
 const fade=PH==='dawn'?1-sat(PT/1.1):1;
 for(const b of K.boats){if(b.st==='gone')continue;
  LAYER=3; drawSprite(b.sp,b.x,b.y,U*(1+b.wob*.08),b.alpha*fade,b.rot,.15,b.flip);
  LAYER=4; const n=b.cargo.length; b.cargo.forEach((it,k)=>icon(it,b.x+(k-(n-1)/2)*3.2*U,b.y-2*U,U*1.3,fade));}
}
function dotArc(p,q,a,c){
 const d=hyp(q.x-p.x,q.y-p.y), n=Math.max(3,(d/(2.6*U))|0), cx=(p.x+q.x)/2, cy=Math.min(p.y,q.y)-d*.18;
 for(let k=0;k<=n;k++){const t=k/n, x=(1-t)*(1-t)*p.x+2*(1-t)*t*cx+t*t*q.x, y=(1-t)*(1-t)*p.y+2*(1-t)*t*cy+t*t*q.y, fl=.5+.5*Math.sin(T*9-k*.6);
  dot(x,y,DS*(.8+.45*fl),c,a*(.3+.55*fl));}
}
function ring(p,r,a,c){for(let k=0;k<12;k++){const an=k/12*TAU+T*1.5;dot(p.x+Math.cos(an)*r,p.y+Math.sin(an)*r,DS*1.15,c===undefined?GOLD:c,a*.85);}}
function drawPreview(){
 if(PH!=='night'||D.st!=='pull'||!D.shape||D.conf<.33||!D.F)return;
 LAYER=6; const a=sat((D.conf-.33)/.35), tip=D.F;
 if(D.shape==='boat'){
  const aim=Math.atan2(D.F.y-D.cy,D.F.x-D.cx), pv=boatPlanPreview(D.Le,aim,D.mass>=1.25?2:1);
  let from=tip;
  if(pv.orn){const op=ornPos(pv.orn); dotArc(from,op,a*.8,CORAL); ring(op,4.6*U,a); from=op;}
  if(pv.route!==undefined){
   dotArc(from,A.window,a*.6,GOLD);
   const f=pv.route, n=Math.max(2,(ROUTE.len*f/(2*U))|0);
   for(let k=0;k<=n;k++){const p=routeAt(k/n*f), fl=.5+.5*Math.sin(T*9-k*.45); dot(p.x,p.y,DS*(1+.5*fl),GOLD,a*(.45+.5*fl));}
   const e=routeAt(f); ring(e,(pv.mat==='honey'?6.5:3)*U,a,pv.mat==='honey'?CORAL:GOLD);
  } else {dotArc(from,pv.pos,a*.95,GOLD); ring(pv.pos,(pv.mat==='berry'?6:4.6)*U,a,pv.mat==='sugar'?GOLD:CORAL);}
 } else if(D.shape==='moon'){
  const r=6.4*clamp((D.rm||D.R)/(RD*1.12),.85,1.3)*U*(1+.18*(D.mass-1));
  for(let k=0;k<26;k++){const an=k/26*TAU+T*.8;dot(A.moon.x+Math.cos(an)*r,A.moon.y+Math.sin(an)*r,DS*1.2,GOLD,a*(.4+.4*Math.sin(T*6+k)));}
  dotArc(tip,A.moon,a*.5,GOLD);
 } else {
  OV.twitch=Math.max(OV.twitch,.6*a); OV.pv=Math.max(OV.pv,a);
  dotArc(tip,A.bolt,a*.7,GOLD);
  /* 稲妻の写し（空の行き先に） */
  const zz=[[0,-8],[3.5,-2.5],[-2.5,1],[2,7]];
  for(let i=0;i<3;i++)for(let k=0;k<5;k++){const t=k/5, x=A.bolt.x+lerp(zz[i][0],zz[i+1][0],t)*U, y=A.bolt.y+lerp(zz[i][1],zz[i+1][1],t)*U; dot(x,y,DS*1.2,GOLD,a*(.45+.35*Math.sin(T*8+k+i)));}
  for(let k=0;k<12;k++){const t=k/11; dot(lerp(A.bolt.x,A.gear.x,t)+(k%2?1:-1)*1.8*U,lerp(A.bolt.y,A.gear.y,t),DS*1.2,k%3?GOLD:CORAL,a*(.45+.45*Math.sin(T*10+k)));}
 }
}
function drawDrag(){
 if(!DRAG)return; const br=DRAG.br;
 drawBread(br,DRAG.x,DRAG.y-3*U,breadSize(br)*1.25,1,.5,5);
 if(DRAG.near>=0){const p=PPL[DRAG.near]; LAYER=6; ring({x:p.x,y:p.y-12*U},9*U,.9);}
}

/* ===================== 入力（Pointer Events・一本指） ===================== */
let PTR=null, DRAG=null;
function hitBread(x,y){
 let best=null,bd=1e9;
 const test=br=>{if(!br||br.hop&&br.hop.t<1)return; const p=breadXY(br), r=Math.max(breadSize(br)*1.5,7.5*U), d=hyp(x-p.x,y-p.y); if(d<r&&d<bd){bd=d;best=br;}};
 SHELF.forEach(s=>test(s.bread)); WIN.forEach(w=>test(w.bread));
 return best;
}
function nearPerson(x,y){
 let bi=-1,bd=1e9;
 PPL.forEach((p,i)=>{if(p.st!=='wait'&&p.st!=='in')return; const d=hyp(x-p.x,y-(p.y-12*U)); if(d<19*U&&d<bd){bd=d;bi=i;}});
 return bi;
}
function tapOther(x,y){
 const inBox=(cx,cy,x0,y0,x1,y1)=>x>=cx+x0*U&&x<=cx+x1*U&&y>=cy+y0*U&&y<=cy+y1*U;
 const m=A.man;
 if(PH==='night'){
  if(RARE.on&&RARE.fall>=1&&hyp(x-RARE.pos.x,y-RARE.pos.y)<7*U){RARE.wob=1;SND.tink(14,1046);spawnSpark(RARE.pos.x,RARE.pos.y,6,CORAL,.7);return;}
  const he=A.route[A.route.length-1]; if(RT.vis>.5&&!RT.taken&&hyp(x-he.x,y-he.y)<7*U){RT.wob=1;SND.tink(12,880);spawnSpark(he.x,he.y,6,GOLD,.7);return;}
  for(let i=0;i<BER.length;i++){const b=BER[i],p=A.berry[i]; if(b.st==='shown'&&hyp(x-p.x,y-p.y)<5.5*U){b.wob=1;SND.tink(10+i,784);return;}}
 }
 if(PH==='morning'){for(const p of PPL){if(p.st!=='off'&&inBox(p.x,p.y,-7,-26,7,0)){p.wob=1;SND.wob();return;}}}
 if(PH==='night'&&inBox(m.x,m.y,-7,-35,7,0)){manAct('poke');SND.wob();return;}
 if(inBox(A.oven.x,A.oven.y,-14,-20,19,1)){OV.twitch=1;SND.wob();return;}
 if(inBox(A.shelf.x,A.shelf.y,-15,-23,15,1)){A.shelf.wob=1;SND.wob();return;}
 for(const c of [K.moon,K.bolt,K.dock]){if(c&&hyp(x-c.x,y-c.y)<9*U){c.wob=1;SND.tink(12,880);spawnSpark(x,y,6,GOLD,.7);return;}}
 if(hyp(x-A.sugar.x,y-A.sugar.y)<9*U){spawnSpark(x,y,6,GOLD,.6);SND.wob();return;}
 for(const o of SKYORN){if(!o.got){const p=ornPos(o); if(hyp(x-p.x,y-p.y)<6*U){o.wob=1;SND.wob();return;}}}
 if(inBox(A.bak.x,A.bak.y,-22,-41,22,0)){A.bak.wob=1;SND.wob();return;}
 for(const h of A.houses){if(inBox(h.x,h.y,-h.w/2,-h.h-h.rh,h.w/2,0)){h.wob=1;SND.wob();return;}}
 /* 背景：反応させず、生地が呼びかける */
 if(PH==='night'){INV.pk=0;}
}
function onDown(e){
 if(e.cancelable)e.preventDefault();
 audioOn();
 const x=e.clientX, y=e.clientY;
 if(PTR){
  /* 2本目以降の指は無視。ただし：同じ指の押し直し／新しい1本目（前の指の離しが失われた）／
     背景に置いたままの指がある時に 生地やパンへ触れた → 新しい指を使う */
  const better=PTR.kind==='tap'&&((PH==='night'&&D.st==='idle'&&doughHit(x,y))||(PH==='morning'&&MOR.close<=0&&!!hitBread(x,y)));
  if(e.pointerId===PTR.id||e.isPrimary||better)endPtr(true); else return;
 }
 lastInput=T;
 /* お手本が見せているもの（引いている生地・運ばれるパン）に触れたら、そのまま続きを自分で */
 const dm=INV.demo; let gb=null;
 if(dm&&dm.kind==='bread'&&dm.br.ghost&&hyp(x-dm.br.ghost.x,y-dm.br.ghost.y)<Math.max(breadSize(dm.br)*1.6,8*U))gb=dm.br;
 if(dm&&dm.kind==='dough'&&D.ghost&&(D.st==='held'||D.st==='pull')&&dm.hx!==undefined&&hyp(x-dm.hx,y-dm.hy)<10*U){
  INV.done[dm.key]=1; INV.demo=null; D.ghost=false;
  PTR={id:e.pointerId,kind:'dough',x,y}; try{cv.setPointerCapture(e.pointerId);}catch(_){}
  SND.press(); SND.stretchStart(); doughMove(x,y); return;
 }
 if(dm){if(gb||dm.kind==='dough')INV.done[dm.key]=1; cancelDemo();}
 PTR={id:e.pointerId,kind:'tap',x,y};
 try{cv.setPointerCapture(e.pointerId);}catch(_){}
 if(PH==='night'&&D.st==='idle'&&doughHit(x,y)){PTR.kind='dough'; doughGrab(x,y,false); return;}
 if(PH==='morning'&&MOR.close<=0){const br=gb||hitBread(x,y); if(br){PTR.kind='bread'; br.ret=null; DRAG={br,x,y,near:nearPerson(x,y)}; SND.pick(); return;}}
 tapOther(x,y);
}
function onMove(e){
 if(!PTR||e.pointerId!==PTR.id)return;
 if(e.cancelable)e.preventDefault();
 const list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
 const evs=list.length?list:[e];
 for(const ev of evs){
  const x=ev.clientX, y=ev.clientY;
  if(PTR.kind==='dough')doughMove(x,y);
  else if(PTR.kind==='bread'&&DRAG){DRAG.x=x;DRAG.y=y;const n=nearPerson(x,y-3*U); if(n!==DRAG.near&&n>=0)SND.tink(9+n*2,659); DRAG.near=n;}
 }
 lastInput=T;
}
function endPtr(cancel){
 const k=PTR.kind; PTR=null; lastInput=T;
 if(k==='dough')doughRelease(cancel);
 else if(k==='bread'&&DRAG){const d=DRAG; DRAG=null;
  if(!cancel&&d.near>=0&&PH==='morning'&&MOR.close<=0)deliver(d.br,d.near);
  else {d.br.ret={x:d.x,y:d.y-3*U,t:0}; SND.drop();}}
}
function onUp(e){audioOn(); if(!PTR||e.pointerId!==PTR.id)return; endPtr(false);}
function onCancel(e){if(!PTR||e.pointerId!==PTR.id)return; endPtr(true);}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',onCancel,{passive:false});
cv.addEventListener('lostpointercapture',e=>{if(PTR&&e.pointerId===PTR.id)endPtr(false);});
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault(); if(ev==='touchend')audioOn();},{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{if(PTR)endPtr(true);});

/* ===================== 進行 ===================== */
function updBreadAnims(dt){
 const f=br=>{if(!br)return; if(br.hop&&br.hop.t<1)br.hop.t+=dt*1.7; if(br.ret){br.ret.t+=dt*3.2; if(br.ret.t>=1)br.ret=null;}};
 SHELF.forEach(s=>f(s.bread)); WIN.forEach(w=>f(w.bread));
}
function update(dt){
 updTimers(dt);
 updatePhase(dt);
 if(PH==='night')updateDough(dt);
 updateCons(dt); updateBoats(dt); updateOven(dt); updateRoute(dt); updLight(dt); updateChain(dt);
 updFlyers(dt); updSparks(dt); updMan(dt); updInvite(dt); updBreadAnims(dt);
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0); ctx.globalAlpha=1; ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
 DOTCOUNT=0;
 if(PH==='dawn'&&(SPIN||SPINK!==1))setTR(W/2,H*.46,SPIN,SPINK); else TR=null;
 WTR=TR;
 drawSky(); drawCons(); drawTown(); drawOven(); drawShelf(); drawBerries(); drawMan(); PPL.forEach(drawPerson); drawBoats();
 TR=null;
 if(PH==='night'||PH==='dawn')drawDoughAll();
 drawFlyers(); drawSparksT(); drawPreview(); drawDrag(); drawHand();
 for(let l=0;l<NLAY;l++)flushLayer(l);
}
function drawDoughAll(){
 if(PH==='dawn'){const a=1-sat(PT/.7); if(a<=0)return; LAYER=5; for(let i=0;i<D.n;i++)dot(D.x[i],D.y[i]-PT*U*20,D.s[i]*DS,D.c[i],a*.8); return;}
 drawDough();
}
function drawSparksT(){
 for(const p of SPK){TR=p.lay<=4?WTR:null; LAYER=p.lay; const f=p.t/p.life, a=p.mote?Math.sin(f*Math.PI)*.75:(1-f)*.95;
  dot(p.x,p.y,p.s*DS*(p.mote?.9:1.1),p.c,a);}
 TR=null;
}

/* ===================== ループ・非表示・回転 ===================== */
let TS=1, last=0, raf=0, running=false, ema=16, wema=4, slowT=0, runT=0, FDT=.016, needLayout=false;
function frame(now){
 raf=requestAnimationFrame(frame);
 if(needLayout){needLayout=false; layout();}
 let dt=(now-last)/1000; last=now; if(!(dt>0))dt=.016;
 const ms=dt*1000, rdt=Math.min(dt,.25); dt=Math.min(dt,.05)*TS; T+=dt; runT+=rdt; FDT=dt;
 const t0=performance.now();
 try{update(dt); render();}catch(err){ if(!frame.err){frame.err=1; console.warn(err);} }
 const work=performance.now()-t0;
 /* 重いときは解像度を下げる（最大2のまま、必要なら1.5→1.25）。
    30Hz固定の画面（省電力）で無駄に下げないよう、実際の処理時間も見る */
 ema=lerp(ema,ms,.05); wema=lerp(wema,work,.05);
 const slow=(ema>22&&wema>7)||wema>14;
 if(runT>4&&slow){slowT+=rdt; if(slowT>2.5&&DPRCAP>1.25){const nc=DPRCAP>1.5?1.5:1.25; DPRCAP=nc; slowT=0; if(Math.min(nc,window.devicePixelRatio||1)<DPR)needLayout=true;}} else slowT=0;
}
function start(){if(running)return; running=true; last=performance.now(); raf=requestAnimationFrame(frame);}
function stop(){running=false; cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stop(); if(PTR)endPtr(true); try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}
 else {start(); try{if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}catch(e){}}
});
function onResize(){
 /* 回転：引いている途中の生地は そっと戻す。航海中の舟は 画面内の割合で置き直す */
 if(PTR&&PTR.kind==='dough')endPtr(true);
 const nx=p=>p?{fx:(p.x-X0)/SW,fy:(p.y-Y0)/SH}:null, bx=K.boats.map(b=>({p:nx(b),f:nx(b.from)}));
 layout(); genHouses();
 K.boats.forEach((b,i)=>{const q=bx[i], leg=b.legs&&b.legs[b.li]; if(q.p){b.x=X0+q.p.fx*SW;b.y=Y0+q.p.fy*SH;} if(q.f&&b.from&&!(leg&&leg.route)&&b.st==='sail'){b.from={x:b.x,y:b.y}; b.lt=0;}});
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(onResize,120));

/* ===================== 検証用（画面には出ない） ===================== */
window.__sb={
 state(){return {phase:PH,night:NIGHT,pt:PT,dough:{x:D.cx,y:D.cy,r:D.R,mass:D.mass,n:D.n,st:D.st,shape:D.shape,conf:D.conf},
  moon:K.moon?K.moon.st:null,bolt:K.bolt?K.bolt.st:null,boats:K.boats.map(b=>({st:b.st,plan:b.plan,cargo:b.cargo.slice(),x:b.x,y:b.y})),dock:!!K.dock,
  oven:{on:OV.on,items:OV.items.slice(),baking:!!OV.bake,recipe:OV.bake?OV.bake.recipe.map(r=>r.shape+':'+r.base):null},
  shelf:SHELF.map(s=>s.bread?s.bread.shape+':'+s.bread.base+(s.bread.tops.length?'+'+s.bread.tops.join('+'):''):'imp:'+s.imp),
  win:WIN.map(w=>w.bread?w.bread.shape+':'+w.bread.base:null),route:{vis:routeVisible(),taken:RT.taken},rare:{on:RARE.on,fall:RARE.fall,pos:RARE.pos},
  berries:BER.map(b=>b.st),skyOrn:SKYORN.map(o=>({type:o.type,got:o.got,slot:o.slot})),chain:CH.p,
  people:PPL.map(p=>({x:p.x,y:p.y,st:p.st,got:p.got})),man:MAN.act,invite:INV.cur?{kind:INV.cur.kind,g:INV.cur.g}:null,demo:INV.demo?INV.demo.kind:null,
  hist:JSON.parse(JSON.stringify(HIST)),fl:FL.length,spk:SPK.length,dots:DOTCOUNT,dpr:DPR,W,H,U,
  demoGhost:INV.demo&&INV.demo.br&&INV.demo.br.ghost?{x:INV.demo.br.ghost.x,y:INV.demo.br.ghost.y}:null,
  demoHand:INV.demo&&INV.demo.hx!==undefined?{x:INV.demo.hx,y:INV.demo.hy,t:INV.demo.t,g:INV.demo.g||null}:null,
  imps:SHELF.map(s=>s.imp),ages:{route:RT.age,rare:RARE.age,berry:BER.map(b=>b.age)}};},
 anchors(){return {dough:{x:D.cx,y:D.cy,r:D.R},rare:A.rare,ppl:A.ppl.map((p,i)=>({x:PPL[i].x,y:PPL[i].y})),moon:A.moon,sugar:A.sugar,bolt:A.bolt,gear:A.gear,window:A.window,
  orn:SKYORN.filter(o=>!o.got).map(o=>({type:o.type,...ornPos(o)})),routeEnd:A.route[A.route.length-1]};},
 breads(){const out=[]; SHELF.forEach((s,i)=>{if(s.bread){const p=breadXY(s.bread);out.push({k:'s',i,x:p.x,y:p.y,kind:s.bread.shape+':'+s.bread.base});}});
  WIN.forEach((w,i)=>{if(w.bread){const p=breadXY(w.bread);out.push({k:'w',i,x:p.x,y:p.y,kind:w.bread.shape+':'+w.bread.base});}}); return out;},
 setTimeScale(k){TS=clamp(+k||1,.1,8);},
 forceRare(){RARE.next=PT-1;},
 audio(){return AC?AC.state:'none';}
};

/* ===================== 開始（開始メニューなし） ===================== */
layout(); genSprites(); genHouses(); initShelf(); initNightState(); makeDough(); updateImprints();
MAN.nextHat=5;
start();
</script>

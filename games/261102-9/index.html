<script>
'use strict';
(function(){
/* ===== 5色のみ ===== */
const R='#E1251B',B='#1E4FB0',Y='#F7C600',K='#111111',W='#FFFFFF';
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const WW=640, WH=1000, GROUND=910;
let DPR=1,VW=1,VH=1,S=1,OX=0,OY=0;
let T=0;
const SPR={x:0,y:0,w:60,h:80,sq:0,sqv:0,hopT:-9};

/* ===== 窓 ===== */
const WD=[
 {id:'roof',    x:95, y:140,w:130,h:95, wall:Y},
 {id:'piano',   x:85, y:285,w:130,h:140,wall:B},
 {id:'bubbles', x:255,y:285,w:130,h:140,wall:R},
 {id:'dancer',  x:425,y:285,w:130,h:140,wall:Y},
 {id:'fire',    x:85, y:480,w:130,h:150,wall:Y},
 {id:'bakery',  x:235,y:465,w:170,h:180,wall:B},
 {id:'neighbor',x:425,y:480,w:130,h:150,wall:R},
 {id:'plants',  x:85, y:690,w:130,h:140,wall:B},
 {id:'drum',    x:425,y:690,w:130,h:140,wall:R},
];
const WIN={};
WD.forEach((w,i)=>{WIN[w.id]=w;w.idx=i;w.cx=w.x+w.w/2;w.cy=w.y+w.h/2;
  w.open=false;w.openT=-100;w.circ=[];w.grid=new Uint8Array(256);w.frac=0;w.fog=null;
  w.sq=0;w.sqv=0;w.hopT=-9;w.act=null;w.actT=-9;w.ph=i*1.7;w.shutT=-1;w.jig=0;w.refogAt=-1;});
const ADJ={roof:['piano','bubbles'],piano:['roof','bubbles','fire'],bubbles:['roof','piano','dancer','bakery'],
 dancer:['bubbles','neighbor'],fire:['piano','bakery','plants'],bakery:['bubbles','fire','neighbor'],
 neighbor:['dancer','bakery','drum'],plants:['fire'],drum:['neighbor']};
const LOOK={
 roof:{body:B,hair:'none',hat:'beret'}, piano:{body:R,hair:'bob'}, bubbles:{body:B,hair:'short'},
 dancer:{body:R,hair:'pig'}, fire:{body:R,hair:'none',hat:'helmet'}, bakery:{body:R,hair:'none',hat:'chef',apron:true},
 neighbor:{body:B,hair:'bun'}, plants:{body:Y,hair:'bob'}, drum:{body:Y,hair:'short'}
};
const RES={roof:{x:65,y:99,u:0.74},piano:{x:65,y:146,u:0.98},bubbles:{x:62,y:146,u:1.02},dancer:{x:65,y:146,u:0.95},
 fire:{x:65,y:156,u:1.05},bakery:{x:85,y:180,u:1.32},neighbor:{x:65,y:156,u:1.05},plants:{x:68,y:146,u:0.98},drum:{x:65,y:146,u:0.98}};
const PANELS=[
 {x:555,y:250,w:25,h:440,c:R},{x:60,y:250,w:25,h:190,c:Y},{x:235,y:432,w:170,h:26,c:Y},
 {x:60,y:638,w:175,h:44,c:B},{x:375,y:690,w:50,h:220,c:B},{x:425,y:838,w:155,h:72,c:Y},
 {x:425,y:432,w:130,h:40,c:B},{x:60,y:838,w:175,h:72,c:R}
];
PANELS.forEach(p=>{p.sh=-9;});

/* ===== 状態 ===== */
let order=[];                 // 開けた順
const del={s:'none',t:0,bx:0,loaded:false,direct:false,eat:'table'}; // パン配達
const nb={table:false,tableT:-9};
const mus={on:false,startAt:-1,style:0,t:0,sch:0,hitT:-9,noteT:-9};
const lad={s:'fold',t:0,e:0,wavT:-9,tick:0};
let edges=[]; let conn=new Set(); const fm={on:false,t:-9,throwT:-9}; let skyF=0, skySag=0, skySv=0;
const fest={on:false,t0:-9,bm:0,tapped:{},sill:{},tower:0,towerT:-9,first:null,autoDone:true,door:0};
let plantsBloom=1;
let resetting=null;
let lastOpenT=-9;
let lastInput=0, demoUsed=false, demo=null;
let parts=[]; const MAXP=140;
let proj=[];
let inv=null; let GZ={};

/* ===== 音 ===== */
let AC=null,MG=null,NB=null;
function audio(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      AC=new C(); MG=AC.createGain(); MG.gain.value=0.5;
      const cp=AC.createDynamicsCompressor(); MG.connect(cp); cp.connect(AC.destination);
      const len=AC.sampleRate|0; NB=AC.createBuffer(1,len,AC.sampleRate);
      const d=NB.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended'&&!document.hidden){const pr=AC.resume(); if(pr&&pr.catch) pr.catch(()=>{});}
  }catch(e){}
}
const aok=()=>!!(AC&&AC.state==='running');
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,delay,dur,type,vol,f2,att){
  if(!aok()) return;
  try{
    const t=AC.currentTime+Math.max(0,delay||0);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+(att||0.006));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(MG); o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function noise(delay,dur,vol,ft,ff,q,ff2){
  if(!aok()) return;
  try{
    const t=AC.currentTime+Math.max(0,delay||0);
    const s=AC.createBufferSource(); s.buffer=NB;
    const f=AC.createBiquadFilter(); f.type=ft; f.frequency.setValueAtTime(ff,t);
    if(ff2) f.frequency.exponentialRampToValueAtTime(ff2,t+dur); f.Q.value=q||1;
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(MG); s.start(t,Math.random()*0.5); s.stop(t+dur+0.03);
  }catch(e){}
}
function whistle(m,delay,dur){
  if(!aok()) return;
  try{
    const t=AC.currentTime+Math.max(0,delay), f=mf(m);
    const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f*0.96,t); o.frequency.exponentialRampToValueAtTime(f,t+0.05);
    const l=AC.createOscillator(); l.frequency.value=5.6; const lg=AC.createGain(); lg.gain.value=f*0.013; l.connect(lg); lg.connect(o.frequency);
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.13,t+0.04);
    g.gain.setValueAtTime(0.13,t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(MG); o.start(t); l.start(t); o.stop(t+dur+0.05); l.stop(t+dur+0.05);
  }catch(e){}
}
const SFX={
  squeak(fr){const f=760+fr*1100; tone(f,0,0.085,'sine',0.17,f*1.5,0.004); tone(f*2.02,0,0.05,'triangle',0.035,f*2.7); noise(0,0.045,0.04,'bandpass',3600,5);},
  open(){[72,76,79,84].forEach((m,i)=>tone(mf(m),0.04+i*0.07,0.32,'triangle',0.15)); tone(mf(96),0.32,0.45,'sine',0.05);},
  pop(i){i=i||0; tone(330+i*45,0,0.12,'sine',0.13,540+i*45);},
  boing(){tone(260,0,0.32,'sine',0.18,95); tone(520,0,0.12,'triangle',0.04,210);},
  thunk(){tone(150,0,0.12,'triangle',0.18,90); noise(0,0.05,0.06,'lowpass',900);},
  roll(){tone(1500,0,0.018,'square',0.015);},
  ding(){tone(mf(88),0,0.8,'sine',0.12); tone(mf(84),0.12,0.9,'sine',0.11); tone(mf(91),0.24,0.9,'sine',0.08);},
  munch(){noise(0,0.06,0.16,'lowpass',700); noise(0.09,0.06,0.13,'lowpass',600);},
  ratchet(i){tone(480+i*14,0,0.03,'square',0.025);},
  pluck(i){const m=[72,74,76,79,81,84,86,88,91,93][i%10]; tone(mf(m),0,0.28,'triangle',0.13); tone(mf(m+12),0,0.12,'sine',0.04);},
  whoosh(){noise(0,0.35,0.1,'bandpass',500,1.5,2600);},
  fanfare(){[[60,64,67],[65,69,72],[67,71,74],[72,76,79,84]].forEach((c,i)=>c.forEach(m=>tone(mf(m),i*0.18,i===3?1.0:0.2,'square',0.035)));},
  spray(){noise(0,0.4,0.2,'highpass',2600,0.7); noise(0.45,0.35,0.16,'highpass',3000,0.7);},
  drum(d){tone(150,d||0,0.18,'sine',0.3,50); noise(d||0,0.05,0.07,'lowpass',1500);},
  bubble(i){tone(520+i*90,0,0.1,'sine',0.09,1150+i*90);},
  yum(){[76,79,84].forEach((m,i)=>tone(mf(m),i*0.09,0.25,'sine',0.13));},
  unlock(){[67,72,79,84,88].forEach((m,i)=>tone(mf(m),i*0.06,0.35,'triangle',0.12));}
};

/* ===== 曲（3つの曲調） ===== */
const SONGS=[
 {d:0.27,len:30,rest:6,bar:6,roots:[48,43,48,48],
  mel:[79,0,76,0,76,0, 77,0,74,0,74,0, 72,0,74,0,76,0, 79,0,0,0,0,0]},
 {d:0.19,len:36,rest:4,bar:8,roots:[48,48,53,43],
  mel:[72,0,76,0,79,0,79,0, 81,0,79,0,76,0,0,0, 77,0,77,0,76,0,76,0, 74,0,74,0,72,0,0,0]},
 {d:0.15,len:38,rest:6,bar:8,roots:[48,53,43,48],
  mel:[72,76,79,76,84,0,79,0, 81,79,76,79,72,0,0,0, 74,76,77,79,81,79,77,76, 74,0,79,0,72,0,0,0]}
];
function songPos(){const sg=SONGS[mus.style]; const st=Math.floor(mus.t/sg.d); const s=st%sg.len; return {sg,s,rest:s>=sg.len-sg.rest,ph:(mus.t/(sg.d*2))%1};}
function inRest(){return mus.on&&songPos().rest;}
function beatHop(){if(!mus.on) return 0; const p=songPos(); if(p.rest) return 0; const k=1-p.ph; return k*k;}
function playStep(sg,s,dt){
  const melLen=sg.mel.length;
  if(s<melLen&&sg.mel[s]){
    let n=1; while(s+n<melLen&&!sg.mel[s+n]&&n<3) n++;
    whistle(sg.mel[s],dt,n*sg.d*0.92);
    mus.noteT=T+dt;
    const p=WIN.piano; spawn(p.x+lerp(30,100,Math.random()),p.y+20,'note',K,(Math.random()-0.5)*30,-50,1.4,9);
  }
  if(s<melLen){
    const bar=Math.floor(s/sg.bar), r=sg.roots[bar]||48, b=s%sg.bar;
    if(mus.style===0){ if(b===0) pianoN(r,dt,0.14); else if(b===2||b===4){pianoN(r+16,dt,0.06);pianoN(r+19,dt,0.06);} }
    else if(mus.style===1){ if(b%4===0) pianoN(r,dt,0.14); else if(b%4===2){pianoN(r+16,dt,0.06);pianoN(r+19,dt,0.06);} }
    else { if(b%2===0) pianoN(r+12+[0,4,7,12][(b/2)%4],dt,0.08); }
    if(b%2===0) mus.hitT=T+dt;
    if(fest.on&&WIN.drum.open&&s%4===0){SFX.drum(dt); WIN.drum.beatT=T+dt;}
  }
}
function pianoN(m,dt,v){tone(mf(m),dt,0.55,'triangle',v); tone(mf(m)*2,dt,0.22,'sine',v*0.3);}
function musicUpdate(dt){
  if(!mus.on){ if(mus.startAt>=0&&T>=mus.startAt&&WIN.piano.open){mus.on=true;mus.t=0;mus.sch=0;} else return; }
  mus.t+=dt; const sg=SONGS[mus.style];
  let guard=0;
  while(mus.sch*sg.d<mus.t+0.12&&guard++<20){
    const st=mus.sch, tt=st*sg.d-mus.t; mus.sch++;
    if(tt<-0.04) continue;
    playStep(sg,st%sg.len,Math.max(0,tt));
  }
}

/* ===== パーティクル ===== */
function spawn(x,y,kind,c,vx,vy,life,size){
  if(parts.length>=MAXP) parts.shift();
  parts.push({x,y,kind,c,vx,vy,life,max:life,size,rot:Math.random()*6,vr:(Math.random()-0.5)*8});
}
function burst(x,y,n,c,sp,kind){
  for(let i=0;i<n;i++){const a=Math.random()*TAU,v=sp*(0.4+Math.random()*0.8);
    spawn(x,y,kind||'sq',c||[R,Y,B][i%3],Math.cos(a)*v,Math.sin(a)*v-sp*0.4,0.6+Math.random()*0.5,4+Math.random()*4);}
}

/* ===== くもり（霧）===== */
function buildFog(w){
  const pw=Math.max(2,Math.ceil(w.w*S*DPR)), ph=Math.max(2,Math.ceil(w.h*S*DPR));
  if(!w.fog) w.fog=document.createElement('canvas');
  w.fog.width=pw; w.fog.height=ph;
  const g=w.fog.getContext('2d');
  g.globalCompositeOperation='source-over'; g.fillStyle=W; g.fillRect(0,0,pw,ph);
  g.globalCompositeOperation='destination-out'; g.fillStyle=K;
  const cw=pw/16, ch=ph/16, gr=Math.max(cw,ch)*0.85;
  for(let i=0;i<256;i++) if(w.grid[i]&&w.gridOnly){ g.beginPath(); g.arc(((i&15)+0.5)*cw,((i>>4)+0.5)*ch,gr,0,TAU); g.fill(); }
  for(const c of w.circ){ g.beginPath(); g.arc(c[0]*pw,c[1]*ph,c[2]*pw,0,TAU); g.fill(); }
  g.globalCompositeOperation='source-over';
}
function wipe(w,lx,ly,r){
  const c=[lx/w.w,ly/w.h,r/w.w];
  if(w.circ.length<400) w.circ.push(c);
  if(w.fog){ const g=w.fog.getContext('2d'); g.globalCompositeOperation='destination-out'; g.beginPath();
    g.arc(c[0]*w.fog.width,c[1]*w.fog.height,c[2]*w.fog.width,0,TAU); g.fill(); g.globalCompositeOperation='source-over'; }
  let n=0;
  for(let i=0;i<256;i++){
    if(!w.grid[i]){ const gx=((i&15)+0.5)/16*w.w, gy=((i>>4)+0.5)/16*w.h; if((gx-lx)*(gx-lx)+(gy-ly)*(gy-ly)<r*r) w.grid[i]=1; }
    n+=w.grid[i];
  }
  w.frac=n/256;
}
function wipeAll(w){ w.circ.push([0.5,0.5,1.0]); w.grid.fill(1); w.frac=1; buildFog(w); }
function refog(w){ w.circ=[]; w.grid.fill(0); w.frac=0; w.gridOnly=false; buildFog(w); }

/* ===== 描画ヘルパ ===== */
function rr(x,y,w,h,r){const g=ctx;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function fs(fill,lw){ctx.fillStyle=fill;ctx.fill();if(lw){ctx.lineWidth=lw;ctx.strokeStyle=K;ctx.stroke();}}
function circ(x,y,r,fill,lw){ctx.beginPath();ctx.arc(x,y,r,0,TAU);fs(fill,lw);}
function loaf(x,y,s){ctx.beginPath();ctx.ellipse(x,y,12*s,7*s,0,0,TAU);fs(Y,2*s);
  ctx.beginPath();ctx.moveTo(x-5*s,y-4*s);ctx.lineTo(x-2*s,y+1*s);ctx.moveTo(x+1*s,y-4*s);ctx.lineTo(x+4*s,y+1*s);ctx.lineWidth=1.6*s;ctx.strokeStyle=K;ctx.stroke();}
function plate(x,y,s){ctx.beginPath();ctx.ellipse(x,y,20*s,6*s,0,0,TAU);fs(W,2.2*s);ctx.beginPath();ctx.ellipse(x,y,11*s,3*s,0,0,TAU);ctx.lineWidth=1.5*s;ctx.strokeStyle=K;ctx.stroke();}

function newPose(){return {tilt:0,lean:0,bob:0,sx:1,sy:1,back:0,aL:[0.18,0.12],aR:[0.18,0.12],prop:null};}
function drawHead(x,y,r,look,back,u){
  const g=ctx;
  circ(x,y,r,back?K:W,3*u);
  if(!back){
    g.fillStyle=K;
    if(look.hair==='short'||look.hair==='bun'||look.hair==='pig'){
      g.beginPath();g.arc(x,y,r,Math.PI+0.32,-0.32);g.closePath();g.fill();
      if(look.hair==='bun') circ(x,y-r*1.08,r*0.45,K,0);
      if(look.hair==='pig'){circ(x-r*1.08,y+r*0.05,r*0.42,K,0);circ(x+r*1.08,y+r*0.05,r*0.42,K,0);}
    }else if(look.hair==='bob'){
      g.beginPath();g.arc(x,y,r*1.08,Math.PI*0.88,Math.PI*2.12);g.lineTo(x+r*0.55,y-r*0.25);g.lineTo(x-r*0.55,y-r*0.25);g.closePath();g.fill();
    }
  }
  if(look.hat==='chef'){ rr(x-r*0.85,y-r*1.95,r*1.7,r*1.3,r*0.25); fs(W,2.4*u);
    circ(x-r*0.5,y-r*1.95,r*0.42,W,2.4*u);circ(x+r*0.5,y-r*1.95,r*0.42,W,2.4*u);circ(x,y-r*2.15,r*0.48,W,2.4*u);
    ctx.fillStyle=W; ctx.fillRect(x-r*0.8,y-r*1.95,r*1.6,r*0.9); }
  else if(look.hat==='helmet'){ g.beginPath();g.arc(x,y-r*0.15,r*1.12,Math.PI,0);g.closePath();fs(R,2.6*u);
    rr(x-r*1.4,y-r*0.28,r*2.8,r*0.34,r*0.15);fs(K,0); rr(x-r*0.25,y-r*0.95,r*0.5,r*0.5,r*0.1);fs(Y,1.8*u); }
  else if(look.hat==='beret'){ g.beginPath();g.ellipse(x+r*0.2,y-r*0.78,r*1.15,r*0.48,-0.2,0,TAU);fs(Y,2.4*u);
    rr(x+r*0.05,y-r*1.45,r*0.25,r*0.35,r*0.1);fs(K,0); }
}
function drawPerson(x,y,u,look,p){
  const g=ctx; g.save(); g.translate(x,y-p.bob*u); g.rotate(p.lean); g.scale(p.sx,p.sy);
  const lw=3*u, shY=-55*u, shW=21*u, btW=28*u;
  g.beginPath(); g.moveTo(-btW,4*u); g.lineTo(-shW,shY+8*u); g.quadraticCurveTo(-shW,shY,-shW+9*u,shY);
  g.lineTo(shW-9*u,shY); g.quadraticCurveTo(shW,shY,shW,shY+8*u); g.lineTo(btW,4*u); g.closePath(); fs(look.body,lw);
  if(look.apron&&!p.back){ rr(-13*u,shY+14*u,26*u,50*u,6*u); fs(W,2.2*u); }
  g.save(); g.translate(0,shY); g.rotate(p.tilt); drawHead(0,-16*u,14*u,look,p.back,u); g.restore();
  const hands=[];
  g.lineCap='round'; g.lineJoin='round';
  for(const side of [-1,1]){
    const a=side<0?p.aL:p.aR, sx=side*(shW-4*u), sy=shY+7*u, a1=a[0], a2=a1+a[1];
    const ex=sx+side*Math.sin(a1)*21*u, ey=sy+Math.cos(a1)*21*u;
    const hx=ex+side*Math.sin(a2)*19*u, hy=ey+Math.cos(a2)*19*u;
    g.beginPath(); g.moveTo(sx,sy); g.lineTo(ex,ey); g.lineTo(hx,hy);
    g.lineWidth=9*u+lw*2; g.strokeStyle=K; g.stroke(); g.lineWidth=9*u; g.strokeStyle=look.body; g.stroke();
    hands.push([hx,hy]);
  }

function appearPose(w,p){
  const a=T-w.openT;
  if(a<0.12){p.back=1;p.bob=2;return true;}
  if(a<0.34){const k=(a-0.12)/0.22;p.sx=Math.max(0.08,Math.abs(Math.cos(k*Math.PI)));p.back=k<0.5?1:0;p.bob=3;return true;}
  if(a<1.25){p.aR=[2.45,-0.35+0.6*Math.sin(a*15)];p.tilt=0.1*Math.sin(a*8);p.bob=Math.abs(Math.sin(a*9))*3;return true;}
  return false;
}
function idlePose(w,p,noPoint){
  p.bob=Math.sin(T*2.2+w.ph)*1.0+beatHop()*(fest.on?5:1.5);
  const g=GZ[w.id];
  if(g){ p.tilt=g.dx*0.2;
    if(g.point&&!noPoint){ const side=g.dx>=0?1:-1, a1=clamp(Math.atan2(Math.abs(g.vx)+0.15,g.vy),0.4,2.9);
      const arm=[a1,0.05+0.08*Math.sin(T*6)]; if(side>0)p.aR=arm; else p.aL=arm; } }
}
function waveArm(p,t,side){const arm=[2.45,-0.35+0.6*Math.sin(t*15)]; if(side<0)p.aL=arm; else p.aR=arm;}
function actK(w,dur){const k=(T-w.actT)/dur; return k>=0&&k<1?k:-1;}

  if(del.s==='pre'&&T>=del.t) startShow();
  if(del.s==='show'&&T-del.t>=1.6){ del.s='travel'; del.t=T; del.direct=N.open&&T-N.openT>1.0; }
  if(del.s==='resume'&&T>=del.t){ del.s='travel'; del.direct=false; }
  if(del.s==='travel'){
    const target=N.open?1:(BXW-BX0)/(BX1-BX0), sp=del.direct?0.95:0.6;
    const was=del.bx; del.bx=Math.min(target,del.bx+sp*dt);
    if(Math.floor(was*20)!==Math.floor(del.bx*20)) SFX.roll();
    if(del.bx>=target-1e-6){
      if(N.open){ SFX.ding(); N.sqv+=4; burst(N.cx-30,N.y+N.h,6,Y,100);
        if(del.direct){ del.s='eat'; del.eat='plate'; del.t=T; del.loaded=false; } else { del.s='take'; del.t=T; } }
      else { del.s='wait'; del.t=T; N.sqv+=2.5; N.jig=0.5; SFX.thunk(); }
    }
  }
  if(del.s==='wait'&&N.open){ del.s='resume'; del.t=T+0.75; }
  if(del.s==='take'&&T-del.t>=0.6){ del.s='table'; del.t=T; nb.table=true; nb.tableT=T; del.loaded=false; SFX.pop(2); }
  if(del.s==='table'&&T-del.t>=0.9){ del.s='eat'; del.eat='table'; del.t=T; }
  if(del.s==='eat'){ const k=(T-del.t)/2.4; const b=Math.floor(k*3.6); if(b!==del.bite){del.bite=b; if(b<4){SFX.munch(); burst(N.x+65,N.y+90,3,Y,60);} }
    if(k>=1){ del.s='return'; del.t=T; del.bx=1; SFX.yum(); N.sqv+=3; } }
  if(del.s==='return'){ del.bx=Math.max(0,del.bx-dt*0.8); if(del.bx<=0){ del.s='home'; } }
}
function ladUpdate(dt){
  if(lad.s==='wait'&&T>=lad.t){ lad.s='climb'; lad.t=T; SFX.pop(4); }
  if(lad.s==='climb'&&T-lad.t>=0.5){ lad.s='ext'; lad.t=T; }
  if(lad.s==='ext'){ const was=lad.e; lad.e=Math.min(1,lad.e+dt/2.4);
    if(Math.floor(was*30)!==Math.floor(lad.e*30)) SFX.ratchet(Math.floor(lad.e*30));
    if(lad.e>=1){ lad.s='top'; lad.wavT=T; SFX.unlock(); WIN.roof.sqv+=5; WIN.roof.hopT=T+0.2; burst(LT.x+10,LT.y,8,null,140); } }
  if(lad.s==='fold'&&lad.e>0) lad.e=Math.max(0,lad.e-dt*0.9);
}
function partsUpdate(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
    if(p.kind==='sq'||p.kind==='drop'||p.kind==='tri') p.vy+=420*dt;
    else if(p.kind==='bub'){p.vy-=10*dt; p.vx*=0.99;}
    else if(p.kind==='note'){p.vx+=Math.sin(p.life*6)*10*dt;}
    else if(p.kind==='mist'){p.vx*=0.97;p.vy*=0.97;} }
  for(let i=proj.length-1;i>=0;i--){ const q=proj[i]; if(T>=q.t0+q.dur){ proj.splice(i,1); if(q.onLand) q.onLand(); } }
}
function update(dt){
  T+=dt;
  springs(dt); musicUpdate(dt); delUpdate(dt); ladUpdate(dt); edgesUpdate(dt); partsUpdate(dt); resetUpdate();
  if(fm.on&&skyF<1&&T-fm.t>1.0){ skyF=Math.min(1,skyF+dt/0.6); if(skyF>=1){skySv+=80; SFX.pluck(0);} }
  if(fest.on){ if(!fest.autoDone&&T-fest.t0>1.8){ fest.autoDone=true; const w=WIN[fest.first]; if(w&&w.open) doAction(w,true); }
    for(const w of WD){ if(w.shutT>=0&&T>=w.shutT&&w.frac<1){ wipeAll(w); burst(w.cx,w.cy,4,null,120); SFX.pop(w.idx); } }
    const b=WIN.bakery; if(b.act==='stack'){ const n=Math.min(5,Math.floor((T-fest.towerT)/0.28)); if(n>fest.tower){fest.tower=n; SFX.pop(n+2); b.sqv+=1.5;} } }
  if(!fest.on&&!resetting&&WD.every(w=>w.open)&&edges.every(e=>e.state==='done')&&T-lastOpenT>1.3&&skyF>=1) startFest();
  inv=inviteTarget(); computeGaze();
  if(inv){ const w=inv==='spray'?SPR:WIN[inv]; if(T-w.hopT>1.6) w.hopT=T; }
  if(!demo&&!demoUsed&&inv&&T-lastInput>4){ demo={t0:T,id:inv}; demoUsed=true; }
}

/* ===== 描画 ===== */
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=W; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const yG=OY+GROUND*S;
  ctx.fillStyle=Y; ctx.fillRect(0,yG,VW,26*S); ctx.fillStyle=K; ctx.fillRect(0,yG-3*S,VW,6*S); ctx.fillRect(0,yG+26*S,VW,4*S);
  ctx.setTransform(S*DPR,0,0,S*DPR,OX*DPR,OY*DPR);
  ctx.lineJoin='round';
  drawSky();
  drawBuilding();
  drawRope();
  for(const w of WD) drawWindow(w);
  drawSillThings();
  drawBasket();
  drawLadder();
  drawFirefighterOut();
  for(const e of edges) drawString(e.g,e.sag,e.p,e.f,e.state==='dangle'&&e.p>=1,e.b.length);
  for(const q of proj){ if(T<q.t0) continue; const k=(T-q.t0)/q.dur; loaf(lerp(q.x0,q.x1,k),lerp(q.y0,q.y1,k)-Math.sin(k*Math.PI)*q.h,0.9); }
  for(const p of parts){ const k=p.life/p.max, s=p.size*(0.4+0.6*k);
    if(p.kind==='sq'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-s/2,-s/2,s,s);ctx.restore();}
    else if(p.kind==='drop') circ(p.x,p.y,s*0.6,p.c,0);
    else if(p.kind==='bub') circ(p.x,p.y,p.size,W,2);
    else if(p.kind==='mist') circ(p.x,p.y,p.size*(1.3-0.3*k),W,1.5);
    else if(p.kind==='note'){ctx.beginPath();ctx.ellipse(p.x,p.y,s*0.55,s*0.4,-0.4,0,TAU);fs(K,0);ctx.fillRect(p.x+s*0.4,p.y-s*1.4,2,s*1.4);}
    else if(p.kind==='tri'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(-s,0);ctx.lineTo(s,0);ctx.lineTo(0,s*1.6);ctx.closePath();fs(p.c,1.5);ctx.restore();}
  }
  drawDemo();
  drawSprayer();
  if(demo&&demo.id==='spray'){ ctx.setTransform(S*DPR,0,0,S*DPR,OX*DPR,OY*DPR); drawDemo(); }
}

/* ===== 入力 ===== */
function toWorld(cx,cy){return {x:(cx-OX)/S,y:(cy-OY)/S};}
function hitWin(x,y){
  const pad=Math.max(12,20/S); let best=null,bd=1e9;
  for(const w of WD){ const dx=Math.max(w.x-x,0,x-(w.x+w.w)), dy=Math.max(w.y-y,0,y-(w.y+w.h)), d=Math.hypot(dx,dy);
    if(d<=pad&&d<bd){bd=d;best=w;} }
  return best;
}
function hitSpray(cx,cy){const p=14; return cx>=SPR.x-p&&cx<=SPR.x+SPR.w+p&&cy>=SPR.y-p&&cy<=SPR.y+SPR.h+p;}
function hitPanel(x,y){for(const p of PANELS) if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h) return p; return null;}
const ptrs=new Map();
function touchWin(w,x,y,isDown,st){
  const lx=x-w.x, ly=y-w.y;
  if(w.id==='roof'&&!roofUnlocked()&&!w.open){
    if(isDown){ w.jig=1; w.sqv+=2; SFX.boing(); WIN.fire.hopT=T; if(WIN.fire.open) lad.wavT=T; }
    return;
  }
  if(!w.open){ openWindow(w,lx,ly); st.lsq=T; return; }
  if(w.frac<1&&!fest.on){ const before=w.frac; wipe(w,clamp(lx,0,w.w),clamp(ly,0,w.h),Math.min(w.w,w.h)*0.21);
    if(isDown||(T-(st.lsq||0)>0.07&&w.frac>before)){ SFX.squeak(w.frac); st.lsq=T; if(Math.random()<0.4) spawn(x,y,'drop',w.wall,(Math.random()-0.5)*60,-40,0.5,4); } }
  if(isDown){ doAction(w,false); }
}
function onDown(e){
  e.preventDefault(); audio(); lastInput=T; demo=null;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  if(ptrs.size>=5) return;
  const st={kind:'none',lx:0,ly:0,lsq:0};
  ptrs.set(e.pointerId,st);
  if(hitSpray(e.clientX,e.clientY)){ st.kind='spray'; doSpray(); return; }
  if(resetting) return;
  const p=toWorld(e.clientX,e.clientY); const w=hitWin(p.x,p.y);
  if(w){ st.kind='win'; st.lx=p.x; st.ly=p.y; touchWin(w,p.x,p.y,true,st); try{draw();}catch(err){} return; }
  const pn=hitPanel(p.x,p.y); if(pn){ pn.sh=T; }
}
function onMove(e){
  const st=ptrs.get(e.pointerId); if(!st||st.kind!=='win'||resetting) return;
  e.preventDefault(); lastInput=T;
  const p=toWorld(e.clientX,e.clientY), dx=p.x-st.lx, dy=p.y-st.ly, d=Math.hypot(dx,dy);
  if(d<4) return;
  const n=Math.min(12,Math.ceil(d/12));
  for(let i=1;i<=n;i++){ const x=st.lx+dx*i/n, y=st.ly+dy*i/n; const w=hitWin(x,y); if(w) touchWin(w,x,y,false,st); }
  st.lx=p.x; st.ly=p.y;
}
function onUp(e){ if(ptrs.has(e.pointerId)){ ptrs.delete(e.pointerId); audio(); save(); } }
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp);
cv.addEventListener('pointercancel',onUp);
cv.addEventListener('lostpointercapture',onUp);
const stop=e=>{e.preventDefault();};
document.addEventListener('touchstart',stop,{passive:false});
document.addEventListener('touchmove',stop,{passive:false});
document.addEventListener('gesturestart',stop,{passive:false});
document.addEventListener('contextmenu',stop);
document.addEventListener('dblclick',stop);

/* ===== 保存 ===== */
const KEY='kumorimado-261102-9';
let memOnly=false;
function gridHex(g){let s='';for(let i=0;i<256;i+=4) s+=((g[i]<<3)|(g[i+1]<<2)|(g[i+2]<<1)|g[i+3]).toString(16);return s;}
function save(){
  if(resetting&&resetting.t0>T-1.3) { /* リセット中は完了時に保存 */ }
  const d={v:1,o:order.slice(),g:{},ps:mus.style,bm:fest.bm,pb:plantsBloom};
  for(const id of order) d.g[id]=gridHex(WIN[id].grid);
  try{ localStorage.setItem(KEY,JSON.stringify(d)); memOnly=false; }catch(e){ memOnly=true; }
}
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){ memOnly=true; return null; }
  if(!raw) return null;
  try{ const d=JSON.parse(raw); const v=validate(d); if(!v) throw 0; return v; }
  catch(e){ try{localStorage.removeItem(KEY);}catch(e2){} return null; }
}
function validate(d){
  if(!d||typeof d!=='object'||d.v!==1||!Array.isArray(d.o)) return null;
  const o=[]; for(const id of d.o){ if(typeof id==='string'&&WIN[id]&&o.indexOf(id)<0) o.push(id); }
  if(o.indexOf('roof')>=0&&o.indexOf('fire')<0) o.splice(o.indexOf('roof'),0,'fire');
  const g={}; const src=(d.g&&typeof d.g==='object')?d.g:{};
  for(const id of o){ const s=src[id]; g[id]=(typeof s==='string'&&/^[0-9a-f]{64}$/.test(s))?s:null; }
  const ps=Number.isInteger(d.ps)&&d.ps>=0&&d.ps<3?d.ps:0;
  const bm=Number.isInteger(d.bm)&&d.bm>=0&&d.bm<3?d.bm:0;
  const pb=Number.isInteger(d.pb)&&d.pb>=0&&d.pb<4?d.pb:1;
  return {o,g,ps,bm,pb};
}
function applyState(d){
  order=d.o.slice();
  for(const id of order){ const w=WIN[id]; w.open=true; w.openT=-100; w.gridOnly=true;
    const hx=d.g[id]; let n=0;
    if(hx){ for(let i=0;i<64;i++){ const v=parseInt(hx[i],16); for(let b=0;b<4;b++){ w.grid[i*4+b]=(v>>(3-b))&1; } } }
    for(let i=0;i<256;i++) n+=w.grid[i];
    if(n<20){ const r=RES[id]; w.gridOnly=false; wipe(w,r.x,r.y-60*r.u,Math.min(w.w,w.h)*0.42); w.gridOnly=true; }
    n=0; for(let i=0;i<256;i++) n+=w.grid[i]; w.frac=n/256;
  }
  plantsBloom=d.pb;
  const BK=WIN.bakery.open, NO=WIN.neighbor.open;
  if(BK&&NO){ del.s='home'; del.bx=0; } else if(BK){ del.s='wait'; del.bx=(BXW-BX0)/(BX1-BX0); del.loaded=true; } else del.s='none';
  if(WIN.piano.open){ mus.style=d.ps; mus.startAt=0; }
  if(WIN.fire.open){ lad.s='top'; lad.e=1; lad.wavT=-9; }
  if(WIN.roof.open){ fm.on=true; fm.t=-9; skyF=1; buildFlagsInstant(); }
  if(WD.every(w=>w.open)){ fest.on=true; fest.t0=-9; fest.bm=d.bm; fest.autoDone=true; fest.first=order[0];
    for(const w of WD){ w.shutT=-9; w.grid.fill(1); w.frac=1; } }
}

/* ===== レイアウト ===== */
function layout(){
  const sa=getComputedStyle(document.getElementById('sa'));
  const st=parseFloat(sa.paddingTop)||0, sr=parseFloat(sa.paddingRight)||0, sb=parseFloat(sa.paddingBottom)||0, sl=parseFloat(sa.paddingLeft)||0;
  VW=Math.max(1,window.innerWidth); VH=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  const aw=VW-sl-sr, ah=VH-st-sb, portrait=ah>aw*1.05;
  const sz=clamp(Math.min(aw,ah)*0.16,64,110);
  const rb=portrait?sz*1.15:0, rs=portrait?0:sz*1.2;
  S=Math.max(0.1,Math.min((aw-2*rs)/WW,(ah-rb)/WH));
  OX=sl+(aw-WW*S)/2; OY=st+(ah-rb-WH*S)/2;
  SPR.h=sz; SPR.w=sz*0.7; SPR.x=VW-sr-SPR.w-16; SPR.y=VH-sb-SPR.h-12;
  for(const w of WD) buildFog(w);
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>{layout();});

/* ===== ループ ===== */
let raf=0,last=0;
function frame(ts){
  raf=requestAnimationFrame(frame);
  let dt=(ts-last)/1000; last=ts; if(!(dt>0)) dt=0; if(dt>0.05) dt=0.05;
  try{ update(dt); draw(); }catch(err){ console.error(err); }
}
function startLoop(){ if(raf) return; last=performance.now(); raf=requestAnimationFrame(frame); }
function stopLoop(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ stopLoop(); save(); try{ if(AC&&AC.state==='running') AC.suspend().catch(()=>{}); }catch(e){} }
  else { startLoop(); try{ if(AC&&AC.state==='suspended') AC.resume().catch(()=>{}); }catch(e){} }
});
window.addEventListener('pagehide',save);

/* ===== 起動 ===== */
layout();
const sv=load(); if(sv){ applyState(sv); for(const w of WD) buildFog(w); }
startLoop();

/* テスト用の読み取り口（ゲーム操作には影響しない） */
window.__kumori={
  state:()=>({T,order:order.slice(),open:WD.filter(w=>w.open).map(w=>w.id),del:del.s,bx:del.bx,direct:del.direct,eat:del.eat,nbTable:nb.table,
    mus:{on:mus.on,style:mus.style,rest:inRest()},lad:lad.s,ladE:lad.e,conn:[...conn],edges:edges.map(e=>e.a+'>'+e.b+':'+e.state),
    fest:fest.on,bm:fest.bm,inv,demo:!!demo,demoUsed,memOnly,parts:parts.length,resetting:!!resetting,tower:fest.tower,sill:Object.keys(fest.sill)}),
  rect:id=>{ if(id==='spray') return {x:SPR.x+SPR.w/2,y:SPR.y+SPR.h/2,w:SPR.w,h:SPR.h}; const w=WIN[id]; return {x:OX+w.cx*S,y:OY+w.cy*S,w:w.w*S,h:w.h*S}; },
  scale:()=>({S,OX,OY,VW,VH,DPR})
};
})();
</script>
